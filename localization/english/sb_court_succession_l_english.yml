l_english:
# ### TO REVIEW ###
sb_court_succession.001.t:0 "The New King"
sb_court_succession.001.d:0 "[SCOPE.sCharacter('sb_court_nominee').GetFullName] stands next to inherit the throne following the king’s death, and the great houses are called to acknowledge [SCOPE.sCharacter('sb_court_nominee').GetHerHim]. Rival princes retain their claims; the strength of their followings will decide whether the handover passes peacefully."
sb_court_succession.001.f:0 "At the royal homestead, the period of mourning has barely closed before the elders watch the gates. Messengers from pledged houses arrive with cattle and spears to salute the incoming heir; envoys from other chiefs bring formal condolences and wait to see who else answers the summons."
sb_court_succession.001.t.retirement:0 "Mpande Steps Aside"
sb_court_succession.001.d.retirement:0 "Mpande is withdrawing from the rule of the kingdom. [SCOPE.sCharacter('sb_court_nominee').GetFullName] is to take his place, provided no rival prince can gather enough backing to contest the handover."
sb_court_succession.001.f.retirement:0 "Suitors arriving with disputes are directed towards the prince’s attendants. Envoys who once awaited Mpande’s word now carry their cases to younger hands. The old king remains within the royal household, but the chiefs already look elsewhere for judgement, reward and redress."
sb_court_succession.001.d.contested:0 "Opposition to [SCOPE.sCharacter('sb_court_nominee').GetFullName]’s succession has grown. A rival prince now commands enough backing to contest the throne, and the houses must choose a side."
sb_court_succession.001.d.withdrawn:0 "This succession can no longer proceed as announced. The court must settle the matter anew."
sb_court_succession.001.a:0 "Acknowledge [SCOPE.sCharacter('sb_court_nominee').GetFullName]."
sb_court_succession.001.a.tt:0 "If the handover remains unchallenged, [SCOPE.sCharacter('sb_court_nominee').GetFullName] becomes [concept_ruler]. Houses pledged to [SCOPE.sCharacter('sb_court_nominee').GetHerHim] back the new reign; houses pledged to other princes oppose it."
sb_court_succession.001.a.minor.tt:0 "Arrange the accession of [SCOPE.sCharacter('sb_court_nominee').GetFullName]. While [SCOPE.sCharacter('sb_court_nominee').GetSheHe] is under age, the leading adult pledged supporter governs as regent if one is present."
sb_court_succession.001.a.prerogative.tt:0 "The new reign begins with #v 0#! Prerogative."
sb_court_succession.001.a.retirement.tt:0 "On a peaceful handover, Mpande retires from government and relinquishes his claim to the throne."
sb_court_succession.001.a.challenge.tt:0 "Should a rival command at least #v 30%#! of succession-pledged [concept_prominence] before the handover, the succession is contested and you must choose a side."
sb_court_succession.001.a.contested.tt:0 "The succession is now contested. Choose between the two princes before the [concept_civil_war] begins."
sb_court_succession.001.c:0 "The houses must be consulted again."
sb_court_succession.001.c.tt:0 "Reconsider the succession without installing the previously announced candidate."
sb_court_succession.001.b:0 "Stand with [SCOPE.sCharacter('sb_court_rival').GetFullName]."
# ### TO REVIEW ###
sb_court_succession.002.t:0 "The Houses Divide"
sb_court_succession.002.d:0 "[SCOPE.sCharacter('sb_court_nominee').GetFullName] and [SCOPE.sCharacter('sb_court_rival').GetFullName] now stand at the head of opposing camps. The struggle will decide who holds the throne; neither prince seeks to abolish it."
sb_court_succession.002.a:0 "Stand with the chosen faction."
# ### TO REVIEW ###
sb_court_succession.003.t:0 "His Father’s Son"
sb_court_succession.003.d:0 "Now of age, [SCOPE.sCharacter('sb_court_adult_son').GetFullName] has declared his support for his father, [SCOPE.sCharacter('sb_court_father').GetFullName]. Those who reckon the strength of the princes must now count the son’s following beside the father’s."
sb_court_succession.003.f:0 "The young prince remained at his father’s side as the visitors were received. When asked whose word he would carry to the other homesteads, he gave his answer before the older man could speak. There would be no separate summons from the son."
sb_court_succession.003.a:0 "Mpande’s house grows stronger."
sb_court_succession.003.a.tt:0 "[SCOPE.sCharacter('sb_court_adult_son').GetFullName] now supports [SCOPE.sCharacter('sb_court_father').GetFullName], adding [SCOPE.sCharacter('sb_court_adult_son').GetHerHis] [concept_prominence] to [SCOPE.sCharacter('sb_court_adult_son').GetHerHis] father’s current coalition."

# ### TO REVIEW ###
sb_court_succession.006.t:0 "The Two Brothers"
sb_court_succession.006.d:0 "[SCOPE.sCharacter('sb_court_brothers_mbuyazi').GetFullName] has come of age. [SCOPE.sCharacter('sb_court_father').GetFullName] favours the younger prince, but [SCOPE.sCharacter('sb_court_brothers_cetshwayo').GetFullName] can draw powerful houses to his own claim. The king must name an [concept_heir]."
sb_court_succession.006.f:0 "Within Mpande’s own enclosure, Mbuyazi’s companions already sit nearest the hearth and carry the king’s errands. Beyond the cattle kraal, elder headmen linger at Cetshwayo’s quarters long after the day’s audiences end. Everyone at the homestead sees the father’s preference; naming an heir in public will settle the precedence of one son and put the other on notice."
sb_court_succession.006.a:0 "[SCOPE.sCharacter('sb_court_brothers_cetshwayo').GetFullName] shall succeed me."
sb_court_succession.006.b:0 "[SCOPE.sCharacter('sb_court_brothers_mbuyazi').GetFullName] shall succeed me."
sb_court_succession.006.a.backer:0 "[SCOPE.sCharacter('sb_court_brothers_backer').GetFullName] pledges [SCOPE.sCharacter('sb_court_brothers_backer').GetHerHis] house to [SCOPE.sCharacter('sb_court_brothers_mbuyazi').GetFullName] for the next succession."
sb_court_succession.006.b.backer:0 "[SCOPE.sCharacter('sb_court_brothers_backer').GetFullName] pledges [SCOPE.sCharacter('sb_court_brothers_backer').GetHerHis] house to [SCOPE.sCharacter('sb_court_brothers_cetshwayo').GetFullName] for the next succession."
sb_court_succession.006.no_backer:0 "No further unpledged house can be secured for the other prince."

sb_court_succession.006.second_backer:0 "[SCOPE.sCharacter('sb_court_brothers_second_backer').GetFullName] also pledges [SCOPE.sCharacter('sb_court_brothers_second_backer').GetHerHis] house to [SCOPE.sCountry('sb_court_country').MakeScope.Var('sb_court_brothers_cetshwayo_scope').GetCharacter.GetFullName] for the next succession."

# ### TO REVIEW ###
sb_court_succession.007.t:0 "The Other Brother"
sb_court_succession.007.d:0 "[SCOPE.sCharacter('sb_court_brothers_heir').GetFullName] has been recognised as [concept_heir], but [SCOPE.sCharacter('sb_court_brothers_other').GetFullName] still has friends at his father’s court. The younger prince is seeking undertakings from houses that have yet to promise their support."
sb_court_succession.007.f:0 "The heir’s name has already been spoken before the chiefs, yet Mpande’s younger son still keeps company with men raised at the royal homestead. None need contradict the king in council; an unpledged chief who takes cattle from the younger prince’s hand and keeps his own counsel can still tip the balance when the reign ends."
sb_court_succession.007.a:0 "[SCOPE.sCharacter('sb_court_brothers_other').GetFullName] has his own following."
sb_court_succession.007.a.backer:0 "[SCOPE.sCharacter('sb_court_brothers_backer').GetFullName] pledges [SCOPE.sCharacter('sb_court_brothers_backer').GetHerHis] house to [SCOPE.sCharacter('sb_court_brothers_other').GetFullName] for the next succession."
sb_court_succession.007.d.cetshwayo:0 "[SCOPE.sCharacter('sb_court_father').GetFullName] has chosen [SCOPE.sCharacter('sb_court_brothers_heir').GetFullName] as [concept_heir]. His elder son, [SCOPE.sCharacter('sb_court_brothers_other').GetFullName], is gathering chiefs who will support his claim against the king’s favoured prince."
sb_court_succession.007.f.cetshwayo:0 "Word of the king’s choice travels down the valleys from one homestead to the next, and the answers return by different paths. Some chiefs send salutations to the favoured younger son; others quietly dispatch headmen to ask when [SCOPE.sCharacter('sb_court_brothers_other').GetFirstNameNoFormatting] will receive them. The elder brother holds no royal appointment to distribute, yet seniority carries weight when houses count whose summons their regiments will obey."
sb_court_succession.007.d.usuthu:0 "The #bold [Glossary('glossary_sb_usuthu','uSuthu')]#! are gathering behind [SCOPE.sCharacter('sb_court_brothers_other').GetFullName], challenging the succession of [SCOPE.sCharacter('sb_court_brothers_heir').GetFullName]. The king’s favoured prince has his #bold iziGqoza#! supporters; his brother is securing promises from the great houses."
sb_court_succession.007.f.usuthu:0 "In the homesteads, people no longer speak only of two princes; they name their companies. Around the younger son stand the iziGqoza, confident in the king’s ear and the royal enclosure. Beyond that circle, riders and headmen bring the uSuthu assurances from distant chiefs and age-regiments. Even a greeting at the gate now marks which brother a house intends to follow."
