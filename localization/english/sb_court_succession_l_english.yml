l_english:
# ### TO REVIEW ###
sb_court_succession.001.t:0 "The Succession Before the Houses"
sb_court_succession.001.d:0 "[SCOPE.sCharacter('sb_court_nominee').GetFullName] stands before the court as the proposed successor. The undertakings of the great houses decide whether the succession can pass by acknowledgement or must be contested."
sb_court_succession.001.f:0 "Messengers came to the royal homestead carrying the answers of their chiefs. Some repeated an undertaking already given; others waited to learn which prince the regiments and neighbouring houses would acknowledge. The king’s place could not remain empty."
sb_court_succession.001.a:0 "Acknowledge [SCOPE.sCharacter('sb_court_nominee').GetFullName]."
sb_court_succession.001.b:0 "Stand with [SCOPE.sCharacter('sb_court_rival').GetFullName]."
# ### TO REVIEW ###
sb_court_succession.002.t:0 "The Houses Divide"
sb_court_succession.002.d:0 "[SCOPE.sCharacter('sb_court_nominee').GetFullName] and [SCOPE.sCharacter('sb_court_rival').GetFullName] now stand at the head of opposing camps. The struggle will decide who holds the throne; neither prince seeks to abolish it."
sb_court_succession.002.a:0 "Stand with the chosen faction."
# ### TO REVIEW ###
sb_court_succession.003.t:0 "His Father's Son"
sb_court_succession.003.d:0 "Now of age, [SCOPE.sCharacter('sb_court_adult_son').GetFullName] has declared his support for his father, [SCOPE.sCharacter('sb_court_father').GetFullName]. Those who reckon the strength of the princes must now count the son's following beside the father's."
sb_court_succession.003.f:0 "The young prince remained at his father's side as the visitors were received. When asked whose word he would carry to the other homesteads, he gave his answer before the older man could speak. There would be no separate embassy from the son."
sb_court_succession.003.a:0 "Mpande's house grows stronger."
sb_court_succession.003.a.tt:0 "[SCOPE.sCharacter('sb_court_adult_son').GetFullName] now supports [SCOPE.sCharacter('sb_court_father').GetFullName], adding his [concept_prominence] to his father's current coalition."

# ### TO REVIEW ###
sb_court_succession.006.t:0 "The Two Brothers"
sb_court_succession.006.d:0 "[SCOPE.sCharacter('sb_court_brothers_mbuyazi').GetFullName] has come of age. With the two princes now grown, [SCOPE.sCharacter('sb_court_father').GetFullName] must name an [concept_heir]; the brother passed over will seek a following of his own."
sb_court_succession.006.f:0 "The brothers stand close enough to hear every word. A chief asks which of them will speak with their father's authority when the king is gone. Neither looks at the other. Men will carry the answer back to their homesteads and begin deciding whose summons they will obey. The king may name one son, but he cannot make them forget the other."
sb_court_succession.006.a:0 "[SCOPE.sCharacter('sb_court_brothers_cetshwayo').GetFullName] shall follow me."
sb_court_succession.006.b:0 "[SCOPE.sCharacter('sb_court_brothers_mbuyazi').GetFullName] shall follow me."
sb_court_succession.006.a.backer:0 "[SCOPE.sCharacter('sb_court_brothers_backer').GetFullName] pledges his house to [SCOPE.sCharacter('sb_court_brothers_mbuyazi').GetFullName] for the next succession."
sb_court_succession.006.b.backer:0 "[SCOPE.sCharacter('sb_court_brothers_backer').GetFullName] pledges his house to [SCOPE.sCharacter('sb_court_brothers_cetshwayo').GetFullName] for the next succession."
sb_court_succession.006.no_backer:0 "No eligible house remains unpledged in the succession."

# ### TO REVIEW ###
sb_court_succession.007.t:0 "The Other Brother"
sb_court_succession.007.d:0 "Now that both princes are of age, the choice of [SCOPE.sCharacter('sb_court_father').GetFullName] faces a fresh test. [SCOPE.sCharacter('sb_court_brothers_heir').GetFullName] is the recognised [concept_heir], but [SCOPE.sCharacter('sb_court_brothers_other').GetFullName] means to be reckoned with."
sb_court_succession.007.f:0 "The recognised heir receives the first greetings. His brother waits until they are finished, then draws the visitors into a conversation of his own. He asks after their households, remembers an old service and offers another meeting. No one disputes the king's announcement aloud. Yet men who came to greet one prince leave having spoken with two."
sb_court_succession.007.a:0 "A brother is still a prince."
sb_court_succession.007.a.backer:0 "[SCOPE.sCharacter('sb_court_brothers_backer').GetFullName] pledges his house to [SCOPE.sCharacter('sb_court_brothers_other').GetFullName] for the next succession."
