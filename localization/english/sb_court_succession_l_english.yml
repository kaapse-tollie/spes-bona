l_english:
# ### TO REVIEW ###
sb_court_succession.001.t:0 "The New King"
sb_court_succession.001.d:0 "[SCOPE.sCharacter('sb_court_nominee').GetFullName] is ready to take the throne, and the great houses are called to acknowledge him. Rival princes retain their claims; the strength of their followings will decide whether the handover passes peacefully."
sb_court_succession.001.f:0 "The chiefs who promised their support send word that they will answer the new ruler's summons. Others offer greetings without an undertaking. The throne can pass without battle; obedience throughout the kingdom must still be won."
sb_court_succession.001.t.retirement:0 "Mpande Steps Aside"
sb_court_succession.001.d.retirement:0 "Mpande is withdrawing from the rule of the kingdom. [SCOPE.sCharacter('sb_court_nominee').GetFullName] is to take his place, provided no rival prince can gather enough backing to contest the handover."
sb_court_succession.001.f.retirement:0 "Men arriving with disputes are directed towards the prince's attendants. Messages that once awaited the king's answer now pass to younger hands. Mpande remains among the royal household, but the chiefs will have another man to approach for judgement, reward and redress."
sb_court_succession.001.d.contested:0 "Opposition to [SCOPE.sCharacter('sb_court_nominee').GetFullName]'s succession has grown. A rival prince now commands enough backing to contest the throne, and the houses must choose a side."
sb_court_succession.001.d.withdrawn:0 "This succession can no longer proceed as announced. The court must reconsider who can take the throne."
sb_court_succession.001.a:0 "Acknowledge [SCOPE.sCharacter('sb_court_nominee').GetFullName]."
sb_court_succession.001.a.tt:0 "If the handover remains unchallenged, [SCOPE.sCharacter('sb_court_nominee').GetFullName] becomes [concept_ruler]. Houses pledged to him support his accession; rival claims remain."
sb_court_succession.001.a.minor.tt:0 "Arrange the accession of [SCOPE.sCharacter('sb_court_nominee').GetFullName]. While he is under age, an adult pledged supporter must govern as regent."
sb_court_succession.001.a.prerogative.tt:0 "The new reign begins with #v 0#! Prerogative."
sb_court_succession.001.a.retirement.tt:0 "On a peaceful handover, Mpande retires from government and relinquishes his claim to the throne."
sb_court_succession.001.a.challenge.tt:0 "Should a rival command at least #v 30%#! of succession-pledged [concept_prominence] before the handover, the succession is contested and you must choose a side."
sb_court_succession.001.a.contested.tt:0 "The succession is now contested. Choose between the two princes before the [concept_civil_war] begins."
sb_court_succession.001.c:0 "The houses must be consulted again."
sb_court_succession.001.c.tt:0 "Reconsider the succession without installing the previously announced candidate."
sb_court_succession.001.b:0 "Stand with [SCOPE.sCharacter('sb_court_rival').GetFullName]."
# ### TO REVIEW ###
sb_court_succession.002.t:0 "The Houses Divide"
sb_court_succession.002.d:0 "[SCOPE.sCharacter('sb_court_nominee').GetFullName] and [SCOPE.sCharacter('sb_court_rival').GetFullName] now stand at the head of opposing camps. The struggle will decide who holds the throne; neither prince seeks to abolish it."
sb_court_succession.002.a:0 "Stand with the chosen faction."
# ### TO REVIEW ###
sb_court_succession.003.t:0 "His Father's Son"
sb_court_succession.003.d:0 "Now of age, [SCOPE.sCharacter('sb_court_adult_son').GetFullName] has declared his support for his father, [SCOPE.sCharacter('sb_court_father').GetFullName]. Those who reckon the strength of the princes must now count the son's following beside the father's."
sb_court_succession.003.f:0 "The young prince remained at his father's side as the visitors were received. When asked whose word he would carry to the other homesteads, he gave his answer before the older man could speak. There would be no separate embassy from the son."
sb_court_succession.003.a:0 "Mpande's house grows stronger."
sb_court_succession.003.a.tt:0 "[SCOPE.sCharacter('sb_court_adult_son').GetFullName] now supports [SCOPE.sCharacter('sb_court_father').GetFullName], adding his [concept_prominence] to his father's current coalition."

# ### TO REVIEW ###
sb_court_succession.006.t:0 "The Two Brothers"
sb_court_succession.006.d:0 "[SCOPE.sCharacter('sb_court_brothers_mbuyazi').GetFullName] has come of age. [SCOPE.sCharacter('sb_court_father').GetFullName] favours the younger prince, but [SCOPE.sCharacter('sb_court_brothers_cetshwayo').GetFullName] can draw powerful houses to his own claim. The king must name an [concept_heir]."
sb_court_succession.006.f:0 "A father's favour is readily understood at the royal homestead. Beyond it, the chiefs must consider whose summons their men will answer when the king is gone. The younger prince has friends close to the throne; the elder has begun receiving visitors of his own. An announcement may give one brother precedence. It will also tell the other how much he has to lose."
sb_court_succession.006.a:0 "[SCOPE.sCharacter('sb_court_brothers_cetshwayo').GetFullName] shall follow me."
sb_court_succession.006.b:0 "[SCOPE.sCharacter('sb_court_brothers_mbuyazi').GetFullName] shall follow me."
sb_court_succession.006.a.backer:0 "[SCOPE.sCharacter('sb_court_brothers_backer').GetFullName] pledges his house to [SCOPE.sCharacter('sb_court_brothers_mbuyazi').GetFullName] for the next succession."
sb_court_succession.006.b.backer:0 "[SCOPE.sCharacter('sb_court_brothers_backer').GetFullName] pledges his house to [SCOPE.sCharacter('sb_court_brothers_cetshwayo').GetFullName] for the next succession."
sb_court_succession.006.no_backer:0 "No further unpledged house can be secured for the other prince."

sb_court_succession.006.second_backer:0 "[SCOPE.sCharacter('sb_court_brothers_second_backer').GetFullName] also pledges his house to [SCOPE.sCharacter('sb_court_brothers_cetshwayo').GetFullName] for the next succession."

# ### TO REVIEW ###
sb_court_succession.007.t:0 "The Other Brother"
sb_court_succession.007.d:0 "[SCOPE.sCharacter('sb_court_brothers_heir').GetFullName] has been recognised as [concept_heir], but [SCOPE.sCharacter('sb_court_brothers_other').GetFullName] still has friends at his father's court. The younger prince is seeking undertakings from houses that have yet to promise their support."
sb_court_succession.007.f:0 "The announcement has been made, yet the king's younger son continues to receive men who owe their standing to the royal homestead. They need not dispute the heir's name in public. A visit, a gift and a promise to answer the prince's summons may matter more when his father's place falls vacant."
sb_court_succession.007.a:0 "[SCOPE.sCharacter('sb_court_brothers_other').GetFullName] has his own following."
sb_court_succession.007.a.backer:0 "[SCOPE.sCharacter('sb_court_brothers_backer').GetFullName] pledges his house to [SCOPE.sCharacter('sb_court_brothers_other').GetFullName] for the next succession."
sb_court_succession.007.d.cetshwayo:0 "[SCOPE.sCharacter('sb_court_father').GetFullName] has chosen [SCOPE.sCharacter('sb_court_brothers_heir').GetFullName] as [concept_heir]. His elder son, [SCOPE.sCharacter('sb_court_brothers_other').GetFullName], is gathering chiefs who will support his claim against the king's favoured prince."
sb_court_succession.007.f.cetshwayo:0 "The king's choice travels quickly between the homesteads. So do the answers. Some chiefs send their greetings to the younger prince; others ask when they may visit his brother. The elder son has no appointment to offer them, but he has a claim, and each promise made to him narrows the distance between a father's preference and a disputed succession."
sb_court_succession.007.d.usuthu:0 "The #bold [Glossary('glossary_sb_usuthu','uSuthu')]#! are gathering behind [SCOPE.sCharacter('sb_court_brothers_other').GetFullName], challenging the succession of [SCOPE.sCharacter('sb_court_brothers_heir').GetFullName]. The king's favoured prince has his #bold iziGqoza#! supporters; his brother is securing promises from the great houses."
sb_court_succession.007.f.usuthu:0 "Men speak of the princes by the companies they keep. Around the younger son stand those who trust his father's favour. His brother's visitors bring assurances from chiefs and regiments beyond that circle. A greeting at the royal homestead has become a declaration: when the king leaves his place, whose summons will each man obey?"
