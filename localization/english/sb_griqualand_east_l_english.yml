# ### TO REVIEW ###
sb_griqualand_east.220.t:0 "A Griqua March-State"
sb_griqualand_east.220.d:0 "With Philippolis lost and the eastern frontier unsettled, Griqua leaders now look to the Cape for a more durable settlement. A protected Griqua march-state in the east would stiffen the colony's hold on the frontier."
sb_griqualand_east.220.f:0 "The Griqua delegates unfolded two maps before the Cape officials: one showing the country they had lost, the other the unsettled eastern marches. Between them lay a proposal to exchange displacement for a frontier of their own."
sb_griqualand_east.220.a:0 "Establish it."
# ### TO REVIEW ###
sb_griqualand_east.221.t:0 "The Kokstad Petition"
sb_griqualand_east.221.d:0 "The council at Kokstad has petitioned for incorporation into the Cape Colony. Its members ask that existing land titles and local arrangements be respected under Cape law. With separate government retaining few defenders, Parliament need only accept the petition and proclaim the union."
sb_griqualand_east.221.f:0 "'It is expedient that the country... commonly known as Nomansland, should be annexed to this Colony.'\n— #italic Resolution of the Cape Parliament, 1875#!"
sb_griqualand_east.221.a:0 "Proclaim the union."
