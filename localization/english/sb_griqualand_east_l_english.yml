# ### TO REVIEW ###
sb_griqualand_east.220.t:0 "A Griqua March-State"
sb_griqualand_east.220.d:0 "With Philippolis lost and the eastern frontier unsettled, Griqua leaders now look to the Cape for a more durable settlement. A protected Griqua march-state in the east would stiffen the colony's hold on the frontier."
sb_griqualand_east.220.f:0 "The Griqua delegates unfolded two maps before the Cape officials: one showing the country they had lost, the other the unsettled eastern marches. Between them lay a proposal to exchange displacement for a frontier of their own."
sb_griqualand_east.220.a:0 "Establish it."
# ### TO REVIEW ###
sb_griqualand_east.221.t:0 "A Voluntary Union"
sb_griqualand_east.221.d:0 "Griqualand East's leaders now petition Cape Town for union. With loyal institutions, cordial relations, and a franchise settlement that can shelter Griqua rights, separate rule no longer seems necessary."
sb_griqualand_east.221.f:0 "The petition carried the seals of Griqua offices that expected to disappear upon union. Its authors did not ask that their history be forgotten, only that the Cape's law now protect what separate government had been created to defend."
sb_griqualand_east.221.a:0 "Bring it into the Cape."
