l_english:
# ### TO REVIEW ###
 sb_griqualand_east.220.t:0 "Across the Drakensberg"
 sb_griqualand_east.220.d:0 "With Philippolis lost, Griqua delegates under Adam Kok have petitioned [ROOT.GetCountry.GetName] for land beyond the Drakensberg. Settling them as a protected captaincy on the unsettled [GetStateRegion('STATE_EASTERN_CAPE').GetName] frontier would secure the borderlands under [ROOT.GetCountry.GetAdjectiveNoFormatting] suzerainty."
 sb_griqualand_east.220.f:0 "Two papers lay on the commissioners' table: the old title-deeds of Philippolis, folded and worn along the creases, and a petition bearing the names of Adam Kok and his council. The delegates asked neither for stipends nor for a seat in [ROOT.GetCountry.GetCapital.GetCityHubName], only for leave to settle the high valleys below the berg and hold them as their own country."
 sb_griqualand_east.220.a:0 "Establish the Griqua captaincy in the east."
 sb_griqualand_east.220.a.settlement:0 "Griqualand East is established as our [concept_puppet] on [GetStateRegion('STATE_EASTERN_CAPE').GetName] frontier districts transferred from Xhosa and [ROOT.GetCountry.GetAdjectiveNoFormatting] holdings, making the state a [GetCulture('griqua').GetName] [concept_homeland] and drawing Griqua migration from [GetStateRegion('STATE_VRYSTAAT').GetName]."
 sb_griqualand_east.220.a.relations:0 "Our [concept_relations] with Griqualand East improve by #p +30#!."
 sb_griqualand_east.220.b:0 "Decline the Griqua petition."
# ### TO REVIEW ###
 sb_griqualand_east.221.t:0 "The Kokstad Petition"
 sb_griqualand_east.221.d:0 "The council at Kokstad has petitioned for Griqualand East to be incorporated into [ROOT.GetCountry.GetName], asking that existing land titles and local arrangements be respected under [ROOT.GetCountry.GetAdjectiveNoFormatting] law. With separate government retaining few defenders, it rests with [ROOT.GetCountry.GetCapital.GetCityHubName] to accept the petition and proclaim the union."
 sb_griqualand_east.221.f:0 "'It is expedient that the country... commonly known as Nomansland, should be annexed to this Colony.'\n— #italic Resolution of the Cape Parliament, 1875#!"
 sb_griqualand_east.221.a:0 "Proclaim the union."
