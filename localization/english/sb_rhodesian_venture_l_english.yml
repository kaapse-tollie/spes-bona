l_english:
 company_sb_british_south_africa_company:0 "British South Africa Company"
 company_sb_british_south_africa_company_desc:0 "A royal-chartered company empowered to administer territory and develop transport, mineral, forestry, and agricultural concessions in the African interior."
 sb_british_south_africa_company_charter_slot:0 "British South Africa Company Charter"
 sb_british_south_africa_company_charter_slot_desc:0 "The Company's territorial charter requires a dedicated place within the British corporate establishment."
 sb_rhodes_diamond_magnate:0 "Diamond Magnate"
 sb_rhodes_diamond_magnate_desc:0 "The consolidation of the diamond fields has given this character wealth, renown, and a formidable public standing."

 decision_sb_back_rhodesian_venture:0 "Organise the Rhodesian Venture"
 decision_sb_back_rhodesian_venture_desc:0 "Back a chartered venture north from Bechuanaland to the Zambezi plateau. Its agents must secure disputed concessions at Lobengula's court, win a Royal Charter in London, and carry a pioneer column inland before company administration can be proclaimed."

# ### TO REVIEW ###
 je_sb_rhodesian_venture:0 "The Rhodesian Venture"
 je_sb_rhodesian_venture_reason:0 "Britain's command of the Bechuanaland corridor has opened a road towards the high plateau beyond the Limpopo. Promoters now propose to turn contested mineral concessions at Bulawayo into a Royal Charter in Whitehall, and then carry a pioneer column north along the Tuli road before rival powers intervene.\n\nEach month brings the venture closer to a chartered settlement, while political, financial, and logistical missteps raise #b Venture Peril#!. Excess peril, default, subjection, repeal of a qualifying colonial law, or loss of an eligible foothold in [GetStateRegion('STATE_ZAMBEZI').GetName] will end the undertaking."
 je_sb_rhodesian_venture_status_concessions:0 "Agents are negotiating at Lobengula's court and contesting what the proposed concessions would actually permit."
 je_sb_rhodesian_venture_status_charter:0 "The concession papers have reached London, where financiers and ministers are arguing over the terms of a Royal Charter."
 je_sb_rhodesian_venture_status_pioneer_column:0 "Recruitment and supply are under way for a pioneer column along the Tuli route."
 je_sb_rhodesian_venture_complete_tt:0 "Complete #v 18#! months of venture progress."
 je_sb_rhodesian_venture_fail_tt:0 "Venture Peril reaches #v 5#!."
 event_effects_sb_rhodesian_venture.011_tt:0 "The venture is abandoned, its commander is released, ongoing expedition expenses end, and another attempt cannot begin for #v 3 years#!."

 sb_rhodesian_venture_progress_bar:0 "Venture Progress"
 sb_rhodesian_venture_progress_bar_desc:0 "Progress from contested concessions, through charter negotiations, to the organisation of the Pioneer Column."
 sb_rhodesian_venture_monthly_progress_tt:0 "The venture advances each month."
 sb_rhodesian_venture_peril_bar:0 "Venture Peril"
 sb_rhodesian_venture_peril_bar_desc:0 "Political, financial, and logistical dangers that may bring the Rhodesian Venture to an end."

 sb_rhodesian_venture_expedition_cost_tt:0 "Detach the chosen commander to lead #bold The Rhodesian Venture#!, incurring an ongoing overseas expedition expense until the venture succeeds or ends."
 sb_rhodesian_venture_success_tt:0 "The #bold British South Africa Company#! is established in London—granting Britain #p +1#! maximum [Concept('concept_company', '$concept_companies|q$')] while the charter endures—and receives a chartered administration in [GetStateRegion('STATE_ZAMBEZI').GetName]. Eligible territory and British claims in [GetStateRegion('STATE_ZAMBEZI').GetName] pass to company rule, and pro-enterprise [Concept('concept_interest_group', '$concept_interest_groups|q$')] gain temporary approval."

 # ### TO REVIEW ###
 sb_rhodesian_venture.001.t:0 "Command of the Rhodesian Venture"
 sb_rhodesian_venture.001.rhodes_d:0 "Cecil Rhodes has thrown the financial weight of De Beers behind the scheme, yet the venture still requires a serving officer to hold together concession agents, London financiers, ox-wagons, and imperial officials."
 sb_rhodesian_venture.001.no_rhodes_d:0 "A syndicate of Cape and London speculators has formed without a single dominant patron, leaving the government to appoint a serving officer able to coordinate rival concession agents, City investors, and the northern route."
 sb_rhodesian_venture.001.f:0 "Across the Colonial Office table lay an Admiralty map with the Zambezi plateau still mostly blank, beside three rival prospectuses and a leather dispatch box. Whoever accepted the commission would have to answer in Whitehall for every pound spent and every boundary crossed beyond the Limpopo."
 sb_rhodesian_venture.001.a:0 "[SCOPE.sCharacter('sb_rhodesian_venture_leader_1').GetPrimaryRoleTitle] [SCOPE.sCharacter('sb_rhodesian_venture_leader_1').GetFullName]"
 sb_rhodesian_venture.001.b:0 "[SCOPE.sCharacter('sb_rhodesian_venture_leader_2').GetPrimaryRoleTitle] [SCOPE.sCharacter('sb_rhodesian_venture_leader_2').GetFullName]"
 sb_rhodesian_venture.001.c:0 "[SCOPE.sCharacter('sb_rhodesian_venture_leader_3').GetPrimaryRoleTitle] [SCOPE.sCharacter('sb_rhodesian_venture_leader_3').GetFullName]"
 sb_rhodesian_venture.001.cancel:0 "No suitable commander remains."

 # ### TO REVIEW ###
 sb_rhodesian_venture.010.t:0 "A Charter Beyond the Limpopo"
 sb_rhodesian_venture.010.rhodes_d:0 "The Royal Charter is sealed, the pioneer column has reached its ground in [GetStateRegion('STATE_ZAMBEZI').GetName], and [SCOPE.sCharacter('sb_rhodesian_venture_success_rhodes_scope').GetFullName] stands ready to exchange private promotion for chartered rule. The British South Africa Company will now govern the territory from Fort Salisbury in Britain's name."
 sb_rhodesian_venture.010.no_rhodes_d:0 "The Royal Charter is sealed and the pioneer column has reached its ground in [GetStateRegion('STATE_ZAMBEZI').GetName]. A newly appointed executive will direct the British South Africa Company from London while its administration takes root at Fort Salisbury."
 sb_rhodesian_venture.010.f:0 "Inside the laager of unhitched ox-wagons, iron survey pegs were driven into the highveld turf while a company clerk pried the Royal Seal from its tin case. Between the parchment in his hands and the line of canvas tents behind him, an expedition was turning into a government."
 sb_rhodesian_venture.010.a:0 "Issue the charter."
 sb_rhodesian_venture.010.b:0 "The ground has shifted beneath the venture."

 # ### TO REVIEW ###
 sb_rhodesian_venture.011.t:0 "The Venture Recalled"
 sb_rhodesian_venture.011.d:0 "The support sustaining the Rhodesian Venture has collapsed. Whether starved of funds, stripped of political authority, or blocked along the northern road, its agents are being recalled before a chartered administration can take hold."
 sb_rhodesian_venture.011.f:0 "In Whitehall, clerks stamped the draft concession files 'Cancelled' and locked them beside unpaid freight bills and voided supply contracts. Along the Bechuanaland road, the column's agents turned their wagons south without a charter to show for the journey."
 sb_rhodesian_venture.011.a:0 "We may reconsider the scheme in time."

 # ### TO REVIEW ###
 sb_rhodesian_venture.020.t:0 "The Meaning of the Concession"
 sb_rhodesian_venture.020.d:0 "Dispatches from Bulawayo clash over what Lobengula's council understood the mining papers to grant. Paying independent interpreters to clarify the text will ease friction at court, whereas enforcing the promoters' broadest reading risks open confrontation."
 sb_rhodesian_venture.020.f:0 "Outside the royal enclosure, a missionary and the king's interpreter laid the English deed beside the spoken Ndebele terms, halting at every clause that turned prospecting rights into exclusive sovereignty. Across the yard, the syndicate's agents pressed for a signature before another envoy arrived."
 sb_rhodesian_venture.020.a:0 "Hire independent interpreters and offer formal assurances."
 sb_rhodesian_venture.020.b:0 "Press the broadest possible reading."

 # ### TO REVIEW ###
 sb_rhodesian_venture.021.t:0 "Rival Concessionaires"
 sb_rhodesian_venture.021.d:0 "Rival prospectors have arrived at Lobengula's court waving competing claims over the same reefs. Buying out their papers clears the path for our syndicate; leaving their weak titles to unravel in the open spares the treasury at the cost of delay."
 sb_rhodesian_venture.021.f:0 "Speculators crowded the wagon road outside Bulawayo with tin deed boxes, wagon-loads of rifles, and fresh promises for every headman who would listen. Our agents weighed a quiet cash buyout against letting the weaker syndicates quarrel themselves into irrelevance."
 sb_rhodesian_venture.021.a:0 "Buy out the competing claims."
 sb_rhodesian_venture.021.b:0 "Let time expose the weaker papers."

 # ### TO REVIEW ###
 sb_rhodesian_venture.022.t:0 "The Charter Lobby"
 sb_rhodesian_venture.022.d:0 "The draft charter is now before Whitehall. Its promoters press for wide territorial powers and swift assent; Treasury and parliamentary critics demand strict bounds on Crown liability before private ambition receives a Royal Seal."
 sb_rhodesian_venture.022.f:0 "Along the corridors of Westminster, company solicitors distributed gilded maps and subscriber lists while Treasury clerks annotated every clause in red ink, asking who would pay if a chartered frontier ended in another colonial war."
 sb_rhodesian_venture.022.a:0 "Fund a determined parliamentary campaign."
 sb_rhodesian_venture.022.b:0 "Accept closer imperial scrutiny."

 # ### TO REVIEW ###
 sb_rhodesian_venture.023.t:0 "Investors and Oversight"
 sb_rhodesian_venture.023.d:0 "City financiers offer full subscription if the Crown grants the promoters wide discretion, while Treasury auditors urge stricter accounting. Submitting to oversight eases political risk at the price of delay; backing the promoters' terms requires Crown money to speed the venture forward."
 sb_rhodesian_venture.023.f:0 "In a Lombard Street boardroom, stockbrokers passed around the subscription ledger beside an open Treasury minute demanding quarterly vouchers and capped guarantees. Nobody doubted the gold rumours; the quarrel was over whose credit stood behind the first bad year."
 sb_rhodesian_venture.023.a:0 "Submit to the Treasury's safeguards."
 sb_rhodesian_venture.023.b:0 "Underwrite the promoters' terms."

 # ### TO REVIEW ###
 sb_rhodesian_venture.024.t:0 "The Tuli Road"
 sb_rhodesian_venture.024.d:0 "Advance scouts warn that the quickest track north crosses washed-out drifts and unreliable pans. Hiring local guides to cut proper crossings will steady the march; pushing straight on keeps the column to schedule at rising hazard."
 sb_rhodesian_venture.024.f:0 "Beyond Fort Tuli, ox-wagons queued above a flooded drift while axes rang in the mopane scrub to corduroy the bank. Scouts returned with dry gourds from the forward pans, leaving the column masters to gamble on the next river crossing."
 sb_rhodesian_venture.024.a:0 "Hire guides and prepare the crossings."
 sb_rhodesian_venture.024.b:0 "Keep the column moving."

 # ### TO REVIEW ###
 sb_rhodesian_venture.025.t:0 "Sickness in the Column"
 sb_rhodesian_venture.025.d:0 "Fever and lung-sickness have struck the teamsters and span oxen, threatening the whole supply train. Halting to quarantine the herds and restock wagons buys safety at heavy cost and delay; driving onward risks crippling the column on the road."
 sb_rhodesian_venture.025.f:0 "At dusk the wagons drew into a tight thornbush laager, quarantine fires smoking downwind from the healthy spans while drivers drenched feverish cattle and weighed out the last quinine tins. No depot lay behind them closer than Bechuanaland."
 sb_rhodesian_venture.025.a:0 "Halt, treat the sick, and reorganise the supply train."
 sb_rhodesian_venture.025.b:0 "The column must not lose momentum."

 # ### TO REVIEW ###
 sb_rhodesian_venture.030.t:0 "The Diamond Magnate"
 sb_rhodesian_venture.030.d:0 "Under [SCOPE.sCharacter('sb_de_beers_rhodes_scope').GetFullName], [SCOPE.sCompany('sb_de_beers_company_scope').GetName] has grown into one of the richest concerns in southern Africa. Mastery of the diamond fields has brought [SCOPE.sCharacter('sb_de_beers_rhodes_scope').GetHerHim] vast wealth and public standing—which [SCOPE.sCharacter('sb_de_beers_rhodes_scope').GetSheHe] now means to carry from the boardroom into parliamentary politics."
 sb_rhodesian_venture.030.f:0 "At Kimberley, sorting tables still glittered with rough stones under armed watch, yet [SCOPE.sCharacter('sb_de_beers_rhodes_scope').GetLastNameNoFormatting]'s chair at the head of the boardroom stood already cleared of share registers. Leaving a successor to manage the mine shafts, [SCOPE.sCharacter('sb_de_beers_rhodes_scope').GetSheHe] packed [SCOPE.sCharacter('sb_de_beers_rhodes_scope').GetHerHis] papers for Cape Town—where fortunes bought votes and ministries alike."
 sb_rhodesian_venture.030.a:0 "The boardroom has become too small for [SCOPE.sCharacter('sb_de_beers_rhodes_scope').GetHerHim]."
 sb_rhodesian_venture.030.a.tt:0 "[SCOPE.sCharacter('sb_de_beers_rhodes_scope').GetFullName] steps down as Executive of #bold [SCOPE.sCompany('sb_de_beers_company_scope').GetName]#! (replaced by a new Industrialist executive), becomes a Politician and [concept_leader] of the [SCOPE.sCharacter('sb_de_beers_rhodes_scope').GetInterestGroup.GetName], upgrades to [GetCharacterTrait('expert_entrepreneur').GetName] and [GetCharacterTrait('experienced_political_operator').GetName], and gains #p +25#! [concept_popularity] for #v 10 years#!."
