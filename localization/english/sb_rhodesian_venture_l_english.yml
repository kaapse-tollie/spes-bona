l_english:
 company_sb_british_south_africa_company:0 "British South Africa Company"
 company_sb_british_south_africa_company_desc:0 "A royal-chartered company empowered to administer territory and develop transport, mineral, forestry, and agricultural concessions in the African interior."
 sb_british_south_africa_company_charter_slot:0 "British South Africa Company Charter"
 sb_british_south_africa_company_charter_slot_desc:0 "The Company's territorial charter requires a dedicated place within the British corporate establishment."
 sb_rhodes_diamond_magnate:0 "Diamond Magnate"
 sb_rhodes_diamond_magnate_desc:0 "The consolidation of the diamond fields has given this character wealth, renown, and a formidable public standing."

 decision_sb_back_rhodesian_venture:0 "Organize the Pioneer Column"
 decision_sb_back_rhodesian_venture_desc:0 "Back a pioneer column into the country beyond Bechuanaland. Its agents must secure disputed concessions, win a Royal Charter, and prepare the expedition before company government can be established."

 je_sb_rhodesian_venture:0 "The Rhodesian Venture"
 je_sb_rhodesian_venture_reason:0 "Britain's command of the Bechuanaland corridor has opened a road toward the plateau beyond the Limpopo. Promoters now propose to turn loosely worded mineral concessions into a royal charter and then carry a pioneer column north. The supposed rights granted at Lobengula's court are disputed, the route remains uncertain, and commercial ambition must still be made into an effective administration.\n\nThe venture advances each month. Incidents may exchange time, money, and Venture Peril, while default, subjection, the loss of a qualifying colonial law, or the loss of an eligible foothold at Fort Salisbury will end the undertaking."
 je_sb_rhodesian_venture_status_concessions:0 "Agents are negotiating at Lobengula's court and contesting what the proposed concessions would actually permit."
 je_sb_rhodesian_venture_status_charter:0 "The concession papers have reached London, where financiers and ministers are arguing over the terms of a Royal Charter."
 je_sb_rhodesian_venture_status_pioneer_column:0 "Recruitment and supply are under way for a pioneer column along the Tuli route."
 je_sb_rhodesian_venture_complete_tt:0 "Complete #v 18#! months of venture progress."
 je_sb_rhodesian_venture_fail_tt:0 "Venture Peril reaches #v 5#!."

 sb_rhodesian_venture_progress_bar:0 "Venture Progress"
 sb_rhodesian_venture_progress_bar_desc:0 "Progress from contested concessions, through charter negotiations, to the organization of the Pioneer Column."
 sb_rhodesian_venture_monthly_progress_tt:0 "The venture advances each month."
 sb_rhodesian_venture_peril_bar:0 "Venture Peril"
 sb_rhodesian_venture_peril_bar_desc:0 "Political, financial, and logistical dangers that may bring the Rhodesian Venture to an end."

 sb_rhodesian_venture_expedition_cost_tt:0 "The venture incurs the standard cost of a medium overseas expedition."
 sb_rhodesian_venture_success_tt:0 "The #bold British South Africa Company#! is established in London and receives a chartered administration at Fort Salisbury. Eligible territory in Zambezi passes to company rule, together with any existing British claim there."

 # ### TO REVIEW ###
 sb_rhodesian_venture.001.t:0 "Command of the Rhodesian Venture"
 sb_rhodesian_venture.001.rhodes_d:0 "Cecil Rhodes has lent the scheme commercial weight, but the venture still requires an officer able to coordinate concession agents, London financiers, transport columns, and imperial officials. Three candidates have been placed before the Cabinet."
 sb_rhodesian_venture.001.no_rhodes_d:0 "Promoters have assembled around the proposed charter without a single dominant financier. The venture still requires an officer able to coordinate concession agents, London investors, transport columns, and imperial officials. Three candidates have been placed before the Cabinet."
 sb_rhodesian_venture.001.f:0 "A line drawn on a prospectus could be crossed in an afternoon. A road through disputed country demanded months of bargaining, money, and preparation."
 sb_rhodesian_venture.001.a:0 "[SCOPE.sCharacter('sb_rhodesian_venture_leader_1').GetPrimaryRoleTitle] [SCOPE.sCharacter('sb_rhodesian_venture_leader_1').GetFullName]"
 sb_rhodesian_venture.001.b:0 "[SCOPE.sCharacter('sb_rhodesian_venture_leader_2').GetPrimaryRoleTitle] [SCOPE.sCharacter('sb_rhodesian_venture_leader_2').GetFullName]"
 sb_rhodesian_venture.001.c:0 "[SCOPE.sCharacter('sb_rhodesian_venture_leader_3').GetPrimaryRoleTitle] [SCOPE.sCharacter('sb_rhodesian_venture_leader_3').GetFullName]"
 sb_rhodesian_venture.001.cancel:0 "No suitable commander remains."

 # ### TO REVIEW ###
 sb_rhodesian_venture.010.t:0 "A Charter Beyond the Limpopo"
 sb_rhodesian_venture.010.rhodes_d:0 "The charter is sealed, the pioneer column has reached its appointed ground, and Cecil Rhodes is ready to exchange promotion for administration. The British South Africa Company will now govern the territory from Fort Salisbury in Britain's name."
 sb_rhodesian_venture.010.no_rhodes_d:0 "The charter is sealed and the pioneer column has reached its appointed ground. A new executive will direct the British South Africa Company from London while its administration takes root at Fort Salisbury."
 sb_rhodesian_venture.010.f:0 "The Company's papers spoke of commerce, order, and development. On the plateau, their meaning arrived in wagons, rifles, clerks, and survey pegs."
 sb_rhodesian_venture.010.a:0 "Issue the charter."
 sb_rhodesian_venture.010.b:0 "The ground has shifted beneath the venture."

 # ### TO REVIEW ###
 sb_rhodesian_venture.011.t:0 "The Venture Recalled"
 sb_rhodesian_venture.011.d:0 "The assumptions supporting the Rhodesian Venture have collapsed. Funds, political authority, or a practicable route are no longer sufficient to sustain the undertaking, and its agents are being recalled before a chartered administration can be established."
 sb_rhodesian_venture.011.f:0 "Concessions and prospectuses survived in London drawers. The column itself did not march."
 sb_rhodesian_venture.011.a:0 "We may reconsider the scheme in time."

 # ### TO REVIEW ###
 sb_rhodesian_venture.020.t:0 "The Meaning of the Concession"
 sb_rhodesian_venture.020.d:0 "Reports from Lobengula's court disagree over what was promised, what was translated, and what the company's agents now claim. A more careful interpretation may preserve the venture's legitimacy, while an expansive reading would move matters forward at considerable risk."
 sb_rhodesian_venture.020.f:0 "The same marks on the same paper carried one meaning in the king's council and another in the offices of London."
 sb_rhodesian_venture.020.a:0 "Pay for interpreters and a narrower settlement."
 sb_rhodesian_venture.020.b:0 "Press the broadest possible reading."

 # ### TO REVIEW ###
 sb_rhodesian_venture.021.t:0 "Rival Concessionaires"
 sb_rhodesian_venture.021.d:0 "Other concession hunters have reached the region with papers of their own. Buying out the most troublesome claims would clear the road to London; waiting for their weakness to show would be safer, but slower."
 sb_rhodesian_venture.021.f:0 "Every signature spawned another map, and every map another claimant."
 sb_rhodesian_venture.021.a:0 "Settle the competing claims."
 sb_rhodesian_venture.021.b:0 "Let time expose the weaker papers."

 # ### TO REVIEW ###
 sb_rhodesian_venture.022.t:0 "The Charter Lobby"
 sb_rhodesian_venture.022.d:0 "The proposed charter has entered Whitehall. Its backers demand broad powers and rapid approval; skeptical officials insist that imperial liabilities be defined before private ambition acquires a public seal."
 sb_rhodesian_venture.022.f:0 "In committee rooms, a frontier was reduced to clauses, guarantees, and the names beneath a memorandum."
 sb_rhodesian_venture.022.a:0 "Fund a determined parliamentary campaign."
 sb_rhodesian_venture.022.b:0 "Accept closer imperial scrutiny."

 # ### TO REVIEW ###
 sb_rhodesian_venture.023.t:0 "Investors and Oversight"
 sb_rhodesian_venture.023.d:0 "Investors will subscribe quickly if the company promises them freedom of action. Treasury officials instead propose a slower syndicate under stricter accounting, reducing danger at the cost of delay."
 sb_rhodesian_venture.023.f:0 "The venture needed capital before it could claim authority, and authority before it could promise a return."
 sb_rhodesian_venture.023.a:0 "Submit to the Treasury's safeguards."
 sb_rhodesian_venture.023.b:0 "Underwrite the promoters' terms."

 # ### TO REVIEW ###
 sb_rhodesian_venture.024.t:0 "The Tuli Road"
 sb_rhodesian_venture.024.d:0 "Scouts report that the quickest road north will expose the column to broken crossings and uncertain water. Local guides can prepare a safer line, or the organizers can accept the danger and maintain the schedule."
 sb_rhodesian_venture.024.f:0 "Beyond Tuli, each mile of road had first to be found, then cut, then supplied."
 sb_rhodesian_venture.024.a:0 "Hire guides and prepare the crossings."
 sb_rhodesian_venture.024.b:0 "Keep the column moving."

 # ### TO REVIEW ###
 sb_rhodesian_venture.025.t:0 "Sickness in the Column"
 sb_rhodesian_venture.025.d:0 "Sickness has spread among the transport crews, threatening discipline and the draft animals upon which every wagon depends. Halting for treatment would lose hard-won time; driving onward could turn illness into disaster."
 sb_rhodesian_venture.025.f:0 "The wagons stood close in the night, their fires small against a country that offered neither depot nor refuge."
 sb_rhodesian_venture.025.a:0 "Halt, treat the sick, and reorganize the supply train."
 sb_rhodesian_venture.025.b:0 "The column must not lose momentum."

 # ### TO REVIEW ###
 sb_rhodesian_venture.030.t:0 "The Diamond Magnate"
 sb_rhodesian_venture.030.d:0 "Under [SCOPE.sCharacter('sb_de_beers_rhodes_scope').GetFullName], De Beers has become one of the most prosperous concerns in southern Africa. Control of the diamond fields has brought him wealth, patronage, and a public reputation extending far beyond Kimberley. Rhodes now intends to leave the company's daily direction to a successor and convert his commercial authority into political leadership."
 sb_rhodesian_venture.030.f:0 "The diamond fields had made a fortune. Their consolidation now supplied a platform from which ambition could reach beyond the boardroom."
 sb_rhodesian_venture.030.a:0 "The boardroom has become too small for him."
 sb_rhodesian_venture.030.a.tt:0 "[SCOPE.sCharacter('sb_de_beers_rhodes_scope').GetFullName] resigns as Executive of #bold De Beers#!, gains #p +25#! [concept_popularity] for #v 10 years#!, and becomes [concept_leader] of the [SCOPE.sCharacter('sb_de_beers_rhodes_scope').GetInterestGroup.GetName]. A new Executive takes charge of De Beers."
