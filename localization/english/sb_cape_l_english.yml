l_english:
 # ### REVIEWED ###
 sb_cape.001.t:0 "The Fairest Cape?"
 sb_cape.001.d:0 "The Sixth Xhosa War is over, but the eastern frontier has not yet been settled. Cape Town speaks of accommodation, law, and franchise, while the eastern districts demand harder rule and faster expansion. The colony cannot long satisfy both."
 sb_cape.001.f:0 "'Harassed and fettered by the remote Table Mountain Government, very ill-informed of the nature of Frontier matters...' — A. Wilmot and John Centlivres Chase"
 sb_cape.001.a:0 "The question must be settled."
 # ### TO REVIEW ###
 sb_cape.100.t:0 "Liberal Ascendancy"
 sb_cape.100.d:0 "Cape Town's reformers have carried the settlement. With [GetLawType('law_cultural_exclusion').GetName] secured in statute and [GetCulture('cape_creole').GetName] citizens admitted to full standing, the colony turns away from frontier supremacy towards parliamentary rule."
 sb_cape.100.d_albany:0 "Reform has prevailed in Cape Town, though only across a diminished colony. With the eastern districts severed into Albany, the ministry secures [GetLawType('law_cultural_exclusion').GetName] and admits [GetCulture('cape_creole').GetName] subjects to full civic standing without eastern veto."
 sb_cape.100.d_after_secession:0 "The eastern bid for partition has failed, leaving Cape Town's ministry master of an undivided colony. With [GetLawType('law_cultural_exclusion').GetName] upheld and [GetCulture('cape_creole').GetName] citizens recognised as a founding people, the separatist committees have spent their force."
 sb_cape.100.f:0 "Along Adderley Street, printers ran off broadsheets celebrating the new ministry before the mail coach had even cleared the pass for Swellendam. In the eastern districts, farmers read the same pages in silence at the post-cart halt, knowing that the policy made beneath Table Mountain now bound the frontier as well."
 sb_cape.100.f_albany:0 "At Table Bay, merchants and Coloured tradesmen gathered outside the Commercial Exchange to hear the gazetted settlement read aloud. Far to the east, the boundary beacons above the Fish River now marked another jurisdiction altogether—proof that Cape Town had won its civic principle at the cost of half its eastern provinces."
 sb_cape.100.f_after_secession:0 "By evening, the last protest banners had been pulled from the railings in Grahamstown while Cape Town's parliamentary clubs toasted an unbroken colony. Few mistook quiet for affection, yet the eastern leagues had thrown their last card and found neither crown nor cannon to back them."
 sb_cape.100.a:0 "Let the new settlement stand."
 # ### REVIEWED ###
sb_cape.101.t:0 "The Frontier Ascendant"
sb_cape.101.d:0 "Frontier interests have carried the day. The policy of conciliation has been cast aside, and frontier colonisation has been written into law while the Eastern Cape Separatist League has suspended its agitation with most of its demands secured."
sb_cape.101.f:0 "'At the moment, the two great wants of the eastern province are security and labour.'\n— Robert Godlonton, #italic Evidence before the Select Committee on Frontier Defence, 1854#!"
sb_cape.101.a:0 "Then let the frontier lead."
 # ### TO REVIEW ###
 sb_cape.102.t:0 "A Cape Compromise"
 sb_cape.102.d:0 "Neither Cape Town's reformers nor the frontier party has mastered the colony. With the Xhosa frontier pacified and [GetLawType('law_cultural_exclusion').GetName] still on the statute book, the ministry closes the long quarrel in an uneasy balance."
 sb_cape.102.f:0 "When the session rose, eastern members and western lawyers shared the same coach down from Parliament without exchanging a word on the franchise or the Fish River. Neither side had got all it demanded, yet both preferred an imperfect peace to tearing the colony apart."
 sb_cape.102.a:0 "Hold the middle ground."
 # ### TO REVIEW ###
 sb_cape.210.t:0 "Weakening of the Franchise"
 sb_cape.210.d:0 "Under [SCOPE.sCharacter('sb_cape_franchise_weakening_ruler_scope').GetFullName], the ministry has revised the [GetAmendmentType('amendment_sb_cape_qualified_franchise').GetName] with a higher property threshold and a stricter literacy test. No racial bar appears in the text, yet the new hurdles strip votes chiefly from African and [GetCulture('cape_creole').GetName] householders."
 sb_cape.210.f:0 "At the magistrate's court in Stellenbosch, a smallholder laid his tax receipt and title deed on the counter, only to have the registering officer push a fresh sheet of dictation across the baize. By dusk, half the street's tenants had been struck off without a single clause naming their colour."
 sb_cape.210.a:0 "Narrow the voter roll."
 sb_cape_210_franchise_weakened_tt:0 "[GetAmendmentType('amendment_sb_cape_qualified_franchise').GetName] is replaced by [GetAmendmentType('amendment_sb_restricted_cape_qualified_franchise').GetName], reducing its Cultural Acceptance bonus from #p +10#! to #p +5#!."
 # ### REVIEWED ###
 sb_cape.130.t:0 "The Cape Qualidfied Franchise"
 sb_cape.130.d:0 "As the ministry debates the issue of citizenship, prominant intellectuals of the #v Cape Liberal Movement#! insists that the new settlement also allow non-Europeans of good standing to be allowed to partake in the political system. They will accept a compromise of wealth, property and literacy, but not one that abandons the principle altogether."
 sb_cape.130.f:0 " "Why should you fear the exercise of franchise? This is a delicate question but it must be touched upon. I do not hesitate to say that I would rather meet the Hottentot at the hustings, voting for his representative, than in the wilds with his gun upon his shoulder. Is it not better to disarm them by granting them the privileges of the constitution? If you now blast all their hopes and tell them they shall not fight their battles constitutionally, do not you yourselves apply to them the stimulus to fight their battles unconstitutionally?" - William Porter"
 sb_cape.130.a:0 "Let us hear them."
 sb_cape.130.b:0 "Their role is to obey."
 # ### TO REVIEW ###
 sb_cape.103.t:0 "The Albany Secession"
 sb_cape.103.d:0 "The eastern settlers judge coexistence with Cape Town impossible. Armed committees have seized the frontier towns, refusing to live under [GetLawType('law_cultural_exclusion').GetName], and a formal ultimatum now demands a separate Colony of Albany."
 sb_cape.103.f:0 "In Grahamstown's crowded committee room, petitions for milder redress were swept off the table for a parchment headed Separation. Before dawn, horsemen were riding out of the town towards Port Elizabeth and the frontier posts to spread the declaration while the sealed original went aboard the mail steamer."
 sb_cape.103.a:0 "Let the eastern appeal meet its answer."
 # ### TO REVIEW ###
 sb_cape.104.t:0 "An Unsettled Colony"
 sb_cape.104.d:0 "Nearly half a century of debate in ministries, mission stations, and frontier halls has ended without either reform or settler mastery. By 1885, the Cape question closes not in a settlement, but in bitter exhaustion."
 sb_cape.104.f:0 "When the Speaker adjourned the house at the end of the session, only a handful of aged members lingered in the benches. Outside, an old frontier veteran folded his newspaper beside the railings and remarked to a younger man that they had been arguing the same boundaries and the same votes since he first rode to the Fish River."
 sb_cape.104.a:0 "Endure a divided colony."
 # ### TO REVIEW ###
 sb_cape.020.t:0 "Responsible Government"
 sb_cape.020.d:0 "Our [concept_overlord] has conceded responsible government to the Cape. Though the colony remains under its [concept_overlord]'s sovereignty, domestic power now passes to a cabinet answerable to Cape Town's own legislature—encouraging parliamentary reformers while alarm spreads across the eastern districts."
 sb_cape.020.f:0 "When the Governor's proclamation was read at the opening of the house, the ministers taking the front benches owed their places to Cape voters rather than metropolitan appointment. Out in the courtyard, western merchants cheered the new ministry, while two eastern delegates watched from the steps and muttered that distant districts had just been handed over to Cape Town."
 sb_cape.020.a:0 "Cape ministers take the reins."
 # ### TO REVIEW ###
 sb_cape.030.t:0 "Responsible Government Agitation"
 sb_cape.030.d:0 "With a distinct [GetCulture('anglo_african').GetName] political consciousness taking hold, colonists across the Cape increasingly reject direct Crown Colony rule from [GetCountry('GBR').GetName]. Reformers and newspapers alike now demand a ministry answerable to Cape voters rather than Whitehall."
 sb_cape.030.f:0 "At the Commercial Exchange in Cape Town, speakers barely finished denouncing Government House before the hall erupted into cheers for an elected cabinet. Even men who prided themselves on imperial loyalty left the meeting declaring that a colony grown to manhood should no longer be ruled by an appointed Governor's desk."
 sb_cape.030.a:0 "The demand for self-rule grows."
 # ### TO REVIEW ###
 sb_cape.031.t:0 "Crown Tutelage Ended"
 sb_cape.031.d:0 "Direct British Crown Colony rule over the Cape has come to an end. Whether through self-governing institutions or separation from Britain, the campaign that once rallied colonists against Whitehall's officials has lost its target."
 sb_cape.031.f:0 "Down came the broadsheets demanding self-rule from the shopfronts of Cape Town and Port Elizabeth, replaced by notices of local taxes, railway bills, and ministerial quarrels. Whatever grievances remained, Cape politicians could no longer blame every unpopular measure on a distant Colonial Secretary."
 sb_cape.031.a:0 "The agitation subsides."
 # ### REVIEWED ###
 sb_cape.200.t:0 "Albany Before the Crown"
 sb_cape.200.d:0 "After a full settler rising in the east, the separatist committees now demand direct recognition from London as a Colony of Albany. If we accept, we preserve imperial authority at the cost of partition; if we refuse, Cape Town must crush the revolt without imperial help."
 sb_cape.200.f:0 "To some in London the answer seemed plain: if the frontier required another government, then let the Crown provide it. To others, partition was surrender in cleaner dress."
 sb_cape.200.a:0 "Create Albany."
 sb_cape.200.b:0 "Keep the Cape whole."
 # ### TO REVIEW ###
 sb_cape.201.t:0 "Albany Sanctioned"
 sb_cape.201.d:0 "London has granted the eastern ultimatum, detaching [GetStateRegion('STATE_EASTERN_CAPE').GetName] from Cape Town as the separate Colony of Albany. Western ministers condemn the dismemberment, while those eastern loyalists left inside the Cape feel betrayed by Crown and capital alike."
 sb_cape.201.f:0 "When the mail packet docked in Table Bay carrying the royal letters patent, angry landowners crowded the steps of the Colonial Office before the ink on the gazette had dried. Merchants tallied the lost wool trade of Algoa Bay, while frontier farmers muttered that imperial loyalty had earned them nothing but a broken colony."
 sb_cape.201.a:0 "Remain in Cape Town."
 sb_cape.201.b:0 "Cross to Albany and govern the east."
 # ### TO REVIEW ###
 sb_cape.202.t:0 "Separation Refused"
 sb_cape.202.d:0 "The eastern ultimatum has been rejected, leaving [GetStateRegion('STATE_EASTERN_CAPE').GetName] bound to Cape Town with no imperial charter to rescue the separatist committees. Stripped of outside backing, the eastern movement faces the full weight of an undivided colonial government."
 sb_cape.202.f:0 "The refusal was posted outside the committee rooms in Grahamstown and read in tight-lipped silence. Without a separate charter or metropolitan troops to shield them, delegates who had staked everything on partition found their following crumbling as Cape Town prepared to reassert its authority."
 sb_cape.202.a:0 "The Cape remains one colony."
 # ### TO REVIEW ###
 sb_cape.203.t:0 "Albany Established"
 sb_cape.203.d:0 "[ROOT.GetCountry.GetName] now stands as a separate colony governed from Grahamstown. Frontier offices are being organised, commando service regularised, and new settlers drawn towards the eastern borderlands."
 sb_cape.203.f:0 "At the Market Square in Grahamstown, mounted burghers tightened their saddle girths beside stacks of broadsheets fresh off the press. For the first time, the men guarding the Fish River crossings answered to a ministry of their own rather than magistrates three weeks' ride away in Cape Town."
 sb_cape.203.a:0 "Grahamstown governs the east."
 # ### TO REVIEW ###
 sb_cape.205.t:0 "The Franchise After Albany"
 sb_cape.205.d:0 "With Albany detached, the strongest eastern bloc no longer sits in Cape Town's chamber. Reformers now press the ministry to attach [GetAmendmentType('amendment_sb_cape_qualified_franchise').GetName] to [GetLawType('law_cultural_exclusion').GetName] while the opposition is gone."
 sb_cape.205.f:0 "From the public gallery, Cape Creole shopkeepers and mission schoolmasters leaned over the rail as the Attorney-General laid out the property and literacy figures. Across the floor, the rows usually filled by eastern delegates stood half-empty, leaving western members to settle who might vote in the diminished colony."
 sb_cape.205.a:0 "Enact [GetAmendmentType('amendment_sb_cape_qualified_franchise').GetName]."
 sb_cape.205.b:0 "Leave [GetLawType('law_cultural_exclusion').GetName] unamended."
 # ### TO REVIEW ###
 sb_cape.111.t:0 "Convicts at the Cape"
 sb_cape.111.d:0 "A convict transport lies anchored off the Cape, carrying imperial plans to turn the colony into a penal station. Merchants and civic associations have organised a boycott of supplies, forcing the ministry to choose between obeying London's orders and backing the colony's defiance."
 sb_cape.111.f:0 "Shop shutters stayed barred along St George's Street while church bells called burghers to the Grand Parade. Down at the jetty, harbourmen stood with folded arms beside the stacked water casks, waiting to learn whether the Governor would order the ship provisioned or signal her back out to sea."
 sb_cape.111.a:0 "If London insists, we shall receive them."
 sb_cape.111.b:0 "The Cape is no gaol."
 # ### TO REVIEW ###
 sb_cape.120.t:0 "The Liberal Petition"
 sb_cape.120.d:0 "With the frontier party ascendant in Cape Town, Cape liberals warn that mild assurances are no longer enough. Their leaders have laid a formal petition before the ministry demanding a binding pledge to enact [GetLawType('law_cultural_exclusion').GetName]."
 sb_cape.120.f:0 "A deputation of lawyers, ministers of religion, and Cape Creole electors filed into the Colonial Secretary's office carrying rolls of signatures bound in black ribbon. Their spokesman laid the sheets across his blotter, asking how long loyal subjects were expected to wait while frontier deputies spoke for the entire colony."
 sb_cape.120.a:0 "Commit to [GetLawType('law_cultural_exclusion').GetName]."
 sb_cape.120.b:0 "Refuse their petition."
 # ### REVIEWED ###
 sb_cape.121.t:0 "Albany's Demand"
 sb_cape.121.d:0 "Frontier settlers and Boer farmers have expressed their strong disapproval of the direction in which Cape Town is steering the colony. The local newspaper, the Grahamstown Journal, has begun calling for the outright secession of the Eastern Province from the Cape Colony. Particularly, those in Albany take great displeasure in being restricted to remaining west of the Great Fish River under the frontier settlement following the Sixth Xhosa War. If the government means to preserve eastern loyalty, it should consider addressing their concerns and commit itself to passing [GetLawType('law_frontier_colonization').GetName]."
 sb_cape.121.f:0 ""The ceded territory must be occupied, and a chain of military posts or villages, or both, must be formed…" - Robert Godlonton"
 sb_cape.121.a:0 "Pass [GetLawType('law_frontier_colonization').GetName]."
 sb_cape.121.b:0 "Refuse the petition."
 # ### TO REVIEW ###
 sb_cape.122.t:0 "The Eastern Demand"
 sb_cape.122.d:0 "With Cape Town's liberals steering colonial policy and no frontier expansion law on the books, delegates from the eastern districts have lost patience. They demand that the ministry bind itself to pursuing [GetLawType('law_frontier_colonization').GetName]."
 sb_cape.122.f:0 "Travel-stained farmers from Albany and Graaff-Reinet crowded the anteroom, spreading tallies of lifted cattle and burnt homesteads over the chairs. 'Cape Town sends us circulars about forbearance,' one stockman told the under-secretary, 'while our herds cross the Fish River by night.'"
 sb_cape.122.a:0 "Commit to [GetLawType('law_frontier_colonization').GetName]."
 sb_cape.122.b:0 "Refuse their demand."
 # ### TO REVIEW ###
 sb_cape.125.t:0 "The Constitutional Claim Broken"
 sb_cape.125.d:0 "The Cape Liberal Movement has passed from petition into armed revolt. By taking up arms against the colonial government, its leaders have shattered their claim to govern by statute, turning the settlement decisively in the frontier interest's favour."
 sb_cape.125.f:0 "In Cape Town, the shutters went up across the liberal reading rooms as militia patrols took the corners. Out along the eastern roads, burgher field-cornets rode in to pledge their districts to the government, eager to remind the capital who had stood fast when constitutional talk gave way to gunpowder."
 sb_cape.125.a:0 "Order belongs to the frontier."
 # ### TO REVIEW ###
 sb_cape.204.t:0 "The Colonial Office Presses"
 sb_cape.204.d:0 "The Colonial Office now treats expansion along the Cape frontier as an imperial priority. With Whitehall pressing for a firmer forward policy, Cape Town is urged to open debate on [GetLawType('law_frontier_colonization').GetName]."
 sb_cape.204.f:0 "The dispatch from Downing Street arrived bound with Treasury minutes and garrison estimates from the last border alarm. Between polite turns of phrase, the permanent under-secretary made London's price plain: imperial patience and regiments would not indefinitely subsidise a static frontier."
 sb_cape.204.a:0 "Begin enacting [GetLawType('law_frontier_colonization').GetName]."
 sb_cape.204.b:0 "We will not be hurried."
