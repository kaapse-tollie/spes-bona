l_english:
 # ### REVIEWED ###
 sb_cape.001.t:0 "The Fairest Cape?"
 sb_cape.001.d:0 "The Sixth Xhosa War is over, but the eastern frontier has not yet been settled. Cape Town speaks of accommodation, law, and franchise, while the eastern districts demand harder rule and faster expansion. The colony cannot long satisfy both."
 sb_cape.001.f:0 "'Harassed and fettered by the remote Table Mountain Government, very ill-informed of the nature of Frontier matters...' — A. Wilmot and John Centlivres Chase"
 sb_cape.001.a:0 "The question must be settled."
 sb_xhosa_native_warbands:0 "Xhosa Warbands"
 sb_xhosa_native_warbands_desc:0 "The frontier clans can summon a broad war levy when the Cape threatens their lands."
 # ### TO REVIEW ###
 sb_cape.100.t:0 "Liberal Ascendancy"
 sb_cape.100.d:0 "The liberals have prevailed. With Cultural Exclusion in force, the Cape can widen its political nation without wholly abandoning hierarchy, and the ministry now claims a distinctly Cape constitutional order."
 sb_cape.100.d_albany:0 "The liberals have prevailed, though only after the east tore itself away from Cape Town. With Albany gone, the ministry may now entrench the Qualified Franchise and pursue a more distinctly Cape constitutional order."
 sb_cape.100.d_after_secession:0 "The eastern challenge has been broken, though not before it drove the colony into open rupture. London refused partition, the separatists spent their fury, and the liberals may now consolidate their constitutional order."
 sb_cape.100.f:0 "In Cape Town, the ministry's supporters crowded the gallery as the new settlement was read into the record. Farther east, newspapers arrived days later and printed the same victory beneath editorials warning that no statute could make the frontier forget its grievances."
 sb_cape.100.f_albany:0 "The ministry entered its franchise settlement into law while clerks removed Albany from the colony's administrative returns. Cape Town had preserved its principle, though the empty eastern columns showed the price at which it had been secured."
 sb_cape.100.f_after_secession:0 "Broken barricades were cleared from the streets as the ministry reclaimed the language of constitutional order. The liberal settlement had survived an armed challenge, but every celebration carried the uneasy knowledge that argument had already crossed into revolt once."
 sb_cape.100.a:0 "So stands the Cape."
 # ### REVIEWED ###
sb_cape.101.t:0 "The Frontier Ascendant"
sb_cape.101.d:0 "Frontier interests have carried the day. The policy of conciliation has been cast aside, and frontier colonisation has been written into law while the Eastern Cape Separatist League has suspended its agitation with most of its demands secured."
sb_cape.101.f:0 "'At the moment, the two great wants of the eastern province are security and labour.'\n— Robert Godlonton, #italic Evidence before the Select Committee on Frontier Defence, 1854#!"
sb_cape.101.a:0 "Then let the frontier lead."
 # ### TO REVIEW ###
 sb_cape.102.t:0 "A Cape Compromise"
 sb_cape.102.d:0 "Neither party has mastered the colony. The ministry closes the question through compromise: the constitutional order survives, colonial policy remains in law, and neither camp can claim a full victory."
 sb_cape.102.f:0 "The final measure satisfied nobody enough to inspire celebration. Ministers signed it because the colony required a government, settlers accepted it because the frontier remained in law, and liberals defended it because the constitutional principle had not been abandoned."
 sb_cape.102.a:0 "Then let compromise suffice."
 # ### TO REVIEW ###
 sb_cape.210.t:0 "Weakening of the Franchise"
 sb_cape.210.d:0 "Under [SCOPE.sCharacter('sb_cape_franchise_weakening_ruler_scope').GetFullName], the ministry has placed the Cape franchise under renewed scrutiny. A new measure raises the property qualification and imposes a stricter literacy test. The franchise remains formally non-racial, but the narrower qualifications fall most heavily upon African and Cape Creole voters."
 sb_cape.210.f:0 "Electoral clerks returned to the rolls with new instructions. Names that had survived every previous revision now disappeared beneath columns recording property, income, and literacy, while ministers continued to insist that no racial bar had been written into law."
 sb_cape.210.a:0 "Raise the qualifications."
 sb_cape_210_franchise_weakened_tt:0 "[GetAmendmentType('amendment_sb_cape_qualified_franchise').GetName] is replaced by [GetAmendmentType('amendment_sb_restricted_cape_qualified_franchise').GetName], reducing its Cultural Acceptance bonus from #p +10#! to #p +5#!."
 # ### REVIEWED ###
 sb_cape.130.t:0 "The Cape Qualidfied Franchise"
 sb_cape.130.d:0 "As the ministry debates the issue of citizenship, prominant intellectuals of the #v Cape Liberal Movement#! insists that the new settlement also allow non-Europeans of good standing to be allowed to partake in the political system. They will accept a compromise of wealth, property and literacy, but not one that abandons the principle altogether."
 sb_cape.130.f:0 " "Why should you fear the exercise of franchise? This is a delicate question but it must be touched upon. I do not hesitate to say that I would rather meet the Hottentot at the hustings, voting for his representative, than in the wilds with his gun upon his shoulder. Is it not better to disarm them by granting them the privileges of the constitution? If you now blast all their hopes and tell them they shall not fight their battles constitutionally, do not you yourselves apply to them the stimulus to fight their battles unconstitutionally?" - William Porter"
 sb_cape.130.a:0 "Let us hear them."
 sb_cape.130.b:0 "Their role is to obey."
 # ### TO REVIEW ###
 sb_cape.103.t:0 "The Albany Secession"
 sb_cape.103.d:0 "The eastern settlers now judge coexistence with Cape Town impossible. Their committees are armed, their newspapers speak openly of separation, and an ultimatum has been sent to London demanding a colony of their own."
 sb_cape.103.f:0 "At the eastern committee meeting, petitions for reform were pushed aside and a fresh sheet headed Separation was placed before the delegates. By nightfall, riders were carrying copies toward Grahamstown while the original was prepared for London."
 sb_cape.103.a:0 "Then we must await London."
 # ### TO REVIEW ###
 sb_cape.104.t:0 "An Unsettled Colony"
 sb_cape.104.d:0 "For decades the Cape question has been fought in ministries, newspapers, mission stations, and on the eastern frontier, yet no lasting settlement has taken hold. The colony has found not resolution, but exhaustion."
 sb_cape.104.f:0 "The archive shelves held petitions for responsible government, frontier memorials, franchise drafts, and reports from wars already receding from memory. Officials tied the newest failure into another bundle, knowing that the same questions would return under different seals."
 sb_cape.104.a:0 "So the bitterness remains."
 # ### TO REVIEW ###
 sb_cape.020.t:0 "Responsible Government"
 sb_cape.020.d:0 "London has granted the Cape responsible government. The colony remains within the Empire, but domestic power now rests far more firmly in Cape hands."
 sb_cape.020.f:0 "The proclamation was read beneath the Queen's portrait, but the ministers standing below it had been chosen in the Cape. Outside Parliament, the crowd cheered a constitutional change whose full meaning would emerge only when London and Cape Town next disagreed."
 sb_cape.020.a:0 "A new order begins."
 # ### TO REVIEW ###
 sb_cape.030.t:0 "Responsible Government Agitation"
 sb_cape.030.d:0 "Cape liberals argue that a colony mature enough to debate its own franchise and frontier policy should no longer be governed as a dependent administration. Responsible government is becoming a public demand, not merely a constitutional preference."
 sb_cape.030.f:0 "Petitions circulated from Cape Town merchants to eastern district meetings, each demanding ministers answerable within the colony. What had begun as a lawyer's constitutional argument now appeared on public platforms, newspaper mastheads, and the desks of imperial officials."
 sb_cape.030.a:0 "The pressure builds."
 # ### TO REVIEW ###
 sb_cape.031.t:0 "Responsible Government Settled"
 sb_cape.031.d:0 "The constitutional demand for responsible government has been answered. With Cape ministers now exercising greater domestic authority, liberal agitation against direct imperial restraint loses its sharpest edge."
 sb_cape.031.f:0 "Campaign placards calling for responsible government came down from meeting halls across the colony. In their place appeared the names of ministers who could no longer answer criticism by pointing toward London."
 sb_cape.031.a:0 "The agitation recedes."
 # ### REVIEWED ###
 sb_cape.200.t:0 "Albany Before the Crown"
 sb_cape.200.d:0 "After a full settler rising in the east, the separatist committees now demand direct recognition from London as a Colony of Albany. If we accept, we preserve imperial authority at the cost of partition; if we refuse, Cape Town must crush the revolt without imperial help."
 sb_cape.200.f:0 "To some in London the answer seemed plain: if the frontier required another government, then let the Crown provide it. To others, partition was surrender in cleaner dress."
 sb_cape.200.a:0 "Create Albany."
 sb_cape.200.b:0 "Keep the Cape whole."
 # ### TO REVIEW ###
 sb_cape.201.t:0 "Albany Sanctioned"
 sb_cape.201.d:0 "London has sanctioned Albany, and the eastern districts have been detached from Cape Town under direct imperial authority. What was once a separatist agitation now stands as a colony of its own."
 sb_cape.201.f:0 "Surveyors copied the new boundary while clerks separated tax rolls, militia lists, and official correspondence. A frontier grievance had become a colony through the patient division of every record that once joined Albany to Cape Town."
 sb_cape.201.a:0 "Albany is sanctioned."
 sb_cape.201.b:0 "Take command of Albany."
 # ### TO REVIEW ###
 sb_cape.202.t:0 "Separation Refused"
 sb_cape.202.d:0 "London has refused the eastern ultimatum. The settlers are furious and now claim to have been abandoned by both Cape Town and the imperial government. The constitutional question may be closed, but the frontier crisis is not."
 sb_cape.202.f:0 "The imperial refusal was posted outside the eastern committee rooms and read in silence. By evening, the notices had been torn down, armed men guarded the meeting halls, and speakers who had petitioned the Crown began asking what remained after petition failed."
 sb_cape.202.a:0 "Then the crisis deepens."
 # ### TO REVIEW ###
 sb_cape.203.t:0 "Albany Established"
 sb_cape.203.d:0 "Albany now stands as a separate colony. Frontier offices are being organized, militia service regularized, and fresh migration is already being drawn toward Grahamstown and the border districts."
 sb_cape.203.f:0 "New seals arrived before the furniture did. Albany's officials worked from borrowed rooms, entering taxes, militia obligations, and appointments into ledgers that transformed separatist committees into the machinery of a colonial government."
 sb_cape.203.a:0 "Albany stands."
 # ### TO REVIEW ###
 sb_cape.205.t:0 "The Franchise After Albany"
 sb_cape.205.d:0 "Albany's separation has removed the strongest eastern opposition from Cape politics. Liberal ministers now argue that the colony should answer partition by entrenching the Cape Qualified Franchise within its citizenship settlement."
 sb_cape.205.f:0 "The benches once occupied by the strongest eastern opponents now stood empty. Liberal ministers used that absence to place the franchise amendment before Parliament, arguing that partition had changed not only the map but the majority capable of defining the Cape."
 sb_cape.205.a:0 "Amend the franchise."
 sb_cape.205.b:0 "The moment has passed."
 # ### TO REVIEW ###
 sb_cape.111.t:0 "Convicts at the Cape"
 sb_cape.111.d:0 "London proposes to make the Cape a destination for transported convicts. To many in the colony this is not policy but insult, proof that the Cape is still treated as a receptacle for imperial burdens rather than a political community."
 sb_cape.111.f:0 "Merchants closed their warehouses, church bells summoned protest meetings, and harbourmen refused to help provision a convict ship. The proposal had united colonists who agreed on little else around a single declaration: the Cape would not be made the Empire's prison."
 sb_cape.111.a:0 "If London insists, we shall receive them."
 sb_cape.111.b:0 "The Cape is no gaol."
 # ### TO REVIEW ###
 sb_cape.120.t:0 "The Liberal Petition"
 sb_cape.120.d:0 "The Cape liberals insist that sentiment is no longer enough. If a broader civic order is to endure, [GetLawType('law_cultural_exclusion').GetName] must be carried into law before frontier alarm hardens into settlement."
 sb_cape.120.f:0 "The liberal petition arrived with signatures from mission men, merchants, lawyers, and voters whose place in the colony depended upon the law remaining broader than the frontier demanded. Its authors asked the ministry to turn constitutional language into a statute before another crisis narrowed it."
 sb_cape.120.a:0 "Pass [GetLawType('law_cultural_exclusion').GetName]."
 sb_cape.120.b:0 "Let them petition."
 # ### REVIEWED ###
 sb_cape.121.t:0 "Albany's Demand"
 sb_cape.121.d:0 "Frontier settlers and Boer farmers have expressed their strong disapproval of the direction in which Cape Town is steering the colony. The local newspaper, the Grahamstown Journal, has begun calling for the outright secession of the Eastern Province from the Cape Colony. Particularly, those in Albany take great displeasure in being restricted to remaining west of the Great Fish River under the frontier settlement following the Sixth Xhosa War. If the government means to preserve eastern loyalty, it should consider addressing their concerns and commit itself to passing [GetLawType('law_frontier_colonization').GetName]."
 sb_cape.121.f:0 ""The ceded territory must be occupied, and a chain of military posts or villages, or both, must be formed…" - Robert Godlonton"
 sb_cape.121.a:0 "Pass [GetLawType('law_frontier_colonization').GetName]."
 sb_cape.121.b:0 "Refuse the petition."
 # ### TO REVIEW ###
 sb_cape.122.t:0 "The Eastern Demand"
 sb_cape.122.d:0 "The settler interest in the eastern districts now demands more than sympathetic words. If the ministry means to govern the whole colony, it must commit itself to [GetLawType('law_frontier_colonization').GetName]."
 sb_cape.122.f:0 "The eastern deputation brought casualty lists, land petitions, and newspaper clippings into the minister's office. Each document made the same case in a different form: a government that asked the frontier for loyalty must be seen to legislate for its security."
 sb_cape.122.a:0 "Pass [GetLawType('law_frontier_colonization').GetName]."
 sb_cape.122.b:0 "Refuse their demand."
 # ### TO REVIEW ###
 sb_cape.125.t:0 "The Constitutional Claim Broken"
 sb_cape.125.d:0 "The Cape Liberal Movement has passed from petition into revolt. Its leaders may still speak in the language of law and franchise, but armed insurrection has broken their claim to govern through either. The frontier interest now presents itself as the guardian of colonial order, and the old balance turns decisively in its favor."
 sb_cape.125.f:0 "News of the liberal rising reached eastern meetings already hostile to Cape Town. Settler speakers held up the reports as proof that those who claimed the language of law would abandon it when defeated, and offered the frontier interest as the colony's remaining party of order."
 sb_cape.125.a:0 "Then the frontier shall lead."
 # ### TO REVIEW ###
 sb_cape.204.t:0 "The Colonial Office Presses"
 sb_cape.204.d:0 "The Colonial Office now treats the Cape frontier as an imperial priority. With Britain pressing a harder colonial policy, Cape Town is being urged to put [GetLawType('law_frontier_colonization').GetName] into law."
 sb_cape.204.f:0 "The Colonial Office dispatch arrived annotated with military estimates and the cost of another frontier emergency. London did not merely recommend a change of policy; it presented frontier colonization as the condition upon which imperial patience and assistance would continue."
 sb_cape.204.a:0 "Pass [GetLawType('law_frontier_colonization').GetName]."
 sb_cape.204.b:0 "We will not be hurried."
