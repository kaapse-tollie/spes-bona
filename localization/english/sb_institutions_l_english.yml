l_english:
 # TO REVIEW (non-event/JE keys)
 sb_institutions_social_mobility_available_tt:0 "The state’s owner does not have an active Prerogative [concept_journal_entry]."
 sb_institutions_reach_positive_tt:0 "Institutional Reach is greater than #v 0#!."
 sb_prerogative_base_legitimacy:0 "Courtly Politics"
 sb_prerogative_political:0 "Co-operation at Court"
 sb_prerogative_military:0 "Co-operation of the Amabutho"
 sb_prerogative_live_readout:0 "$sb_prerogative_country_title$: #v [JournalEntry.GetCountry.MakeScope.Var('sb_prerogative_var').GetValue|1]#!  #low (−100 to +100)#!\nTarget: #v [JournalEntry.GetCountry.MakeScope.Var('sb_prerogative_target_var').GetValue|1]#!\nMonthly change: #v [JournalEntry.GetCountry.MakeScope.Var('sb_prerogative_monthly_change_var').GetValue|=1]#!"
 sb_prerogative_breakdown:0 "#b Prerogative#!\nHow firmly the ruler can rely on the court and the country’s supporters.\n\n#b Current effects#!\n[JournalEntry.GetCountry.GetCustom('sb_prerogative_current_effects')]\n\n#b What sets the target?#!\n• #v 75%#!: present allegiance and the ruler’s [concept_popularity]. The ruler and loyal supporters strengthen court backing; rival coalitions weaken it. Uncommitted prominence moderates this balance at #v one quarter#! of its full weight. Court backing: #v [JournalEntry.GetCountry.MakeScope.Var('sb_prerogative_cooperation_var').GetValue|1]#!.\n• #v 25%#!: the balance of [concept_political_movement_support] for the present constitution against its opponents. Movement balance: #v [JournalEntry.GetCountry.MakeScope.Var('sb_prerogative_movement_balance_var').GetValue|1]#!.\n\nPrerogative moves towards this target each month by #v 15%#! of the gap, up to #v 4#! points. #italic Secure a Pledge#! buys personal co-operation. Popularity contributes half its value to court backing before the 75% weighting. Promises about the next succession are shown separately in the court.\n\n[JournalEntry.GetCountry.GetCustom('sb_court_challenge_rule')]"
 sb_prerogative_effects_active:0 "[ConcatIfNeitherEmpty(JournalEntry.GetCountry.GetTimedModifier('sb_prerogative_base_legitimacy').GetDesc, '\n')][ConcatIfNeitherEmpty(JournalEntry.GetCountry.GetTimedModifier('sb_prerogative_political').GetDesc, '\n')][JournalEntry.GetCountry.GetTimedModifier('sb_prerogative_military').GetDesc]"
 sb_prerogative_effects_none:0 "No institutional effects are currently active."

 # TO REVIEW (non-event/JE keys)
 sb_prerogative_country_title:0 "[JournalEntry.GetCountry.GetCustom('sb_prerogative_title')]"
 sb_prerogative_royal_title:0 "Royal Prerogative"
 sb_prerogative_chiefly_title:0 "Chiefly Prerogative"
 sb_prerogative_royal_flavour:0 "The king rules from the royal homestead, but his commands must pass through the great chiefs and the regiments. A chief may uphold the monarchy while favouring another prince; an acknowledged heir may still find the kingdom divided when his time comes. The uSuthu defend the royal house, while the amaKhosi seek greater power for the chiefs. Gifts, appointments and a carefully chosen successor may bind these interests to the throne. Neglect them, and another coalition may claim the right to rule."
 sb_prerogative_chiefly_flavour:0 "The great chiefs have divided the powers once exercised from the royal homestead. Each commands a following, but none can govern the country by their own word alone. The amaKhosi uphold the federation; the uSuthu look to the royal house for its undoing. The head chief must secure the co-operation of their peers, settle their disputes and keep the royal claimants from gathering a stronger following. A council united in name may yet prove divided in allegiance."
 sb_institutional_reach_readout:0 "Institutional Reach: #v [JournalEntry.GetCountry.MakeScope.Var('sb_institutional_reach_var').GetValue|0]#! / 50"
 sb_institutional_reach_breakdown:0 "#b Institutional Reach#!\nHow much government depends on the royal court and the great chiefs. Higher Reach strengthens both the benefits of co-operation and the penalties for opposition.\n\n#b Base: 50#![JournalEntry.GetCountry.GetCustom('sb_ir_governance_adjustment')][JournalEntry.GetCountry.GetCustom('sb_ir_economy_adjustment')][JournalEntry.GetCountry.GetCustom('sb_ir_police_adjustment')][JournalEntry.GetCountry.GetCustom('sb_ir_distribution_adjustment')][JournalEntry.GetCountry.GetCustom('sb_ir_bureaucracy_adjustment')][JournalEntry.GetCountry.GetCustom('sb_ir_army_adjustment')]\n\nThe total is capped between #v 0#! and #v 50#!. At #v 0#!, or if monarchy and federated chiefdoms are abandoned (or Technocracy, Single-Party State or Anarchy enacted), this Journal Entry closes.\n\n#b Current effects#!\n#n $decree_promote_social_mobility$ is unavailable while this Journal Entry is active.#!\n[JournalEntry.GetCountry.GetCustom('sb_prerogative_current_effects')]\n\nReforming away from [Glossary('glossary_sb_amabutho','Amabutho')] removes the military effects."
 sb_court_movements_readout:0 "[concept_political_movement_support]\nuSuthu: #v [JournalEntry.GetCountry.MakeScope.ScriptValue('sb_court_royal_support')|%1]#! · amaKhosi: #v [JournalEntry.GetCountry.MakeScope.ScriptValue('sb_court_chiefly_support')|%1]#!"
 sb_court_movements_breakdown:0 "#b Political Movements#!\nThe [Glossary('glossary_sb_usuthu','uSuthu')] favour monarchy and autocratic rule. The [Glossary('glossary_sb_amakhosi','amaKhosi')] favour Federated Chiefdoms and a Chiefly Council.\n\n#b [concept_activism]#!\nuSuthu: #v [JournalEntry.GetCountry.MakeScope.ScriptValue('sb_institutions_royal_activism')|%1]#!\namaKhosi: #v [JournalEntry.GetCountry.MakeScope.ScriptValue('sb_institutions_chiefly_activism')|%1]#!\n\n#b Influential Supporters#!\nProminent members of the court draw followers towards the constitution they favour, increasing its movement’s Pop Attraction by up to #v 50%#!. Each following is counted once. Agitators already contributing through their public role are not counted again.\nuSuthu attraction bonus: #v [JournalEntry.GetCountry.MakeScope.ScriptValue('sb_court_royal_following_attraction')|%1]#!\namaKhosi attraction bonus: #v [JournalEntry.GetCountry.MakeScope.ScriptValue('sb_court_chiefly_following_attraction')|%1]#!"
 sb_ir_governance_adjustment:0 "\n[JournalEntry.GetCountry.GetActiveLawFromGroup('lawgroup_governance_principles').GetName]: #v −[JournalEntry.GetCountry.MakeScope.ScriptValue('sb_ir_governance_deduction')|0]#!"
 sb_ir_economy_adjustment:0 "\n[JournalEntry.GetCountry.GetActiveLawFromGroup('lawgroup_economic_system').GetName]: #v −[JournalEntry.GetCountry.MakeScope.ScriptValue('sb_ir_economy_deduction')|0]#!"
 sb_ir_police_adjustment:0 "\n[JournalEntry.GetCountry.GetActiveLawFromGroup('lawgroup_policing').GetName]: #v −[JournalEntry.GetCountry.MakeScope.ScriptValue('sb_ir_police_deduction')|0]#!"
 sb_ir_distribution_adjustment:0 "\n[JournalEntry.GetCountry.GetActiveLawFromGroup('lawgroup_distribution_of_power').GetName]: #v −[JournalEntry.GetCountry.MakeScope.ScriptValue('sb_ir_distribution_deduction')|0]#!"
 sb_ir_bureaucracy_adjustment:0 "\n[JournalEntry.GetCountry.GetActiveLawFromGroup('lawgroup_bureaucracy').GetName]: #v −[JournalEntry.GetCountry.MakeScope.ScriptValue('sb_ir_bureaucracy_deduction')|0]#!"
 sb_ir_army_adjustment:0 "\n[JournalEntry.GetCountry.GetActiveLawFromGroup('lawgroup_army_model').GetName]: #v −[JournalEntry.GetCountry.MakeScope.ScriptValue('sb_ir_army_deduction')|0]#!"
 sb_ir_local_police_adjustment:0 "\n[JournalEntry.GetCountry.GetActiveLawFromGroup('lawgroup_policing').GetName]: #v +5#!"
