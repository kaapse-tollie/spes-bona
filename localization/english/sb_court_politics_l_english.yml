 # ### TO REVIEW ###
 sb_court_politics.002.t:0 "A Pledge of Co-operation"
 sb_court_politics.002.d:0 "[SCOPE.sCharacter('sb_court_actor').GetFullName] will pledge co-operation to the reigning sovereign for #v @money![SCOPE.sCountry('sb_court_country').MakeScope.Var('sb_court_offer_price_var').GetValue|0]#!. We must decide whether this cost is worth it."
 sb_court_politics.002.a:0 "Secure their cooperation."
 sb_court_politics.002.b:0 "Make no offer."
 # ### TO REVIEW ###
 sb_court_politics.003.t:0 "A Rival Summoned"
 sb_court_politics.003.d:0 "[SCOPE.sCharacter('sb_court_actor').GetFullName] still presses a claim to the throne. A demand for renunciation would test that claim in open council. Sending men to seize and kill the rival risks flight or an armed challenge."
 sb_court_politics.003.a:0 "Demand renunciation in open council."
 sb_court_politics.003.b:0 "Leave the rival alone."
 sb_court_politics.003.c:0 "Send men to seize and kill the rival."
 # ### TO REVIEW ###
 sb_court_politics.004.t:0 "An Accommodation"
 sb_court_politics.004.d:0 "The opposing leadership may recognise the current institutions without surrendering its identity. [SCOPE.sCharacter('sb_court_actor').GetFullName] will weigh the proposal."
 sb_court_politics.004.a:0 "Seek their agreement."
 sb_court_politics.004.b:0 "Continue the contest."
 # ### TO REVIEW ###
 sb_court_politics.005.t:0 "The Offer Refused"
 sb_court_politics.005.d:0 "The opposition has refused the proposed accommodation. Its political commitments remain in place."
 sb_court_politics.005.a:0 "Their opposition remains."
 # ### TO REVIEW ###
 sb_court_politics.006.t:0 "An Agreement Reached"
 sb_court_politics.006.d:0 "The proposal has been accepted. The agreement changes the commitments of the people concerned without removing them from political life."
 sb_court_politics.006.a:0 "Record the agreement."
