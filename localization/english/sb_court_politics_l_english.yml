 sb_court_current_coalition_summary:0 "Current coalition: #v [Character.MakeScope.Var('sb_court_current_weight_var').GetValue|1]#! [concept_prominence] · #v [Character.MakeScope.Var('sb_court_current_share_var').GetValue|1]%#! of currently pledged prominence"
