 sb_court_challenge_rule_royal:0 "#b Challenge threshold: −50#!\nAt #v −50#! Prerogative or lower, an eligible rival commanding at least #v 25%#! of currently pledged [concept_prominence] can challenge the ruler. Succession disputes follow separate rules. An existing court crisis, civil war or post-war recovery period can prevent a new challenge."
