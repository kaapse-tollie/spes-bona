 # TO REVIEW (non-event/JE keys)
 sb_court_roster_heading:0 "Great Houses and Councillors"
 sb_court_roster_explanation:0 "Present allegiance shows who supports the ruler or a rival today. Succession pledges concern who should rule afterwards. A house’s prominence combines its adult members and follows its leader’s commitments; unaffiliated councillors pledge individually. Select a name to open that character."
 sb_court_roster_commitments:0 "[Character.GetCustom('sb_court_character_alignment')]\n[Character.GetCustom('sb_court_roster_endorsement')]\n[Character.GetCustom('sb_court_future_pledge_display')]"
 sb_court_roster_backs_incumbent:0 "Allegiance: [Character.MakeScope.Var('sb_court_home_scope').GetCountry.GetRuler.GetFullName]"
 sb_court_roster_backs_claimant:0 "Allegiance: [Character.MakeScope.Var('sb_court_claimant_scope').GetCharacter.GetFullName]"
 sb_court_alignment_royal_trait:0 "uSuthu Supporter"
 sb_court_alignment_royal_trait_desc:0 "This character favours the royal house and government under a monarch. They may nevertheless prefer another prince to the present ruler."
 sb_court_alignment_chiefly_trait:0 "amaKhosi Supporter"
 sb_court_alignment_chiefly_trait_desc:0 "This character favours a federation governed by the great chiefs and their council. Their personal allegiance remains a separate matter."
 sb_court_alignment_neutral_trait:0 "Constitutionally Unaligned"
 sb_court_alignment_neutral_trait_desc:0 "This character has not committed to either royal or chiefly rule. They may still support a particular ruler or claimant."
 sb_court_endorsement_incumbent_trait:0 "Supports the Incumbent"
 sb_court_endorsement_incumbent_trait_desc:0 "This character has pledged co-operation to the ruler of their home court, even if they favour a different form of government."
 sb_court_endorsement_claimant_trait:0 "Supports a Rival Claimant"
 sb_court_endorsement_claimant_trait_desc:0 "This character backs a particular royal claimant against the incumbent. The court roster names the person they support."
 sb_court_endorsement_uncommitted_trait:0 "Personally Uncommitted"
 sb_court_endorsement_uncommitted_trait_desc:0 "This character has pledged allegiance to neither the incumbent nor a rival claimant. Patronage may secure their co-operation."
 sb_court_claimant_trait:0 "Claimant"
 sb_court_claimant_trait_desc:0 "This character has a claim to the throne. Their allegiance to the reigning sovereign is shown separately."

 # TO REVIEW (non-event/JE keys)
 sb_court_no_accession_tt:0 "No succession settlement is awaiting a decision or being fought over."
 sb_court_secure_pledge:0 "Secure a Pledge"
 sb_court_secure_pledge_desc:0 "Offer cash for this following’s personal co-operation with the incumbent. The exact quote is shown before payment."
 sb_court_confront_rival:0 "Confront a Rival"
 sb_court_confront_rival_desc:0 "Demand renunciation of this claim or attempt a purge. Renunciation spends 25 Prerogative and commits 100 Authority for ten years; a purge spends 50 and commits 200. The odds are shown before you decide."
 sb_court_pledge_representative_tt:0 "A living adult house leader or unaffiliated councillor in our court, other than the ruler, has not pledged co-operation to the incumbent."
 sb_court_confrontation_available_tt:0 "This living adult claimant is present in our court."
 sb_court_confrontation_tt:0 "Cost: #v 25 Prerogative#!; #v 100#! [concept_authority] committed for #v ten years#!. Available Authority: #v [SCOPE.sCountry('sb_court_country').MakeScope.ScriptValue('sb_court_available_authority')|0]#!.\n\nPossible effects:\n• #bold [SCOPE.sCountry('sb_court_country').MakeScope.Var('sb_court_offer_submission_var').GetValue|1]%#!: [SCOPE.sCharacter('sb_court_actor').GetFullName] renounces the claim. The prince and current supporters become uncommitted; future pledges to this prince are released. Constitutional allegiances remain unchanged.\n• #bold [SCOPE.sCountry('sb_court_country').MakeScope.Var('sb_court_offer_refusal_var').GetValue|1]%#!: [SCOPE.sCharacter('sb_court_actor').GetFullName] refuses and gains #v 10#! [concept_prominence] for #v ten years#!.\n\nYou may ask this rival again after ten years. A purge remains a separate choice. Both outcomes incur the cost."
 sb_court_purge_tt:0 "Cost: #v 50 Prerogative#!; #v 200#! [concept_authority] committed for #v ten years#!. Available Authority: #v [SCOPE.sCountry('sb_court_country').MakeScope.ScriptValue('sb_court_available_authority')|0]#!.\n\nPossible effects:\n• #bold [SCOPE.sCountry('sb_court_country').MakeScope.Var('sb_court_offer_capture_var').GetValue|1]%#!: [SCOPE.sCharacter('sb_court_actor').GetFullName] is killed. Other family members are spared."
 movement_sb_dynastic_test:0 "Dynastic Rivalry"
 movement_sb_dynastic_test_name:0 "Dynastic Rivalry"
 sb_court_dynastic_ai_supply:0 "Civil War Provisioning"
 sb_court_introduce_heir_button:0 "Present a Son"
 sb_court_introduce_heir_button_desc:0 "Present a newborn son and recognise him as heir. Available once per reign. Costs #n 50#! Prerogative. Roughly half your supporting houses’ [concept_prominence] will back him, respecting existing succession pledges."
 sb_court_introduce_heir_tt:0 "Spend #n 50#! Prerogative to introduce a newborn son and recognise him as heir. Roughly half your supporting houses’ [concept_prominence] will pledge to him, without abandoning you. Houses already pledged to another prince keep their promise."
