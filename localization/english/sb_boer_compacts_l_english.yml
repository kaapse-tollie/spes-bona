l_english:
 decision_sb_renew_boer_compacts:0 "Renew Boer Compacts"
 decision_sb_renew_boer_compacts_desc:0 "Invite fellow Boer republics to renew compact treaties of mutual defence, transit, and trade privilege."
 # ### REVIEWED ###
 sb_boer_compacts.010.t:0 "[SCOPE.sCountry('sb_boer_compact_proposer').GetName] Proposes Renewal"
 sb_boer_compacts.010.d:0 "[SCOPE.sCountry('sb_boer_compact_proposer').GetName] has proposed renewing the compact between our republics for another ten years. Each signatory would defend the other's independence, permit free passage across its territory and extend mutual privileges to merchants on both sides of the frontier."
 sb_boer_compacts.010.f:0 "'The two Republics bound themselves to come to each other's assistance in case the independence of either should be wantonly threatened from without.'\n— Paul Kruger, #italic Memoirs#!"
 sb_boer_compacts.010.a:0 "Renew the compact."
 sb_boer_compacts_010_accept_tt:0 "Any existing compact arrangements with [SCOPE.sCountry('sb_boer_compact_proposer').GetName] will be replaced by a single #v 10-year#! Boer Compact, providing mutual defence, reciprocal transit rights and mutual trade privileges."
 sb_boer_compacts.010.b:0 "We will stand apart."
