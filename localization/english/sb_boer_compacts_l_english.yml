l_english:
 decision_sb_renew_boer_compacts:0 "Renew Boer Compacts"
 decision_sb_renew_boer_compacts_desc:0 "Invite fellow Boer republics to renew compact treaties of mutual defence and transit."
 sb_boer_compacts.010.t:0 "[SCOPE.sCountry('sb_boer_compact_proposer').GetName] Wants to Renew the Compact"
 sb_boer_compacts.010.d:0 "[SCOPE.sCountry('sb_boer_compact_proposer').GetName] has proposed renewing the old Boer compact: a limited treaty of mutual defence and transit between the republics for the next ten years."
 sb_boer_compacts.010.f:0 ""A compact can bind arms, roads, and memory alike.""
 sb_boer_compacts.010.a:0 "Renew the compact."
 sb_boer_compacts_010_accept_tt:0 "Replace incomplete compact fragments with one #v 10-year#! Boer compact with [SCOPE.sCountry('sb_boer_compact_proposer').GetName], including mutual defence and two-way transit rights."
 sb_boer_compacts.010.b:0 "Decline the offer."
