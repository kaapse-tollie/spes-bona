l_english:
 # TO REVIEW (non-event/JE keys)
 law_sb_contested_crown:0 "Contested Crown"
 law_sb_contested_crown_desc:0 "Two members of the royal house claim the throne. The monarchy's institutions remain in place while their supporters fight to decide who will rule."
 law_sb_contested_social_crown:0 "Contested Social Crown"
 law_sb_contested_social_crown_desc:0 "A rival claimant challenges the sovereign without proposing to dismantle the Social Monarchy. Its institutions remain in force throughout the struggle."
 ideology_sb_contested_crown:0 "Claimant's Cause"
 ideology_sb_contested_crown_desc:0 "This movement seeks to replace the sovereign with its chosen claimant while retaining the monarchy."
 ideology_sb_contested_social_crown:0 "Claimant's Cause"
 ideology_sb_contested_social_crown_desc:0 "This movement seeks a different sovereign for the existing Social Monarchy."
 sb_court_claimant_mobilisation:0 "Rallying to the Claimant"
 sb_court_coalition_recruitment:0 "Mustering the Coalition"
 sb_court_claimant_armed_forces:0 "Divided over the Crown"
 gov_sb_contested_crown:0 "Contested Monarchy"
 gov_sb_contested_crown_desc:0 "A [concept_government_type] in which rival members of the royal house contest the throne."
 gov_sb_contested_regency:0 "Contested Regency"
 gov_sb_contested_regency_desc:0 "A [concept_government_type] in which a regent defends a young sovereign's claim against a rival member of the royal house."
 sb_court_dynastic_sponsor_tt:0 "All [Concept('concept_interest_group', '$concept_interest_groups|q$')] lose #n 20#! [concept_approval] until this conflict ends. This penalty is removed if the challenge is cancelled."
 sb_court_dynastic_coalitions_tt:0 "Committed [concept_prominence]: [SCOPE.sCharacter('sb_court_nominee').GetFullName] #v [SCOPE.sCountry('sb_court_country').MakeScope.Var('sb_court_dynastic_incumbent_weight_var').GetValue|1]#!; [SCOPE.sCharacter('sb_court_rival').GetFullName] #v [SCOPE.sCountry('sb_court_country').MakeScope.Var('sb_court_dynastic_rival_weight_var').GetValue|1]#!. The weaker side receives one existing Barracks level before the remainder is divided by these shares. Conscription Centres are divided by Prominence. Where both Zululand and Natal are held, the stronger coalition takes Zululand; equal backing leaves it with the incumbent."
 sb_court_dynastic_force_split_tt:0 "Existing recruitment centres are redistributed where needed as preparations begin. When the country divides, [GetPopType('soldiers').GetName] and [GetPopType('officers').GetName] move with their households in proportion to each side's Barracks levels, and both armies are rebuilt. #n Rebuilt units lose their manpower, experience and composition.#! They must recruit and train again; the [concept_conscription_limit] still applies."
 sb_court_dynastic_back_incumbent_tt:0 "Fight the [concept_civil_war] for [SCOPE.sCharacter('sb_court_nominee').GetFullName]. You retain control of [SCOPE.sCountry('sb_court_country').GetName]; [SCOPE.sCharacter('sb_court_rival').GetFullName] leads the opposing country."
 sb_court_dynastic_back_claimant_tt:0 "When the [concept_civil_war] begins, [SCOPE.sCharacter('sb_court_rival').GetFullName] takes the throne of [SCOPE.sCountry('sb_court_country').GetName], which you continue to control. [SCOPE.sCharacter('sb_court_nominee').GetFullName] leads the opposing country."
 sb_court_dynastic_stakes_tt:0 "The victorious side secures the throne. #n The defeated contender and every member of his coalition when this challenge began will be killed.#! Other princes and uncommitted characters survive, retaining their allegiances and succession pledges. The monarchy's institutions are preserved."

 # ### TO REVIEW ###
 sb_court_succession.004.t:0 "Two Claims to the Throne"
 sb_court_succession.004.t.retirement:0 "Mpande's Divided House"
 sb_court_succession.004.d.retirement:0 "Mpande is withdrawing from government, but the royal household is divided. [SCOPE.sCharacter('sb_court_nominee').GetFullName] expects to take his place; [SCOPE.sCharacter('sb_court_rival').GetFullName] has the backing to challenge him. The kingdom must choose between them."
 sb_court_succession.004.f.retirement:0 "The king's withdrawal brings no common summons. Each prince sends for the men who promised to follow him, and the answers arrive at separate homesteads. Mpande's favour can name a successor; it cannot make the other prince's followers lay down their arms."
 sb_court_succession.004.d:0 "[SCOPE.sCharacter('sb_court_rival').GetFullName] has gathered the backing to contest [SCOPE.sCharacter('sb_court_nominee').GetFullName]'s claim to rule. The houses must choose which prince to follow."
 sb_court_succession.004.d.withdrawn:0 "The circumstances of this challenge have changed. These two contenders can no longer contest the throne on the terms presented to the houses."
 sb_court_succession.004.f:0 "Messengers leave the royal homestead in different directions. Each carries a prince's summons; each knows which homesteads will welcome it. Kinship offers no answer now. The men who have promised their support must bring it into the field, and the kingdom cannot have two kings."
 sb_court_succession.004.a:0 "Stand with [SCOPE.sCharacter('sb_court_nominee').GetFullName]."
 sb_court_succession.004.b:0 "Take up [SCOPE.sCharacter('sb_court_rival').GetFullName]'s cause."
 sb_court_succession.004.c:0 "There is no longer a choice to make."
 sb_court_succession.004.prerogative.tt:0 "Both princes begin their rule with #v 0#! Prerogative when the kingdom divides."

 # ### TO REVIEW ###
 sb_court_succession.005.t:0 "One Royal Homestead"
 sb_court_succession.005.d:0 "[SCOPE.sCharacter('sb_court_victor').GetFullName] holds the throne. The defeated contender and his adherents have been put to death; the surviving princes and chiefs must now reckon with the victor."
 sb_court_succession.005.f:0 "There are gaps among the men gathered at the royal homestead. Those who answered the defeated prince's summons will not return. The victors bring their claims of service; the chiefs who stood aside wait to be called. One king now receives them, but their houses remember whom they followed."
 sb_court_succession.005.a:0 "Let the houses come before us."
 sb_court_succession.005.a.tt:0 "Gain #p 10#! Prerogative, up to #v 100#!. For #v 18 months#! after victory, low Prerogative cannot provoke another claimant's challenge."
