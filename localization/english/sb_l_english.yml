sb_potgieter_relief:0 "Potgieter's Relief"
sb_albany_partition_shock:0 "Albany Partition Shock"
 sb_albany_founding_mandate:0 "Albany Founding Mandate"
 sb_albany_eastern_cape_colonial_mandate:0 "Eastern Cape Colonial Mandate"
 sb_albany_eastern_cape_colonial_mandate_desc:0 "Albany's separate administration is organized around frontier settlement, survey, and colonial expansion in the Eastern Cape."
 sb_cape_liberal_victory:0 "Cape Liberal Ascendancy"
sb_cape_victory_against_xhosa:0 "Victory against the Xhosa"
sb_cape_victory_against_xhosa_desc:0 "Recent success on the Xhosa frontier has strengthened settler confidence and accelerated colonial expansion."
sb_xhosa_cattle_killing_crisis:0 "Cattle-Killing Crisis"
sb_xhosa_cattle_killing_crisis_desc:0 "Prophecy has emptied kraals and granaries across the Xhosa frontier, leaving hunger in its wake."
sb_xhosa_cattle_killing_relief:0 "Relief Amid the Crisis"
sb_xhosa_cattle_killing_relief_desc:0 "Cape provisions and mission stores blunt the worst of the hunger without ending the calamity."
sb_cape_cattle_killing_colonial_opening:0 "Frontier Opening"
sb_cape_cattle_killing_colonial_opening_desc:0 "The crisis beyond the frontier has temporarily accelerated survey, settlement, and colonial advance."
sb_cape_xhosa_relief_aid:0 "Xhosa Relief Aid"
sb_cape_xhosa_relief_aid_desc:0 "Cape funds sustain the distribution of provisions across the stricken frontier."
sb_cape_missionary_relief_approval:0 "Missionary Relief Effort"
sb_cape_missionary_relief_approval_desc:0 "The Mission Churches welcome the government's support for relief stations beyond the frontier."
sb_hunter_gatherer_society:0 "Hunter-Gatherer Society"
sb_hunter_gatherer_society_desc:0 "Foraging, seasonal mobility, and exchange networks sustain communities outside the narrow agrarian base represented by formal arable land."
sb_arid_frontier_pastoralism:0 "Arid Frontier Pastoralism"
sb_arid_frontier_pastoralism_desc:0 "Pastoral circuits, kin exchange, and local knowledge help sustain small arid communities where the formal agrarian base is thin."
sb_herero_pastoral_subsistence:0 "Herero Pastoral Networks"
sb_herero_pastoral_subsistence_desc:0 "Mobile herding and established exchange networks sustain production beyond the narrow limits of settled agriculture."
sb_basotho_highland_agriculture:0 "Basotho Highland Agriculture"
sb_basotho_highland_agriculture_desc:0 "Terraced fields, livestock, and highland grain cultivation sustain Basotho communities in terrain poorly represented by formal arable capacity alone."
  sb_cape_frontier_compromise:0 "Cape Frontier Compromise"
  sb_cape_liberal_cqf_satisfied:0 "Qualified Franchise Secured"
 sb_cape_liberal_cqf_satisfied_desc:0 "Cape liberals are reassured that the ministry means to preserve the Qualified Franchise within the new legal order."
 sb_cape_liberal_cqf_refused:0 "Qualified Franchise Denied"
 sb_cape_liberal_cqf_refused_desc:0 "Cape liberals are embittered by the ministry's refusal to preserve the Qualified Franchise within the new legal order."
