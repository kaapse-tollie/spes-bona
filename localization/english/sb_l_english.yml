 amendment_sb_cape_qualified_franchise:0 "The Cape Qualified Franchise"
 amendment_sb_cape_qualified_franchise_desc:0 "The Cape Qualified Franchise widens the electorate within a property- and literacy-based framework. It does not establish equality, but it raises the standing of Cape Creole, Griqua, and other selected Southern African peoples."
 amendment_sb_restricted_cape_qualified_franchise:0 "The Restricted Cape Qualified Franchise"
 amendment_sb_restricted_cape_qualified_franchise_desc:0 "Higher property qualifications and a stricter literacy test have narrowed the Cape Qualified Franchise. The electorate remains formally non-racial, but far fewer non-European subjects can now meet its requirements."
 amendment_sb_convict_transportation_scheme:0 "Convict Transportation Scheme"
 amendment_sb_convict_transportation_scheme_desc:0 "The Cape has accepted limited convict transportation as part of imperial migration policy. The scheme draws labour and settlers toward the colony, but any fall in living standards now carries sharper social consequences. Cape liberals and frontier farmers both resent the stigma and labour disruption."
