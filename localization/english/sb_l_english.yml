 sb_cape_responsible_govt_ecsl_backlash:0 "Responsible Government Backlash"
 sb_cape_liberals_checked:0 "Liberal Opposition Blunted"
 sb_boerehaat:0 "Boerehaat"
 sb_boerehaat_desc:0 "Anti-Boer feeling is deeply rooted in Cape political life. Boer settlers are treated with marked suspicion, and their place in the colony's civic order remains deliberately constrained."
