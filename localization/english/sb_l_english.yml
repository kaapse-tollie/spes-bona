 # Modifiers
 sb_cape_political_tensions:0 "Cape Political Tensions"
sb_cape_autonomy_pressure:0 "Push for Autonomy"
sb_cape_autonomy_pressure_desc:0 "The colony still lacks responsible government. Liberal agitation grows louder, autonomy becomes a sharper political demand, and the Intelligentsia grows less patient with imperial restraint."
sb_cape_liberal_autonomy_pressure:0 "Liberal Autonomy Agitation"
sb_cape_liberal_autonomy_pressure_desc:0 "The Cape Liberal Movement has turned the lack of responsible government into a sharper constitutional campaign."
 sb_cape_liberal_ascendant:0 "Cape Liberal Ascendant"
 sb_cape_liberal_dominant:0 "Cape Liberals Dominant"
 sb_cape_settler_ascendant:0 "Cape Settlers Ascendant"
 sb_cape_settler_dominant:0 "Cape Settlers Dominant"
 sb_responsible_government:0 "Responsible Government"
