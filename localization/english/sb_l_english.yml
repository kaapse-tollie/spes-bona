 sb_zulu_dynastic_crisis_desc:0 "This ruler seized the throne amid a dynastic collapse, staining their legitimacy."
sb_trek_ai_mobilization:0 "Emergency Muster"
sb_trek_ai_mobilization_desc:0 "The republic is calling every available burgher into the field while the frontier crisis endures."
sb_swazi_stand_apart:0 "Standing Apart"
sb_swazi_stand_apart_desc:0 "The kingdom has refused outside shelter and drawn prestige from a hard line of independence."

  # State Traits
  state_trait_sb_xhosa_resistance:0 "The Xhosa Frontier"
  state_trait_sb_xhosa_resistance_desc:0 "Xhosa polities fiercely contest encroachment upon their lands. Raids, reprisals, and broken communications make the eastern districts a hard country to master."
  state_trait_sb_mountain_fortress:0 "Mountain Stronghold"
 state_trait_sb_mountain_fortress_desc:0 "The rugged Drakensberg forms a natural stronghold, favoring defense while constraining settlement and development."
 state_trait_sb_south_west_africa_administrative_barrier:0 "Desert Coastline"
 state_trait_sb_south_west_africa_administrative_barrier_desc:0 "The Namibian coast offers few natural harbours and little water. Sustained colonial expansion requires artificial harbour works, administrative doctrine, and either a land approach or a completed mission to South West Africa."
 state_trait_sb_arid_interior_corridor:0 "Arid Interior Corridor"
 state_trait_sb_arid_interior_corridor_desc:0 "The interior route through Bechuanaland is dry, thinly supplied, and difficult to sustain beyond the diamond fields. Settlement advances slowly through this corridor."
 state_trait_sb_griqualand_west_mining:0 "Griqualand West Ore Belt"
 state_trait_sb_griqualand_west_mining_desc:0 "The mineral belt around Kimberley, Griquatown, and the northern Cape interior rewards concentrated extraction."

