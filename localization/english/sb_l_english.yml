# ### TO REVIEW ###
sb_frontier_ai_wars.130.t:0 "The Cattle-Killing Movement"
sb_frontier_ai_wars.130.d:0 "Reports from the Xhosa frontier tell of Nongqawuse's prophecy spreading from kraal to kraal. Cattle are slaughtered, stores are abandoned, and the promise of deliverance has become a calamity."
sb_frontier_ai_wars.130.f:0 "Smoke rose above kraals where cattle had been slaughtered and grain was no longer planted. Beyond the frontier, colonial officials watched hungry families begin to move and calculated what the calamity might do to resistance, settlement, and the next season's boundary."
sb_frontier_ai_wars.130.a:0 "The frontier has changed."
sb_frontier_ai_wars.130.b:0 "Open the stores and send what relief we can."

 # Boer-Zulu / Natal chain
zulu_raid_port_natal:0 "Strike at Port Natal"
zulu_raid_port_natal_desc:0 "With the Boer threat checked for now, the royal court may seize Port Natal, carry off its stores of guns, and force a British answer on the coast."
zulu_raid_port_natal_firearms_tt:0 "Seizing British arms at Port Natal adds #v +10%#! progress to #bold Adoption of Firearms#!."
natalia_raid_port_natal:0 "Seize Port Natal"
natalia_raid_port_natal_desc:0 "Seize Port Natal before London can dictate the coast from offshore. It will likely provoke Britain, but it forces the question on republican terms."




