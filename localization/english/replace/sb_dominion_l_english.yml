l_english:
 concept_dominion_desc:1 "[Concept('concept_recognized_power','$concept_recognized_powers$')] may turn a weaker [concept_country] into their $concept_dominion$ ([concept_subject]). A $concept_dominion$ is a more autonomous [concept_subject_type] that can start its own [Concept('concept_diplomatic_play','$concept_diplomatic_plays$')], is not automatically required to join its [Concept('concept_overlord','$concept_overlord_possessive$')] [Concept('concept_war','$concept_wars$')], and pays #v 10%#! of its [concept_treasury] income to its $concept_overlord$ each week."
 dominion_desc: "Establishes a [concept_dominion] [concept_subject_type] relationship between two [Concept('concept_country', '$concept_countries$')]. Dominions can start their own [Concept('concept_diplomatic_play','$concept_diplomatic_plays$')], are not automatically required to join overlord wars, and pay #v 10%#! of their [concept_treasury] income to their [concept_overlord]."
 dominion_pact_desc:0 "[SCOPE.GetRootScope.GetDiplomaticPact.GetSecondCountry.GetName] is a [concept_dominion] of [SCOPE.GetRootScope.GetDiplomaticPact.GetFirstCountry.GetName], paying #v 10%#! of their [concept_treasury] income while retaining control over whether to join overlord wars."
 become_dominion_desc: "Establishes a [concept_dominion] [concept_subject_type] relationship between two [Concept('concept_country', '$concept_countries$')], with the proposing country becoming the [concept_subject]. Dominions pay #v 10%#! of their [concept_treasury] income and are not automatically required to join overlord wars."
 dp_make_dominion_desc: "Sets the initiating [concept_war_goal] to force the targeted [concept_country] to become your [concept_dominion]. Dominions pay #v 10%#! of their [concept_treasury] income and are not automatically required to join overlord wars."
 war_goal_make_dominion_type_desc: "Force another [concept_country] to become a [concept_dominion]. Dominions pay #v 10%#! of their [concept_treasury] income and are not automatically required to join overlord wars."
