l_english:
 # ### TO REVIEW ###
 sb_court_dunn.001.t:0 "A Friend from Across the Thukela"
 sb_court_dunn.001.d:0 "[SCOPE.sCharacter('sb_court_dunn_visitor').GetFullName], a hunter and trader from Natal, seeks a place at court. He offers coastal trade connections and access to firearms to [SCOPE.sCharacter('sb_court_dunn_prince').GetFullName], whose circle has already divided the royal household."
 sb_court_dunn.001.f:0 "At the enclosure gate, [SCOPE.sCharacter('sb_court_dunn_visitor').GetLastNameNoFormatting] unpacks powder flasks, percussion caps and cloth brought up from the Thukela drifts. [SCOPE.sCharacter('sb_court_dunn_prince').GetFirstNameNoFormatting] questions him closely on buyers and river crossings. Elder heads of houses keep their distance: a white intermediary from Natal gives one prince more than trade goods, and those who distrust him will look to his brother."
 sb_court_dunn.001.a:0 "Let him enter Mbuyazi’s service."
 sb_court_dunn.001.a.tt:0 "[SCOPE.sCharacter('sb_court_dunn_visitor').GetFullName] pledges his [concept_prominence] to [SCOPE.sCharacter('sb_court_dunn_prince').GetFullName] for the next succession and begins annual deliveries of @small_arms! #b guns#! while Firearms Adoption remains unfinished, each providing #p 2 weeks#! of progress or arms for a loyal following."
 sb_court_dunn.001.objector.tt:0 "[SCOPE.sCharacter('sb_court_dunn_objector').GetFullName] pledges [SCOPE.sCharacter('sb_court_dunn_objector').GetHerHis] household to [SCOPE.sCharacter('sb_court_dunn_other_prince').GetFullName] for the next succession."
 sb_court_dunn.001.b:0 "His connections belong on the other bank."
 sb_court_dunn.001.b.tt:0 "[SCOPE.sCharacter('sb_court_dunn_visitor').GetFullName] leaves the court and returns to Natal."
 # ### TO REVIEW ###
 sb_court_dunn.002.t:0 "Guns from Natal"
 sb_court_dunn.002.d:0 "[SCOPE.sCharacter('sb_court_dunn_trader').GetFullName] has obtained a small consignment of @small_arms! #b guns#!. He offers to bring them into the kingdom through his trading contacts."
 sb_court_dunn.002.d.faction:0 "[SCOPE.sCharacter('sb_court_dunn_trader').GetFullName] has brought a small consignment of @small_arms! #b guns#!. Distributing them would spread their use; entrusting them to [SCOPE.sCharacter('sb_court_dunn_ally').GetFullName] would strengthen a faithful following against [SCOPE.sCharacter('sb_court_dunn_enemy_prince').GetFullName] and [SCOPE.sCharacter('sb_court_dunn_enemy_prince').GetHerHis] supporters."
 sb_court_dunn.002.f:0 "A gun is passed between the men examining the consignment. Others ask after powder, shot and spare parts. The load will not arm a regiment, but those who receive it will have something to practise with before the next delivery."
 sb_court_dunn.002.f.faction:0 "Dunn lays out the guns for inspection. There are more hands reaching for them than weapons to pass around. A few given to each gathering would teach more men their use; kept together, they would give one supporter an advantage [SCOPE.sCharacter('sb_court_dunn_ally').GetHerHis] rivals must reckon with. The men of [SCOPE.sCharacter('sb_court_dunn_opponent').GetFullNameNoFormatting] will notice who leaves the ruler’s homestead better armed."
 sb_court_dunn.002.a:0 "Distribute them widely."
 sb_court_dunn.002.a.tt:0 "The @small_arms! #b guns#! provide #p 2 weeks#! of Firearms Adoption progress."
 sb_court_dunn.002.b:0 "Put them in faithful hands."
 sb_court_dunn.002.b.valid.tt:0 "The named ally still supports the same ruler, the opposing following still backs the named rival, and no court negotiation or succession conflict is in progress."
 sb_court_dunn.002.b.ally.tt:0 "[SCOPE.sCharacter('sb_court_dunn_ally').GetFullName] gains #p +10#! [concept_prominence] for #v 5 years#!, up to the maximum of #v 100#!."
 sb_court_dunn.002.b.ally.refresh.tt:0 "[SCOPE.sCharacter('sb_court_dunn_ally').GetFullName]’s #p +10#! [concept_prominence] from armed followers is renewed for #v 5 years#!; the bonus does not stack."
 sb_court_dunn.002.b.opponent.tt:0 "[SCOPE.sCharacter('sb_court_dunn_opponent').GetFullName] loses #n 10#! [concept_prominence] for #v 5 years#!, weakening [SCOPE.sCharacter('sb_court_dunn_enemy_prince').GetFullName]’s coalition."
 sb_court_dunn.002.b.opponent.refresh.tt:0 "[SCOPE.sCharacter('sb_court_dunn_opponent').GetFullName]’s #n −10#! [concept_prominence] from being outgunned is renewed for #v 5 years#!; the penalty does not stack."
 sb_court_dunn.002.b.risk.tt:0 "#v 1%#! chance that [SCOPE.sCharacter('sb_court_dunn_enemy_prince').GetFullName] is #n killed#! in clashes between the rival followings."
 # ### TO REVIEW ###
 sb_court_dunn.003.t:0 "An Unwelcome Intermediary"
 sb_court_dunn.003.d:0 "[SCOPE.sCharacter('sb_court_dunn_trader').GetFullName] offers [SCOPE.sCharacter('sb_court_dunn_king').GetFullName] the guns and Natal connections he once placed at Mbuyazi’s disposal. Men who fought for the victorious king begrudge a place at his side to their enemy’s associate."
 sb_court_dunn.003.d.no_guns:0 "[SCOPE.sCharacter('sb_court_dunn_trader').GetFullName] offers [SCOPE.sCharacter('sb_court_dunn_king').GetFullName] the trading connections that brought him into Mbuyazi’s service. Men who fought for the victorious king begrudge a place at his side to their enemy’s associate."
 sb_court_dunn.003.f:0 "Dunn is brought before men who have just buried their kin. He speaks of traders across the Thukela, of powder and guns, of messages he could carry to Natal. His listeners remember the other prince who found those services useful. Accepting him now would be a public act of pardon, before men still waiting for their own service to be rewarded."
 sb_court_dunn.003.f.mthonga:0 "$sb_court_dunn.003.f$\n\nAnother of Mpande’s sons, Mthonga, has taken up their grievance. If the king rewards his former enemy’s associate, the young prince is ready to offer the discontented a different royal name to follow."
 sb_court_dunn.003.a:0 "Execute him. Our dead will be avenged."
 sb_court_dunn.003.a.tt:0 "[SCOPE.sCharacter('sb_court_dunn_trader').GetFullName] dies."
 sb_court_dunn.003.a.relations.tt:0 "[concept_relations] with Great Britain decrease by #n 10#!."
 sb_court_dunn.003.b:0 "His connections will serve the crown."
 sb_court_dunn.003.b.tt:0 "[SCOPE.sCharacter('sb_court_dunn_trader').GetFullName] pledges his support to [SCOPE.sCharacter('sb_court_dunn_king').GetFullName]."
 sb_court_dunn.003.b.claim.tt:0 "#n Mthonga kaMpande declares his own claim to the throne#!, receiving the [GetCharacterTrait('sb_court_claimant_trait').GetName] trait and its #v +25#! [concept_prominence]."
 sb_court_dunn.003.b.trade.tt:0 "Dunn continues his annual @small_arms! #b gun deliveries#! while Firearms Adoption remains unfinished, each providing #p 2 weeks#! of progress or arms for a loyal following."
 sb_court_dunn.003.b.relations.tt:0 "[concept_relations] with Great Britain improve by #p 5#!."
 sb_court_dunn.003.c:0 "Send him back across the Thukela."
 sb_court_dunn.003.c.tt:0 "[SCOPE.sCharacter('sb_court_dunn_trader').GetFullName] is banished from the court. Britain takes no offence at his departure."
 sb_court_dunn.003.trade_lost.tt:0 "Dunn’s annual @small_arms! #b gun deliveries#! end."
 # TO REVIEW (non-event/JE keys)
 sb_court_trader:0 "Trader"
 sb_court_trader_desc:0 "This character’s trading connections bring wealth, influence and access to goods beyond the kingdom."
 Mthonga:0 "Mthonga"
