l_english:
 # ### TO REVIEW ###
 sb_court_dunn.001.t:0 "A Friend from Across the Thukela"
 sb_court_dunn.001.d:0 "[SCOPE.sCharacter('sb_court_dunn_visitor').GetFullName], a hunter and trader from Natal, seeks a place at court. He offers #b guns from Natal#! and his trading connections to [SCOPE.sCharacter('sb_court_dunn_prince').GetFullName], whose ambitions have already divided the royal household."
 sb_court_dunn.001.f:0 "Dunn knows the river crossings and the men who trade powder and guns. Mbuyazi listens closely. Some of the chiefs watch the stranger instead: a prince who takes advice from across the Thukela may bring more than trade into the kingdom."
 sb_court_dunn.001.a:0 "Let him enter Mbuyazi's service."
 sb_court_dunn.001.a.tt:0 "[SCOPE.sCharacter('sb_court_dunn_visitor').GetFullName] pledges his [concept_prominence] to [SCOPE.sCharacter('sb_court_dunn_prince').GetFullName] for the next succession and offers an annual delivery of @small_arms! #b guns#!, worth #p 2 weeks#! of Firearms Adoption while it remains unfinished."
 sb_court_dunn.001.objector.tt:0 "[SCOPE.sCharacter('sb_court_dunn_objector').GetFullName] pledges his house to [SCOPE.sCharacter('sb_court_dunn_other_prince').GetFullName] for the next succession."
 sb_court_dunn.001.b:0 "His connections belong on the other bank."
 sb_court_dunn.001.b.tt:0 "[SCOPE.sCharacter('sb_court_dunn_visitor').GetFullName] returns to Natal."
 # ### TO REVIEW ###
 sb_court_dunn.002.t:0 "Guns from Natal"
 sb_court_dunn.002.d:0 "[SCOPE.sCharacter('sb_court_dunn_trader').GetFullName] has obtained another small consignment of @small_arms! #b guns#!. He offers to bring them into the kingdom through his trading contacts."
 sb_court_dunn.002.f:0 "A gun is passed between the men examining the consignment. Others ask after powder, shot and spare parts. The load will not arm a regiment, but those who receive it will have something to practise with before the next delivery."
 sb_court_dunn.002.a:0 "Distribute the guns."
 sb_court_dunn.002.a.tt:0 "The @small_arms! #b guns#! provide #p 2 weeks#! of Firearms Adoption progress."
 # ### TO REVIEW ###
 sb_court_dunn.003.t:0 "Mbuyazi's Englishman"
 sb_court_dunn.003.d:0 "[SCOPE.sCharacter('sb_court_dunn_king').GetFullName] has defeated Mbuyazi, but his brother's associate [SCOPE.sCharacter('sb_court_dunn_trader').GetFullName] survives. The trader who brought guns into the kingdom now offers his services to its victorious king."
 sb_court_dunn.003.d.no_guns:0 "[SCOPE.sCharacter('sb_court_dunn_king').GetFullName] has defeated Mbuyazi, but his brother's associate [SCOPE.sCharacter('sb_court_dunn_trader').GetFullName] survives. Dunn offers the victorious king the same trading contacts that once made him useful to Mbuyazi."
 sb_court_dunn.003.f:0 "There are men at court who remember where Dunn stood when the brothers gathered their followers. Others point to Natal: its traders and officials will still be there tomorrow. Dunn waits for judgement, offering to become the king's intermediary with the people beyond the river."
 sb_court_dunn.003.a:0 "He chose my brother. Let him share his fate."
 sb_court_dunn.003.a.tt:0 "[SCOPE.sCharacter('sb_court_dunn_trader').GetFullName] dies."
 sb_court_dunn.003.a.relations.tt:0 "[concept_relations] with Great Britain decrease by #n 10#!."
 sb_court_dunn.003.b:0 "He will speak to Natal on my behalf."
 sb_court_dunn.003.b.tt:0 "[SCOPE.sCharacter('sb_court_dunn_trader').GetFullName] supports the king. If available, Mthonga kaMpande declares his own claim to the throne."
 sb_court_dunn.003.b.relations.tt:0 "[concept_relations] with Great Britain improve by #p 5#!."
 sb_court_dunn.003.c:0 "He may leave with his life."
 sb_court_dunn.003.c.tt:0 "[SCOPE.sCharacter('sb_court_dunn_trader').GetFullName] leaves the court."
 # TO REVIEW (non-event/JE keys)
 sb_court_trader:0 "Trader"
 sb_court_trader_desc:0 "This character's trading connections bring wealth, influence and access to goods beyond the kingdom."
 Mthonga:0 "Mthonga"
