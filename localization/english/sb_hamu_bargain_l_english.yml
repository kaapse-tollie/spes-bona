l_english:
 # ### TO REVIEW ###
 sb_hamu_bargain.001.t:0 "The Zulu Kingdom"
 sb_hamu_bargain.001.d:0 "The republic's trade passes through other governments' ports. [SCOPE.sCharacter('sb_hamu_prince').GetFullName] offers another prospect: if Boer backing brings him the Zulu crown, he will cede land for a coastal republic under our protection. His price is #b @money![ROOT.GetCountry.MakeScope.Var('sb_hamu_grant_var').GetValue|K0]#!."
 sb_hamu_bargain.001.f:0 "On the eastern frontier, a road to the sea is also a question of who may close it. Hamu's messengers offer a strip of country broad enough to reach the coast. In return, their prince wants the means to gather men around him. The land is not yet his to give; the promise will be worth nothing unless he takes the throne."
 sb_hamu_bargain.001.a:0 "We shall back his claim."
 sb_hamu_bargain.001.payment.tt:0 "Pay #n @money![ROOT.GetCountry.MakeScope.Var('sb_hamu_grant_var').GetValue|K0]#!. The payment may use [concept_credit]."
 sb_hamu_bargain.001.promise.tt:0 "If [SCOPE.sCharacter('sb_hamu_prince').GetFullName] succeeds, Greater Nieuwe Republiek forms along the agreed coast as our Confederal Partner. Further payments are optional."
 sb_hamu_bargain.001.relations.tt:0 "[concept_relations] with [SCOPE.sCountry('sb_hamu_court').GetName] decrease by #n 10#!."
 sb_hamu_bargain.001.backer.tt:0 "If still uncommitted, [SCOPE.sCharacter('sb_hamu_backer').GetFullName] brings his house into [SCOPE.sCharacter('sb_hamu_prince').GetFullName]'s coalition."
 sb_hamu_bargain.001.no_backer.tt:0 "No uncommitted house is presently available to join his coalition."
 sb_hamu_bargain.001.b:0 "His crown is no concern of ours."
 # ### TO REVIEW ###
 sb_hamu_bargain.002.t:0 "A Prince's Bargain"
 sb_hamu_bargain.002.d:0 "[SCOPE.sCharacter('sb_hamu_prince').GetFullName] has accepted backing from [SCOPE.sCountry('sb_hamu_sponsor').GetName]. He pursues the crown in his own name, promising land and a route to the sea if he succeeds."
 sb_hamu_bargain.002.f:0 "Word of the promise reaches the royal homestead before its terms can be concealed. The cattle, fields and river crossings offered to the Boers belong to people who have not been asked. Hamu's supporters speak instead of the king they mean to serve, and of the friends he has found beyond the frontier."
 sb_hamu_bargain.002.a:0 "He has promised land that is not his."
 sb_hamu_bargain.002.promise.tt:0 "A successful accession by [SCOPE.sCharacter('sb_hamu_prince').GetFullName] will cede the Greater Nieuwe Republiek territory, including its coast, to a Confederal Partner of [SCOPE.sCountry('sb_hamu_sponsor').GetName]."
 sb_hamu_bargain.002.backer.tt:0 "[SCOPE.sCharacter('sb_hamu_backer').GetFullName] has joined [SCOPE.sCharacter('sb_hamu_prince').GetFullName]'s coalition."
 # ### TO REVIEW ###
 sb_hamu_bargain.003.t:0 "The Price of a Crown"
 sb_hamu_bargain.003.d:0 "[SCOPE.sCharacter('sb_hamu_prince').GetFullName] has honoured his undertaking. [SCOPE.sCountry('sb_hamu_republic').GetName] now holds the promised territory and coast as our Confederal Partner."
 sb_hamu_bargain.003.f:0 "The agreement that once depended on a prince's hopes now has a boundary. Settlers and traders look towards the coast; the people living along the new line must discover what the republic's arrival will mean for them. Hamu has his crown. Its price is visible on the map."
 sb_hamu_bargain.003.a:0 "Let the road to the coast remain open."
 sb_hamu_bargain.003.a.tt:0 "The territorial promise is fulfilled. Continuing payments to Hamu end."
 # ### TO REVIEW ###
 sb_hamu_bargain.010.t:0 "Britain Challenges the Boundary"
 sb_hamu_bargain.010.d:0 "With the remaining Zulu territory now under British rule, Great Britain disputes the coastal lands held by [SCOPE.sCountry('sb_hamu_republic').GetName]. As the republic's overlord, we must answer the demand to withdraw inland."
 sb_hamu_bargain.010.f:0 "The British demand leaves a small inland republic and takes away the corridor to the sea. Its authors dismiss Hamu's undertaking as insufficient title. The very land that made the bargain attractive is now the part they insist must be surrendered."
 sb_hamu_bargain.010.a:0 "Accept the inland boundary."
 sb_hamu_bargain.010.a.tt:0 "Return the disputed coastal territory to the British-controlled Zulu territory. The reduced Nieuwe Republiek remains our subject."
 sb_hamu_bargain.010.b:0 "We shall defend our partner's frontier."
 sb_hamu_bargain.010.b.tt:0 "Great Britain may open a [concept_diplomatic_play] to reclaim Nieuwe Republiek's Zululand territory."
 # TO REVIEW (non-event/JE keys)
 sb_hamu_fund:0 "Support Hamu's Following"
 sb_hamu_fund_desc:0 "Provide continuing funds to help Hamu gather support. This raises his Popularity while payments continue; his promise of land already stands."
 sb_hamu_end_funding:0 "End Payments to Hamu"
 sb_hamu_end_funding_desc:0 "End the continuing expense and Hamu's funded Popularity bonus. The paid territorial promise remains in force."
 sb_hamu_funding_valid_tt:0 "Hamu is alive and retains his claim, and his territorial promise remains unfulfilled."
 sb_hamu_subsidy_cost:0 "Payments to Hamu"
 sb_hamu_boer_patronage:0 "Boer Patronage"
