l_english:
 # ### TO REVIEW ###
 sb_hamu_bargain.001.t:0 "A Road to the Sea"
 sb_hamu_bargain.001.d:0 "[ROOT.GetCountry.GetNameNoFormatting]’s trade still passes through foreign ports. [SCOPE.sCharacter('sb_hamu_prince').GetFullName] offers another prospect: if our backing helps him win the throne of [SCOPE.sCountry('sb_hamu_court').GetName], he will cede northern [GetStateRegion('STATE_ZULULAND').GetName] and its coast for a Boer republic as our [concept_protectorate]. His initial grant is #b @money![ROOT.GetCountry.MakeScope.Var('sb_hamu_grant_var').GetValue|K0]#!."
 sb_hamu_bargain.001.f:0 "The riders from Ngenetsheni arrive dusty from the Phongolo crossings, carrying no signed paper — only a prince’s word spoken beside the cattle-folds of the borderland. Around the table in [ROOT.GetCountry.GetCapital.GetCityHubName], commandants and merchants trace the line from the highveld ridges down to the Indian Ocean surf. Foreign customs houses at Durban and Delagoa Bay have long taxed every wagon out of the interior. Here, at last, sits a claim to a harbour — bought with treasury coin from a prince who still stands outside the royal homestead."
 sb_hamu_bargain.001.a:0 "We shall back his claim."
 sb_hamu_bargain.001.payment.tt:0 "Pay #n @money![ROOT.GetCountry.MakeScope.Var('sb_hamu_grant_var').GetValue|K0]#!. The payment may use [concept_credit]."
 sb_hamu_bargain.001.promise.tt:0 "[SCOPE.sCharacter('sb_hamu_prince').GetFullName] presses his own claim to the throne. If he accedes, Nieuwe Republiek forms across five northern districts of [GetStateRegion('STATE_ZULULAND').GetName], including its port, as our [concept_protectorate]. Optional weekly payments may then be sent by decision to raise his [concept_popularity]."
 sb_hamu_bargain.001.relations.tt:0 "[concept_relations] with [SCOPE.sCountry('sb_hamu_court').GetName] decrease by #n 10#!."
 sb_hamu_bargain.001.backer.tt:0 "If still uncommitted, [SCOPE.sCharacter('sb_hamu_backer').GetFullName] brings [SCOPE.sCharacter('sb_hamu_backer').GetHerHis] house into [SCOPE.sCharacter('sb_hamu_prince').GetFullName]’s coalition."
 sb_hamu_bargain.001.no_backer.tt:0 "No uncommitted house is presently available to join [SCOPE.sCharacter('sb_hamu_prince').GetFullName]’s coalition."
 sb_hamu_bargain.001.b:0 "His crown is no concern of ours."
 # ### TO REVIEW ###
 sb_hamu_bargain.002.t:0 "A Prince’s Bargain"
 sb_hamu_bargain.002.d:0 "[SCOPE.sCharacter('sb_hamu_prince').GetFullName] has accepted Boer gold from [SCOPE.sCountry('sb_hamu_sponsor').GetName]. Turning from [SCOPE.sCharacter('sb_hamu_sovereign').GetFullName] to press a claim in his own name, he has promised northern [GetStateRegion('STATE_ZULULAND').GetName] and a road to the sea if he wins the throne."
 sb_hamu_bargain.002.f:0 "Word of the undertaking reaches [SCOPE.sCharacter('sb_hamu_sovereign').GetFullNameNoFormatting]’s royal homestead before its terms can be concealed. The grazing lands, kraals and Phongolo river crossings offered to the Boers belong to households who were never asked. Yet in the northern districts, Hamu’s followers already speak of the king they mean to serve — and of the gold and patronage pledged from beyond the frontier."
 sb_hamu_bargain.002.a:0 "He has promised land that is not his."
 sb_hamu_bargain.002.promise.tt:0 "[SCOPE.sCharacter('sb_hamu_prince').GetFullName] now stands in his own coalition. If he takes the throne, five northern districts of [GetStateRegion('STATE_ZULULAND').GetName] — including its port — will be ceded to form Nieuwe Republiek as a [concept_protectorate] of [SCOPE.sCountry('sb_hamu_sponsor').GetName]."
 sb_hamu_bargain.002.backer.tt:0 "[SCOPE.sCharacter('sb_hamu_backer').GetFullName] has joined [SCOPE.sCharacter('sb_hamu_prince').GetFullName]’s coalition."
 # ### TO REVIEW ###
 sb_hamu_bargain.003.t:0 "The Price of a Crown"
 sb_hamu_bargain.003.d:0 "[SCOPE.sCharacter('sb_hamu_prince').GetFullName] has taken the Zulu throne and honoured his undertaking. [SCOPE.sCountry('sb_hamu_republic').GetName] now holds the promised northern districts of [GetStateRegion('STATE_ZULULAND').GetName] and their port as our [concept_protectorate]."
 sb_hamu_bargain.003.f:0 "What once rested on a prince’s word across the Phongolo is now marked out in beacons and farm claims. Trekkers and traders look down from the Vryheid ridges towards the Indian Ocean surf, while Zulu homesteads along the new border reckon with republican landdrosts and tax-rolls. Hamu holds the royal enclosure — and the coast has changed hands to pay for it."
 sb_hamu_bargain.003.a:0 "Let the road to the coast remain open."
 sb_hamu_bargain.003.a.tt:0 "The territorial promise has been fulfilled, and any continuing payments to Hamu have ended."
 # ### TO REVIEW ###
 sb_hamu_bargain.010.t:0 "Britain Challenges the Boundary"
 sb_hamu_bargain.010.d:0 "With the rest of Zululand now under British rule, [SCOPE.sCharacter('sb_hamu_british_ruler').GetFullName]’s government disputes the coastal districts held by [SCOPE.sCountry('sb_hamu_republic').GetName]. London has sent its terms to Vryheid and to the government that guarantees its frontier."
 sb_hamu_bargain.010.f:0 "The imperial despatch draws a red-ink line well short of the sea, confining the burghers to the upland pastures around Vryheid. British officials dismiss Hamu’s old undertaking as insufficient title to the harbour for which the burghers first backed the prince."
 sb_hamu_bargain.010.a:0 "Accept the inland boundary."
 sb_hamu_bargain.010.a.tt:0 "Cede the three disputed coastal districts to British-controlled Zululand. [SCOPE.sCountry('sb_hamu_republic').GetName] keeps its own government at Vryheid and remains a [concept_protectorate]."
 sb_hamu_bargain.010.b:0 "Stand by the frontier at Vryheid."
 sb_hamu_bargain.010.b.tt:0 "Refuse the demand. Great Britain may open a [concept_diplomatic_play] against the republic’s protector to reclaim all the land [SCOPE.sCountry('sb_hamu_republic').GetName] holds in [GetStateRegion('STATE_ZULULAND').GetName]."
 # TO REVIEW (non-event/JE keys)
 sb_hamu_fund:0 "Support Hamu’s Following"
 sb_hamu_fund_desc:0 "Send regular stipends to Hamu kaNzibe to strengthen his standing at the Zulu court. While payments continue, he gains #p +25#! [concept_popularity] at a weekly cost of #n @money!250#! — though the territorial promise secured by our initial grant already stands."
 sb_hamu_end_funding:0 "End Payments to Hamu"
 sb_hamu_end_funding_desc:0 "Halt the weekly stipend and remove Hamu’s #v +25#! [concept_popularity] bonus. The territorial promise secured by our initial grant remains in force, and payments may be resumed later while his claim still stands."
 sb_hamu_funding_valid_tt:0 "Hamu is alive and retains his claim, and his territorial promise remains unfulfilled."
 sb_hamu_subsidy_cost:0 "Payments to Hamu"
 sb_hamu_boer_patronage:0 "Boer Patronage"
