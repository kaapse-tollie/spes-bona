sb_court_gathering_royal_flavour:0 "As the regiments form along the cattle enclosure before the ruler’s seat, chiefs greet one another by rank while watchers count who stands closest to each prince. By dusk, the public songs of the [Glossary('glossary_sb_umkhosi','first fruits')] give way to quieter bargains among the homesteads."
sb_court_gathering_chiefs_flavour:0 "Each great chief arrives with retainers whose attendance gives weight to their chief’s voice on the council ground. They speak of cattle, borders and shared duties, while watching closely who takes a seat beside the head chief and who sits apart."

