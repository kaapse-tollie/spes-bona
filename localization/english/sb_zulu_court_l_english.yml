sb_court_gathering_royal_flavour:0 "The cattle enclosure fills before the king appears. Men recognise the faces beside each chief and notice those who have crossed to another gathering. The ceremony speaks of a single kingdom; the conversations afterwards tell of its many undertakings."
sb_court_gathering_chiefs_flavour:0 "The delegations arrive separately. Each chief has brought people whose attendance lends weight to their words. They speak of common business, but watch the places taken beside the head chief and those left conspicuously empty."

