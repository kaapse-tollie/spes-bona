# ### TO REVIEW ###
sb_zulu_court.200.t:0 "Rumors in the Royal Household"
sb_zulu_court.200.d:0 "Stories now pass from homestead to regiment that another branch of the royal house may yet hold the stronger claim. The talk can be bought quiet, or left to burn itself out among the king's loyalists."
sb_zulu_court.200.f:0 "The first whisper named no regiment and accused no chief. Within days, however, men repeated it only among those whose loyalty they trusted, and each telling attached another house, grievance, or remembered claim to the succession."
sb_zulu_court.200.a:0 "Pay to silence the whispers."
sb_zulu_court.200.b:0 "Let the loyal houses answer them."
# ### TO REVIEW ###
sb_zulu_court.201.t:0 "Affinities Among the Impis"
sb_zulu_court.201.d:0 "Officers and service men in several amabutho are said to be bound more closely to favored chiefs and princes than to the king. A purge would steady the dynasty, but it would cut into the regiments themselves."
sb_zulu_court.201.f:0 "At the muster, several officers looked first toward a favoured prince before answering the royal messenger. The hesitation lasted only a moment, but the induna reporting it to the court understood that regimental obedience could be divided long before an army openly chose sides."
sb_zulu_court.201.a:0 "Purge the factional networks."
sb_zulu_court.201.b:0 "Tolerate the regimental ties."
# ### TO REVIEW ###
sb_zulu_court.202.t:0 "Burdening the Great Houses"
sb_zulu_court.202.d:0 "The court can demand cattle, labor, and deference from the upper houses to bind them closer to the throne. Such pressure would strengthen the succession for now, but the great houses will feel the insult."
sb_zulu_court.202.f:0 "Royal collectors moved from one great homestead to the next, counting cattle and naming labour obligations before assembled dependants. Each house complied in public; in private, senior men compared what had been taken and which rival had been spared."
sb_zulu_court.202.a:0 "Press the great houses."
sb_zulu_court.202.b:0 "Conciliate the notables."
# ### TO REVIEW ###
sb_zulu_court.203.t:0 "Coastal Traders"
sb_zulu_court.203.d:0 "Coastal intermediaries offer access to more firearms and powder if the court will tolerate their growing influence. The bargain could strengthen the chiefdom's military modernization, but it would also loosen royal control over the coast."
sb_zulu_court.203.f:0 "The coastal broker laid powder, shot, and a clean musket before the royal officers. His requested payment was not written beside them: freer passage, trusted intermediaries, and influence at a coast the king could command only through men like him."
sb_zulu_court.203.a:0 "Take the guns."
sb_zulu_court.203.b:0 "Tighten the leash."
sb_zulu_court_201_a_tt:0 "#v +5#! Dynastic Stability. #v 50#! Officers and #v 500#! Soldiers in Zululand will die, and the Armed Forces lose approval for #v 12 months#!."
sb_zulu_court_202_a_tt:0 "#v +5#! Dynastic Stability. Upper-strata pops lose #v 2#! Standard of Living, #v 20%#! of upper-strata pops become more radical, and Authority is reduced for #v 12 months#!."
sb_zulu_court_202_b_tt:0 "#v -2#! Dynastic Stability. #v 20%#! of upper-strata pops become more loyal."
