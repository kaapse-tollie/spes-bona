l_english:
# ### TO REVIEW ###
sb_zulu_court.200.t:0 "[SCOPE.sCountry('sb_court_country').GetCustom('sb_court_gathering_title')]"
sb_zulu_court.200.d:0 "The great houses have gathered for the [Glossary('glossary_sb_umkhosi','first fruits')]. Before [SCOPE.sCharacter('sb_court_episode_ruler').GetFullName], their public greetings and undertakings have revealed where present allegiances and succession pledges have shifted since last year."
sb_zulu_court.200.d.chiefs:0 "The great houses have assembled before [SCOPE.sCharacter('sb_court_episode_ruler').GetFullName], head of the chiefs. Their declarations before the council ground show where present support and future pledges have shifted over the past year."
sb_zulu_court.200.f:0 "[SCOPE.sCountry('sb_court_country').GetCustom('sb_court_gathering_flavour')]"
sb_zulu_court.200.a:0 "Record where the houses stand."
# ### TO REVIEW ###
sb_zulu_court.201.t:0 "The Council Set Aside"
sb_zulu_court.201.d:0 "The [GetLawType('law_sb_chiefly_council').GetName] promised to [SCOPE.sCharacter('sb_court_episode_ruler').GetFullName]’s backers has been set aside. The houses that relied on that undertaking have withdrawn their personal support, and the ruler’s own standing at court has suffered."
sb_zulu_court.201.f:0 "Messengers ride back from the outlying homesteads without the customary cattle or greetings. Elders who witnessed the original undertaking repeat its words by the hearth, asking what service is owed to a ruler who takes the backing and sets the council aside."
sb_zulu_court.201.a:0 "They have taken back their word."
# ### TO REVIEW ###
sb_zulu_court.210.t:0 "A Pledge for the Next Reign"
sb_zulu_court.210.d:0 "[SCOPE.sCharacter('sb_court_episode_actor').GetFullName] stands with [SCOPE.sCharacter('sb_court_episode_ruler').GetFullName] today, but now intends to pledge [SCOPE.sCharacter('sb_court_episode_actor').GetHerHis] following to [SCOPE.sCharacter('sb_court_episode_candidate').GetFullName] for the next succession. [SCOPE.sCharacter('sb_court_episode_ruler').GetFullName] must decide whether to let the undertaking stand or intervene before it hardens."
sb_zulu_court.210.f:0 "“We know whose summons we answer today. We must also know whose summons we shall answer when this reign is over.”\n\n[SCOPE.sCharacter('sb_court_episode_candidate').GetFullNameNoFormatting]’s name follows. Some listeners nod; others wait to hear the terms. Before the promise is carried beyond the royal enclosure, there is still time to shape what the next reign will owe."
sb_zulu_court.210.a:0 "Accept the pledge to [SCOPE.sCharacter('sb_court_episode_candidate').GetFullName]."
sb_zulu_court.210.b:0 "Offer chiefly privileges for a pledge to [SCOPE.sCharacter('sb_court_episode_other_candidate').GetFullName]."
sb_zulu_court.210.c:0 "Let [SCOPE.sCharacter('sb_court_episode_other_candidate').GetFullName] promise the chiefs a Council."
sb_zulu_court.210.z:0 "Forbid the pledge."
# ### TO REVIEW ###
sb_zulu_court.211.t:0 "A Name on Every Tongue"
sb_zulu_court.211.d:0 "Praise for [SCOPE.sCharacter('sb_court_episode_actor').GetFullName] is spreading beyond [SCOPE.sCharacter('sb_court_episode_actor').GetHerHis] own following. [SCOPE.sCharacter('sb_court_episode_ruler').GetFullName] may honour that standing at court or spend from the treasury to undermine it."
sb_zulu_court.211.f:0 "Before the assembled elders, the praise-singer recites [SCOPE.sCharacter('sb_court_episode_actor').GetFullNameNoFormatting]’s deeds at length — naming cattle recovered, disputes settled, and men kept loyal — while others who have served [SCOPE.sCharacter('sb_court_episode_ruler').GetFullNameNoFormatting] receive scarcely a phrase.\n\nThose seated nearest the ruler’s seat watch closely to see whether the praise draws a nod of approval or a cold word from the ruler’s messengers."
sb_zulu_court.211.a:0 "Let [SCOPE.sCharacter('sb_court_episode_actor').GetFullName] receive the praise."
sb_zulu_court.211.b:0 "Send word of [SCOPE.sCharacter('sb_court_episode_actor').GetFullName]’s failings."
sb_zulu_court.211.z:0 "Let the matter rest."
# ### TO REVIEW ###
sb_zulu_court.212.t:0 "The Terms of Service"
sb_zulu_court.212.d:0 "[SCOPE.sCharacter('sb_court_episode_actor').GetFullName] offers to bring [SCOPE.sCharacter('sb_court_episode_actor').GetHerHis] following behind [SCOPE.sCharacter('sb_court_episode_ruler').GetFullName], provided the chiefs receive a firm guarantee of their standing before any pledge is given."
sb_zulu_court.212.f:0 "“You call for our people, and they come through us. Yet when we bring our counsel, must we leave it at the gate?”\n\n[SCOPE.sCharacter('sb_court_episode_actor').GetFullNameNoFormatting] has brought other chiefs to echo the demand. They insist on a public undertaking that can be repeated before their homesteads, rather than a private word easily set aside."
sb_zulu_court.212.a:0 "Confirm their customary privileges."
sb_zulu_court.212.b:0 "Grant the chiefs a Council."
sb_zulu_court.212.z:0 "Grant no concession."
# ### TO REVIEW ###
sb_zulu_court.213.t:0 "A Place Beside the Ruler"
sb_zulu_court.213.d:0 "[SCOPE.sCharacter('sb_court_episode_actor').GetFullName] offers to abandon [SCOPE.sCharacter('sb_court_episode_candidate').GetFullName] and support [SCOPE.sCharacter('sb_court_episode_ruler').GetFullName]. [SCOPE.sCharacter('sb_court_episode_other').GetFullName], already loyal to the ruler, threatens to withdraw if the offer is accepted."
sb_zulu_court.213.f:0 "[SCOPE.sCharacter('sb_court_episode_actor').GetFullNameNoFormatting] names the homesteads and retainers ready to cross over with [SCOPE.sCharacter('sb_court_episode_actor').GetHerHim]. Before the greeting is finished, [SCOPE.sCharacter('sb_court_episode_other').GetFullNameNoFormatting] breaks in from the ruler’s side: “So past opposition buys a warmer seat than steady service? I answered your summons without first naming a price.”\n\nNeither gives ground before the assembly, leaving [SCOPE.sCharacter('sb_court_episode_ruler').GetFullNameNoFormatting] to weigh whose following can better be spared."
sb_zulu_court.213.a:0 "Accept [SCOPE.sCharacter('sb_court_episode_actor').GetFullName]’s support."
sb_zulu_court.213.z:0 "Keep faith with [SCOPE.sCharacter('sb_court_episode_other').GetFullName]."
# ### TO REVIEW ###
sb_zulu_court.214.t:0 "One Herd, Two Claims"
sb_zulu_court.214.d:0 "A reward of cattle has brought [SCOPE.sCharacter('sb_court_episode_actor').GetFullName] and [SCOPE.sCharacter('sb_court_episode_other').GetFullName] into open dispute. Both want [SCOPE.sCharacter('sb_court_episode_ruler').GetFullName] to uphold their claim; [SCOPE.sCharacter('sb_court_episode_candidate').GetFullName] is ready to receive whichever household is turned away."
sb_zulu_court.214.f:0 "One party names the men who drove the recovered cattle back across the river. The other names the homesteads that sheltered and fed them on the march. Each insists the entire herd was promised as its reward, and neither will accept half.\n\nOutside the enclosure, a messenger from [SCOPE.sCharacter('sb_court_episode_candidate').GetFullNameNoFormatting] waits to learn who leaves empty-handed."
sb_zulu_court.214.a:0 "Award the herd to [SCOPE.sCharacter('sb_court_episode_actor').GetFullName]."
sb_zulu_court.214.b:0 "Award the herd to [SCOPE.sCharacter('sb_court_episode_other').GetFullName]."
sb_zulu_court.214.c:0 "Pay for a second reward."
sb_zulu_court.214.z:0 "Leave the award unsettled."
# ### TO REVIEW ###
sb_zulu_court.215.t:0 "Who Will Pay for the Guns?"
sb_zulu_court.215.d:0 "[SCOPE.sCharacter('sb_court_episode_actor').GetFullName] has found coastal merchants ready to sell firearms. Allowing the chiefs to broker the exchange through their own contacts will strengthen the amaKhosi, whereas [SCOPE.sCharacter('sb_court_episode_ruler').GetFullName] may pay from the treasury to keep the trade in the ruler’s hands."
sb_zulu_court.215.f:0 "A musket is laid across a mat before the councillors, with powder horn and shot beside it. One of [SCOPE.sCharacter('sb_court_episode_actor').GetFullNameNoFormatting]’s men tests the flintlock while others count how many head of cattle or tusks the traders demand. Whoever delivers the payment will also carry away the coastal merchants’ goodwill for the next shipment."
sb_zulu_court.215.a:0 "Let [SCOPE.sCharacter('sb_court_episode_actor').GetFullName] arrange the purchase."
sb_zulu_court.215.b:0 "Pay for the guns through our own agents."
sb_zulu_court.215.z:0 "Decline the offer."
