l_english:
# ### TO REVIEW ###
sb_zulu_court.200.t:0 "[SCOPE.sCountry('sb_court_country').GetCustom('sb_court_gathering_title')]"
sb_zulu_court.200.d:0 "The great houses have gathered for the [Glossary('glossary_sb_umkhosi','first fruits')]. Before [SCOPE.sCharacter('sb_court_episode_ruler').GetFullName], they declare where their support now lies. Hover over the acknowledgement to see the changed allegiances and succession pledges."
sb_zulu_court.200.d.chiefs:0 "The great houses gather before the head of the chiefs. Their declarations reveal where the houses now stand. Hover over the acknowledgement to see the changed allegiances and succession pledges."
sb_zulu_court.200.f:0 "[SCOPE.sCountry('sb_court_country').GetCustom('sb_court_gathering_flavour')]"
sb_zulu_court.200.a:0 "Let their words be remembered."
# ### TO REVIEW ###
sb_zulu_court.201.t:0 "A Promise Broken"
sb_zulu_court.201.d:0 "The Chiefly Council promised to the ruler’s backers has been set aside. Those still bound by that undertaking have withdrawn their personal support."
sb_zulu_court.201.f:0 "The witnesses do not dispute what was said. They dispute whether a king may enjoy the service promised to him while withholding the power he promised in return."
sb_zulu_court.201.a:0 "The houses will remember this."
# ### TO REVIEW ###
sb_zulu_court.210.t:0 "A Pledge for the Next Reign"
sb_zulu_court.210.d:0 "[SCOPE.sCharacter('sb_court_episode_actor').GetFullName] intends to support [SCOPE.sCharacter('sb_court_episode_candidate').GetFullName] at the next succession. For now, [SCOPE.sCharacter('sb_court_episode_actor').GetHerHis] household serves [SCOPE.sCharacter('sb_court_episode_ruler').GetFullName]; the proposed pledge concerns who will rule afterwards."
sb_zulu_court.210.f:0 "“We know whose summons we answer today. We must also know whose summons we shall answer when this reign is over.”\n\n[SCOPE.sCharacter('sb_court_episode_candidate').GetFullNameNoFormatting]'s name follows. Some listeners nod; others wait for the terms. Before the pledge is repeated beyond the enclosure, there is time to ask what the next ruler will owe those who help secure the throne."
sb_zulu_court.210.a:0 "Accept the pledge to [SCOPE.sCharacter('sb_court_episode_candidate').GetFullName]."
sb_zulu_court.210.b:0 "Offer chiefly privileges for a pledge to [SCOPE.sCharacter('sb_court_episode_other_candidate').GetFullName]."
sb_zulu_court.210.c:0 "Let [SCOPE.sCharacter('sb_court_episode_other_candidate').GetFullName] promise the chiefs a Council."
sb_zulu_court.210.z:0 "No pledge will be made today."
# ### TO REVIEW ###
sb_zulu_court.211.t:0 "A Name on Every Tongue"
sb_zulu_court.211.d:0 "Praise for [SCOPE.sCharacter('sb_court_episode_actor').GetFullName] is spreading beyond [SCOPE.sCharacter('sb_court_episode_actor').GetHerHis] own household. [SCOPE.sCharacter('sb_court_episode_ruler').GetFullName] can honour that reputation or pay to undermine it."
sb_zulu_court.211.f:0 "The praise-singer has an eager audience. Generosity, courage, sound judgement: each quality is greeted with approval, and each is attached to the same name. Others who have served the ruler receive scarcely a word.\n\nThose nearest the place of honour watch for a response. Praise acknowledged here will travel; so will a public rebuke."
sb_zulu_court.211.a:0 "Let [SCOPE.sCharacter('sb_court_episode_actor').GetFullName] receive the praise."
sb_zulu_court.211.b:0 "Send word of [SCOPE.sCharacter('sb_court_episode_actor').GetFullName]'s failings."
sb_zulu_court.211.z:0 "Let the matter rest."
# ### TO REVIEW ###
sb_zulu_court.212.t:0 "The Terms of Service"
sb_zulu_court.212.d:0 "[SCOPE.sCharacter('sb_court_episode_actor').GetFullName] offers to bring [SCOPE.sCharacter('sb_court_episode_actor').GetHerHis] following behind [SCOPE.sCharacter('sb_court_episode_ruler').GetFullName], provided the chiefs receive a guarantee of their powers. The support is available, but the concession must come first."
sb_zulu_court.212.f:0 "“You call for our people, and they come through us. Yet when we bring our counsel, must we leave it at the gate?”\n\n[SCOPE.sCharacter('sb_court_episode_actor').GetFullNameNoFormatting] has brought others to speak for the same demand. They want an undertaking that can be repeated before their households, not a private assurance which the ruler may later deny."
sb_zulu_court.212.a:0 "Confirm their customary privileges."
sb_zulu_court.212.b:0 "Grant the chiefs a Council."
sb_zulu_court.212.z:0 "I will make no concession."
# ### TO REVIEW ###
sb_zulu_court.213.t:0 "A Place Beside the Ruler"
sb_zulu_court.213.d:0 "[SCOPE.sCharacter('sb_court_episode_actor').GetFullName] offers to abandon [SCOPE.sCharacter('sb_court_episode_candidate').GetFullName] and support [SCOPE.sCharacter('sb_court_episode_ruler').GetFullName]. [SCOPE.sCharacter('sb_court_episode_other').GetFullName], already loyal to the ruler, threatens to withdraw if the offer is accepted."
sb_zulu_court.213.f:0 "The visitor lists the people who will follow [SCOPE.sCharacter('sb_court_episode_actor').GetHerHim]. Before the offer is answered, [SCOPE.sCharacter('sb_court_episode_other').GetFullNameNoFormatting] interrupts. “So service earns less than opposition? I have stood beside the ruler without demanding a welcome.”\n\nThe new support would be useful. Accepting it, however, would tell those already loyal how little their objections count."
sb_zulu_court.213.a:0 "Accept [SCOPE.sCharacter('sb_court_episode_actor').GetFullName]'s support."
sb_zulu_court.213.z:0 "Keep faith with [SCOPE.sCharacter('sb_court_episode_other').GetFullName]."
# ### TO REVIEW ###
sb_zulu_court.214.t:0 "One Herd, Two Claims"
sb_zulu_court.214.d:0 "A reward of cattle has brought [SCOPE.sCharacter('sb_court_episode_actor').GetFullName] and [SCOPE.sCharacter('sb_court_episode_other').GetFullName] into open dispute. Both want [SCOPE.sCharacter('sb_court_episode_ruler').GetFullName] to uphold their claim; [SCOPE.sCharacter('sb_court_episode_candidate').GetFullName] is ready to receive whichever household is turned away."
sb_zulu_court.214.f:0 "One delegation names the people who recovered the cattle. The other names the homesteads that sheltered them on the way back. Each insists that the herd was promised as its reward. Neither will accept half.\n\nOutside the enclosure, a messenger from [SCOPE.sCharacter('sb_court_episode_candidate').GetFullNameNoFormatting] waits to learn who leaves empty-handed."
sb_zulu_court.214.a:0 "Award the herd to [SCOPE.sCharacter('sb_court_episode_actor').GetFullName]."
sb_zulu_court.214.b:0 "Award the herd to [SCOPE.sCharacter('sb_court_episode_other').GetFullName]."
sb_zulu_court.214.c:0 "Pay for a second reward."
sb_zulu_court.214.z:0 "Leave the award unsettled."
# ### TO REVIEW ###
sb_zulu_court.215.t:0 "Who Will Pay for the Guns?"
sb_zulu_court.215.d:0 "[SCOPE.sCharacter('sb_court_episode_actor').GetFullName] has found merchants willing to provide firearms. The chiefs can arrange the purchase through their own contacts, or [SCOPE.sCharacter('sb_court_episode_ruler').GetFullName] can pay to take charge of it."
sb_zulu_court.215.f:0 "A gun is laid before the councillors, with powder and shot beside it. The merchants will not wait for every chief to settle a separate bargain. [SCOPE.sCharacter('sb_court_episode_actor').GetFullNameNoFormatting] offers to bring the buyers together. The ruler's messengers could take over, provided they arrive with payment of their own."
sb_zulu_court.215.a:0 "Let [SCOPE.sCharacter('sb_court_episode_actor').GetFullName] arrange the purchase."
sb_zulu_court.215.b:0 "Pay for the guns through our own agents."
sb_zulu_court.215.z:0 "Decline the offer."
