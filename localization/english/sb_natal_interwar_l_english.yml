 # ### TO REVIEW ###
 je_sb_natal_indenture_program:0 "The Natal Indenture System"
 # ### TO REVIEW ###
 je_sb_natal_indenture_program_v2:0 "$je_sb_natal_indenture_program$"
 je_sb_natal_indenture_program_completion_tt:0 "Indian-origin [Concept('concept_pop', '$concept_pops|q$')] in [GetStateRegion('STATE_NATAL').GetName] number ≥ #v 100,000#!."
 je_sb_natal_indenture_program_progress:0 "Indian-origin population: #v [ROOT.GetCountry.MakeScope.Var('sb_natal_indian_origin_population_var').GetValue|K]#! / #v 100K#!"

 je_sb_natal_indenture_program_reason:0 "Natal's sugar estates demand steady field labour that neither the small settler population nor African homesteads—sheltered by the Shepstone System on reserved land with cattle of their own—will supply at plantation wages. Seeking a reliable workforce, the colonial government has opened recruiting offices in British India, offering passage to Natal in return for fixed terms of indenture.\n\nThe scheme promises a regular flow of hands, though every arrival increases the cost of recruitment, transport and supervision. Should the burden grow too heavy, recruitment may be suspended without abandoning the colony's target.\n$TOOLTIP_DELIMITER$\n@information! #bold Monthly Recruitment#!\nWhile recruitment is #p active#!, #v 400#! [GetPopType('peasants').GetName] from #v British India#! will move to [GetStateRegion('STATE_NATAL').GetName] after every month and become [GetPopType('laborers').GetName] upon arrival.\n\n#bold Cost of the Scheme#!\nThe scheme initially costs #v 25#! [concept_bureaucracy] and #v £100#! per week. Its cost rises quadratically with Natal's Indian-origin population, reaching #v 100#! [concept_bureaucracy] and #v £1,050#! per week at #v 100,000#! people.\n\n#bold Suspending Recruitment#!\nSuspending the scheme removes its running costs without erasing progress towards the population target.\n\n#bold Intensifying Recruitment#!\nWhile selected, monthly recruitment and all programme costs are doubled."
 je_sb_natal_indenture_program_v2_reason:0 "$je_sb_natal_indenture_program_reason$"

 je_sb_natal_indenture_program_status_active:0 "Recruitment in British India is #p active#!."
 je_sb_natal_indenture_program_status_intensified:0 "Recruitment in British India is #p intensified#!."
 je_sb_natal_indenture_program_status_suspended:0 "Recruitment in British India is #n suspended#!."

 je_sb_natal_suspend_indenture_program_button:0 "Suspend the Scheme"
 je_sb_natal_suspend_indenture_program_button_desc:0 "Recall the recruiting agents and remove the scheme's running costs. Progress towards the population target will be retained, but the current monthly recruitment cycle will be lost."

 je_sb_natal_resume_indenture_program_button:0 "Resume the Scheme"
 je_sb_natal_resume_indenture_program_button_desc:0 "Reopen the recruiting offices and restore the scheme's running costs. A fresh full-month recruitment cycle will begin; no contingent will arrive immediately."

 je_sb_natal_intensify_indenture_program_button:0 "Intensify Recruitment"
 je_sb_natal_intensify_indenture_program_button_desc:0 "Double the costs for double the recruits. Changing intensity during active recruitment begins a fresh full-month cycle."
 sb_natal_indenture_intensity_requires_active_tt:0 "Recruitment must be active to change its intensity."

sb_natal_indenture_migration_tt:0 "The first contingent of #v 342#! Tamil [GetPopType('peasants').GetName] will move from #v British India#! to [GetStateRegion('STATE_NATAL').GetName] and become [GetPopType('laborers').GetName] upon arrival."

 # ### TO REVIEW ###
 sb_natal_indian_ethnogenesis_tt:0 "Up to #v 1,500#! Gujarati [GetPopType('peasants').GetName] from #v British India#! arrive in [GetStateRegion('STATE_NATAL').GetName] as [GetPopType('shopkeepers').GetName], and #v 25%#! of Indian-origin [Concept('concept_pop', '$concept_pops|q$')] in [GetStateRegion('STATE_NATAL').GetName] adopt the new #v Natal Indian#! [concept_culture]."
 sb_natal_indian_homeland_tt:0 "[GetStateRegion('STATE_NATAL').GetName] will become a [concept_homeland] of this new Culture."

 sb_natal_shepstone_accept_tt:0 "#v 80%#! of every non-[GetPopType('peasants').GetName] [GetCulture('zulu').GetName] [Concept('concept_pop', '$concept_pops|q$')] in [GetStateRegion('STATE_NATAL').GetName] will become [GetPopType('peasants').GetName]."

 sb_natal_shepstone_make_fully_accepted_loyalist_10_tt:0 "#p 10%#! of [Concept('concept_acceptance_status', '$fully accepted|q$')] @acceptance_status_5! [Concept('concept_pop', '$concept_pops|q$')] become more [concept_loyalist]."
 sb_natal_shepstone_make_fully_accepted_loyalist_5_tt:0 "#p 5%#! of [Concept('concept_acceptance_status', '$fully accepted|q$')] @acceptance_status_5! [Concept('concept_pop', '$concept_pops|q$')] become more [concept_loyalist]."
 sb_natal_shepstone_decline_zulu_movement_attraction_tt:0 "The [GetCulture('zulu').GetName] National Movement gains #n +100%#! Political Movement Pop Attraction, decaying over #v 25 years#!."
 sb_natal_shepstone_repeal_zulu_movement_attraction_tt:0 "The [GetCulture('zulu').GetName] National Movement gains #n +50%#! Political Movement Pop Attraction, decaying over #v 10 years#!."

 sb_natal_shepstone_make_fully_accepted_radical_10_tt:0 "#n 10%#! of [Concept('concept_acceptance_status', '$fully accepted|q$')] @acceptance_status_5! [Concept('concept_pop', '$concept_pops|q$')] become more [concept_radical]."

 sb_natal_indian_civic_rights_accept_tt:0 "The early indenture exception is replaced by #bold $amendment_sb_natal_indian_civic_rights$#!, giving Indian cultures #green +60#! Cultural Acceptance. #green 10%#! of Indian [Concept('concept_pop', '$concept_pops|q$')] become more Loyalist, and the Civil Rights Movement disbands."
 sb_natal_indian_civic_rights_refuse_tt:0 "#red 20%#! of Indian [Concept('concept_pop', '$concept_pops|q$')] become more Radical. The Civil Rights Movement and its leaders remain active."
 # ### TO REVIEW ###
 sb_natal_trn_supports_zulu_restoration_tt:0 "The greater #bold Nieuwe Republiek#! is created from the five agreed districts of Zululand. [ROOT.GetCountry.GetName] pays #n £10,000#! to [SCOPE.sCountry('sb_natal_arms_appeal_zulu_scope').GetName], transfers up to #v 1,000#! existing Boer [GetPopType('soldiers').GetName], and supplies one #v Dragoons#! unit. A dedicated treaty provides #v 10#! Grain, #v 10#! Small Arms and Military Assistance for exactly #v 36 months#!. Relations fall by #n 15#! with [SCOPE.sCountry('sb_natal_arms_appeal_natal_scope').GetName] and #n 5#! with Great Britain."
 sb_natal_trn_refuses_zulu_restoration_tt:0 "No republic is created and no aid is sent. Relations fall by #n 20#! with [SCOPE.sCountry('sb_natal_arms_appeal_zulu_scope').GetName], but improve by #p 15#! with [SCOPE.sCountry('sb_natal_arms_appeal_natal_scope').GetName] and #p 5#! with Great Britain."
 treaty_name_sb_trn_zulu_rebellion_aid:0 "The Pretoria–uSuthu Aid Convention"
 zulu_boer_dragoon_contingent:0 "Boer Mounted Contingent"

 # ### REVIEWED ###
 sb_natal_interwar.001.t:0 "Labour from India"
 sb_natal_interwar.001.d:0 "Natal's sugar planters cannot attract enough workers to the cane fields on the terms they offer. At their urging, the colonial government has prepared a scheme to recruit labourers in India and allot them to Natal estates. In return for passage, wages and rations, each immigrant will be bound to five years of service under laws enforced by the magistrates."
 sb_natal_interwar.001.f:0 "'It is essential to the perfect success of sugar manufacture that the operations during the season should proceed night and day, without interruptions.'\n— #italic Natal Mercury, 1855#!"
 sb_natal_interwar.001.a:0 "Authorise the indenture scheme."

 # ### TO REVIEW ###
 sb_natal_interwar.005.t:0 "A New People of Natal"
 sb_natal_interwar.005.d:0 "Labourers brought to Natal from across India—divided on arrival by language, caste and faith—have finished their contracts and raised families who know no other home. Joined by free traders and artisans arriving from Gujarat, these once-separate communities have forged common associations and a distinct Natal Indian society."
 sb_natal_interwar.005.f:0 "'Natal is the mother country of a very large number of the Indians whose parents, in some cases, were born in this Colony.'\n— #italic Petition of Natal Indian organisations to the Colonial Secretary, 10 July 1909#!"
 sb_natal_interwar.005.a:0 "Natal is their home."

 # ### REVIEWED ###
 sb_natal_interwar.050.t:0 "The Native Locations"
 sb_natal_interwar.050.d:0 "Natal's African population far outnumbers its settlers, and a handful of magistrates cannot govern every chiefdom directly. Theophilus Shepstone proposes setting aside Native Locations, where chiefs recognised by the government will rule under colonial supervision. The scheme promises order at little cost, but settlers complain that communities with land and cattle of their own have little reason to labour on colonial farms. Leaving the land open to settler occupation would drive many dispossessed families towards wage labour—but it may also turn the countryside against the Colony."
 sb_natal_interwar.050.f:0 "'The attempt to subject a large native population... to the regular administration of British law must be abandoned.'\n— The Earl Grey, #italic Dispatch to Sir Harry Smith, 10 December 1847#!"
 sb_natal_interwar.050.a:0 "Establish the Native Locations."
 sb_natal_interwar.050.b:0 "Open the land to settlement."

 # ### REVIEWED ###
 sb_natal_interwar.055.t:0 "The Locations Unmade"
 sb_natal_interwar.055.d:0 "The Shepstone System has been repealed. Land reserved to African communities is being surveyed for sale and settler occupation, while the chiefs through whom the government once ruled are stripped of their recognised authority. Homesteads that had treated the locations as protection now see surveyors crossing their fields and grazing grounds. The measure promises more land and labour to the Colony, but it has given communities across Natal a common grievance. The government must either carry the repeal through or restore the locations before resistance spreads."
 sb_natal_interwar.055.f:0 "'To throw a large mass of native labour into the hands of agricultural and other classes.'\n— #italic Memorial to Lieutenant-Governor Pine, 15 October 1851#!"
 sb_natal_interwar.055.a:0 "The land will no longer be reserved."
 sb_natal_interwar.055.b:0 "We were mistaken."

 # ### TO REVIEW ###
 sb_natal_interwar.010.t:0 "A Petition for Civil Rights"
 sb_natal_interwar.010.d:0 "Indian associations have brought their campaign before the colonial ministry. They argue that residence, property, and service to Natal must carry a recognised civic standing; their opponents insist that any exception would weaken the racial settlement upon which responsible government was granted."
 sb_natal_interwar.010.f:0 "On the ministry table lay bound petitions from Durban and Pietermaritzburg merchants beside the colony's franchise rolls. Between them sat the latest dispatch from London, reminding ministers that the Crown watched how Natal treated British Indian subjects—even as settler deputies counted every vote at the next election."
 sb_natal_interwar.010.a:0 "Recognise their civic rights."
 sb_natal_interwar.010.b:0 "The racial settlement must stand."

 # ### TO REVIEW ###
 sb_natal_interwar.030.t:0 "The Government of Zululand"
 sb_natal_interwar.030.d:0 "With the Zulu regiments defeated and the kingdom placed under Natal's protection, the Governor and ministry must settle how Zululand is to be governed. Direct annexation, partition among thirteen chiefs under a British Resident, or leaving the Zulu Crown in place beneath Natal's authority each carry lasting consequences for peace on the Tugela."
 sb_natal_interwar.030.f:0 "'We neither gave the Zulus our form of government nor let them have their own; but we divided the country into thirteen portions.'\n— H. E. Colenso, #italic Zululand: Past and Present, 1890#!"
 sb_natal_interwar.030.a:0 "Destroy the Crown; annex Zululand to Natal."
 sb_natal_interwar.030.b:0 "Splinter the Crown into thirteen chiefdoms."
 sb_natal_interwar.030.c:0 "Retain the Zulu Crown under our protection."

 sb_natal_interwar.030.a.tt:0 "Natal annexes [GetStateRegion('STATE_ZULULAND').GetName]."
 sb_natal_interwar.030.a.tt.incorporation:0 "Natal can begin [Concept('concept_incorporated_state', '$concept_incorporating|q$')] Zululand immediately."
 sb_natal_interwar.030.a.tt.radicals:0 "#n 25%#! of Zulu [Concept('concept_pop', '$concept_pops|q$')] in Natal become more [concept_radical]."
 sb_natal_interwar.030.a.tt.movement:0 "The [Concept('concept_cultural_movement', 'Zulu National Movement')] gains #v +100%#! #tooltippable #tooltip:[GetPlayer.GetTooltipTag],political_movement_pop_attraction_mult_desc Pop Attraction#!#!, decaying over #v 20 years#!."


 sb_natal_interwar.030.b.tt:0 "Zululand becomes Natal’s [concept_puppet] under the [concept_sb_zulu_chiefdoms]."
 sb_natal_interwar.030.b.tt.exile:0 "The deposed royal household goes into exile, including its children. Rival royal claimants outside the house are put to death."
 sb_natal_interwar.030.b.tt.institutions:0 "Zululand adopts [GetLawType('law_sb_federated_chiefdoms').GetName] and [GetLawType('law_sb_chiefly_council').GetName]."
 sb_natal_interwar.030.b.tt.chief:0 "Zibhebhu kaMaphitha heads the first council if he can serve. Otherwise the chiefs choose their most prominent eligible supporter."
 sb_natal_interwar.030.b.tt.reserves:0 "Chiefly Reserves are established in [GetStateRegion('STATE_ZULULAND').GetName]."
 sb_natal_interwar.030.b.tt.radicals:0 "#n 5%#! of Zulu [Concept('concept_pop', '$concept_pops|q$')] in Natal and Zululand become more [concept_radical]."
 sb_natal_interwar.030.b.tt.confirmation:0 "Hamu’s bargain has already founded the Nieuwe Republiek. The amaKhosi prevail immediately. Natal gains #p +50%#! incorporation speed in any part of Zululand it owns."
 sb_natal_interwar.030.b.tt.situation:0 "The Thirteen Chiefdoms [concept_com_international_situation] begins."

 sb_natal_interwar.030.c.tt:0 "Zululand retains its ruler as a [concept_protectorate] of Natal."
 sb_natal_interwar.030.c.tt.relations_nal:0 "Zulu [concept_relations] with Natal improve by #p 15#!."
 sb_natal_interwar.030.c.tt.relations_gbr:0 "Zulu [concept_relations] with Great Britain improve by #p 15#!."
 sb_natal_interwar.030.c.tt.loyalists:0 "#p 10%#! of Zulu [Concept('concept_pop', '$concept_pops|q$')] in Natal become more [concept_loyalist]."

 # ### TO REVIEW ###
 sb_natal_interwar.039.t:0 "Return of the King"
 sb_natal_interwar.039.d:0 "The rising against Natal has opened the way to restore the Zulu monarchy. Colonial offices inherited from Pietermaritzburg cannot command a war fought in the royal house's name; before the amabutho face the colony, the Crown must be proclaimed anew."
 sb_natal_interwar.039.f:0 "A colonial magistrate's notice lay torn in the red dust outside the homestead as messengers struck shields and called the regiments by their royal names. Whatever statutes Natal had written on paper, the men gathering on the hillside answered only to the House of Zulu."
 sb_natal_interwar.039.a:0 "The king returns at the head of the nation."
 sb_natal_interwar.039.a.tt:0 "Zululand enacts [GetLawType('law_monarchy').GetName], [GetLawType('law_autocracy').GetName], and [GetLawType('law_sb_amabutho_system').GetName]. The surviving pre-annexation ruler—or his living heir or dynastic successor—takes the throne, and Zululand presses a #bold Return State#! claim on [GetStateRegion('STATE_NATAL').GetName] in the uprising."

 # ### REVIEWED ###
 sb_natal_interwar.040.t:0 "A Republic for a Kingdom"
 sb_natal_interwar.040.d:0 "The Zulu Crown has raised its standard against [SCOPE.sCountry('sb_natal_arms_appeal_natal_scope').GetName] and sent envoys to [ROOT.GetCountry.GetCapital.GetCityHubName]. They offer to cede the northern districts of Zululand at once for the foundation of the Nieuwe Republiek. In return, they ask for money, rifles and commandos to sustain the rising. Victory would leave the new republic beside a restored Zulu Kingdom; defeat would leave it exposed upon land Britain and Natal still regard as theirs."
 sb_natal_interwar.040.f:0 "'The Boer adventurers were invited to come and were given a vast tract of country...'\n— Edmond Robert Wodehouse, #italic House of Commons, 29 October 1884#!"
 sb_natal_interwar.040.a:0 "Strike the bargain. Send rifles and commandos."
 sb_natal_interwar.040.b:0 "The Zulu Crown must fight alone."


 # ### REVIEWED ###
 sb_natal_interwar.060.t:0 "An Indian Congress in Natal"
 sb_natal_interwar.060.d:0 "A young barrister from India, Mohandas Gandhi, has arrived in Natal and found that professional standing offers little protection from the colony's racial distinctions. Merchants, former indentured labourers, and educated residents are gathering around a new congress to petition against their civic exclusion. Their campaign gives the Indian rights movement an organiser—and the colonial government an opponent it can no longer dismiss as scattered complaint."
 sb_natal_interwar.060.f:0 "A grievance shared in private became an association; an association, once printed and petitioned, became a public cause."
 sb_natal_interwar.060.a:0 "Let the Congress make its case."
 sb_natal_interwar.060.b:0 "Meet agitation with official hostility."

