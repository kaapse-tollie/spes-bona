l_english:
 state_trait_sb_natal_sugar_country:0 "Natal Sugar Country"
 state_trait_sb_natal_sugar_country_desc:0 "Warm coastal lowlands and well-watered valleys make Natal particularly suited to the cultivation of sugar cane."

 ideology_sb_natal_civil_rights:0 "Civil Rights"
 ideology_sb_natal_civil_rights_desc:0 "Indian residents seek equal civic standing and the removal of laws that exclude them from the political life of the colony."

 movement_sb_natal_civil_rights:0 "Natal Civil Rights Movement"
 movement_sb_natal_civil_rights_short:0 "Civil Rights"
 movement_sb_natal_civil_rights_name:0 "Natal Civil Rights Movement"
 movement_sb_natal_civil_rights_desc:0 "Indian merchants, professionals, laborers, and their allies organize against the civic disabilities imposed by Natal's racial order."

 amendment_sb_shepstone_system:0 "The Shepstone System"
 amendment_sb_shepstone_system_desc:0 "African locations preserve land for subsistence and place chiefly authority beneath the colonial government. They leave Zulu cultivators less dependent upon plantation wages, to the lasting anger of the settler interest."
 amendment_sb_natal_indian_indenture_status:0 "Indentured Indian Status"
 amendment_sb_natal_indian_indenture_status_desc:0 "A narrow statutory exception admits recruited Indian workers to Natal while preserving their subordinate place within the colony's racial order."
 amendment_sb_natal_indian_civic_rights:0 "Indian Civic Rights"
 amendment_sb_natal_indian_civic_rights_desc:0 "Indian residents receive a protected civic status within Natal despite the colony's wider system of racial segregation."
 amendment_sb_zulu_chiefdom_settlement:0 "Thirteen Chiefdoms"
 amendment_sb_zulu_chiefdom_settlement_desc:0 "Zululand is administered through a divided system of appointed chiefs, preserving subsistence and local authority while sharply limiting education and advancement."

 sb_natal_civil_rights_initial_activism:0 "Organized Civil Rights Campaign"
 sb_natal_civil_rights_initial_activism_desc:0 "Indian associations have united around a common petition for civic recognition."
 sb_natal_indenture_program_costs:0 "The Natal Indenture System"
 sb_natal_indenture_program_costs_desc:0 "Recruitment offices and passage contracts impose a fixed administrative and financial cost on Natal."
 # ### TO REVIEW ###
 sb_natal_indenture_program_scaled_costs:0 "Expanding Indenture Administration"
 sb_natal_indenture_program_scaled_costs_desc:0 "The cost of recruiting, assigning, and supervising indentured labour rises as Natal's Indian population grows."
 sb_shepstone_colonial_garrison_approval:0 "The Native Locations Policy"
 sb_shepstone_colonial_garrison_approval_desc:0 "The Colonial Garrison approves of the government's assertion of authority over the African population."
 sb_shepstone_industrialists_opposition:0 "Planter Opposition to the Locations"
 sb_shepstone_industrialists_opposition_desc:0 "Planters condemn a reserve policy which allows African cultivators to refuse poorly paid estate labour."
 sb_shepstone_colonial_garrison_opposition:0 "Native Policy Abandoned"
 sb_shepstone_colonial_garrison_opposition_desc:0 "The Colonial Garrison resents the government's refusal to establish a coherent system of African administration."
 sb_shepstone_industrialists_approval:0 "Free Access to African Labour"
 sb_shepstone_industrialists_approval_desc:0 "Planters welcome the government's refusal to reserve further land from commercial settlement."
 # ### TO REVIEW ###
 sb_shepstone_repeal_colonial_garrison_opposition:0 "Native Policy Repealed"
 sb_shepstone_repeal_colonial_garrison_opposition_desc:0 "The Colonial Garrison resents the dismantling of the system through which it administered Natal's African population."
 sb_shepstone_repeal_industrialists_approval:0 "Locations Opened to Settlement"
 sb_shepstone_repeal_industrialists_approval_desc:0 "Planters welcome the reopening of reserved land and labour to commercial settlement."
 sb_shepstone_refusal_zulu_movement_attraction:0 "Rejection of the Shepstone System"
 sb_shepstone_refusal_zulu_movement_attraction_desc:0 "The refusal to establish protected locations has strengthened Zulu national organization against the colonial government."
 sb_shepstone_repeal_zulu_movement_attraction:0 "Repeal of the Shepstone System"
 sb_shepstone_repeal_zulu_movement_attraction_desc:0 "The dismantling of the locations has renewed Zulu national organization against the colonial government."
 sb_port_natal_migration_deterrent:0 "The Port Natal Outpost"
 sb_port_natal_migration_deterrent_desc:0 "Before a civil government is constituted, Port Natal remains an isolated imperial outpost which attracts little permanent settlement."
 sb_zulu_chiefdom_administration:0 "The Thirteen Chiefdoms"
 sb_zulu_chiefdom_administration_desc:0 "Indirect rule restrains social disruption and protects local food security, but severely limits the qualifications available to the Zulu population."

 decision_sb_dismantle_zulu_chiefdom_settlement:0 "Dismantle the Chiefdom Settlement"
 decision_sb_dismantle_zulu_chiefdom_settlement_desc:0 "End the partition of Zululand into appointed chiefdoms and return the territory to ordinary colonial administration."
 decision_sb_integrate_restored_zululand:0 "Integrate Restored Zululand"
 decision_sb_integrate_restored_zululand_desc:0 "With the restored kingdom no longer seeking autonomy, bring Zululand back under the direct administration of Natal."

 # ### TO REVIEW ###
 je_sb_natal_indenture_program:0 "The Natal Indenture System"
 je_sb_natal_indenture_program_v2:0 "$je_sb_natal_indenture_program$"
 je_sb_natal_indenture_program_completion_tt:0 "#v Natal's#! Indian-origin [Concept('concept_pop', '$concept_pops$')] is ≥ #v 100,000#!."
 je_sb_natal_indenture_program_progress:0 "Indian-origin population: #v [ROOT.GetCountry.MakeScope.Var('sb_natal_indian_origin_population_var').GetValue|K]#! / #v 100K#!"

 je_sb_natal_indenture_program_reason:0 "Natal's sugar estates have created a demand for labour that the colony cannot meet on the planters' terms. African communities, protected by the Shepstone system and sustained by land and cattle of their own, have little reason to bind themselves to plantation work, while the settler population is too small to fill the cane fields. At the urging of the sugar interest, the colonial government has opened recruiting offices in British India, offering passage to Natal in return for fixed terms of indenture.\n\nThe scheme promises a steady supply of labour, but every new arrival adds to the cost of recruitment, transport and supervision. Recruitment may be suspended if these demands grow too great.\n$TOOLTIP_DELIMITER$\n@information! #bold Monthly Recruitment#!\nWhile recruitment is #p active#!, #v 400#! [GetPopType('peasants').GetName] from #v British India#! will move to [GetStateRegion('STATE_NATAL').GetName] after every month and become [GetPopType('laborers').GetName] upon arrival.\n\n#bold Cost of the Scheme#!\nThe scheme initially costs #v 25#! Bureaucracy and #v £100#! per week. Its cost rises quadratically with Natal's Indian-origin population, reaching #v 100#! Bureaucracy and #v £1,050#! per week at #v 100,000#! people.\n\n#bold Suspending Recruitment#!\nSuspending the scheme removes its running costs without erasing progress towards the population target.\n\n#bold Intensifying Recruitment#!\nWhile selected, intensive recruitment doubles the monthly cohort and all programme costs. It may be switched off again; changing intensity during active recruitment begins a fresh full-month cycle."
 je_sb_natal_indenture_program_v2_reason:0 "$je_sb_natal_indenture_program_reason$"

 je_sb_natal_indenture_program_status_active:0 "Recruitment in British India is #p active#!."
 je_sb_natal_indenture_program_status_intensified:0 "Recruitment in British India is #p intensified#!."
 je_sb_natal_indenture_program_status_suspended:0 "Recruitment in British India is #n suspended#!."

 je_sb_natal_suspend_indenture_program_button:0 "Suspend the Scheme"
 je_sb_natal_suspend_indenture_program_button_desc:0 "Recall the recruiting agents and remove the scheme's running costs. Progress towards the population target will be retained, but the current monthly recruitment cycle will be lost."

 je_sb_natal_resume_indenture_program_button:0 "Resume the Scheme"
 je_sb_natal_resume_indenture_program_button_desc:0 "Reopen the recruiting offices and restore the scheme's running costs. A fresh full-month recruitment cycle will begin; no contingent will arrive immediately."

 je_sb_natal_intensify_indenture_program_button:0 "Intensify Recruitment"
 je_sb_natal_intensify_indenture_program_button_desc:0 "Toggle intensive recruitment. While selected, monthly recruitment and all programme costs are doubled. Changing this setting during active recruitment begins a fresh full-month cycle; no contingent arrives immediately."
 sb_natal_indenture_intensity_requires_active_tt:0 "Recruitment must be active to change its intensity."

sb_natal_indenture_migration_tt:0 "The first contingent of #v 342#! Tamil [GetPopType('peasants').GetName] will move from #v British India#! to [GetStateRegion('STATE_NATAL').GetName] and become [GetPopType('laborers').GetName] upon arrival."

 # ### TO REVIEW ###
 sb_natal_indian_ethnogenesis_tt:0 "#v 25%#! of Indian-origin [Concept('concept_pop', '$concept_pops$')] in #v Natal #! will adopt a new Culture."
 sb_natal_indian_homeland_tt:0 "[GetStateRegion('STATE_NATAL').GetName] will become a [concept_homeland] of this new Culture."

 sb_natal_shepstone_accept_tt:0 "#v 80%#! of every non-[GetPopType('peasants').GetName] [GetCulture('zulu').GetName] [Concept('concept_pop', '$concept_pops$')] in [GetStateRegion('STATE_NATAL').GetName] will become [GetPopType('peasants').GetName]."

 sb_natal_shepstone_make_fully_accepted_loyalist_10_tt:0 "#p 10%#! of [Concept('concept_acceptance_status', '$fully_accepted$')] @acceptance_status_5! [Concept('concept_pop', '$concept_pops$')] become more [concept_loyalist]."
 sb_natal_shepstone_make_fully_accepted_loyalist_5_tt:0 "#p 5%#! of [Concept('concept_acceptance_status', '$fully_accepted$')] @acceptance_status_5! [Concept('concept_pop', '$concept_pops$')] become more [concept_loyalist]."
 sb_natal_shepstone_decline_zulu_movement_attraction_tt:0 "The [GetCulture('zulu').GetName] National Movement gains #p +100%#! Political Movement Pop Attraction, decaying over #v 25 years#!."
 sb_natal_shepstone_repeal_zulu_movement_attraction_tt:0 "The [GetCulture('zulu').GetName] National Movement gains #p +50%#! Political Movement Pop Attraction, decaying over #v 10 years#!."

 sb_natal_shepstone_make_fully_accepted_radical_10_tt:0 "#n 10%#! of [Concept('concept_acceptance_status', '$fully_accepted$')] @acceptance_status_5! [Concept('concept_pop', '$concept_pops$')] become more [concept_radical]."

 sb_natal_indian_civic_rights_accept_tt:0 "The early indenture exception is replaced by #bold $amendment_sb_natal_indian_civic_rights$#!, giving Indian cultures #green +60#! Cultural Acceptance. #green 10%#! of Indian [Concept('concept_pop', '$concept_pops$')] become more Loyalist, and the Civil Rights Movement disbands."
 sb_natal_indian_civic_rights_refuse_tt:0 "#red 20%#! of Indian [Concept('concept_pop', '$concept_pops$')] become more Radical. The Civil Rights Movement and its leaders remain active."
 sb_natal_zulu_appeals_to_transvaal_tt:0 "Transvaal will decide whether to exchange rifles and Military Assistance for the Vryheid districts."
 sb_natal_trn_supports_zulu_restoration_tt:0 "[ROOT.GetCountry.GetName] receives the Vryheid districts, gains #red 2.5#! [concept_infamy], and provides [SCOPE.sCountry('sb_natal_arms_appeal_zulu_scope').GetName] with Military Assistance and #v 10#! Small Arms for #v 5 years#!."

 # ### REVIEWED ###
 sb_natal_interwar.001.t:0 "Labour from India"
 sb_natal_interwar.001.d:0 "Natal's sugar planters cannot attract enough workers to the cane fields on the terms they offer. At their urging, the colonial government has prepared a scheme to recruit labourers in India and allot them to Natal estates. In return for passage, wages and rations, each immigrant will be bound to five years of service under laws enforced by the magistrates."
 sb_natal_interwar.001.f:0 "'It is essential to the perfect success of sugar manufacture that the operations during the season should proceed night and day, without interruptions.'\n— #italic Natal Mercury, 1855#!"
 sb_natal_interwar.001.a:0 "Authorise the indenture scheme."

 # ### TO REVIEW ###
 sb_natal_interwar.005.t:0 "A New People of Natal"
 sb_natal_interwar.005.d:0 "Indenture brought labourers to Natal from many parts of India, divided by language, caste and faith. Many have now completed their contracts, settled in the Colony and raised children who have never known another home. Temples, mosques, schools, market gardens and associations bind these once-separate communities to one another and to Natal. While in origin they were many peoples, a new and unique Natal Indian community has taken root."
 sb_natal_interwar.005.f:0 "'Natal is the mother country of a very large number of the Indians whose parents, in some cases, were born in this Colony.'\n— #italic Petition of Natal Indian organisations to the Colonial Secretary, 10 July 1909#!"
 sb_natal_interwar.005.a:0 "Natal is their home."

 # ### REVIEWED ###
 sb_natal_interwar.050.t:0 "The Native Locations"
 sb_natal_interwar.050.d:0 "Natal's African population far outnumbers its settlers, and a handful of magistrates cannot govern every chiefdom directly. Theophilus Shepstone proposes setting aside Native Locations, where chiefs recognised by the government will rule under colonial supervision. The scheme promises order at little cost, but settlers complain that communities with land and cattle of their own have little reason to labour on colonial farms. Leaving the land open to settler occupation would drive many dispossessed families towards wage labour—but it may also turn the countryside against the Colony."
 sb_natal_interwar.050.f:0 "'The attempt to subject a large native population... to the regular administration of British law must be abandoned.'\n— The Earl Grey, #italic Dispatch to Sir Harry Smith, 10 December 1847#!"
 sb_natal_interwar.050.a:0 "Establish the Native Locations."
 sb_natal_interwar.050.b:0 "Open the land to settlement."

 # ### REVIEWED ###
 sb_natal_interwar.055.t:0 "The Locations Unmade"
 sb_natal_interwar.055.d:0 "The Shepstone System has been repealed. Land reserved to African communities is being surveyed for sale and settler occupation, while the chiefs through whom the government once ruled are stripped of their recognised authority. Homesteads that had treated the locations as protection now see surveyors crossing their fields and grazing grounds. The measure promises more land and labour to the Colony, but it has given communities across Natal a common grievance. The government must either carry the repeal through or restore the locations before resistance spreads."
 sb_natal_interwar.055.f:0 "'To throw a large mass of native labour into the hands of agricultural and other classes.'\n— #italic Memorial to Lieutenant-Governor Pine, 15 October 1851#!"
 sb_natal_interwar.055.a:0 "The land will no longer be reserved."
 sb_natal_interwar.055.b:0 "We were mistaken."

 # ### TO REVIEW ###
 sb_natal_interwar.010.t:0 "A Petition for Civil Rights"
 sb_natal_interwar.010.d:0 "Indian associations have brought their campaign before the colonial ministry. They argue that residence, property, and service to Natal must carry a recognized civic standing; their opponents insist that any exception would weaken the racial settlement upon which responsible government was granted."
 sb_natal_interwar.010.f:0 "Petitions passed from meeting halls to printers, from printers to ministers, and from ministers into the machinery of colonial law."
 sb_natal_interwar.010.a:0 "Recognize their civic rights."
 sb_natal_interwar.010.b:0 "The racial settlement must stand."

 # ### TO REVIEW ###
 sb_natal_interwar.020.t:0 "The Chiefdom Settlement Stands"
 sb_natal_interwar.020.d:0 "The division of Zululand into appointed chiefdoms is the foundation of the present administration. The bureaucracy cannot be reformed while that settlement remains in force; it must first be dismantled by decision."
 sb_natal_interwar.020.a:0 "Then the settlement remains."

 # ### TO REVIEW ###
 sb_natal_interwar.030.t:0 "The Government of Zululand"
 sb_natal_interwar.030.d:0 "The destruction of the independent Zulu state leaves Natal responsible for a populous kingdom with its own royal house, authorities, and political loyalties. The ministry must decide whether to absorb its people, govern through divided chiefs, or preserve a subordinate crown beneath imperial rule."
 sb_natal_interwar.030.f:0 "Conquest settled the frontier on a map. It did not settle how the conquered country would be ruled."
 sb_natal_interwar.030.a:0 "Force their integration into Natal."
 sb_natal_interwar.030.b:0 "Divide the country among thirteen chiefs."
 sb_natal_interwar.030.c:0 "Restore the Crown beneath imperial rule."

 # ### TO REVIEW ###
 sb_natal_interwar.035.t:0 "A Rifle for a District"
 sb_natal_interwar.035.d:0 "The Zulu national movement has passed into open secession, and [SCOPE.sCountry('sb_natal_arms_appeal_natal_scope').GetName]'s troops will soon come north. Across the Buffalo, the Transvaal covets the Vryheid districts. Its government may exchange rifles, ammunition, and military assistance for a frontier concession that no Zulu king would lightly grant."
 sb_natal_interwar.035.f:0 "The messengers carried two offers in the same saddlebag: land for the republic, and war for the kingdom."
 sb_natal_interwar.035.a:0 "Offer Vryheid for Boer arms."
 sb_natal_interwar.035.b:0 "Zululand will fight without them."

 # ### TO REVIEW ###
 sb_natal_interwar.040.t:0 "An Appeal from Zululand"
 sb_natal_interwar.040.d:0 "Agents of [SCOPE.sCountry('sb_natal_arms_appeal_zulu_scope').GetName] have reached Pretoria while the Zulu secession against [SCOPE.sCountry('sb_natal_arms_appeal_natal_scope').GetName] gathers for war. They offer the Vryheid districts in exchange for rifles, ammunition, and formal military assistance."
 sb_natal_interwar.040.f:0 "The frontier could be purchased in land, but the price would be paid in another country's war."
 sb_natal_interwar.040.a:0 "Accept the bargain and arm Zululand."
 sb_natal_interwar.040.b:0 "We will not challenge Britain over this."

 # ### REVIEWED ###
 sb_natal_interwar.060.t:0 "An Indian Congress in Natal"
 sb_natal_interwar.060.d:0 "A young barrister from India, Mohandas Gandhi, has arrived in Natal and found that professional standing offers little protection from the colony's racial distinctions. Merchants, former indentured labourers, and educated residents are gathering around a new congress to petition against their civic exclusion. Their campaign gives the Indian rights movement an organiser—and the colonial government an opponent it can no longer dismiss as scattered complaint."
 sb_natal_interwar.060.f:0 "A grievance shared in private became an association; an association, once printed and petitioned, became a public cause."
 sb_natal_interwar.060.a:0 "Let the Congress make its case."
 sb_natal_interwar.060.b:0 "Meet agitation with official hostility."
