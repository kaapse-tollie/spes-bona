l_english:
sb_native_conscription_MTB:0 "A Gathered Host"
sb_native_conscription_MTB_desc:0 "Mzilikazi has gathered local manpower for a short, violent frontier war. The host can call up far more men than usual, though it still fights as an irregular army."
sb_native_conscription_MTB_player:0 "Mzilikazi's host"
sb_native_conscription_MTB_player_desc:0 "Mzilikazi has fully gathered his host for the struggle against the Voortrekkers. Conscription and battlefield performance rise while the kingdom fights for survival."
sb_laager_defence_desc:0 "Our commandos utilise an innovative defensive system, interlocking their wagons into a ring-like barrier and firing from behind it."
sb_frontier_levy_reconstitution:0 "Levy Reconstitution"
sb_frontier_levy_reconstitution_desc:0 "Local musters are being restored to their intended wartime strength before hostilities begin."
sb_amabutho_levy_reconstitution:0 "Amabutho Reconstitution"
sb_amabutho_levy_reconstitution_desc:0 "Age-regiments are being recalled and trained for wartime service without widening the kingdom's established levy obligation."
ai_strategy_sb_frontier_levy_preservation:0 "Preserve the Frontier Levies"
ai_strategy_sb_frontier_levy_preservation_desc:0 "The state preserves its established levy pool while a diplomatic confrontation remains unresolved."
