 sb_imperial_confederation_ignored_delagoa:0 "Ignored Boer Sea Access"
 sb_boer_blossoming_nationhood:0 "Blossoming Nationhood"
 sb_boer_blossoming_nationhood_desc:0 "The failure of Britain's confederation scheme has hardened a distinct Boer political identity and a stronger will to resist outside leverage."
 sb_imperial_confederation_failed_prestige:0 "Confederation Scheme Failed"
 sb_imperial_confederation_failed_prestige_desc:0 "Britain's attempt to bind Southern Africa into a peaceful imperial confederation has collapsed."
 je_sb_confederate_southern_africa:0 "Confederate Southern Africa"
 je_sb_confederate_southern_africa_reason:0 "The Confederated States of Southern Africa can consolidate British-network territories into one colonial federation. Multi-region subjects only transfer their Southern African states."
 je_sb_confederate_southern_africa_status:0 "Use the confederation button to integrate eligible Southern African British-network states and subjects. The entry completes once the Confederated States controls the full Southern African region."
 je_sb_confederate_southern_africa_button:0 "Expand the Confederation"
 je_sb_confederate_southern_africa_button_desc:0 "Integrate one eligible Southern African British-network territory or subject into the Confederated States of Southern Africa."
 je_sb_confederate_southern_africa_button_possible_tt:0 "At least one eligible Southern African British-network territory or subject remains outside the Confederated States."
 je_sb_confederate_southern_africa_button_effect_tt:0 "A direct British Southern African state is transferred first. Otherwise, an eligible level-one British-network subject is integrated; if that subject spans multiple regions, only one Southern African state is transferred."
 je_sb_confederate_southern_africa_complete_tt:0 "The Confederated States of Southern Africa controls the Southern African region."
 sb_confederated_south_africa_unified:0 "Confederated Southern Africa"
 sb_confederated_south_africa_unified_desc:0 "Southern Africa has been consolidated into a decentralized imperial confederation."
 sb_gbr_unified_southern_africa:0 "Southern African Confederation"
 sb_gbr_unified_southern_africa_desc:0 "Britain has overseen the peaceful confederation of its Southern African network."
 # ### TO REVIEW ###
 sb_imperial_confederation.030.t:0 "Boer Access to Delagoa"
 sb_imperial_confederation.030.d:0 "Transvaal has built its own foothold at Lourenco Marques, bypassing the imperial trade network. London must decide whether to defend Portuguese claims, demand submission, or absorb the diplomatic cost."
 sb_imperial_confederation.030.f:0 "The new route was marked in red across the Foreign Office map, running from the Boer interior to a coast outside British control. Beside it, an official had written the trade figures and underlined the conclusion: every wagon using Delagoa weakened the pressure on which confederation depended."
 sb_imperial_confederation.030.a:0 "Demand relinquishment to Portugal."
 sb_imperial_confederation.030.b:0 "Demand vassalisation."
 sb_imperial_confederation.030.c:0 "Ignore the matter."
 sb_imperial_confederation_030_relinquish_tt:0 "Transvaal receives an ultimatum to hand its Lourenco Marques holdings to Portugal."
 sb_imperial_confederation_030_vassalize_tt:0 "Britain starts a diplomatic play to make Transvaal a protectorate."
 # ### TO REVIEW ###
 sb_imperial_confederation.031.t:0 "London Demands Delagoa"
 sb_imperial_confederation.031.d:0 "Britain has demanded that Transvaal relinquish Lourenco Marques to Portugal. Refusal will turn the port question into a wider imperial crisis."
 sb_imperial_confederation.031.f:0 "London's demand arrived in Pretoria with Portugal's title attached and Britain's force behind it. Ministers studied the narrow coastal holdings on the map, then the railway approaching them, and understood why ground once dismissed as distant had become an imperial test."
 sb_imperial_confederation.031.a:0 "Back down."
 sb_imperial_confederation.031.b:0 "Refuse."
 sb_imperial_confederation_031_back_down_tt:0 "Portugal gains Transvaal-controlled Lourenco Marques land."
 sb_imperial_confederation_031_refuse_tt:0 "Portugal starts a return-state play and Britain backs Portugal with a protectorate demand where valid."
 # ### TO REVIEW ###
 sb_imperial_confederation.040.t:0 "Natal Accelerates the Frontier"
 sb_imperial_confederation.040.d:0 "Boer trade through Zululand threatens the imperial trade scheme. Natal has been pushed toward a faster ultimatum against the Zulu kingdom."
 sb_imperial_confederation.040.f:0 "Natal officials counted Boer wagons passing through a frontier they had hoped to control through dependence. The traffic did not carry soldiers, yet each load strengthened the argument that delay would leave the Zulu corridor beyond imperial direction."
 sb_imperial_confederation.040.a:0 "The pressure rises."
 # ### TO REVIEW ###
 sb_imperial_confederation.050.t:0 "A Boer Route to the Sea"
 sb_imperial_confederation.050.d:0 "A Boer republic has secured access to a non-British sea route. Britain has three years to reverse the corridor, restore imperial leverage, or accept that the confederation scheme is losing its main instrument of pressure."
 sb_imperial_confederation.050.f:0 "A clerk entered the first month of non-British access into the scheme's register. The notation occupied a single line, but every subsequent report from the port would lengthen it and shorten the time available for London to restore its leverage."
 sb_imperial_confederation.050.a:0 "The clock is now running."
 # ### TO REVIEW ###
 sb_imperial_confederation.051.t:0 "The Confederation Scheme Fails"
 sb_imperial_confederation.051.d:0 "The imperial confederation scheme has collapsed. Either a bound subject has broken free, the Boer republics no longer remain as republics to bind, their trade can now reach the sea without depending on British corridors, or Britain has abandoned the peaceful route for war."
 sb_imperial_confederation.051.d_war:0 "Britain has entered open war against a republic the confederation scheme was meant to bind peacefully. The project can no longer be presented as a gradual federation under imperial supervision; the Southern African question will now be settled by force."
 sb_imperial_confederation.051.d_subject_escape:0 "A participant already brought into the imperial subject structure has broken free again. With British authority visibly reversible, the scheme can no longer credibly promise a controlled confederation."
 sb_imperial_confederation.051.d_economic:0 "A Boer republic has maintained a durable route to a non-British sea outlet. With trade no longer dependent on British corridors, the main instrument of peaceful imperial pressure has failed."
 sb_imperial_confederation.051.d_no_boers:0 "The Boer republics the scheme was meant to bind no longer exist as independent political actors. Confederation has been overtaken by conquest, collapse, or incorporation outside the intended imperial settlement."
 sb_imperial_confederation.051.f:0 "The committee met beneath the same map on which the scheme had first been drawn. Trade bindings, subject arrangements, and constitutional proposals were crossed out one after another until no practical road to confederation remained."
 sb_imperial_confederation.051.f_war:0 "The first wartime telegram reached Whitehall before the confederation papers had been removed from the table. Officials who had promised union by gradual pressure now issued orders for a conflict that admitted the peaceful design had ended."
 sb_imperial_confederation.051.f_subject_escape:0 "News of the escaped subject passed quickly through every capital the scheme still hoped to bind. London could restore flags and treaties later; it could not restore the certainty that imperial subordination, once achieved, was irreversible."
 sb_imperial_confederation.051.f_economic:0 "The thirty-sixth monthly report arrived with another set of freight figures from the non-British port. The republic's merchants had learned the route, its treasury had learned the revenue, and British dependence had become a memory rather than an instrument."
 sb_imperial_confederation.051.f_no_boers:0 "The final memorandum listed no Boer republic left to negotiate into the proposed union. Whitehall's machinery for treaties and gradual autonomy had survived, but the political actors for whom it was built had disappeared."
 sb_imperial_confederation.051.a:0 "The scheme is finished."
