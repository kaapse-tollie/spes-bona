 sb_zulu_drift_mpande_reserved:0 "Mpande's Reserved Court"
 sb_zulu_mpande_transition:0 "Managed Succession"
 # ### TO REVIEW ###
 sb_zulu_dynasty.094.t:0 "Mpande's Last Decision"
 sb_zulu_dynasty.094.d:0 "Mpande's succession settlement has endured long enough for the court to look beyond crisis management. Cetshwayo's faction now expects the king to decide whether the heir should rule in his own name or wait upon his father's caution."
 sb_zulu_dynasty.094.f:0 "Cetshwayo's supporters waited outside the royal enclosure while Mpande conferred with the senior houses. The succession was no longer in doubt; what remained uncertain was whether the old king would choose the moment of transition or force his heir to do so."
 sb_zulu_dynasty.094.a:0 "Step aside for Cetshwayo."
 sb_zulu_dynasty.094.b:0 "Remain on the throne."

 decision_sb_anglo_zulu_ultimatum:0 "Issue the Zulu Ultimatum"
 decision_sb_anglo_zulu_ultimatum_desc:0 "Demand that the Zulu kingdom yield Natal's claimed territory before the frontier crisis hardens into war."
 dp_sb_anglo_zulu_return_state_locked:0 "Anglo-Zulu War"
 dp_sb_anglo_zulu_return_state_locked_desc:0 "Natal presses a locked return-state demand against the Zulu kingdom."
 dp_sb_anglo_zulu_return_state_locked_tooltip:0 "Start the #v Anglo-Zulu War#! as a locked return-state diplomatic play."
 # ### TO REVIEW ###
 sb_anglo_zulu.010.t:0 "Ultimatum to Ulundi"
 sb_anglo_zulu.010.d:0 "Natal's ministers argue that the Zulu kingdom cannot be left as an armed power across the frontier. With colonial administration in place, the claim to Zululand can now be pressed as an imperial demand."
 sb_anglo_zulu.010.f:0 "Natal's ministers revised the ultimatum until every frontier grievance appeared as a condition the Zulu court could scarcely accept. When the document was sealed, the military estimates had already been copied and sent to the officers expected to enforce it."
 sb_anglo_zulu.010.a:0 "Issue the ultimatum."
 # ### TO REVIEW ###
 sb_anglo_zulu.020.t:0 "Zulu Victory on the Frontier"
 sb_anglo_zulu.020.d:0 "The Natal demand has failed. Zulu commanders, regiments, and court factions now draw a clear lesson from the war: survival depends on arms as much as royal legitimacy."
 sb_anglo_zulu.020.f:0 "Captured rifles were carried into the royal enclosure beside shields marked by the fighting. Commanders examined the locks, cartridges, and sights while the court praised the victory, each understanding that surviving the next invasion would require learning from the weapons left by this one."
 sb_anglo_zulu.020.a:0 "The kingdom has endured."
 # ### TO REVIEW ###
 sb_anglo_zulu.030.t:0 "Natal Enforces the Frontier"
 sb_anglo_zulu.030.d:0 "Natal has forced its claim over Zululand. The old frontier question now moves from diplomacy into colonial administration."
 sb_anglo_zulu.030.f:0 "Survey parties followed the advancing administration into Zululand, placing boundary posts where soldiers had marched. Behind them came tax notices and police orders, turning a military victory into a frontier that would now have to be governed every day."
 sb_anglo_zulu.030.a:0 "The pressure is resolved."
 # ### TO REVIEW ###
 sb_anglo_zulu.040.t:0 "Zululand under Natal"
 sb_anglo_zulu.040.d:0 "British victory has placed part of Zululand under direct imperial occupation. Natal Colony already possesses the administration, ports, and frontier offices needed to govern the conquered territory; retaining a separate imperial jurisdiction would divide authority along the same unsettled frontier."
 sb_anglo_zulu.040.f:0 "The military boundary lasted only until the surveyors arrived. Their instructions placed the conquered districts beneath the government at Pietermaritzburg, carrying Natal's administration northward behind the advancing columns."
 sb_anglo_zulu.040.a:0 "Place Zululand under Natal."
 sb_anglo_zulu_040_handoff_tt:0 "All British-held territory in [GetStateRegion('STATE_ZULULAND').GetName] will be transferred to [SCOPE.sCountry('sb_natal_colony_scope').GetName], and [GetStateRegion('STATE_ZULULAND').GetName] will become an Anglo-African [concept_homeland]."

 je_sb_consolidating_gaza_lobby:0 "Soshangane's Gaza kingdom commands the lower Limpopo, Delagoa approaches, and routes north toward Zambezia, but conquest has not yet become settled rule. Bring the conquered districts to order and incorporate Zambezia before the founder leaves power."
 je_sb_consolidating_gaza:0 "Consolidating Gaza"
 je_sb_consolidating_gaza_reason:0 "Soshangane's Gaza kingdom was not a compact homeland, but a military order built by Nguni regiments over Tonga, Shona, Sena, Lacustrine Bantu, and other Mozambican communities. Its authority reaches from the Delagoa approaches toward Zambezia, but many chiefs still read Gaza rule as conquest rather than obligation.\n\nWhile Soshangane remains ruler, settle the Gaza-held districts of Lourenco Marques and Zambezia, and make Zambezia part of the kingdom's regular administration. If the founder departs first, succession will turn local autonomy into open resistance."
 je_sb_consolidating_gaza_status:0 "Complete this by reducing turmoil in the Gaza-held parts of Lourenco Marques and Zambezia until both show no visible unrest, then fully incorporate Gaza-held Zambezia."
 je_sb_consolidating_gaza_complete_lourenco_turmoil_tt:0 "Gaza-held Lourenco Marques has no visible turmoil."
 je_sb_consolidating_gaza_complete_zambezia_turmoil_tt:0 "Gaza-held Zambezia has no visible turmoil."
 je_sb_consolidating_gaza_complete_zambezia_incorporated_tt:0 "Gaza-held Zambezia is fully incorporated."
 je_sb_consolidating_gaza_fail_soshangane_tt:0 "Soshangane is no longer the ruler of Gaza."
 je_sb_consolidating_gaza_invalid_subject_tt:0 "Gaza is no longer independent."
 je_sb_consolidating_gaza_invalid_holdings_tt:0 "Gaza no longer holds land in Lourenco Marques or Zambezia."
 sb_gaza_collectors:0 "Royal Collectors"
 sb_gaza_open_regiments:0 "Opened Regiments"
 sb_gaza_narrow_regiments:0 "Narrow Regimental Core"
 sb_gaza_consolidated_recruitment:0 "Consolidated Gaza Recruitment"
 sb_gaza_local_order:0 "Local Accommodation"
 # ### REVIEWED ###
 sb_gaza.001.t:0 "The Kingdom of the Limpopo"
 sb_gaza.001.d:0 "Soshangane kaZikode Nxumalo rules a kingdom made by migration, war, and tribute. Gaza's Nguni military households command the lower Limpopo and the road toward Delagoa, while northern tributaries link the court to Zambezia and the caravan routes beyond."
 sb_gaza.001.f:0 "\"The king's messengers can reach the coast, the river chiefs, and the road north. Whether those roads carry obedience once the regiments leave is the question before the court.\""
 sb_gaza.001.a:0 "Conquest must become government."
 # ### REVIEWED ###
 sb_gaza.010.t:0 "The Road North"
 sb_gaza.010.d:0 "The Gaza royal kraal has never been fixed ground. Soshangane has moved it before, and the road north toward Musapa stands open. Whether to move the court into Zambezia and bring those tributaries quicker to heel, or to stay on the Limpopo and anchor the states' power on the larger, more prosperous southern half of the kingdom; the choice is his and his alone."
 sb_gaza.010.f:0 "\"The mats came down first, then the posts, then the screens of the inner enclosure. Men who had never seen the inside of the royal household carried the pieces out in careful order, each piece placed where it had always been placed, so that the kraal could be raised again in exactly the same arrangement somewhere else.\n\nMusapa was three weeks north.\""
 sb_gaza.010.a:0 "The court stays on the Limpopo."
 sb_gaza.010.b:0 "March the kraal to Musapa."
 # ### TO REVIEW ###
 sb_gaza.020.t:0 "The Collector's Hand"
 sb_gaza.020.d:0 "Gaza's hold over the conquered districts rests on the memory of its regiments. The court must now decide how to make that authority felt in peacetime: dispatch royal collectors to draw tribute directly from Tonga, Shona and Sena lands, or govern through the chiefs already in place and risk making Gaza look like an army that has gone home."
 sb_gaza.020.f:0 "The royal collector entered the village with armed attendants and an account of cattle owed to the kraal. The local chief offered hospitality, disputed the total, and watched every animal driven away; tribute had been collected, but obedience remained harder to enter in a ledger."
 sb_gaza.020.a:0 "Dispatch the collectors."
 sb_gaza.020.b:0 "Rule through the chiefs."
 # ### REVIEWED ###
 sb_gaza.030.t:0 "Opening the Regiments"
 sb_gaza.030.d:0 "Gaza's regiments were made by war and migration, not by the subject peoples who now live inside the kingdom's reach. Whether to change that, opening the ranks to Tonga, Shona and Sena men and trading a tight Nguni core for a wider army, is a choice the court must now make."
 sb_gaza.030.f:0 "\"The induna counted the men assembled on the parade ground and then counted them again. Almost half were Tonga. He did not say anything.\nThe king had asked for more men, and more men had come.\""
 sb_gaza.030.a:0 "Open the regiments."
 sb_gaza.030.b:0 "Keep the regimental core narrow."
 # ### TO REVIEW ###
 sb_gaza.040.t:0 "Guns on the Caravan Road"
 sb_gaza.040.d:0 "Portuguese posts and caravan routes carry cloth, ivory, powder, and muskets through Gaza's frontier. Raiding those routes could fill our coffers and arm the regiments quickly, but the coast will remember who made commerce unsafe."
 sb_gaza.040.f:0 "Ivory, cloth, powder, and muskets moved together along the caravan road beneath Portuguese papers. Gaza scouts could seize the loads before sunset; the court also knew that tomorrow's traders would arrive with guards, demands, or not at all."
 sb_gaza.040.a:0 "Raid the trade routes."
 sb_gaza.040.b:0 "Keep the routes open."
 # ### REVIEWED ###
 sb_gaza.090.t:0 "The Tributaries Bound"
 sb_gaza.090.d:0 "The work of consolidation is finished, all now bow to Soshangane's name. The court now has room to decide what the kingdom becomes, whether to govern through the tributary chiefs already in place, or to bind the kingdom more tightly to the central kraal."
 sb_gaza.090.f:0 "\"A tributary who sends cattle obeys for a season. A tributary who sends sons has already accepted a different future.\""
 sb_gaza.090.a:0 "Govern through tributary chiefs."
 sb_gaza.090.b:0 "Bind the kingdom through the regiments."
 # ### TO REVIEW ###
 sb_gaza.095.t:0 "The Cord Breaks"
 sb_gaza.095.d:0 "Soshangane no longer commands the Gaza kingdom, and the conquered districts have not been folded into regular Nguni rule. Chiefs who once submitted to the founder's strength now openly ask whether his successors can compel the same obedience."
 sb_gaza.095.f:0 "In districts where Soshangane's messengers had once been obeyed at once, chiefs delayed the tribute and asked which regiments would come to collect it. The roads still connected the kingdom, but fewer men along them now acted as though the royal kraal stood near."
 sb_gaza.095.a:0 "His mighty work may come undone..."

 sb_mozambique_company_charter_slot:0 "Mozambique Company Charter"
 sb_mozambique_company_charter_slot_desc:0 "The $company_mozambique_company$'s administration of Mozambique reserves an additional company slot for its chartering country."
 decision_sb_transfer_mozambique_to_company_rule:0 "Transfer Mozambique to Company Rule"
 decision_sb_transfer_mozambique_to_company_rule_desc:0 "Entrust our Mozambican possessions and claims to the $company_mozambique_company$, converting its commercial privileges into a territorial charter."
 decision_sb_transfer_mozambique_to_company_rule_effect_tt:0 "The existing $company_mozambique_company$ retains its headquarters, assets, establishment date, and prosperity.\n\n#bold Company rule:#! Create $MZQ$ as a #v Chartered Company#! and transfer all directly owned territory and claims in [GetStateRegion('STATE_MOCAMBIQUE').GetName], [GetStateRegion('STATE_ZAMBEZIA').GetName], and [GetStateRegion('STATE_LOURENCO_MARQUES').GetName] to its administration.\n\n#bold Chartering country:#! Gains #p +1#! maximum [Concept('concept_company', '$concept_companies$')] while the charter remains in force."

 je_sb_delagoa_route_to_sea:0 "Delagoa Route to the Sea"
 je_sb_delagoa_route_to_sea_reason:0 "The Transvaal interior is landlocked, and its commerce must presently follow long wagon roads or pass through British ports. East of the escarpment, [GetStateRegion('STATE_LOURENCO_MARQUES').GetName] offers an Indian Ocean outlet beyond Britain's customs houses.\n\nRails laid across the three Transvaal districts can bind the republic to Delagoa Bay. Steel alone, however, cannot open the route: the power leading the port's [Concept('concept_market', '$concept_market$')] must grant the republic's traffic passage."
 je_sb_delagoa_route_to_sea_status:0 "Complete the railway to Delagoa Bay and secure passage through the [Concept('concept_market', '$concept_market$')] containing [GetStateRegion('STATE_LOURENCO_MARQUES').GetName]."
 sb_delagoa_transvaal_railway_complete_tt:0 "[GetStateRegion('STATE_TRANSVAAL').GetName] has an operational $building_railway$."
 sb_delagoa_east_transvaal_railway_complete_tt:0 "[GetStateRegion('STATE_EAST_TRANSVAAL').GetName] has an operational $building_railway$."
 sb_delagoa_northern_transvaal_railway_complete_tt:0 "[GetStateRegion('STATE_NORTHERN_TRANSVAAL').GetName] has an operational $building_railway$."
 sb_delagoa_market_leader_transit_complete_tt:0 "[ROOT.GetCountry.GetName] has $transit_rights$ through the leader of the [Concept('concept_market', '$concept_market$')] containing [GetStateRegion('STATE_LOURENCO_MARQUES').GetName]."
 sb_delagoa_import_advantage:0 "Delagoa Import Route"
 sb_delagoa_port_gateway:0 "Delagoa Gateway"
 # ### TO REVIEW ###
 sb_delagoa.010.t:0 "Passage to Delagoa Bay"
 sb_delagoa.010.d:0 "Railways now cross the Transvaal toward [GetStateRegion('STATE_LOURENCO_MARQUES').GetName], whose port belongs to our market. The Boer republic asks that its freight be allowed to pass through that outlet, promising new traffic for Delagoa Bay while drawing inland commerce away from British harbours."
 sb_delagoa.010.f:0 "Engineers compared gradients and bridgeworks while merchants compared tariffs. The rails had fixed the direction of the route; diplomacy would decide whether the trains could use it."
 sb_delagoa.010.a:0 "Open the route."
 sb_delagoa.010.b:0 "Refuse the arrangement."
 sb_delagoa_010_accept_tt:0 "Creates a 25-year trade-through treaty with Transvaal, including #v 10#! merchant marine support."
 sb_delagoa_010_reject_tt:0 "Relations with Transvaal worsen by #v 25#!. The AI helper will not ask again."
 # ### TO REVIEW ###
 sb_delagoa.020.t:0 "A Road to the Sea"
 sb_delagoa.020.d:0 "The republic's railways now meet the eastern line through [GetStateRegion('STATE_LOURENCO_MARQUES').GetName]. With passage to Delagoa Bay secured, freight can reach the coast without passing through British ports."
 sb_delagoa.020.f:0 "'One of my fondest wishes was at last effected. The railway to Delagoa Bay was solemnly opened at Pretoria.'\n— Paul Kruger, #italic Memoirs#!"
 sb_delagoa.020.a:0 "At last, the sea."
 # ### TO REVIEW ###
 sb_delagoa.021.t:0 "Pretoria Opens the Route"
 sb_delagoa.021.d:0 "The Transvaal route has brought Boer traffic toward Lourenco Marques. The port's position as an outlet for the interior now strengthens the local market."
 sb_delagoa.021.f:0 "At Lourenco Marques, dockworkers unloaded goods consigned to firms beyond the Transvaal frontier. Warehouses expanded along the line, customs receipts rose, and a port once facing chiefly outward began to draw the inland economy toward itself."
 sb_delagoa.021.a:0 "Develop the corridor."

