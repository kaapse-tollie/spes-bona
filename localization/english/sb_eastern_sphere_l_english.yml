l_english:
 sb_imperial_confederation.001.t:0 "The Confederation Question"
 sb_imperial_confederation.001.d:0 "The growth of separate Boer republics has forced Britain to consider a more deliberate policy for the South African interior. Trade, recognition, and colonial authority are now being discussed as tools for keeping the inland republics inside an imperial system."
 sb_imperial_confederation.001.f:0 "\"The Boers might call it independence; in London it is more often called a problem of routes, ports, and influence.\""
 sb_imperial_confederation.001.a:0 "The scheme takes shape."
 MZQ:0 "Mozambique Company"
 MZQ_ADJ:0 "Mozambican"
 dyn_c_sb_mozambique_company:0 "Mozambique Company"
 dyn_c_sb_mozambique_company_adj:0 "Mozambican"
 dyn_c_sb_portuguese_mozambique:0 "Portuguese Mozambique"
 dyn_c_sb_portuguese_mozambique_adj:0 "Portuguese Mozambican"

 sb_zulu_drift_mpande_reserved:0 "Mpande's Reserved Court"
 sb_zulu_mpande_transition:0 "Managed Succession"
 sb_zulu_dynasty.093.b:0 "Back Cetshwayo."
 sb_zulu_dynasty.093.c:0 "Back Mbuyazi."
 sb_zulu_dynasty.094.t:0 "Mpande's Last Decision"
 sb_zulu_dynasty.094.d:0 "Mpande's succession settlement has endured long enough for the court to look beyond crisis management. Cetshwayo's faction now expects the king to decide whether the heir should rule in his own name or wait upon his father's caution."
 sb_zulu_dynasty.094.f:0 "\"A king may choose a son. He may also choose the hour at which that son becomes king.\""
 sb_zulu_dynasty.094.a:0 "Step aside for Cetshwayo."
 sb_zulu_dynasty.094.b:0 "Remain on the throne."

 decision_sb_anglo_zulu_ultimatum:0 "Issue the Zulu Ultimatum"
 decision_sb_anglo_zulu_ultimatum_desc:0 "Demand that the Zulu kingdom yield Natal's claimed territory before the frontier crisis hardens into war."
 dp_sb_anglo_zulu_return_state_locked:0 "Anglo-Zulu War"
 dp_sb_anglo_zulu_return_state_locked_desc:0 "Natal presses a locked return-state demand against the Zulu kingdom."
 dp_sb_anglo_zulu_return_state_locked_tooltip:0 "Start the #v Anglo-Zulu War#! as a locked return-state diplomatic play."
 sb_anglo_zulu.010.t:0 "Ultimatum to Ulundi"
 sb_anglo_zulu.010.d:0 "Natal's ministers argue that the Zulu kingdom cannot be left as an armed power across the frontier. With colonial administration in place, the claim to Zululand can now be pressed as an imperial demand."
 sb_anglo_zulu.010.f:0 "\"The question is no longer whether Ulundi disputes our border, but whether the border may exist under arms at all.\""
 sb_anglo_zulu.010.a:0 "Issue the ultimatum."
 sb_anglo_zulu.010.b:0 "Hold back for now."
 sb_anglo_zulu.020.t:0 "Zulu Victory on the Frontier"
 sb_anglo_zulu.020.d:0 "The Natal demand has failed. Zulu commanders, regiments, and court factions now draw a clear lesson from the war: survival depends on arms as much as royal legitimacy."
 sb_anglo_zulu.020.f:0 "\"The rifles taken after battle speak more plainly than any envoy.\""
 sb_anglo_zulu.020.a:0 "The kingdom has endured."
 sb_anglo_zulu.030.t:0 "Natal Enforces the Frontier"
 sb_anglo_zulu.030.d:0 "Natal has forced its claim over Zululand. The old frontier question now moves from diplomacy into colonial administration."
 sb_anglo_zulu.030.f:0 "\"A frontier settled by war rarely stays quiet, but it is settled all the same.\""
 sb_anglo_zulu.030.a:0 "The pressure is resolved."

 je_sb_consolidating_gaza_lobby:0 "Soshangane's Gaza kingdom commands the lower Limpopo, Delagoa approaches, and routes north toward Zambezia, but conquest has not yet become settled rule. Bring the conquered districts to order and incorporate Zambezia before the founder leaves power."
 je_sb_consolidating_gaza:0 "Consolidating Gaza"
 je_sb_consolidating_gaza_reason:0 "Soshangane's Gaza kingdom was not a compact homeland, but a military order built by Nguni regiments over Tonga, Shona, Sena, Lacustrine Bantu, and other Mozambican communities. Its authority reaches from the Delagoa approaches toward Zambezia, but many chiefs still read Gaza rule as conquest rather than obligation.\n\nWhile Soshangane remains ruler, settle the Gaza-held districts of Lourenco Marques and Zambezia, and make Zambezia part of the kingdom's regular administration. If the founder departs first, succession will turn local autonomy into open resistance."
 je_sb_consolidating_gaza_status:0 "Complete this by reducing turmoil in the Gaza-held parts of Lourenco Marques and Zambezia until both show no visible unrest, then fully incorporate Gaza-held Zambezia."
 je_sb_consolidating_gaza_complete_lourenco_turmoil_tt:0 "Gaza-held Lourenco Marques has no visible turmoil."
 je_sb_consolidating_gaza_complete_zambezia_turmoil_tt:0 "Gaza-held Zambezia has no visible turmoil."
 je_sb_consolidating_gaza_complete_zambezia_incorporated_tt:0 "Gaza-held Zambezia is fully incorporated."
 je_sb_consolidating_gaza_fail_soshangane_tt:0 "Soshangane is no longer the ruler of Gaza."
 je_sb_consolidating_gaza_invalid_subject_tt:0 "Gaza is no longer independent."
 je_sb_consolidating_gaza_invalid_holdings_tt:0 "Gaza no longer holds land in Lourenco Marques or Zambezia."
 sb_gaza_collectors:0 "Royal Collectors"
 sb_gaza_open_regiments:0 "Opened Regiments"
 sb_gaza_narrow_regiments:0 "Narrow Regimental Core"
 sb_gaza_consolidated_recruitment:0 "Consolidated Gaza Recruitment"
 sb_gaza_local_order:0 "Local Accommodation"
 sb_gaza.001.t:0 "The Kingdom of the Limpopo"
 sb_gaza.001.d:0 "Soshangane kaZikode Nxumalo rules a kingdom made by migration, war, and tribute. Gaza's Nguni military households command the lower Limpopo and the road toward Delagoa, while northern tributaries link the court to Zambezia and the caravan routes beyond."
 sb_gaza.001.f:0 "\"The king's messengers can reach the coast, the river chiefs, and the road north. Whether those roads carry obedience once the regiments leave is the question before the court.\""
 sb_gaza.001.a:0 "Conquest must become government."
 sb_gaza.010.t:0 "The Road North"
 sb_gaza.010.d:0 "The Gaza royal kraal has never been fixed ground. Soshangane has moved it before, and the road north toward Musapa stands open. Whether to move the court into Zambezia and bring those tributaries quicker to heel, or to stay on the Limpopo and anchor the states' power on the larger, more prosperous southern half of the kingdom; the choice is his and his alone."
 sb_gaza.010.f:0 "\"The mats came down first, then the posts, then the screens of the inner enclosure. Men who had never seen the inside of the royal household carried the pieces out in careful order, each piece placed where it had always been placed, so that the kraal could be raised again in exactly the same arrangement somewhere else.\n\nMusapa was three weeks north.\""
 sb_gaza.010.a:0 "The court stays on the Limpopo."
 sb_gaza.010.b:0 "March the kraal to Musapa."
 sb_gaza.020.t:0 "The Collector's Hand"
 sb_gaza.020.d:0 "Gaza's hold over the conquered districts rests on the memory of its regiments. The court must now decide how to make that authority felt in peacetime: dispatch royal collectors to draw tribute directly from Tonga, Shona and Sena lands, or govern through the chiefs already in place and risk making Gaza look like an army that has gone home."
 sb_gaza.020.f:0 "\"The collector counts cattle. The chief counts insults. Both remember the total.\""
 sb_gaza.020.a:0 "Dispatch the collectors."
 sb_gaza.020.b:0 "Rule through the chiefs."
 sb_gaza.030.t:0 "Opening the Regiments"
 sb_gaza.030.d:0 "Gaza's regiments were made by war and migration, not by the subject peoples who now live inside the kingdom's reach. Whether to change that, opening the ranks to Tonga, Shona and Sena men and trading a tight Nguni core for a wider army, is a choice the court must now make."
 sb_gaza.030.f:0 "\"The induna counted the men assembled on the parade ground and then counted them again. Almost half were Tonga. He did not say anything.\nThe king had asked for more men, and more men had come.\""
 sb_gaza.030.a:0 "Open the regiments."
 sb_gaza.030.b:0 "Keep the regimental core narrow."
 sb_gaza.040.t:0 "Guns on the Caravan Road"
 sb_gaza.040.d:0 "Portuguese posts and caravan routes carry cloth, ivory, powder, and muskets through Gaza's frontier. Raiding those routes could fill our coffers and arm the regiments quickly, but the coast will remember who made commerce unsafe."
 sb_gaza.040.f:0 "\"A musket taken on the road may win one battle. The trader it was taken from may cost ten more.\""
 sb_gaza.040.a:0 "Raid the trade routes."
 sb_gaza.040.b:0 "Keep the routes open."
 sb_gaza.090.t:0 "The Tributaries Bound"
 sb_gaza.090.d:0 "The work of consolidation is finished, all now bow to Soshangane's name. The court now has room to decide what the kingdom becomes, whether to govern through the tributary chiefs already in place, or to bind the kingdom more tightly to the central kraal."
 sb_gaza.090.f:0 "\"A tributary who sends cattle obeys for a season. A tributary who sends sons has already accepted a different future.\""
 sb_gaza.090.a:0 "Govern through tributary chiefs."
 sb_gaza.090.b:0 "Bind the kingdom through the regiments."
 sb_gaza.095.t:0 "The Cord Breaks"
 sb_gaza.095.d:0 "Soshangane no longer commands the Gaza kingdom. The conquered districts have not been folded under Nguni regular rule. The Chiefs who had once submitted in fear to the might of Soshangane founder now openly speak about whether his successors can compel the same obedience."
 sb_gaza.095.f:0 "\"A kingdom may cross a river quickly. It does not rule the far bank so easily.\""
 sb_gaza.095.a:0 "His mighty work may come undone..."

 sb_mozambique_company.010.t:0 "The Mozambique Administration"
 sb_mozambique_company.010.d:0 "Portugal now controls the Mozambican coast and interior from Lourenco Marques to Mozambique. Lisbon must decide whether this southern African administration will be run as a company, a mission field, a settler colony, or an extractive regime."
 sb_mozambique_company.010.f:0 "\"A colony on paper still needs an office, a road, a port, and a method of extracting obedience.\""
 sb_mozambique_company.010.a:0 "Commerce and private enterprise."
 sb_mozambique_company.010.b:0 "Missions and schools."
 sb_mozambique_company.010.c:0 "Settlement campaigns."
 sb_mozambique_company.010.e:0 "Ruthless extraction."
 sb_mozambique_company_010_company_tt:0 "Creates #v $MZQ$#! as a chartered company and applies the vanilla commerce/private-enterprise colonial package."
 sb_mozambique_company_010_mission_tt:0 "Creates #v $MZQ$#! as a colony and applies the vanilla mission administration package."
 sb_mozambique_company_010_settler_tt:0 "Creates #v $MZQ$#! as a colony and applies the vanilla settler-colony package."
 sb_mozambique_company_010_extraction_tt:0 "Creates #v $MZQ$#! as a colony and applies the vanilla ruthless extraction package."

 je_sb_delagoa_route_to_sea:0 "Delagoa Route to the Sea"
 je_sb_delagoa_route_to_sea_reason:0 "Transvaal can loosen British control over Boer trade by building railways to Pretoria and the East Transvaal, then securing transit through Portuguese Lourenco Marques."
 je_sb_delagoa_route_to_sea_status:0 "Build railways in Transvaal and East Transvaal, then secure trade-through rights with Portugal or Portuguese Mozambique."
 sb_delagoa_route_opened:0 "Delagoa Route Opened"
 sb_delagoa_port_gateway:0 "Delagoa Gateway"
 sb_delagoa_railway_link:0 "Delagoa Railway Link"
 sb_delagoa.010.t:0 "Pretoria Seeks Delagoa Bay"
 sb_delagoa.010.d:0 "The Transvaal has built the railway base needed for a route to Lourenco Marques. A transit agreement would pull Boer trade toward Delagoa Bay and make the port more valuable."
 sb_delagoa.010.f:0 "\"The rails end inland for now, but the map already points to the sea.\""
 sb_delagoa.010.a:0 "Open the route."
 sb_delagoa.010.b:0 "Refuse the arrangement."
 sb_delagoa_010_accept_tt:0 "Creates a 25-year trade-through treaty with Transvaal, including #v 10#! merchant marine support."
 sb_delagoa_010_reject_tt:0 "Relations with Transvaal worsen by #v 25#!. The AI helper will not ask again."
 sb_delagoa.020.t:0 "A Road to the Sea"
 sb_delagoa.020.d:0 "The Delagoa route is open. Transvaal commerce can now move through Lourenco Marques instead of depending entirely on British-controlled corridors."
 sb_delagoa.020.f:0 "\"For Pretoria, the sea was no longer only a British horizon.\""
 sb_delagoa.020.a:0 "The route is secured."
 sb_delagoa.021.t:0 "Pretoria Opens the Route"
 sb_delagoa.021.d:0 "The Transvaal route has brought Boer traffic toward Lourenco Marques. Ports, trade centers, and railways along the corridor stand to benefit."
 sb_delagoa.021.f:0 "\"A railway does not need to own the sea to change who profits from it.\""
 sb_delagoa.021.a:0 "Develop the corridor."

 je_sb_imperial_confederation_scheme_lobby:0 "Britain can bind Boer and colonial participants into an imperial trade network, then attempt an early South African confederation once the network has been brought under British authority."
 je_sb_imperial_confederation_scheme:0 "Southern African Imperial Confederation Scheme"
 je_sb_imperial_confederation_scheme_reason:0 "Britain can bind the Boer republics economically, then confederate British subject territories into a decentralized South African union. The subject-control bar counts each Boer or Anglo-African participant that has been reduced to a level-one subject under Britain. The sea-access bar counts cumulative months of durable Boer access to a non-British port."
 je_sb_imperial_confederation_scheme_status:0 "Confederation requires every Boer or Anglo-African participant to be a level-one subject under Britain, and at least two participants must each fully control a Southern African state. The highest-GDP eligible participant will form the institutional base of South Africa. The entry closes when South Africa exists, and fails if a bound subject breaks free, the Boer republics are destroyed, maintain non-British sea access for three years, or Britain enters a war against a participant."
 je_sb_imperial_confederation_scheme_imperial_victory:0 "To achieve an #b Imperial Confederation#! victory:\n"
 je_sb_imperial_confederation_scheme_failure:0 "To cause the #b Confederation Scheme#! to fail:\n"
 je_sb_imperial_confederation_success_confederate_tt:0 "Form South Africa through the confederation button after reducing all participants to level-one British subjects."
 je_sb_imperial_confederation_failure_sea_access_tt:0 "Boer republics have maintained durable non-British sea access for three years."
 je_sb_imperial_confederation_failure_terminal_tt:0 "The confederation scheme has entered a terminal failure state."
 je_sb_imperial_confederation_failure_no_boers_tt:0 "No live Boer republic remains to confederate."
 je_sb_imperial_confederation_failure_british_war_tt:0 "Britain is at war with an Imperial Confederation participant."
 je_sb_imperial_confederation_failure_subject_escape_tt:0 "A participant already brought under British subject control has become independent again."
 je_sb_imperial_confederation_bind_trade_button:0 "Bind Trade"
 je_sb_imperial_confederation_bind_trade_button_desc:0 "Renew five-year imperial trade bindings with independent participants. This creates or refreshes treaty access; subject control still depends on later imperial pressure."
 je_sb_imperial_confederation_bind_trade_possible_tt:0 "At least one independent Boer or Anglo-African participant lacks a current five-year imperial trade binding."
 je_sb_imperial_confederation_form_saf_button:0 "Confederate South Africa"
 je_sb_imperial_confederation_form_saf_button_desc:0 "Form the Confederated States of Southern Africa from level-one British subject territories. The eligible participant with the highest GDP becomes the institutional base of the new union."
 je_sb_imperial_confederation_form_british_cape_tt:0 "If Britain presses the button, Cape Colony must exist as a British subject."
 je_sb_imperial_confederation_form_level_1_subjects_tt:0 "Every Boer or Anglo-African participant must be a level-one subject under Britain: Colony, Puppet, Crown Land, Vassal, Responsible Colony, or Confederal Partner."
 je_sb_imperial_confederation_form_state_owners_tt:0 "At least two separate participant tags must each fully control a Southern African state."
 sb_imperial_confederation_subject_control_bar:0 "Subject Control"
 sb_imperial_confederation_subject_control_bar_low:0 "Subject control: [GetGlobalVariable('sb_imperial_confederation_subject_control_count_var').GetValue|v0]/[GetGlobalVariable('sb_imperial_confederation_subject_control_total_var').GetValue|v0]"
 sb_imperial_confederation_subject_control_bar_high:0 "All participants controlled"
 sb_imperial_confederation_sea_access_bar:0 "Sea Access Timer"
 sb_imperial_confederation_sea_access_bar_safe:0 "No non-British sea route"
 sb_imperial_confederation_boer_sea_access_drift:0 "+1 month: non-British sea route"
 sb_imperial_confederation_no_boer_sea_access_drift:0 "Timer reset: no sea route"
 sb_imperial_confederation_ignored_delagoa:0 "Ignored Boer Sea Access"
 sb_boer_blossoming_nationhood:0 "Blossoming Nationhood"
 sb_boer_blossoming_nationhood_desc:0 "The failure of Britain's confederation scheme has hardened a distinct Boer political identity and a stronger will to resist outside leverage."
 sb_imperial_confederation_failed_prestige:0 "Confederation Scheme Failed"
 sb_imperial_confederation_failed_prestige_desc:0 "Britain's attempt to bind Southern Africa into a peaceful imperial confederation has collapsed."
 je_sb_confederate_southern_africa:0 "Confederate Southern Africa"
 je_sb_confederate_southern_africa_reason:0 "The Confederated States of Southern Africa can consolidate British-network territories into one colonial federation. Multi-region subjects only transfer their Southern African states."
 je_sb_confederate_southern_africa_status:0 "Use the confederation button to integrate eligible Southern African British-network states and subjects. The entry completes once the Confederated States controls the full Southern African region."
 je_sb_confederate_southern_africa_button:0 "Expand the Confederation"
 je_sb_confederate_southern_africa_button_desc:0 "Integrate one eligible Southern African British-network territory or subject into the Confederated States of Southern Africa."
 je_sb_confederate_southern_africa_button_possible_tt:0 "At least one eligible Southern African British-network territory or subject remains outside the Confederated States."
 je_sb_confederate_southern_africa_button_effect_tt:0 "A direct British Southern African state is transferred first. Otherwise, an eligible level-one British-network subject is integrated; if that subject spans multiple regions, only one Southern African state is transferred."
 je_sb_confederate_southern_africa_complete_tt:0 "The Confederated States of Southern Africa controls the Southern African region."
 sb_confederated_south_africa_unified:0 "Confederated Southern Africa"
 sb_confederated_south_africa_unified_desc:0 "Southern Africa has been consolidated into a decentralized imperial confederation."
 sb_gbr_unified_southern_africa:0 "Southern African Confederation"
 sb_gbr_unified_southern_africa_desc:0 "Britain has overseen the peaceful confederation of its Southern African network."
 sb_imperial_confederation.030.t:0 "Boer Access to Delagoa"
 sb_imperial_confederation.030.d:0 "Transvaal has built its own foothold at Lourenco Marques, bypassing the imperial trade network. London must decide whether to defend Portuguese claims, demand submission, or absorb the diplomatic cost."
 sb_imperial_confederation.030.f:0 "\"A Boer port was not merely a customs matter. It was a route around British leverage.\""
 sb_imperial_confederation.030.a:0 "Demand relinquishment to Portugal."
 sb_imperial_confederation.030.b:0 "Demand vassalisation."
 sb_imperial_confederation.030.c:0 "Ignore the matter."
 sb_imperial_confederation_030_relinquish_tt:0 "Transvaal receives an ultimatum to hand its Lourenco Marques holdings to Portugal."
 sb_imperial_confederation_030_vassalize_tt:0 "Britain starts a diplomatic play to make Transvaal a protectorate."
 sb_imperial_confederation.031.t:0 "London Demands Delagoa"
 sb_imperial_confederation.031.d:0 "Britain has demanded that Transvaal relinquish Lourenco Marques to Portugal. Refusal will turn the port question into a wider imperial crisis."
 sb_imperial_confederation.031.f:0 "\"The coast was only a strip of land until the great powers began counting railways.\""
 sb_imperial_confederation.031.a:0 "Back down."
 sb_imperial_confederation.031.b:0 "Refuse."
 sb_imperial_confederation_031_back_down_tt:0 "Portugal gains Transvaal-controlled Lourenco Marques land."
 sb_imperial_confederation_031_refuse_tt:0 "Portugal starts a return-state play and Britain backs Portugal with a protectorate demand where valid."
 sb_imperial_confederation.040.t:0 "Natal Accelerates the Frontier"
 sb_imperial_confederation.040.d:0 "Boer trade through Zululand threatens the imperial trade scheme. Natal has been pushed toward a faster ultimatum against the Zulu kingdom."
 sb_imperial_confederation.040.f:0 "\"Trade routes made quiet frontiers loud.\""
 sb_imperial_confederation.040.a:0 "The pressure rises."
 sb_imperial_confederation.050.t:0 "A Boer Route to the Sea"
 sb_imperial_confederation.050.d:0 "A Boer republic has secured access to a non-British sea route. Britain has three years to reverse the corridor, restore imperial leverage, or accept that the confederation scheme is losing its main instrument of pressure."
 sb_imperial_confederation.050.f:0 "\"A railway, a port, or a treaty could undo what proclamations had tried to bind.\""
 sb_imperial_confederation.050.a:0 "The clock is now running."
 sb_imperial_confederation.051.t:0 "The Confederation Scheme Fails"
 sb_imperial_confederation.051.d:0 "The imperial confederation scheme has collapsed. Either a bound subject has broken free, the Boer republics no longer remain as republics to bind, their trade can now reach the sea without depending on British corridors, or Britain has abandoned the peaceful route for war."
 sb_imperial_confederation.051.d_war:0 "Britain has entered open war against a republic the confederation scheme was meant to bind peacefully. The project can no longer be presented as a gradual federation under imperial supervision; the Southern African question will now be settled by force."
 sb_imperial_confederation.051.d_subject_escape:0 "A participant already brought into the imperial subject structure has broken free again. With British authority visibly reversible, the scheme can no longer credibly promise a controlled confederation."
 sb_imperial_confederation.051.d_economic:0 "A Boer republic has maintained a durable route to a non-British sea outlet. With trade no longer dependent on British corridors, the main instrument of peaceful imperial pressure has failed."
 sb_imperial_confederation.051.d_no_boers:0 "The Boer republics the scheme was meant to bind no longer exist as independent political actors. Confederation has been overtaken by conquest, collapse, or incorporation outside the intended imperial settlement."
 sb_imperial_confederation.051.f:0 "\"Confederation required dependence before it could promise union. Without dependence, the scheme had no hinge.\""
 sb_imperial_confederation.051.f_war:0 "\"A confederation imposed by ultimatum had become a war in all but name. Once the guns opened, the scheme was finished.\""
 sb_imperial_confederation.051.f_subject_escape:0 "\"A bond that could be broken once could be broken again; London had lost the certainty on which the whole design depended.\""
 sb_imperial_confederation.051.f_economic:0 "\"A railway, a port, or a treaty could do what armies had not: make the republics look outward instead of south.\""
 sb_imperial_confederation.051.f_no_boers:0 "\"The map still had frontiers, but not the republics Whitehall had meant to draw into union.\""
 sb_imperial_confederation.051.a:0 "The scheme is finished."
