l_english:
 # ### TO REVIEW ###
 sb_imperial_confederation.001.t:0 "The Confederation Question"
 sb_imperial_confederation.001.d:0 "The growth of separate Boer republics has forced Britain to consider a more deliberate policy for the Southern African interior. Trade, recognition, and colonial authority are now being discussed as tools for keeping the inland republics inside an imperial system."
 sb_imperial_confederation.001.f:0 "Across the Whitehall table lay conventions, customs returns, port charts, and a map crowded with small republics. The officials drafting the scheme spoke less about conquest than connection: which road carried Boer goods, which harbour received them, and whose authority stood at either end."
 sb_imperial_confederation.001.a:0 "The scheme takes shape."
 MZQ:0 "Mozambique Company"
 MZQ_ADJ:0 "Mozambican"
