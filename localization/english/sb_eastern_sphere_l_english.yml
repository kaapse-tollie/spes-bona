 je_sb_imperial_confederation_form_saf_button_desc:0 "Form the Confederated States of Southern Africa from level-one British subject territories. The eligible participant with the highest GDP becomes the institutional base of the new union."
 je_sb_imperial_confederation_form_british_cape_tt:0 "If Britain presses the button, Cape Colony must exist as a British subject."
