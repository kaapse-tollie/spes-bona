 # ### TO REVIEW ###
 decision_sb_transfer_zululand_to_natal_colony:0 "Settle Conquered Zululand"
 decision_sb_transfer_zululand_to_natal_colony_desc:0 "Convene the postwar settlement for Britain's conquered Zulu territory, choosing whether to place Zululand as a protectorate beneath Natal Colony or retain it under direct imperial administration."
 decision_sb_transfer_zululand_to_natal_colony_tt:0 "Open the imperial settlement of conquered [GetStateRegion('STATE_ZULULAND').GetName]. Britain may restore the complete state as a Zulu [concept_protectorate] beneath Natal or annex it under direct imperial rule."

 # ### TO REVIEW ###
 sb_anglo_zulu.020.t:0 "Britain Turned Back"
 sb_anglo_zulu.020.d:0 "Britain's attempt to annex the kingdom has failed, leaving [ROOT.GetCountry.GetName] intact beyond the Tugela. Whether the redcoats withdrew before an ultimatum became war or broke on the field, the court and regiments take the same lesson from the crisis: future survival will rest as much on modern firearms as on the old muster."
 sb_anglo_zulu.020.f:0 "At the royal enclosure, messengers from the Tugela drift laid down their staffs beside the commanders' shields. Across the river, the British columns had gone—driven off or recalled—yet no induna mistook the respite for safety. Around the armouries, young men turned imported rifles over in their hands, testing sights and locks and measuring how far a cartridge could reach before the assegai ever closed."
 sb_anglo_zulu.020.a:0 "The kingdom has endured."

# ### TO REVIEW ###
 je_sb_consolidating_gaza_lobby:0 "Soshangane's Gaza kingdom commands the lower Limpopo, Delagoa approaches, and routes north towards Zambezia, but conquest has not yet become settled rule. Bring the conquered districts to order and incorporate Zambezia before the founder leaves power."
 je_sb_consolidating_gaza:0 "Consolidating Gaza"
 je_sb_consolidating_gaza_reason:0 "Soshangane's Gaza kingdom was not a compact homeland, but a military order built by Nguni regiments over Tsonga, Tonga, Shona, Sena, and neighbouring Mozambican communities. Its authority reaches from the Delagoa approaches towards [GetStateRegion('STATE_ZAMBEZIA').GetName], yet many chiefs still read Gaza rule as conquest rather than obligation.\n\nWhile Soshangane remains ruler, settle the Gaza-held districts of [GetStateRegion('STATE_LOURENCO_MARQUES').GetName] and [GetStateRegion('STATE_ZAMBEZIA').GetName], and incorporate [GetStateRegion('STATE_ZAMBEZIA').GetName] into the kingdom's regular administration. If the founder departs first, succession will turn local autonomy into open resistance."
 je_sb_consolidating_gaza_status:0 "Reduce [concept_turmoil] below #v 25%#! in Gaza-held [GetStateRegion('STATE_LOURENCO_MARQUES').GetName] and [GetStateRegion('STATE_ZAMBEZIA').GetName], and fully incorporate Gaza-held [GetStateRegion('STATE_ZAMBEZIA').GetName]."
 je_sb_consolidating_gaza_complete_lourenco_turmoil_tt:0 "Gaza-held [GetStateRegion('STATE_LOURENCO_MARQUES').GetName] has [concept_turmoil] below #v 25%#!."
 je_sb_consolidating_gaza_complete_zambezia_turmoil_tt:0 "Gaza-held [GetStateRegion('STATE_ZAMBEZIA').GetName] has [concept_turmoil] below #v 25%#!."
 je_sb_consolidating_gaza_complete_zambezia_incorporated_tt:0 "Gaza-held [GetStateRegion('STATE_ZAMBEZIA').GetName] is fully incorporated."
 event_effects_sb_gaza.090_tt:0 "$event_effect_choose_one$ #indent_newline:3 \n• Govern through the tributary chiefs: #p 10%#! of non-Nguni [Concept('concept_pop', '$concept_pops|q$')] in [GetStateRegion('STATE_LOURENCO_MARQUES').GetName] and [GetStateRegion('STATE_ZAMBEZIA').GetName] become more [concept_loyalist]\n• Bind the kingdom through the regiments: gain the permanent [GetStaticModifier('sb_gaza_consolidated_recruitment').GetName] modifier, while #n 10%#! of non-Nguni [Concept('concept_pop', '$concept_pops|q$')] in both states become more [concept_radical]#!"
 event_effects_sb_gaza.095_tt:0 "#n 50%#! of non-Nguni [Concept('concept_pop', '$concept_pops|q$')] in [GetStateRegion('STATE_LOURENCO_MARQUES').GetName] and [GetStateRegion('STATE_ZAMBEZIA').GetName] become more [concept_radical]."
 je_sb_consolidating_gaza_fail_soshangane_tt:0 "Soshangane is no longer the ruler of [ROOT.GetCountry.GetName]."
 je_sb_consolidating_gaza_invalid_subject_tt:0 "[ROOT.GetCountry.GetName] is no longer independent."
 je_sb_consolidating_gaza_invalid_holdings_tt:0 "[ROOT.GetCountry.GetName] no longer holds land in [GetStateRegion('STATE_LOURENCO_MARQUES').GetName] or [GetStateRegion('STATE_ZAMBEZIA').GetName]."
 sb_gaza_collectors:0 "Royal Collectors"
 sb_gaza_open_regiments:0 "Opened Regiments"
 sb_gaza_narrow_regiments:0 "Narrow Regimental Core"
 sb_gaza_consolidated_recruitment:0 "Consolidated Gaza Recruitment"
 sb_gaza_local_order:0 "Local Accommodation"
 # ### REVIEWED ###
 sb_gaza.001.t:0 "The Kingdom of the Limpopo"
 sb_gaza.001.d:0 "Soshangane kaZikode Nxumalo rules a kingdom made by migration, war, and tribute. Gaza's Nguni military households command the lower Limpopo and the road toward Delagoa, while northern tributaries link the court to Zambezia and the caravan routes beyond."
 sb_gaza.001.f:0 "\"The king's messengers can reach the coast, the river chiefs, and the road north. Whether those roads carry obedience once the regiments leave is the question before the court.\""
 sb_gaza.001.a:0 "Conquest must become government."
 # ### REVIEWED ###
 sb_gaza.010.t:0 "The Road North"
 sb_gaza.010.d:0 "The Gaza royal kraal has never been fixed ground. Soshangane has moved it before, and the road north toward Musapa stands open. Whether to move the court into Zambezia and bring those tributaries quicker to heel, or to stay on the Limpopo and anchor the states' power on the larger, more prosperous southern half of the kingdom; the choice is his and his alone."
 sb_gaza.010.f:0 "\"The mats came down first, then the posts, then the screens of the inner enclosure. Men who had never seen the inside of the royal household carried the pieces out in careful order, each piece placed where it had always been placed, so that the kraal could be raised again in exactly the same arrangement somewhere else.\n\nMusapa was three weeks north.\""
 sb_gaza.010.a:0 "The court stays on the Limpopo."
 sb_gaza.010.b:0 "March the kraal to Musapa."
 # ### TO REVIEW ###
 sb_gaza.020.t:0 "The Collector's Hand"
 sb_gaza.020.d:0 "Gaza's hold over the conquered districts rests on the memory of its regiments. The court must now decide how to make that authority felt in peacetime: dispatch royal collectors to draw tribute directly from Tsonga, Tonga, Shona, and Sena lands, or govern through the chiefs already in place and risk making Gaza look like an army that has gone home."
 sb_gaza.020.f:0 "The royal envoy sat beneath the shade tree outside the kraal while his armed followers drove the disputed cattle through the gate, counting each beast aloud before the village elders. The headman brought beer and spoke of loyalty to Soshangane, yet his eyes followed the retreating herd until the dust settled on the road."
 sb_gaza.020.a:0 "Dispatch the collectors."
 sb_gaza.020.b:0 "Rule through the chiefs."
 # ### REVIEWED ###
 sb_gaza.030.t:0 "Opening the Regiments"
 sb_gaza.030.d:0 "Gaza's regiments were made by war and migration, not by the subject peoples who now live inside the kingdom's reach. Whether to change that, opening the ranks to Tonga, Shona and Sena men and trading a tight Nguni core for a wider army, is a choice the court must now make."
 sb_gaza.030.f:0 "\"The induna counted the men assembled on the parade ground and then counted them again. Almost half were Tonga. He did not say anything.\nThe king had asked for more men, and more men had come.\""
 sb_gaza.030.a:0 "Open the regiments."
 sb_gaza.030.b:0 "Keep the regimental core narrow."
 # ### TO REVIEW ###
 sb_gaza.040.t:0 "Guns on the Caravan Road"
 sb_gaza.040.d:0 "Caravans bound for Portuguese coastal posts cross Gaza's frontier carrying silver and arms. Seizing their loads would enrich the royal treasury and help equip the regiments, though Lisbon's governors will not forgive the devastation along the trade roads."
 sb_gaza.040.f:0 "At the river ford, porters waited beneath a faded Portuguese pass while the caravan leader counted his trade bales and checked the priming of his escorts' muskets. Across the reeds, Gaza outriders watched the crossing in silence—close enough to take the powder casks and coin chests before nightfall, or to let the column pass in peace to the coast."
 sb_gaza.040.a:0 "Raid the trade routes."
 sb_gaza.040.b:0 "Keep the routes open."
 # ### REVIEWED ###
 sb_gaza.090.t:0 "The Tributaries Bound"
 sb_gaza.090.d:0 "The work of consolidation is finished, all now bow to Soshangane's name. The court now has room to decide what the kingdom becomes, whether to govern through the tributary chiefs already in place, or to bind the kingdom more tightly to the central kraal."
 sb_gaza.090.f:0 "\"A tributary who sends cattle obeys for a season. A tributary who sends sons has already accepted a different future.\""
 sb_gaza.090.a:0 "Govern through tributary chiefs."
 sb_gaza.090.b:0 "Bind the kingdom through the regiments."
 # ### TO REVIEW ###
 sb_gaza.095.t:0 "The Cord Breaks"
 sb_gaza.095.d:0 "Soshangane's rule has ended before the conquered districts of [GetStateRegion('STATE_LOURENCO_MARQUES').GetName] and [GetStateRegion('STATE_ZAMBEZIA').GetName] could be settled into regular administration. Across the subject lands, local chiefs now test whether the new court can still enforce Gaza's authority."
 sb_gaza.095.f:0 "Word of the founder's passing reached the outer districts faster than any royal regiment could march. At river crossings and village gates, elders spoke openly of keeping their cattle inside their own enclosures, while Gaza's envoys rode back south with empty hands and promises delayed until the next dry season."
 sb_gaza.095.a:0 "The succession begins in unrest."

 sb_mozambique_company_charter_slot:0 "Mozambique Company Charter"
 sb_mozambique_company_charter_slot_desc:0 "The $company_mozambique_company$'s administration of Mozambique reserves an additional company slot for its chartering country."
 decision_sb_transfer_mozambique_to_company_rule:0 "Transfer Mozambique to Company Rule"
 decision_sb_transfer_mozambique_to_company_rule_desc:0 "Entrust our Mozambican possessions and claims to the $company_mozambique_company$, converting its commercial privileges into a territorial charter."
 decision_sb_transfer_mozambique_to_company_rule_effect_tt:0 "The existing $company_mozambique_company$ retains its headquarters, assets, establishment date, and prosperity.\n\n#bold Company rule:#! Create $MZQ$ as a #v Chartered Company#! and transfer all directly owned territory and claims in [GetStateRegion('STATE_MOCAMBIQUE').GetName], [GetStateRegion('STATE_ZAMBEZIA').GetName], and [GetStateRegion('STATE_LOURENCO_MARQUES').GetName] to its administration.\n\n#bold Chartering country:#! Gains #p +1#! maximum [Concept('concept_company', '$concept_companies|q$')] while the charter remains in force."

# ### TO REVIEW ###
 je_sb_delagoa_route_to_sea:0 "Delagoa Route to the Sea"
 je_sb_delagoa_route_to_sea_reason:0 "The Transvaal interior is landlocked, and its commerce must presently follow long wagon roads or pass through British ports. East of the escarpment, [GetStateRegion('STATE_LOURENCO_MARQUES').GetName] offers an Indian Ocean outlet beyond Britain's customs houses.\n\nRails laid across the three Transvaal districts can bind the republic to Delagoa Bay. Steel alone, however, cannot open the route: the power leading the port's [Concept('concept_market', '$concept_market|q$')] must grant the republic's traffic passage."
 je_sb_delagoa_route_to_sea_status:0 "Complete the railway to Delagoa Bay and secure passage through the [Concept('concept_market', '$concept_market|q$')] containing [GetStateRegion('STATE_LOURENCO_MARQUES').GetName]."
 sb_delagoa_transvaal_railway_complete_tt:0 "[GetStateRegion('STATE_TRANSVAAL').GetName] has an operational $building_railway$."
 sb_delagoa_east_transvaal_railway_complete_tt:0 "[GetStateRegion('STATE_EAST_TRANSVAAL').GetName] has an operational $building_railway$."
 sb_delagoa_northern_transvaal_railway_complete_tt:0 "[GetStateRegion('STATE_NORTHERN_TRANSVAAL').GetName] has an operational $building_railway$."
 sb_delagoa_market_leader_transit_complete_tt:0 "[ROOT.GetCountry.GetName] has $transit_rights$ through the leader of the [Concept('concept_market', '$concept_market|q$')] containing [GetStateRegion('STATE_LOURENCO_MARQUES').GetName]."
 event_effects_sb_delagoa.020_tt:0 "• Every [ROOT.GetCountry.GetAdjectiveNoFormatting] state in [GetStateRegion('STATE_TRANSVAAL').GetName], [GetStateRegion('STATE_EAST_TRANSVAAL').GetName], and [GetStateRegion('STATE_NORTHERN_TRANSVAAL').GetName] gains the permanent [GetStaticModifier('sb_delagoa_import_advantage').GetName] modifier\n• Relations improve by #p 25#! with Mozambique and Portugal where they exist\n• The owner of [GetStateRegion('STATE_LOURENCO_MARQUES').GetName] gains the permanent [GetStaticModifier('sb_delagoa_port_gateway').GetName] modifier and #p 25#! relations with each completed route actor"
 sb_delagoa_import_advantage:0 "Delagoa Import Route"
 sb_delagoa_port_gateway:0 "Delagoa Gateway"
 # ### TO REVIEW ###
 sb_delagoa.010.t:0 "Passage to Delagoa Bay"
 sb_delagoa.010.d:0 "[SCOPE.sCountry('sb_delagoa_actor_scope').GetName] has carried its railways across the Transvaal towards [GetStateRegion('STATE_LOURENCO_MARQUES').GetName], whose harbour lies inside our [concept_market]. Its envoys now seek transit rights through the port, promising steady freight for Delagoa Bay at the expense of British colonial harbours."
 sb_delagoa.010.f:0 "Along the quay and in the customs office, shipping agents laid Boer freight estimates beside the colony's tariff schedules. Every truckload of mining gear and wool bound for Delagoa Bay meant harbour dues and influence gained—while British consuls watched the same figures to see whether the inland republics could still be kept inside Cape and Natal lines."
 sb_delagoa.010.a:0 "Open the route."
 sb_delagoa.010.b:0 "Refuse the arrangement."
 sb_delagoa_010_accept_tt:0 "Conclude a #v 25-year#! treaty granting [SCOPE.sCountry('sb_delagoa_actor_scope').GetName] $transit_rights$ and #v 10#! [GetGoods('merchant_marine').GetName], opening the Delagoa Bay corridor for both [SCOPE.sCountry('sb_delagoa_actor_scope').GetNameNoFormatting] and [GetStateRegion('STATE_LOURENCO_MARQUES').GetName]."
 sb_delagoa_010_reject_tt:0 "[concept_relations] with [SCOPE.sCountry('sb_delagoa_actor_scope').GetName] worsen by #n 25#!, and [SCOPE.sCountry('sb_delagoa_actor_scope').GetNameNoFormatting] will not renew this request."
 # ### TO REVIEW ###
 sb_delagoa.020.t:0 "A Road to the Sea"
 sb_delagoa.020.d:0 "[ROOT.GetCountry.GetName]'s railways now meet the eastern line through [GetStateRegion('STATE_LOURENCO_MARQUES').GetName]. With passage to Delagoa Bay secured, inland freight can reach the Indian Ocean without passing through British ports."
 sb_delagoa.020.f:0 "'...one of my fondest wishes was at last effected. The railway to Delagoa Bay was solemnly opened at Pretoria.'\n— Paul Kruger, #italic Memoirs#!"
 sb_delagoa.020.a:0 "At last, the sea."
 # ### TO REVIEW ###
 sb_delagoa.021.t:0 "Trains from the Highveld"
 sb_delagoa.021.d:0 "The new railway from the Transvaal interior has begun carrying Boer traffic into [GetStateRegion('STATE_LOURENCO_MARQUES').GetName]. Serving as an independent ocean outlet for the inland republics now strengthens the port's trade and customs."
 sb_delagoa.021.f:0 "Along the quays of Lourenço Marques, stevedores swung crated machinery and rails onto flatcars bound up the escarpment. New sheds rose beside the marshalling yard, customs returns climbed week by week, and a harbour that had long faced only towards passing ships began drawing the inland trade onto its own wharves."
 sb_delagoa.021.a:0 "Welcome the inland freight."

 # ### TO REVIEW ###
 je_sb_imperial_confederation_scheme_lobby:0 "By drawing the Boer republics into the British Empire through diplomacy and trade, Britain aims to confederate them with its Anglo-African colonies into a decentralised Southern African union."
 je_sb_imperial_confederation_scheme:0 "Southern African Imperial Confederation Scheme"
 je_sb_imperial_confederation_scheme_reason:0 "By drawing the Boer republics into the British Empire through diplomacy and commercial bindings, Britain aims to confederate them with its Anglo-African colonies into a decentralised Southern African union.\n\nThe #b Subject Control#! bar tracks the share of Boer and Anglo-African participants bound as direct British [Concept('concept_subject','$concept_subjects|q$')]. The #b Sea Access Timer#! tracks consecutive months in which any independent Boer republic holds a port or transit route outside the British imperial network; sixty months of uninterrupted access collapses the scheme."
 je_sb_imperial_confederation_scheme_status:0 "Britain must bring every Boer and Anglo-African participant under direct British [concept_subject] status without war or five years of independent Boer sea access."

 je_sb_imperial_confederation_scheme_imperial_victory:0 "To achieve an #b Imperial Confederation#! victory:\n"
 je_sb_imperial_confederation_scheme_failure:0 "To cause the #b Confederation Scheme#! to fail:\n"
 je_sb_imperial_confederation_success_confederate_tt:0 "Establish the Confederated States of Southern Africa via #b Confederate South Africa#! once all participants are direct British [Concept('concept_subject','$concept_subjects|q$')]."
 je_sb_imperial_confederation_failure_sea_access_tt:0 "Boer republics have maintained durable non-British sea access for five years."
 je_sb_imperial_confederation_failure_terminal_tt:0 "The confederation scheme has entered a terminal failure state."
 je_sb_imperial_confederation_failure_no_boers_tt:0 "No live Boer republic remains to confederate."
 je_sb_imperial_confederation_failure_british_war_tt:0 "Britain is at war with an Imperial Confederation participant."
 je_sb_imperial_confederation_failure_subject_escape_tt:0 "A participant already brought under British subject control has become independent again."
 je_sb_imperial_confederation_bind_trade_button:0 "Bind Trade"
 je_sb_imperial_confederation_bind_trade_button_desc:0 "Renew five-year imperial trade bindings with independent participants. This creates or refreshes treaty access; subject control still depends on later imperial pressure."
 je_sb_imperial_confederation_bind_trade_possible_tt:0 "At least one independent Boer or Anglo-African participant lacks a current five-year imperial trade binding."
 je_sb_imperial_confederation_form_saf_button:0 "Confederate South Africa"
 je_sb_imperial_confederation_form_saf_button_desc:0 "Proclaim the Confederated States of Southern Africa once every participant is a direct British subject. The eligible participant with the highest [concept_gdp] becomes the core of the new federation, which then integrates the remaining British-aligned territories in Southern Africa."
 je_sb_imperial_confederation_form_british_cape_tt:0 "Cape Colony exists as a British [concept_subject]."
 je_sb_imperial_confederation_form_level_1_subjects_tt:0 "Every Boer or Anglo-African participant must be a direct [concept_subject] of Britain: Colony, Puppet, Crown Land, Vassal, Self-Governing Colony, or Confederal Partner."
 je_sb_imperial_confederation_form_state_owners_tt:0 "At least #v 2#! separate participating countries must each control an entire Southern African state."
 sb_imperial_confederation_subject_control_bar:0 "Subject Control"
 sb_imperial_confederation_subject_control_bar_low:0 "Subject control: [GetGlobalVariable('sb_imperial_confederation_subject_control_count_var').GetValue|v0]/[GetGlobalVariable('sb_imperial_confederation_subject_control_total_var').GetValue|v0]"
 sb_imperial_confederation_subject_control_bar_high:0 "All participants controlled"
 sb_imperial_confederation_sea_access_bar:0 "Sea Access Timer"
 sb_imperial_confederation_sea_access_bar_safe:0 "Boer access to non-British sea route"
 sb_imperial_confederation_sea_access_bar_danger:0 "Five years of sea access"
 sb_imperial_confederation_boer_sea_access_drift:0 "+1 month: non-British sea route"
 sb_imperial_confederation_no_boer_sea_access_drift:0 "Timer reset: no sea route"
 sb_imperial_confederation_ignored_delagoa:0 "Ignored Boer Sea Access"
 sb_boer_blossoming_nationhood:0 "Blossoming Nationhood"
 sb_boer_blossoming_nationhood_desc:0 "The failure of Britain's confederation scheme has hardened a distinct Boer political identity and a stronger will to resist outside leverage."
 sb_imperial_confederation_failed_prestige:0 "Confederation Scheme Failed"
 sb_imperial_confederation_failed_prestige_desc:0 "Britain's attempt to bind Southern Africa into a peaceful imperial confederation has collapsed."

# ### TO REVIEW ###
 je_sb_confederate_southern_africa:0 "Confederate Southern Africa"
 je_sb_confederate_southern_africa_reason:0 "The Confederated States of Southern Africa can consolidate British-network territories into one colonial federation. Multi-region subjects only transfer their Southern African states."
 je_sb_confederate_southern_africa_status:0 "Use the confederation button to integrate eligible Southern African British-network states and subjects. The entry completes once the Confederated States controls the full Southern African region."
 je_sb_confederate_southern_africa_button:0 "Expand the Confederation"
 je_sb_confederate_southern_africa_button_desc:0 "Integrate one directly controlled British state or eligible British subject in Southern Africa into the Confederated States of Southern Africa (available once every #v 365 days#! while at peace)."
 je_sb_confederate_southern_africa_button_possible_tt:0 "At least one eligible Southern African British-network territory or subject remains outside the Confederated States."
 je_sb_confederate_southern_africa_button_effect_tt:0 "Transfers one directly held British state in Southern Africa first; otherwise integrates one eligible direct British [concept_subject] (or transfers a single Southern African state if that subject spans multiple regions). May be taken once every #v 365 days#!."
 je_sb_confederate_southern_africa_complete_tt:0 "The Confederated States of Southern Africa controls the Southern African region."
 sb_confederated_south_africa_unified:0 "Confederated Southern Africa"
 sb_confederated_south_africa_unified_desc:0 "Southern Africa has been consolidated into a decentralised imperial confederation."
 sb_gbr_unified_southern_africa:0 "Southern African Confederation"
 sb_gbr_unified_southern_africa_desc:0 "Britain has overseen the peaceful confederation of its Southern African network."
 # ### TO REVIEW ###
 sb_imperial_confederation.030.t:0 "Boer Access to Delagoa"
 sb_imperial_confederation.030.d:0 "Transvaal has secured its own coastal foothold at [GetStateRegion('STATE_LOURENCO_MARQUES').GetName], bypassing the imperial trade network. London must decide whether to back Portuguese claims, demand a British protectorate, or absorb the diplomatic cost."
 sb_imperial_confederation.030.f:0 "The new route was marked in red across the Foreign Office map, running from the Boer interior to a coast outside British control. Beside it, an official had written the trade figures and underlined the conclusion: every wagon using Lourenço Marques weakened the pressure on which confederation depended."
 sb_imperial_confederation.030.a:0 "Demand relinquishment to Portugal."
 sb_imperial_confederation.030.b:0 "Demand a British protectorate."
 sb_imperial_confederation.030.c:0 "Ignore the matter."
 sb_imperial_confederation_030_relinquish_tt:0 "Transvaal receives an ultimatum to cede its holdings in [GetStateRegion('STATE_LOURENCO_MARQUES').GetName] to Portugal."
 sb_imperial_confederation_030_vassalize_tt:0 "Britain starts a [concept_diplomatic_play] to make Transvaal a [concept_protectorate]."
 # ### TO REVIEW ###
 sb_imperial_confederation.031.t:0 "London Demands Delagoa"
 sb_imperial_confederation.031.d:0 "Britain has demanded that [ROOT.GetCountry.GetName] relinquish [GetStateRegion('STATE_LOURENCO_MARQUES').GetName] to Portugal. Refusal will turn the port dispute into an armed imperial crisis."
 sb_imperial_confederation.031.f:0 "London's demand arrived in Pretoria with Portugal's title attached and Britain's force behind it. Ministers studied the narrow coastal strip on the map, then the railway approaching it, and understood why ground once dismissed as distant had become an imperial test."
 sb_imperial_confederation.031.a:0 "Relinquish the port."
 sb_imperial_confederation.031.b:0 "Refuse London's demand."
 sb_imperial_confederation_031_back_down_tt:0 "Portugal takes control of [ROOT.GetCountry.GetAdjectiveNoFormatting] territory in [GetStateRegion('STATE_LOURENCO_MARQUES').GetName], ending the republic's direct port outlet."
 sb_imperial_confederation_031_refuse_tt:0 "Portugal opens a Return State [concept_diplomatic_play] for [GetStateRegion('STATE_LOURENCO_MARQUES').GetName], and Britain joins Portugal with a [concept_protectorate] [concept_war_goal] against [ROOT.GetCountry.GetName]."
 # ### TO REVIEW ###
 sb_imperial_confederation.050.t:0 "A Boer Route to the Sea"
 sb_imperial_confederation.050.d:0 "A Boer republic has secured access to a non-British sea route. Britain has five years to reverse the corridor, restore imperial leverage, or accept that the confederation scheme is losing its main instrument of pressure."
 sb_imperial_confederation.050.f:0 "A clerk entered the first month of non-British access into the scheme's register. The notation occupied a single line, but every subsequent report from the port would lengthen it and shorten the time available for London to restore its leverage."
 sb_imperial_confederation.050.a:0 "The clock is now running."
 # ### TO REVIEW ###
 sb_imperial_confederation.051.t:0 "The Confederation Scheme Fails"
 sb_imperial_confederation.051.d:0 "The imperial confederation scheme has collapsed. Either a bound subject has broken free, the Boer republics no longer remain as republics to bind, their trade can now reach the sea without depending on British corridors, or Britain has abandoned the peaceful route for war."
 sb_imperial_confederation.051.d_war:0 "Britain is at open war with a Southern African participant the confederation scheme was meant to bind by diplomacy. With arms raised, Whitehall can no longer pursue union through gradual imperial pressure."
 sb_imperial_confederation.051.d_subject_escape:0 "A Southern African participant already bound beneath British rule has reclaimed its independence. Once imperial authority proves reversible, the scheme can no longer compel the remaining states into confederation."
 sb_imperial_confederation.051.d_economic:0 "A Boer republic has kept a non-British route to the sea open for five full years. Free of British harbours and customs houses, the inland republics can no longer be drawn into confederation by commercial pressure alone."
 sb_imperial_confederation.051.d_no_boers:0 "The Boer republics the scheme was meant to bind no longer exist as independent political actors. Confederation has been overtaken by conquest, collapse, or incorporation outside the intended imperial settlement."
 sb_imperial_confederation.051.f:0 "The committee met beneath the same map on which the scheme had first been drawn. Trade bindings, subject arrangements, and constitutional proposals were crossed out one after another until no practical road to confederation remained."
 sb_imperial_confederation.051.f_war:0 "The first wartime telegram reached Whitehall before the confederation papers had been removed from the table. Officials who had promised union by gradual pressure now issued orders for a conflict that admitted the peaceful design had ended."
 sb_imperial_confederation.051.f_subject_escape:0 "Word of the broken bond ran through every Southern African capital before Whitehall's dispatches reached the Cape. Treaties might yet be redrafted and garrisons reinforced, but no republic would again mistake British subjecthood for a settled end."
 sb_imperial_confederation.051.f_economic:0 "The sixtieth monthly report arrived with another set of freight figures from the non-British port. The republic's merchants had learned the route, its treasury had begun to count on the customs revenue, and British commercial leverage had withered into a footnote."
 sb_imperial_confederation.051.f_no_boers:0 "The final memorandum listed no Boer republic left to negotiate into the proposed union. Whitehall's machinery for treaties and gradual autonomy had survived, but the political actors for whom it was built had disappeared."
 sb_imperial_confederation.051.a:0 "The scheme is finished."
