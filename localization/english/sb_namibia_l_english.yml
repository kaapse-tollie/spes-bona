 sb_nam_rule_harshness_bar: "Colonial Rule Harshness"
 sb_nam_rule_harshness_bar_soft: "Harshness: [GetGlobalVariable('sb_nam_rule_harshness_current_var').GetValue|v0]/10"
 sb_nam_rule_harshness_bar_harsh: "Harsh Rule"

 sb_namibian_coastal_access: "Namibian Coastal Access"
 sb_namibian_coastal_access_desc: "Surveyed sea lanes, established coastal stations, local agreements, or an overland approach make sustained colonial expansion in South West Africa possible."
 decision_sb_map_namibian_coast: "Mission to South West Africa"
 decision_sb_map_namibian_coast_desc: "Dispatch a combined naval and overland mission to assess the Namibian coast, establish contact with local powers, chart routes into the interior, and determine whether a permanent colonial foothold can be sustained."

 je_sb_map_namibian_coast: "Mission to South West Africa"
 je_sb_map_namibian_coast_reason: "European charts describe the outline of the Namibian coast, but they do not answer the questions facing a government that means to remain there. The mission must sound difficult anchorages, locate water, establish contact with Nama and Herero authorities, and test routes into an interior too often dismissed from afar as empty desert. Progress is made every month, while reckless choices increase Expedition Peril. Default, loss of an eligible colonial law, loss of major-power standing, or subjection will end the expedition."
 je_sb_map_namibian_coast_status_active: "The mission is sounding the coast, establishing local contacts, and testing routes toward the interior."
 je_sb_map_namibian_coast_status_dangerous: "The mission is close to breaking point. Another serious reverse may force its recall."
 je_sb_map_namibian_coast_complete_tt: "Complete #v 30#! months of South West African mission progress."
 je_sb_map_namibian_coast_fail_tt: "Expedition Peril reaches #v 8#!."
 sb_namibian_coast_survey_progress_bar: "Mission Progress"
 sb_namibian_coast_survey_progress_bar_desc: "Progress in charting the coast, assessing routes and water, establishing local contacts, and preparing a viable station in South West Africa."
 sb_namibian_coast_survey_monthly_progress_tt: "Monthly mission work"
 sb_namibian_coast_expedition_peril_bar: "Expedition Peril"
 sb_namibian_coast_expedition_peril_bar_desc: "Danger from surf, fog, thirst, failing discipline, and the exposed coast. At 8 Peril, the expedition fails."
 sb_nam_expedition_costs_tt: "The mission will impose a large ongoing cost until it succeeds or fails."

 je_sb_consolidation_of_south_west_africa: "Consolidation of South West Africa"
 je_sb_consolidation_of_south_west_africa_reason: "[ROOT.GetCountry.GetName] now holds the coastal gateways of Lüderitz and Swakopmund, making it possible to bind Namaqualand and Hereroland into a South West African colonial administration.\n\n#b Colonial Rule Harshness#! runs from #v 0#! to #v 10#!. It begins from the administering country's laws: [GetLawType('law_frontier_colonization').GetName] #n +1#!, [GetLawType('law_colonial_resettlement').GetName] #n +3#!, [GetLawType('law_colonial_exploitation').GetName] #n +6#!; [GetLawType('law_racial_segregation').GetName] #n +1#!, [GetLawType('law_national_supremacy').GetName] #n +2#!, [GetLawType('law_ethnostate').GetName] #n +3#!; [GetLawType('law_cultural_exclusion').GetName] #p -1#! and [GetLawType('law_multicultural').GetName] #p -2#!. Cape Qualified Franchise and a Cape liberal victory can reduce it further.\n\nFour South West African consolidation incidents then each move harshness by #n +1#! or #p -1#!: land policy, mission petitions, forced labour, and border or grazing disputes. The final level sets the colony's permanent administration: #v 0-2#! Mission Colony, #v 3-5#! Chartered Company, #v 6-8#! Extractive Colony, and #v 9+#! Exterminatory Settler-Extractive Colony."
 je_sb_consolidation_of_south_west_africa_status_accommodating: "The South West African administration is still relying on mission mediation, negotiated boundaries, and limited coercion."
 je_sb_consolidation_of_south_west_africa_status_supervised: "South West Africa is being brought under close colonial supervision, but the administration has not committed to an openly brutal programme."
 je_sb_consolidation_of_south_west_africa_status_coercive: "The South West African administration is imposing tighter control over labour, land, and movement."
 je_sb_consolidation_of_south_west_africa_status_brutal: "The South West African administration has embraced a hard settler-colonial line of dispossession and coercion."
 je_sb_consolidation_of_south_west_africa_status_exterminatory: "The South West African colonial regime is prepared to rule through systematic terror."
 je_sb_consolidation_of_south_west_africa_tt_ports: "Own both #v Lüderitz#! and #v Swakopmund#!."
 je_sb_consolidation_of_south_west_africa_tt_events: "Resolve all four consolidation incidents."
 je_sb_consolidation_of_south_west_africa_tt_namaqualand: "Control at least #v 80%#! of the passable provinces in #v Namaqualand#!."
 je_sb_consolidation_of_south_west_africa_tt_hereroland: "Control at least #v 80%#! of the passable provinces in #v Hereroland#!."

 je_sb_delegate_south_west_affairs_to_cape_button: "Delegate South West Affairs to the Cape"
 je_sb_delegate_south_west_affairs_to_cape_button_desc: "Transfer the practical administration of Britain's South West African footholds in Namaqualand and Hereroland to the Cape Colony."

 sb_nam_german_colonial_rebuff: "Colonial Ambition Rebuffed"
 sb_nam_german_colonial_rebuff_desc: "Colonial advocates in Berlin resent the government's refusal to pursue a South West African foothold."
 sb_nam_rehoboth_discouraged: "Rehoboth Discouraged"
 sb_nam_rehoboth_discouraged_desc: "Cape pressure has checked the Rehoboth Baster trek toward South West Africa, but at domestic political cost."
 sb_nam_rule_accommodating: "Accommodating Rule"
 sb_nam_rule_accommodating_desc: "The South West African administration is still trying to soften colonial rule through mission mediation and compromise."
 sb_nam_rule_supervised: "Supervised Rule"
 sb_nam_rule_supervised_desc: "South West Africa is being organized under closer colonial supervision, but without a fully brutal programme."
 sb_nam_rule_supervised_state: "$sb_nam_rule_supervised$"
 sb_nam_rule_supervised_state_desc: "$sb_nam_rule_supervised_desc$"
 sb_nam_rule_coercive: "Coercive Rule"
 sb_nam_rule_coercive_desc: "South West African colonial order is being enforced through harsher labour, land, and movement policies."
 sb_nam_rule_coercive_state: "$sb_nam_rule_coercive$"
 sb_nam_rule_coercive_state_desc: "$sb_nam_rule_coercive_desc$"
 sb_nam_rule_brutal: "Brutal Rule"
 sb_nam_rule_brutal_desc: "Settler and administrative interests in South West Africa have embraced dispossession and direct coercion."
 sb_nam_rule_brutal_state: "$sb_nam_rule_brutal$"
 sb_nam_rule_brutal_state_desc: "$sb_nam_rule_brutal_desc$"
 sb_nam_rule_exterminatory: "Exterminatory Rule"
 sb_nam_rule_exterminatory_desc: "The South West African colonial regime is prepared to rule through systematic terror."
 sb_nam_rule_exterminatory_state: "$sb_nam_rule_exterminatory$"
 sb_nam_rule_exterminatory_state_desc: "$sb_nam_rule_exterminatory_desc$"
 sb_nam_minority_rights_seed_low: "Muted Resistance"
 sb_nam_minority_rights_seed_low_desc: "Discriminated communities in South West Africa are beginning to organize against colonial rule."
 sb_nam_minority_rights_seed_mid: "Gathering Resistance"
 sb_nam_minority_rights_seed_mid_desc: "A broader South West African resistance movement is taking shape."
 sb_nam_minority_rights_seed_high: "Hardening Resistance"
 sb_nam_minority_rights_seed_high_desc: "Colonial repression is radicalizing South West Africa."
 sb_nam_minority_rights_seed_extreme: "Explosive Resistance"
 sb_nam_minority_rights_seed_extreme_desc: "Resistance to colonial rule in South West Africa is reaching a dangerous pitch."
 sb_nam_minority_rights_seed_maximum: "Implacable Resistance"
 sb_nam_minority_rights_seed_maximum_desc: "South West Africa is on the edge of open revolt against colonial rule."
 sb_nam_minority_rights_suppressed: "Suppressed Resistance"
 sb_nam_minority_rights_suppressed_desc: "Open South West African resistance has been temporarily checked."
 sb_nam_forced_camps_country: "Forced Camps"
 sb_nam_forced_camps_country_desc: "Confinement, rationing, and forced labour reduce Standard of Living by 7 for pops facing Violent Hostility, 5 for Cultural Erasure, and 2 for Open Prejudice."
 sb_nam_forced_camps_movement: "Forced Camps"
 sb_nam_forced_camps_movement_desc: "Confinement has narrowed the South West African resistance movement's room to organize."
 sb_nam_extermination_orders_country: "Extermination Orders"
 sb_nam_extermination_orders_country_desc: "Exterminatory violence reduces Standard of Living by 10 for pops facing Violent Hostility, 7 for Cultural Erasure, and 5 for Open Prejudice."
 sb_nam_extermination_orders_movement: "Extermination Orders"
 sb_nam_extermination_orders_movement_desc: "Exterminatory violence has torn apart organized South West African resistance."
 sb_nam_resistance_allowed_minor: "Resistance Allowed to Gather"
 sb_nam_resistance_allowed_minor_desc: "The colonial state has hesitated, giving South West African resistance more room to cohere."
 sb_nam_resistance_allowed_major: "Resistance Allowed to Organize"
 sb_nam_resistance_allowed_major_desc: "The authorities have balked at total repression in South West Africa, and resistance is growing bolder."
 sb_nam_colonial_charter: "Colonial Charter"
 sb_nam_colonial_charter_desc: "South West Africa is being run for extraction through a chartered colonial company."
 sb_nam_mission_colony: "Mission Colony"
 sb_nam_mission_colony_desc: "South West Africa is being organized around mission mediation and agrarian administration rather than extraction."
 sb_nam_extractive_colony: "Extractive Colony"
 sb_nam_extractive_colony_desc: "South West Africa is being organized around mines, plantations, and racialized labour control."
 sb_nam_extractive_colony_state: "Extractive Colony"
 sb_nam_extractive_colony_state_desc: "The local South West African administration is opening land and labour to extractive colonial expansion."
 sb_nam_exterminatory_settler_extractive_colony: "Exterminatory Settler-Extractive Colony"
 sb_nam_exterminatory_settler_extractive_colony_desc: "South West Africa is being organized around settler claims, extraction, and exterminatory coercion."
 sb_nam_exterminatory_settler_extractive_colony_state: "Exterminatory Settler-Extractive Colony"
 sb_nam_exterminatory_settler_extractive_colony_state_desc: "The local South West African administration is directing settlement and coercive expansion into this state."

 # ### REVIEWED ###
 sb_nam.010.t: "Berlin Looks Overseas"
 sb_nam.010.d: "In Berlin, colonial advocates within the Junkers and officer corps argue that Germany should prepare an expedition to the Namibian coast before rival empires occupy its few viable landing grounds."
 sb_nam.010.f: "Mission reports and incomplete charts circulate through ministries, clubs, and military messes. Each line is presented as commerce, each anchorage as protection, and each mission station as evidence that the Reich should no longer remain only a continental power."
 sb_nam.010.a: "Back a colonial programme"
 sb_nam_010_a_tt: "Back German preparations in South West Africa. If Germany lacks an eligible colonial law, promise to pursue [GetLawType('law_colonial_exploitation').GetName]. A future mission to South West Africa may draw upon missionary intelligence."
 sb_nam.010.b: "Keep Germany in Europe"
 sb_nam_010_b_tt: "Reject the South West African colonial lobby, angering its sponsor in government."

 # ### REVIEWED ###
 sb_nam.011.t: "The Missionaries' Maps"
 sb_nam.011.d: "Missionaries who have travelled between Nama communities, Herero settlements, and the coast offer Berlin a body of reports far more useful than the mission's inherited charts. Their routes identify wells, seasonal tracks, and stretches where boats may survive the surf."
 sb_nam.011.f: "What the admiralty calls an empty coast is already crossed by paths, memory, obligation, and warning. The question is whether Berlin will pay to turn that knowledge into an imperial instrument."
 sb_nam.011.a: "Fund the mission network"
 sb_nam_011_a_tt: "Pay #v £100,000#!. The South West Africa mission gains #p +10 Progress#! and loses #p 2 Peril#!."
 sb_nam.011.b: "The mission can manage without them"
 sb_nam_011_b_tt: "Decline the missionary intelligence and continue at the mission's present pace."

 # ### TO REVIEW ###
 sb_nam.012.t: "Mission to South West Africa"
 sb_nam.012.d: "The cabinet has authorized a mission to determine whether a permanent foothold in South West Africa can be sustained. Ships, survey boats, engineers, interpreters, and stores must be assembled to sound the coast, meet the powers of the interior, and trace routes through country that foreign maps reduce to sand and blank space."
 sb_nam.012.f: "Charts of the coast ended in uncertain soundings and broad spaces marked desert. Around them, the mission's planners assembled water casks, surveying instruments, interpreters' reports, and enough stores to discover whether the apparent emptiness belonged to the country or only to the map."
 sb_nam.012.a: "Appoint the mission's commander"

 # ### TO REVIEW ###
 sb_nam.013.t: "Command of the South West Africa Mission"
 sb_nam.013.d: "The mission requires an officer capable of coordinating naval soundings, inland reconnaissance, supply depots, interpreters, and negotiations across a region that punishes haste and ignorance alike."
 sb_nam.013.f: "The candidates stood before the same coastal chart while ministers questioned them about surf, supply, discipline, and negotiation. Whoever accepted the command would carry the state's authority into the mission, and personal responsibility for every blank the expedition failed to fill."
 sb_nam.013.a: "[SCOPE.sCharacter('sb_nam_expedition_leader_1').GetPrimaryRoleTitle] [SCOPE.sCharacter('sb_nam_expedition_leader_1').GetFullName]"
 sb_nam.013.b: "[SCOPE.sCharacter('sb_nam_expedition_leader_2').GetPrimaryRoleTitle] [SCOPE.sCharacter('sb_nam_expedition_leader_2').GetFullName]"
 sb_nam.013.c: "[SCOPE.sCharacter('sb_nam_expedition_leader_3').GetPrimaryRoleTitle] [SCOPE.sCharacter('sb_nam_expedition_leader_3').GetFullName]"
 sb_nam.013.cancel: "No suitable commander remains"
 sb_nam_013_d_tt: "Cancel the expedition preparations. Another attempt may be made in #v six months#!."

 # ### TO REVIEW ###
 sb_nam.014.t: "South West Africa Assessed"
 sb_nam.014.d: "The mission has returned with soundings, water reports, inland routes, and local agreements sufficient to sustain a permanent coastal station. Where the coast remains outside another power's control, survey camps can now be replaced by administration, warehouses, and harbour works."
 sb_nam.014.f: "Survey boats returned with marked charts while inland parties unpacked route notes and agreements beside them. At the chosen landing grounds, instruments gave way to timber, warehouses, and a flagstaff; the temporary camp was being measured for permanent administration."
 sb_nam.014.a: "Establish the coastal stations"
 sb_nam_014_a_tt: "Secure every still-decentralized beachhead at #v Lüderitz#! and #v Swakopmund#!. Each acquired state receives a Port and Trade Center, and [ROOT.GetCountry.GetNameNoFlag] gains claims there, #p +2,500#! [concept_involvement] in Southern Africa, and permanent Namibian Coastal Access."

 # ### TO REVIEW ###
 sb_nam.015.t: "The Mission Breaks Apart"
 sb_nam.015.d: "The mission can no longer continue. Stores are exhausted, confidence has collapsed, and the remaining crews have begun the journey home with incomplete reports and a wounded commander."
 sb_nam.015.f: "The last boat pushed away from a beach littered with stores too heavy to recover. Aboard ship, the surviving officers guarded incomplete notebooks and avoided the commander's eye while the same unmastered coastline receded into fog."
 sb_nam.015.a: "Bring home whoever remains"
 sb_nam_015_a_tt: "End the expedition, release its commander, and prevent another attempt for #v two years#!. A surviving commander is wounded."

 # ### TO REVIEW ###
 sb_nam.016.t: "Flags on the Shore"
 sb_nam.016.d: "Before our mission could establish a station, rival flags appeared over the remaining landing grounds. Its charts and reports may retain scientific value, but they can no longer secure an uncontested coastal foothold."
 sb_nam.016.f: "The landing party found fresh posts above the shore and a foreign flag visible from the boats. Their charts remained accurate and their observations useful, but every sounding now described an approach to somebody else's station."
 sb_nam.016.a: "Recall the mission"
 sb_nam_016_a_tt: "End the mission without refunding its costs and prevent another attempt for #v two years#!."

 # ### TO REVIEW ###
 sb_nam.030.t: "Fog on the Benguela Current"
 sb_nam.030.d: "Cold water and warm air have buried the coast beneath a wall of fog. Soundings taken at speed may shorten the voyage, but a single unseen shoal could tear open a survey vessel."
 sb_nam.030.f: "The leadsman called each depth into fog so thick that the officer recording it could not see the bow. Somewhere ahead, surf sounded against an unseen shore; behind them, the previous line of soundings vanished into the same white wall."
 sb_nam.030.a: "Wait for clear water"
 sb_nam.030.b: "Keep the leadsmen working"

 # ### TO REVIEW ###
 sb_nam.031.t: "Water Beyond the Dunes"
 sb_nam.031.d: "The landing parties report that their nearest dependable water lies far inland. Cisterns and guarded depots would make the route safer, but each barrel landed through the surf carries an imperial price."
 sb_nam.031.f: "The inland party returned with empty vessels and an estimate of how much farther the next dependable water lay. Officers converted the distance into barrels, animals, guards, and trips through the surf, until a short line on the map became an entire supply system."
 sb_nam.031.a: "Establish supply depots"
 sb_nam.031.b: "Ration the remaining stores"

 # ### TO REVIEW ###
 sb_nam.032.t: "Soundings at Angra Pequena"
 sb_nam.032.d: "A sheltered roadstead offers the expedition its most promising southern anchorage. The officers disagree over whether the preliminary soundings are sufficient or whether another season must be spent proving the channel."
 sb_nam.032.f: "The newest chart showed a clean channel into Angra Pequena, though the officers who had taken the soundings remembered every cross-current omitted from its lines. On deck, they argued whether another season would make the harbour safer or merely make the mission later."
 sb_nam.032.a: "Complete the soundings"
 sb_nam.032.b: "Publish the preliminary chart"

 # ### TO REVIEW ###
 sb_nam.033.t: "Pilots of the Dry Coast"
 sb_nam.033.d: "Local pilots and mission intermediaries offer to guide the survey parties between landing grounds and inland water. Their price is modest compared with another lost boat, though some officers resent depending upon knowledge outside their command."
 sb_nam.033.f: "The local pilots traced wells and landing places with a finger across the official chart, naming routes the expedition had marked as blank. The surveyors could hire that knowledge, or spend another season proving for themselves what the coast's inhabitants already knew."
 sb_nam.033.a: "Hire the pilots"
 sb_nam.033.b: "Keep the work in official hands"

 # ### TO REVIEW ###
 sb_nam.034.t: "Boats in the Surf"
 sb_nam.034.d: "A narrow interval between the breakers may permit an immediate landing. Waiting is safer; attempting it now could put men and instruments ashore weeks ahead of schedule, or scatter both along the beach."
 sb_nam.034.f: "The coxswain watched one set of breakers collapse and saw a narrow channel open behind it. Men tightened their hands around oars and instrument cases, waiting for the order that would either send them through the surf or leave another day's work beyond reach."
 sb_nam.034.a: "Remain offshore"
 sb_nam.034.b: "Run the boats through"

 # ### TO REVIEW ###
 sb_nam.035.t: "Rival Survey Flags"
 sb_nam.035.d: "Reports place another expedition somewhere along the Namibian coast. Additional launches and survey crews could force the pace, though speed will expose men and ships to greater danger."
 sb_nam.035.f: "A mast appeared briefly through the coastal haze, then vanished before its colours could be read. The sighting entered the mission log as uncertain, but every officer at the meeting treated it as a rival expedition already one landing ahead."
 sb_nam.035.a: "Outspend and outpace them"
 sb_nam.035.b: "Keep to the survey plan"

 # ### TO REVIEW ###
 sb_nam.036.t: "Discipline Under the Desert Sun"
 sb_nam.036.d: "Heat, repetition, and the isolation of the coast are wearing down the expedition. The commander can halt the work and reorganize the crews, or impose another punishing march before discipline frays completely."
 sb_nam.036.f: "Boots split, tempers shortened, and small mistakes multiplied in the heat. The commander could hear discipline fraying in the delay between an order and its execution, a silence no punishment could shorten indefinitely."
 sb_nam.036.a: "Rest and reorganize"
 sb_nam.036.b: "Enforce the pace"

 # ### TO REVIEW ###
 sb_nam.037.t: "The Landing Party Is Missing"
 sb_nam.037.d: "A storm has cut off one of the expedition's landing parties. A cautious withdrawal would sacrifice months of work. A rescue through the surf might recover the charts and men, but it could also carry the commander to the same fate."
 sb_nam.037.f: "Signal lamps burned from the ship until dawn without an answer from shore. Each hour of darkness made rescue more dangerous and abandonment more final, while the missing party's charts and instruments remained somewhere beyond the breakers."
 sb_nam.037.a: "Abandon the stores and regroup"
 sb_nam.037.b: "The commander will lead the rescue"
 sb_nam_037_b_tt: "There is a #n 25% chance#! that the expedition commander dies. Otherwise, the expedition gains #p +3 Progress#! and #n +3 Peril#!."

 # ### TO REVIEW ###
 sb_nam.038.t: "The Wells Have Failed"
 sb_nam.038.d: "Reports from the inland parties arrive together and carry the same warning: the expected wells have failed. Transport animals are dying, stores have been abandoned, and several detachments are stranded beyond the dunes. An immediate relief march might preserve years of work, but every remaining reserve would be committed to country already turning against the mission."
 sb_nam.038.f: "The relief report placed the failed wells in blue pencil exactly where the older chart promised water. Around those useless marks were the real consequences: dead transport animals, abandoned loads, and detachments waiting beyond the dunes for reserves that might not reach them."
 sb_nam.038.a: "Drive the relief columns inland"
 sb_nam.038.b: "Abandon the season and rebuild"
 decision_sb_delegate_british_south_west_africa: "Delegate British South West Africa"
 decision_sb_delegate_british_south_west_africa_desc: "Transfer Britain's completed South West African holdings to its Southern African subject administration. If the Cape or South Africa already holds Walvis Bay or another local enclave, only Britain's remaining state fragments are transferred."

 # ### REVIEWED ###
 sb_nam.020.t: "The Rehoboth Trek"
 sb_nam.020.d: "Cape policy is pushing Rehoboth Baster frontier families toward the interior, where a trek into South West Africa could create a new buffer community beyond direct colonial control."
 sb_nam.020.f: "Wagons are not merely loaded with furniture, rifles, and church books. They carry old grievances from the Cape frontier, and those grievances do not disappear once the wheels cross another dry riverbed."
 sb_nam.020.a: "Allow the trek"
 sb_nam_020_a_tt: "Two thousand Cape Creole Pops will emigrate from the Cape and establish a distinct Baster community at Rehoboth."
 sb_nam.020.b: "Discourage the move"
 sb_nam_020_b_tt: "Block the Rehoboth trek, discouraging the frontier movement at domestic political cost."

 # ### REVIEWED ###
 sb_nam.100.t: "South West Africa: Land Policy"
 sb_nam.100.d: "Surveyors, concession seekers, and settler spokesmen in South West Africa are pressing the administration to define who may graze, farm, and hold title in Namaqualand and Hereroland."
 sb_nam.100.f: "First comes the line on the map. Then come the pegs in the ground, the signatures in the office, and the guards who insist that an old route has become somebody else's property."
 sb_nam.100.a: "Survey and reserve the land"
 sb_nam_rule_harshness_increase_tt: "Colonial Rule Harshness in South West Africa will increase by #n 1#!."
 sb_nam.100.b: "Recognize local grazing rights"
 sb_nam_rule_harshness_decrease_tt: "Colonial Rule Harshness in South West Africa will decrease by #p 1#!."

 # ### REVIEWED ###
 sb_nam.110.t: "South West Africa: Mission Petitions"
 sb_nam.110.d: "Missionaries and indigenous petitioners in South West Africa warn that a narrow settler regime will turn local communities against the colonial administration."
 sb_nam.110.f: "The petitions arrive folded, translated, annotated, and delayed. They are inconvenient because they speak in the language of the administration itself: promises, protection, law."
 sb_nam.110.a: "Dismiss the petitions"
 sb_nam.110.b: "Hear the missions"

 # ### REVIEWED ###
 sb_nam.120.t: "South West Africa: Forced Labour"
 sb_nam.120.d: "Settlers and administrators in South West Africa want forced labour rules to secure workers for transport, ranching, and public works."
 sb_nam.120.f: "The ledgers call it shortage. The district officers call it order. Those summoned from their homes call it what it is: another demand made under the shadow of a rifle."
 sb_nam.120.a: "Enforce labour ordinances"
 sb_nam.120.b: "Limit forced labour"

 # ### REVIEWED ###
 sb_nam.130.t: "South West Africa: Grazing Boundaries"
 sb_nam.130.d: "Expanding colonial districts in South West Africa are colliding with long-standing grazing routes and local boundary agreements."
 sb_nam.130.f: "A frontier can be drawn in an office in an afternoon. It takes longer to explain why the waterhole, the winter pasture, or the cattle path beyond it has suddenly changed hands."
 sb_nam.130.a: "Impose a punitive settlement"
 sb_nam.130.b: "Negotiate the boundaries"

 # ### REVIEWED ###
 sb_nam.140.t: "Administer South West Africa"
 sb_nam.140.d: "[ROOT.GetCountry.GetName] has consolidated Lüderitz, Swakopmund, Namaqualand, and Hereroland into a coherent South West African colonial project. The colony's permanent administration will now be fixed by the harshness of the rule already imposed."
 sb_nam.140.f: "The reports no longer describe scattered purchases and isolated posts. They describe districts, labour needs, police powers, mission claims, settler pressure, and the machinery required to make a foothold permanent."
 sb_nam.140.a: "Proclaim the administration"
 sb_nam_140_mission_tt: "Create #v South West Africa#! as a #v Mission Colony#!.\n\n#bold Laws:#! [GetLawType('law_colonial_administration').GetName], [GetLawType('law_oligarchy').GetName], [GetLawType('law_subjecthood').GetName], [GetLawType('law_agrarianism').GetName], [GetLawType('law_colonial_resettlement').GetName], mission-style religious schooling where valid, and restrictive colonial baseline laws.\n\n#bold Permanent modifier:#! Mission Colony: reduced radicalism from open-prejudice increases."
 sb_nam_140_charter_tt: "Create #v South West Africa#! as a #v Chartered Company#!.\n\n#bold Laws:#! [GetLawType('law_colonial_administration').GetName], [GetLawType('law_oligarchy').GetName], [GetLawType('law_subjecthood').GetName], [GetLawType('law_extraction_economy').GetName], [GetLawType('law_colonial_exploitation').GetName], and restrictive colonial baseline laws.\n\n#bold Permanent modifier:#! Colonial Charter: #p +10%#! plantation throughput and #p +10%#! mining throughput."
 sb_nam_140_extractive_tt: "Create #v South West Africa#! as an #v Extractive Colony#!.\n\n#bold Laws:#! [GetLawType('law_colonial_administration').GetName], [GetLawType('law_oligarchy').GetName], [GetLawType('law_racial_segregation').GetName], [GetLawType('law_extraction_economy').GetName], [GetLawType('law_colonial_exploitation').GetName], and restrictive colonial baseline laws.\n\n#bold Permanent country modifier:#! #p +10%#! plantation throughput, #p +10%#! mining throughput, and #n +10%#! radicalism gain for pops facing violent hostility, cultural erasure, or open prejudice.\n\n#bold Namaqualand and Hereroland modifier:#! #p +25%#! colony growth."
 sb_nam_140_exterminatory_tt: "Create #v South West Africa#! as an #v Exterminatory Settler-Extractive Colony#!.\n\n#bold Laws:#! [GetLawType('law_colonial_administration').GetName], [GetLawType('law_autocracy').GetName], [GetLawType('law_racial_segregation').GetName], [GetLawType('law_extraction_economy').GetName], [GetLawType('law_colonial_exploitation').GetName], [GetLawType('law_censorship').GetName], and restrictive colonial baseline laws.\n\n#bold Permanent country modifier:#! #p +10%#! plantation throughput, #p +10%#! mining throughput, #n +20%#! radicalism gain for pops facing violent hostility, cultural erasure, or open prejudice, and #n -2#! Standard of Living for those pops.\n\n#bold Namaqualand and Hereroland modifier:#! #p +50%#! colony growth and #p +10%#! migration attraction."

 # ### REVIEWED ###
 sb_nam.150.t: "South West Africa Proclaimed"
 sb_nam.150.d: "A South West African colonial administration now stands between the coast and the interior, claiming authority over Lüderitz, Swakopmund, Namaqualand, and Hereroland."
 sb_nam.150.f: "The proclamation settles the question of administration. It does not settle the question of land, labour, sovereignty, or resistance."
 sb_nam.150.a: "Consolidate the colony"
 sb_nam_150_a_tt: "Seed South West African minority-rights resistance according to the final Colonial Rule Harshness level."

 # ### REVIEWED ###
 sb_nam.151.t: "Play as South West Africa?"
 sb_nam.151.d: "A new South West African colonial administration has been proclaimed beneath the authority of [ROOT.GetCountry.GetName]. You may continue directing the colonial project from [ROOT.GetCountry.GetName], or take control of South West Africa itself."
 sb_nam.151.f: "A colonial government has its own offices, budgets, garrisons, and ambitions. What began as a distant question of empire can now be played from the colonial capital itself."
 sb_nam.151.a: "Remain with [ROOT.GetCountry.GetName]"
 sb_nam_151_a_tt: "Continue playing as [ROOT.GetCountry.GetName]."
 sb_nam.151.b: "Play as South West Africa"
 sb_nam_151_b_tt: "Switch to #v South West Africa#!."

 # ### REVIEWED ###
 sb_nam.200.t: "South West Africa: Forced Camps"
 sb_nam.200.d: "The South West African administration proposes forced camps, rationing, and harsher labour discipline to break indigenous resistance."
 sb_nam.200.f: "The memorandum calls the camps temporary. It calls the rations efficient, the fences necessary, and the confinement a practical answer to disorder. The words are clean. The policy is not."
 sb_nam.200.a: "Approve the camps"
 sb_nam_200_a_tt: "Impose forced camps for ten years, suppressing organized resistance and reducing Standard of Living by #n 7#! for pops facing Violent Hostility, #n 5#! for Cultural Erasure, and #n 2#! for Open Prejudice."
 sb_nam.200.b: "Do not go that far"
 sb_nam_200_b_tt: "Refuse forced camps, allowing resistance to gather."

 # ### REVIEWED ###
 sb_nam.201.t: "South West Africa: Extermination Orders"
 sb_nam.201.d: "Hardliners in the South West African colonial administration now demand exterminatory violence against communities accused of sustaining resistance."
 sb_nam.201.f: "The order is written as policy, but everyone in the room understands what it means. It would not merely defeat resistance. It would mark the colony with a crime that cannot be hidden by new maps or clean reports."
 sb_nam.201.a: "Issue the orders"
 sb_nam_201_a_tt: "Issue extermination orders, shattering organized resistance and reducing Standard of Living by #n 10#! for pops facing Violent Hostility, #n 7#! for Cultural Erasure, and #n 5#! for Open Prejudice."
 sb_nam.201.b: "Refuse"
 sb_nam_201_b_tt: "Refuse extermination orders, allowing resistance to organize further."
