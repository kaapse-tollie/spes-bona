l_english:
 sb_great_trek.030.t:0 "A Republic in Earnest"
 sb_great_trek.030.d:0 "What began as trekker camps has become a working economy. Farms sustain a larger population, traders bring coastal goods, and the volksraad now has a treasury behind it. The republic is no longer a mere frontier fancy."
 sb_great_trek.030.f:0 "The camps remained, but now there were farms, a treasury, and a council to turn migration into government."
 sb_great_trek.030.a:0 "The republic endures."
 sb_great_trek_boer_slice_tt:0 "3.3% of Boer [Concept('concept_pop', '$concept_pops$')] in each Cape-owned state will move to our strongest trekker settlement."
 sb_great_trek.031.t:0 "Potchefstroom Established"
 sb_great_trek.031.d:0 "The settlement on the Mooi River has grown beyond its first condition. Farms line the banks, a church stands at the center, and Potchefstroom now looks less like a laager than a town."
 sb_great_trek.031.f:0 "Where wagons once stood alone, there were now streets, stockyards, and the sound of a church bell."
 sb_great_trek.031.a:0 "Our footing is secure."
 sb_great_trek.040.t:0 "The Vrystaat Won"
 sb_great_trek.040.d:0 "Our republic now holds the whole Vrystaat. From the Orange to the Vaal, the land answers to the volksraad in Bloemfontein, and news of that success is already drawing fresh wagons from the Cape."
 sb_great_trek.040.f:0 "Word of a whole country won ran quickly through the Cape. Where there was land, there would soon be wagons."
 sb_great_trek.040.a:0 "Then let them come."
 sb_great_trek.041.t:0 "The Vaal Republic Secured"
 sb_great_trek.041.d:0 "The western Transvaal core is now secure. Potchefstroom and the surrounding districts answer to one republican authority, and the inland republic stands on firmer ground than a line of moving camps."
 sb_great_trek.041.f:0 "North of the Vaal, men had begun to speak less of passing through than of staying."
 sb_great_trek.041.a:0 "The republic is secure."
 sb_great_trek.042.t:0 "The Limpopo Frontier Won"
 sb_great_trek.042.d:0 "Zoutpansberg has grown from a handful of northern commandos into a republic that can claim the wider Limpopo frontier. Farms, laagers, and trading posts now bind the bushveld to the volksraad."
 sb_great_trek.042.f:0 "At the edge of the bushveld the trek had found not an end, but another country."
 sb_great_trek.042.a:0 "Let them come north."
 sb_great_trek.044.t:0 "Lydenburg Secured"
 sb_great_trek.044.d:0 "Lydenburg now commands the eastern Transvaal. The highveld roads, farms, and frontier posts answer to one republican authority, giving the eastern trek a country of its own."
 sb_great_trek.044.f:0 "The eastern road no longer ended in scattered farms, but in a republic that could hold the passes."
 sb_great_trek.044.a:0 "Let them come east."
 sb_great_trek.043.t:0 "Natal Secured"
 sb_great_trek.043.d:0 "Natal is no longer merely a coastal foothold. From Port Natal to the inland frontier, farms, wagon roads, and a republican council now bind the region into the wider trek."
 sb_great_trek.043.f:0 "Here the wagons had found the ocean, and with it a republic unlike those of the inland rivers."
 sb_great_trek.043.a:0 "Then let them come."
 sb_great_trek.100.t:0 "A Republic Established"
 sb_great_trek.100.d:0 "Our republic has grown from a scattered collection of trekker camps into a viable state. Farms have been established, people gathered, and government made to function. This land may now be called our own."
 sb_great_trek.100.f:0 "What began in flight had ended in magistrates, farms, and a republic fit to endure."
 sb_great_trek.100.a:0 "So the republic stands."
 sb_great_trek.101.t:0 "A Settled Coast"
 sb_great_trek.101.d:0 "Natalia is no longer merely a frontier laager clinging to the coast. With the trek complete, the republic may begin to exchange its improvised wartime institutions for a more regular civil order suited to a settled maritime state."
 sb_great_trek.101.f:0 "The wagons had found the sea. The harder task was to govern what the sea-road had won."
 sb_great_trek.101.a:0 "Let Natalia be settled."
 sb_great_trek.002.t:0 "In Mzilikazi's wake"
 sb_great_trek.002.d:0 "Our boer commandos have successfully defeated Mzilikazi's host at the great battle of Vegkop. Mzilikazi has decided to move the entire [SCOPE.sCountry('ndebele').GetAdjective] court further north under pressure from our Trekboer commandos and border skirmishes with [SCOPE.sCountry('zulu').GetName]. The #v highveld#! opens her arms to our wagons for settlement."
 sb_great_trek.002.f:0 "Reports from the highveld came in fragments, but on one point they agreed: [SCOPE.sCharacter('mzilikazi').GetFirstNameNoFormatting] was moving north, and the land behind him lay open to whoever could seize and hold it."
 sb_great_trek.002_tt:0 "A #v large number#! of Boer [Concept('concept_pop', '$concept_pops$')] will move from [SCOPE.sCountry('cape_colony').GetName] to [SCOPE.sCountry('oranje').GetName]."
 sb_great_trek.002.a:0 "To new pastures we go!"
 law_discrete_inboekstelsel:0 "Discrete Inboekstelsel"
 law_discrete_inboekstelsel_desc:0 "A localized system of coerced child apprenticeship and bonded labor is tolerated on the frontier, but large-scale slave imports are formally closed."
 law_expanded_inboekstelsel:0 "Expanded Inboekstelsel"
 law_expanded_inboekstelsel_desc:0 "The frontier republic openly permits commandos and magistrates to widen the inboekstelsel into a harsher coerced-labor order, while still refusing overseas slave imports."
 je_sb_inboekstelsel_system:0 "The Inboekstelsel System"
 je_sb_inboekstelsel_system_reason:0 "The Boer republics maintain coerced labor through the inboekstelsel: a frontier system of apprenticeship, captive-taking, and household service that sits uneasily beside British anti-slavery pressure."
 je_sb_inboekstelsel_system_status:0 "Decide each year whether to enforce the inboekstelsel more harshly or relax its pressure under unrest and British scrutiny."
 je_sb_inboekstelsel_enforce_button:0 "Enforce the Inboekstelsel"
 je_sb_inboekstelsel_enforce_button_desc:0 "Bind a small share of the most marginalized animist households into coerced service for Boer farms. Expanded law lets the commandos enforce the system more widely, but worsens relations with Britain and the Cape."
 je_sb_inboekstelsel_relax_button:0 "Relax the Inboekstelsel"
 je_sb_inboekstelsel_relax_button_desc:0 "Free a small share of slave households and ease pressure on violently hostile communities, at the cost of Groot Boere approval and Boer loyalist confidence."
 sb_inboekstelsel_cooldown_tt:0 "The inboekstelsel has not been adjusted in the past year."
 sb_inboekstelsel_valid_pops_tt:0 "There are @acceptance_status_1! $violent_hostility$ animist [Concept('concept_pop', '$concept_pops$')] in our states."
 sb_inboekstelsel_discrete_effect_tt:0 "1% of @acceptance_status_1! $violent_hostility$ animist [Concept('concept_pop', '$concept_pops$')] become [GetPopType('slaves').GetName].\n0.5% of animist @acceptance_status_1! $violent_hostility$ [Concept('concept_pop', '$concept_pops$')] become radical.\n2.5% of Boer [Concept('concept_pop', '$concept_pops$')] become loyalist.\nThe Groot Boere receive +10% strength and +1 approval.\nRelations with the Cape Colony and Britain worsen by #v 2#!."
 sb_inboekstelsel_expanded_effect_tt:0 "2.5% of @acceptance_status_1! $violent_hostility$ animist [Concept('concept_pop', '$concept_pops$')] become [GetPopType('slaves').GetName].\n1% of animist @acceptance_status_1! $violent_hostility$ [Concept('concept_pop', '$concept_pops$')] become radical.\n5% of Boer [Concept('concept_pop', '$concept_pops$')] become loyalist.\nThe Groot Boere receive +25% strength and +2 approval.\nRelations with the Cape Colony and Britain worsen by #v 5#!."
 sb_inboekstelsel_relax_effect_tt:0 "1% of [GetPopType('slaves').GetName] become [GetPopType('laborers').GetName].\n1% of @acceptance_status_1! $violent_hostility$ [Concept('concept_pop', '$concept_pops$')] lose radicalism.\n1% of Boer [Concept('concept_pop', '$concept_pops$')] lose loyalism.\nThe Groot Boere lose #v 1#! approval.\nRelations with Britain improve by #v 5#!."
 sb_inboekstelsel_enforced:0 "Inboekstelsel Enforced"
 sb_inboekstelsel_enforced_desc:0 "The frontier government has sanctioned a limited seizure of marginalized local households under the discrete inboekstelsel."
 sb_inboekstelsel_enforced_slave_trade:0 "Inboekstelsel Enforced"
 sb_inboekstelsel_enforced_slave_trade_desc:0 "The frontier government has sanctioned a broader seizure of marginalized local households under the expanded inboekstelsel."
 sb_inboekstelsel_relaxed:0 "Inboekstelsel Relaxed"
 sb_inboekstelsel_relaxed_desc:0 "The frontier government has ordered magistrates and commandos to release a small number of bonded households and reduce pressure on the most hostile communities."
 sb_great_trek.006.t:0 "Potchefstroom Founded"
 sb_great_trek.006.d:0 "A Boer foothold now stands beyond the Vaal. What began as Oranje's advance into the western Transvaal can now harden into a separate inland republic centered upon Potchefstroom, with its own commandant and council."
 sb_great_trek.006.f:0 "A laager had become a town, and a town might yet become a republic."
 sb_great_trek.006.a:0 "Play as Transvaal."
 sb_great_trek.006.b:0 "So be it."
