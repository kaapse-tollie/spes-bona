l_english:
 # ### TO REVIEW ###
 sb_great_trek.030.t:0 "The Trek Continues"
 sb_great_trek.030.d:0 "Reports of surveyed farms, busy markets and a sitting Volksraad in [ROOT.GetCountry.GetName] have spread among the Boer communities of the Cape. What was once dismissed as a scattering of trekker camps now offers land, kin and government beyond Cape Town's reach. Families are selling what they cannot carry and making ready for the road."
 sb_great_trek.030.f:0 "The letter was read twice beneath the shade of the stoep. There was good grazing beyond the river, it said, and water enough for the herds through the dry months. A landdrost had recorded their cousin's claim, while the Volksraad had settled a quarrel over its boundaries.\n\nBy week's end, the plough and spare furniture had been sold. The Bible, seed-corn and family chests were packed beneath the wagon's canvas. At dawn, another household left the Cape behind."
 sb_great_trek.030.a:0 "Let the wagons come."
 sb_great_trek_boer_slice_tt:0 "5% of the Boer [Concept('concept_pop', '$concept_pops$')] living in each Cape-owned state will move to our trekker settlement."
 # ### TO REVIEW ###
 sb_great_trek.031.t:0 "The Market on the Mooi"
 sb_great_trek.031.d:0 "The settlement on the Mooi has grown into a busy market town. Wagons laden with farm produce and coastal goods crowd the square, artisans find no shortage of work, and new houses rise along the river. News of Potchefstroom's prosperity has reached the Cape, and Boer families are once again preparing for the journey north."
 sb_great_trek.031.f:0 ""Everywhere is bustle, life, industry and activity. Here bricks are being made, there the foundations of new buildings are being laid..."\n— #italic De Staats Courant der ZAR, editorial, 1 July 1859#!"
 sb_great_trek.031.a:0 "There is room for more."
 # ### TO REVIEW ###
 sb_great_trek.040.t:0 "The Vrystaat Secured"
 sb_great_trek.040.d:0 "The Basotho have been driven east of the Caledon into their mountain strongholds. The Volksraad's authority now stretches across the open veld between the Orange and the Vaal. Field-cornets and surveyors are marking out farms along the secured frontier, and news of victory and available land is drawing fresh wagons from the Cape."
 sb_great_trek.040.f:0 "'Should the Free State succeed in driving them into the mountains, and obtaining possession of all the more level Basuto country...'\n— John Burnet, #italic Civil Commissioner of Aliwal North, 1865#!"
 sb_great_trek.040.a:0 "Let the wagons come."
 # ### TO REVIEW ###
 sb_great_trek.041.t:0 "The Mooi River Country"
 sb_great_trek.041.d:0 "Potchefstroom's authority now reaches across the western Highveld. The landdrost hears disputes, field-cornets muster the burghers, and farm claims are entered in the republic's registers. Word that the country north of the Vaal is held and governed is already drawing fresh wagons from the Cape."
 sb_great_trek.041.f:0 ""After we had crossed the Vaal, the trekkers took up their farms on condition that they live upon the land. Potgieter settled on the Mooi River."\n— J. P. Marais, #italic recollections recorded by G. A. Odé#!"
 sb_great_trek.041.a:0 "Let the wagons cross the Vaal."
 # ### TO REVIEW ###
 sb_great_trek.042.t:0 "The Limpopo Frontier Won"
 sb_great_trek.042.d:0 "Zoutpansberg has grown from a handful of northern commandos into a republic that can claim the wider Limpopo frontier. Farms, laagers, and trading posts now bind the bushveld to the volksraad."
 sb_great_trek.042.f:0 "Northbound wagons emerged from the highveld into thorn country and heat. Beside the first trading post, a clerk entered farms into the republic's book while commandos watched roads that ran farther toward the Limpopo."
 sb_great_trek.042.a:0 "Let them come north."
 # ### TO REVIEW ###
 sb_great_trek.044.t:0 "Lydenburg Secured"
 sb_great_trek.044.d:0 "Lydenburg now commands the eastern Transvaal. The highveld roads, farms, and frontier posts answer to one republican authority, giving the eastern trek a country of its own."
 sb_great_trek.044.f:0 "From the escarpment, riders could see wagon roads descending toward the eastern lowlands. Posts now guarded those approaches, and the farms behind them answered to a council capable of calling out more than a single neighbourhood commando."
 sb_great_trek.044.a:0 "Let them come east."
 # ### TO REVIEW ###
 sb_great_trek.043.t:0 "Natal Secured"
 sb_great_trek.043.d:0 "Natal is no longer merely a coastal foothold. From Port Natal to the inland frontier, farms, wagon roads, and a republican council now bind the region into the wider trek."
 sb_great_trek.043.f:0 "Salt air reached the wagon camps before the harbour came into view. Merchants spoke of ships and customs dues beside farmers discussing grazing, and the new republic learned that a frontier ending at the sea required different institutions from one bounded by rivers."
 sb_great_trek.043.a:0 "Then let them come."
 # ### TO REVIEW ###
 sb_great_trek.045.t:0 "The Bechuanaland Republic Secured"
 sb_great_trek.045.d:0 "Stellaland-Goshen now commands the Bechuanaland corridor. What began as a fragile frontier settlement has become a republic with its own roads, farms, and commando lines."
 sb_great_trek.045.f:0 "The road through Bechuanaland no longer passed only scattered laagers and disputed farms. A magistrate's notice stood at the crossing, commandos patrolled the approaches, and settlers carried their petitions to a government claiming the corridor as its country."
 sb_great_trek.045.a:0 "The corridor is ours."
 # ### TO REVIEW ###
 sb_great_trek.101.t:0 "A Settled Coast"
 sb_great_trek.101.d:0 "Natalia is no longer merely a frontier laager clinging to the coast. With the trek complete, the republic may begin to exchange its improvised wartime institutions for a more regular civil order suited to a settled maritime state."
 sb_great_trek.101.f:0 "In the council chamber, commando rolls shared a table with harbour accounts and town ordinances. The institutions of movement and war had carried Natalia to the coast; the business before the volksraad was deciding which of them could govern a settled republic."
 sb_great_trek.101.a:0 "Let Natalia be settled."
 # ### TO REVIEW ###
 sb_great_trek.002.t:0 "In Mzilikazi's Wake"
 sb_great_trek.002.d:0 "The attack on Vegkop has been avenged along the Marico. After days of pursuit, our commandos have broken [SCOPE.sCharacter('mzilikazi').GetFirstNameNoFormatting]'s regiments and driven his people beyond the Limpopo. In their wake, trekker families are already turning their wagons towards the Highveld."
 sb_great_trek.002.f:0 "'They then left their land, and what had been his became ours.'\n— Sarel Cilliers, #italic on the 1837 campaign against Mzilikazi#!"
 sb_great_trek.002_tt:0 "A #v large number#! of Boer [Concept('concept_pop', '$concept_pops$')] will move from [SCOPE.sCountry('cape_colony').GetName] to [SCOPE.sCountry('oranje').GetName]."
 sb_great_trek.002.a:0 "The wagons will follow."

 law_discrete_inboekstelsel:0 "Inboekstelsel System"
 law_discrete_inboekstelsel_desc:0 "A localized system of coerced child apprenticeship and bonded labor is tolerated on the frontier, while large-scale slave imports remain formally closed."
 amendment_sb_expanded_inboekstelsel:0 "Expanded Inboekstelsel"
 amendment_sb_expanded_inboekstelsel_desc:0 "Commandos and magistrates are permitted to widen the inboekstelsel into a harsher coerced-labor order, while still refusing overseas slave imports."
 je_sb_inboekstelsel_system:0 "The Inboekstelsel System"
 je_sb_inboekstelsel_system_reason:0 "The Boer republics maintain coerced labor through the inboekstelsel: a frontier system of apprenticeship, captive-taking, and household service that sits uneasily beside British anti-slavery pressure."
 je_sb_inboekstelsel_system_status:0 "Decide each year whether to enforce the inboekstelsel more harshly or relax its pressure under unrest and British scrutiny."
 je_sb_inboekstelsel_enforce_button:0 "Enforce the Inboekstelsel"
 je_sb_inboekstelsel_enforce_button_desc:0 "Bind a small share of the most marginalized animist households into coerced service for Boer farms. Expanded law lets the commandos enforce the system more widely, but worsens relations with Britain and the Cape."
 je_sb_inboekstelsel_relax_button:0 "Relax the Inboekstelsel"
 je_sb_inboekstelsel_relax_button_desc:0 "Free a small share of slave households and ease pressure on violently hostile communities, at the cost of Groot Boere approval and Boer loyalist confidence."
 sb_inboekstelsel_cooldown_tt:0 "The inboekstelsel has not been adjusted in the past year."
 sb_inboekstelsel_valid_pops_tt:0 "There are @acceptance_status_1! [Concept('concept_acceptance_status', '$violent_hostility$')] animist [Concept('concept_pop', '$concept_pops$')] in our states."
 sb_inboekstelsel_discrete_effect_tt:0 "#n 1%#! of @acceptance_status_1! [Concept('concept_acceptance_status', '$violent_hostility$')] animist [Concept('concept_pop', '$concept_pops$')] become [GetPopType('slaves').GetName].\n• #n 0.5%#! of animist @acceptance_status_1! [Concept('concept_acceptance_status', '$violent_hostility$')] [Concept('concept_pop', '$concept_pops$')] become more [concept_radical]."
 sb_inboekstelsel_expanded_effect_tt:0 "#n 2.5%#! of @acceptance_status_1! [Concept('concept_acceptance_status', '$violent_hostility$')] animist [Concept('concept_pop', '$concept_pops$')] become [GetPopType('slaves').GetName].\n• #n 1%#! of animist @acceptance_status_1! [Concept('concept_acceptance_status', '$violent_hostility$')] [Concept('concept_pop', '$concept_pops$')] become more [concept_radical]."
 sb_inboekstelsel_relax_effect_tt:0 "1% of [GetPopType('slaves').GetName] become [GetPopType('laborers').GetName].\n• 1% of @acceptance_status_1! [Concept('concept_acceptance_status', '$violent_hostility$')] [Concept('concept_pop', '$concept_pops$')] lose [Concept('concept_radical', '$concept_radicalism$')].\n• #n 1%#! of Boer [Concept('concept_pop', '$concept_pops$')] lose [Concept('concept_loyalist', '$concept_loyalism$')]."
 sb_inboekstelsel_enforced:0 "Inboekstelsel Enforced"
 sb_inboekstelsel_enforced_desc:0 "The frontier government has sanctioned a limited seizure of marginalized local households under the discrete inboekstelsel."
 sb_inboekstelsel_enforced_slave_trade:0 "Inboekstelsel Enforced"
 sb_inboekstelsel_enforced_slave_trade_desc:0 "The frontier government has sanctioned a broader seizure of marginalized local households under the expanded inboekstelsel."
 sb_inboekstelsel_relaxed:0 "Inboekstelsel Relaxed"
 sb_inboekstelsel_relaxed_desc:0 "The frontier government has ordered magistrates and commandos to release a small number of bonded households and reduce pressure on the most hostile communities."
 # ### TO REVIEW ###
 sb_great_trek.006.t:0 "A Republic Beyond the Vaal"
 sb_great_trek.006.d:0 "The settlement on the Mooi River has become the seat of government for the burghers beyond the Vaal. A landdrost now hears their disputes, farm registers are filling, and a council has assembled at Potchefstroom. What began as Oranje's northern outpost is becoming a republic in its own right."
 sb_great_trek.006.f:0 "'They have found a dwelling-place of their own.'\n— Viator, #italic De Zuid-Afrikaan, 19 June 1840#!"
 sb_great_trek.006.a:0 "Our future lies beyond the Vaal."
 sb_great_trek.006.b:0 "Our future remains with Oranje."
