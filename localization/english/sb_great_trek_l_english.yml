l_english:
 # ### REVIEWED ###
 sb_great_trek.003.t:0 "The Great Trek"
 sb_great_trek.003.d:0 "The Great Trek has begun. Disputes over frontier policy, the emancipation of the slaves and the reach of British colonial rule have sent Boer families north with their wagons. Beyond the Orange River they seek land and a government of their own, but the interior is neither empty nor unclaimed. Mzilikazi, once a commander under the great Shaka Zulu, holds the western Highveld with his Ndebele regiments. Along the Caledon, the cunning Moshoeshoe gathers scattered communities into a growing Basotho kingdom, threatening to raid our supplies. While beyond the Drakensberg, Dingane rules from the great kraal at uMgungundlovu, having taken Shaka's throne in blood, and commands one of southern Africa's most formidable armies. Building one republic or several will require diplomacy, toil and blood; nor can the trekkers know how long Britain will remain satisfied beyond the Great Karoo..."
 sb_great_trek.003.f:0 "'We are now quitting the fruitful land of our birth... and are entering a wild and dangerous territory.'\n— Piet Retief, #italic Manifesto of the Emigrant Farmers, 1837#!"
 sb_great_trek.003.a:0 "We shall make our future beyond the frontier."

 # ### TO REVIEW ###
 sb_great_trek.030.t:0 "The Trek Continues"
 sb_great_trek.030.d:0 "Reports of surveyed farms, busy markets and a sitting Volksraad in [ROOT.GetCountry.GetName] have spread among the Boer communities of the Cape. What was once dismissed as a scattering of trekker camps now offers land, kin and government beyond Cape Town's reach. Families are selling what they cannot carry and making ready for the road."
 sb_great_trek.030.f:0 "The letter was read twice beneath the shade of the stoep. There was good grazing beyond the river, it said, and water enough for the herds through the dry months. A landdrost had recorded their cousin's claim, while the Volksraad had settled a quarrel over its boundaries.\n\nBy week's end, the plough and spare furniture had been sold. The Bible, seed-corn and family chests were packed beneath the wagon's canvas. At dawn, another household left the Cape behind."
 sb_great_trek.030.a:0 "Welcome the incoming families."




# ### REVIEWED ###
 sb_great_trek.031.t:0 "The Market on the Mooi"
 sb_great_trek.031.d:0 "The settlement on the Mooi has grown into a busy market town. Wagons laden with farm produce and coastal goods crowd the square, artisans find no shortage of work, and new houses rise along the river. News of Potchefstroom's prosperity has reached the Cape, and Boer families are once again preparing for the journey north."
 sb_great_trek.031.f:0 ""Everywhere is bustle, life, industry and activity. Here bricks are being made, there the foundations of new buildings are being laid..."\n— #italic De Staats Courant der ZAR, editorial, 1 July 1859#!"
 sb_great_trek.031.a:0 "There is room for more."

# ### TO REVIEW ###
 sb_great_trek.032.t:0 "Natalia Takes Root"
 sb_great_trek.032.d:0 "Natalia has begun to prosper. New farms supply Pietermaritzburg's markets, workshops are opening in the town, and the land office struggles to keep pace with fresh claims. Word of work, land and a Boer government beyond the Drakensberg has reached the Cape. Another wave of families is preparing to follow the first trekkers into Natal."
 sb_great_trek.032.f:0 "'You can scarcely imagine how quickly the town is being built. Masons and sawyers would find a good living here.'\n— #italic Letter from Pietermaritzburg, De Ware Afrikaan, November 1840#!"
 sb_great_trek.032.a:0 "Make room below the Drakensberg."
 sb_great_trek_boer_slice_tt:0 "#v 5%#! of the Boer [Concept('concept_pop', '$concept_pops|q$')] living in each Cape-owned state will move to [ROOT.GetCountry.GetName]."

 # ### TO REVIEW ###
 sb_great_trek.040.t:0 "The Vrystaat Secured"
 sb_great_trek.040.d:0 "The Volksraad's authority now holds from the Orange River to the Vaal. Landdrosts and field-cornets have marked out the districts across the Highveld plains, turning scattered trekker outposts into a settled republic whose claim draws fresh families north from the Cape."
 sb_great_trek.040.f:0 "A stone beacon, freshly whitewashed, marked where the farm met the open grass between the Modder and the Caledon. Beside his saddlebags, the landdrost checked the surveyor's sketch against the field-cornet's list of burghers and paced the boundary once more.\n\nNo trekker camp along that stream still lived out of wagon chests; each stone cairn fixed a freehold, a tax roll and a seat in the district court."
 sb_great_trek.040.a:0 "Survey the Vrystaat for the newcomers."
 # ### TO REVIEW ###
 sb_great_trek.041.t:0 "The Western Highveld"
 sb_great_trek.041.d:0 "Potchefstroom's authority now reaches across the western Highveld. Landdrosts hear disputes, field-cornets muster the burghers, and farm titles are entered in the republic's registers, convincing wavering households in the Cape that the country north of the Vaal is settled for good."
 sb_great_trek.041.f:0 "'After we had crossed the Vaal, the trekkers took up their farms on condition that they live upon the land. Potgieter settled on the Mooi River.'\n— J. P. Marais, #italic recollections recorded by G. A. Odé#!"
 sb_great_trek.041.a:0 "Open the Highveld registers."
 # ### TO REVIEW ###
 sb_great_trek.042.t:0 "The Limpopo Frontier Won"
 sb_great_trek.042.d:0 "The commandos beneath the Soutpansberg have turned a distant ivory camp into a settled northern republic. From the mountain passes to the Limpopo, the Volksraad's field-cornets now hold the bushveld tracks, drawing bolder families north from the Cape to try their fortune at the edge of the trek."
 sb_great_trek.042.f:0 "Beyond the Highveld escarpment, wagons dropped into thornveld, mopane and midday heat that spared neither oxen nor men. At Schoemansdal, hunters unloaded tusks beside bales of Cape lead and coffee while a field-cornet chalked the boundaries of new valley farms.\n\nFever and distance kept the northernmost republic leaner than the southern towns, yet its burghers held the Limpopo approaches in their own name."
 sb_great_trek.042.a:0 "Settle the Limpopo bushveld."
 # ### TO REVIEW ###
 sb_great_trek.044.t:0 "Lydenburg Secured"
 sb_great_trek.044.d:0 "Across the eastern Highveld and the escarpment passes, Lydenburg's scattered farmsteads have coalesced into a single republic. With the districts bordering Pedi and Swazi territory brought under one Volksraad, fresh families from the Cape are turning their wagons east."
 sb_great_trek.044.f:0 "Mist clung to the Berg above the Ohrigstad road, where earlier fever had driven the trekkers up onto higher grass. Below the pass, riders checked cattle brands along the streams that ran east toward the lowveld, where neighbours had once answered only to their own field-cornet.\n\nA seat in Lydenburg's council now bound those border farms into a single eastern commonwealth."
 sb_great_trek.044.a:0 "Claim the eastern Highveld."
 # ### TO REVIEW ###
 sb_great_trek.043.t:0 "Natal Secured"
 sb_great_trek.043.d:0 "[ROOT.GetCountry.GetName] is no longer a precarious encampment beneath the Drakensberg. Holding both the inland pastures and Port Natal's harbour, the republic has secured a home between the mountains and the Indian Ocean—and families in the Cape are already packing to join them."
 sb_great_trek.043.f:0 "At Port Natal, the customs clerk dipped his pen to enter wool, hides and gunpowder against ships riding beyond the sandbar. Three days' trek inland, ox-wagons still creaked down the Drakensberg passes toward Pietermaritzburg.\n\nUnlike the landlocked Highveld republics, a Boer state with an anchorage had to answer both to its farmers on the pastures and to the sea trade at its wharf."
 sb_great_trek.043.a:0 "Bind the coast to the republic."
 # ### TO REVIEW ###
 sb_great_trek.045.t:0 "The Bechuanaland Republic Secured"
 sb_great_trek.045.d:0 "Along the dry western borderlands, [ROOT.GetCountry.GetName] has secured the Bechuanaland trade corridor. What began as rival trekker claims at Vryburg and Rooigrond now stands as an ordered republic, drawing land-hungry families up the missionary road from the Cape."
 sb_great_trek.045.f:0 "Every northward trader and missionary bound from Kimberley toward the interior had to water oxen along the same dry track past Vryburg. Where freebooters and Tswana headmen had lately disputed every pan and well, beacon stones and quitrent titles now lined the wagon road.\n\nControl of that narrow corridor gave the western borderers leverage far out of proportion to their numbers."
 sb_great_trek.045.a:0 "Plant the republic along the corridor."

 # ### TO REVIEW ###
 sb_great_trek.046.t:0 "A Republic in Zululand"
 sb_great_trek.046.d:0 "The Nieuwe Republiek now holds all of Zululand. What began as a frontier land grant around Vryheid in return for aid to the uSuthu has grown into an established Boer state reaching from the Highveld approaches to the sea, attracting new settlers from the Cape."
 sb_great_trek.046.f:0 "Survey chains were stretched across thorn valleys where volunteer horsemen had lately ridden in uSuthu service. In Vryheid's new landdrost office, rough promises of farms in Zululand were turned into numbered grants stretching east toward St. Lucia.\n\nWhat had begun as a mercenary bargain on the Zulu border was now laid out as permanent Boer country."
 sb_great_trek.046.a:0 "Confirm the Vryheid settlement."
 # ### (DP) REVIEWED ###
 sb_great_trek.002.t:0 "In Mzilikazi's Wake"
 sb_great_trek.002.d:0 "The attack on Vegkop has been avenged along the Marico. After days of pursuit, our commandos have broken [SCOPE.sCharacter('mzilikazi').GetFirstNameNoFormatting]'s regiments and driven his people beyond the Limpopo. In their wake, trekker families are already turning their wagons towards the Highveld."
 sb_great_trek.002.f:0 "'They then left their land, and what had been his became ours.'\n— Sarel Cilliers, #italic on the 1837 campaign against Mzilikazi#!"
 sb_great_trek.002_tt:0 "A #v large number#! of Boer [Concept('concept_pop', '$concept_pops|q$')] will move from [SCOPE.sCountry('cape_colony').GetName] to [SCOPE.sCountry('oranje').GetName]."
 sb_great_trek.002.a:0 "The wagons will follow."

 law_discrete_inboekstelsel:0 "Inboekstelsel System"
 law_discrete_inboekstelsel_desc:0 "A localized system of coerced child apprenticeship and bonded labor is tolerated on the frontier, while large-scale slave imports remain formally closed."
 amendment_sb_expanded_inboekstelsel:0 "Expanded Inboekstelsel"
 amendment_sb_expanded_inboekstelsel_desc:0 "Commandos and magistrates are permitted to widen the inboekstelsel into a harsher coerced-labor order, while still refusing overseas slave imports."

# ### TO REVIEW ###
 je_sb_inboekstelsel_system:0 "The Inboekstelsel System"
 je_sb_inboekstelsel_system_reason:0 "[ROOT.GetCountry.GetName] maintains unpaid frontier farm labour through the inboekstelsel, a system of coerced apprenticeship and household service that binds animist communities to settler estates. Year by year, the authorities must weigh landholders' demands for stricter enforcement against local unrest and British anti-slavery scrutiny."
 je_sb_inboekstelsel_system_status:0 "The inboekstelsel remains active across [ROOT.GetCountry.GetName], leaving magistrates to enforce bonded labour or ease its reach as frontier pressures shift."
 je_sb_inboekstelsel_enforce_button:0 "Enforce the Inboekstelsel"
 je_sb_inboekstelsel_enforce_button_desc:0 "Bind a small share of the most marginalized animist households into coerced service for Boer farms. Expanded law lets the commandos enforce the system more widely, but worsens relations with Britain and the Cape."
 je_sb_inboekstelsel_relax_button:0 "Relax the Inboekstelsel"
 je_sb_inboekstelsel_relax_button_desc:0 "Free a small share of slave households and ease pressure on violently hostile communities, at the cost of Groot Boere approval and Boer loyalist confidence."
 sb_inboekstelsel_cooldown_tt:0 "The inboekstelsel has not been adjusted in the past year."
 sb_inboekstelsel_valid_pops_tt:0 "There are @acceptance_status_1! [Concept('concept_acceptance_status', '$violent_hostility|q$')] animist [Concept('concept_pop', '$concept_pops|q$')] in our states."
 sb_inboekstelsel_discrete_effect_tt:0 "#n 1%#! of @acceptance_status_1! [Concept('concept_acceptance_status', '$violent_hostility|q$')] animist [Concept('concept_pop', '$concept_pops|q$')] become [GetPopType('slaves').GetName].\n• #n 0.5%#! of animist @acceptance_status_1! [Concept('concept_acceptance_status', '$violent_hostility|q$')] [Concept('concept_pop', '$concept_pops|q$')] become more [concept_radical]."
 sb_inboekstelsel_expanded_effect_tt:0 "#n 2.5%#! of @acceptance_status_1! [Concept('concept_acceptance_status', '$violent_hostility|q$')] animist [Concept('concept_pop', '$concept_pops|q$')] become [GetPopType('slaves').GetName].\n• #n 1%#! of animist @acceptance_status_1! [Concept('concept_acceptance_status', '$violent_hostility|q$')] [Concept('concept_pop', '$concept_pops|q$')] become more [concept_radical]."
 sb_inboekstelsel_relax_effect_tt:0 "1% of [GetPopType('slaves').GetName] become [GetPopType('peasants').GetName].\n• 1% of @acceptance_status_1! [Concept('concept_acceptance_status', '$violent_hostility|q$')] [Concept('concept_pop', '$concept_pops|q$')] lose [Concept('concept_radical', '$concept_radicalism|q$')].\n• #n 1%#! of Boer [Concept('concept_pop', '$concept_pops|q$')] lose [Concept('concept_loyalist', '$concept_loyalism|q$')]."
 sb_inboekstelsel_enforced:0 "Inboekstelsel Enforced"
 sb_inboekstelsel_enforced_desc:0 "The frontier government has sanctioned a limited seizure of marginalized local households under the discrete inboekstelsel."
 sb_inboekstelsel_enforced_slave_trade:0 "Inboekstelsel Enforced"
 sb_inboekstelsel_enforced_slave_trade_desc:0 "The frontier government has sanctioned a broader seizure of marginalized local households under the expanded inboekstelsel."
 sb_inboekstelsel_relaxed:0 "Inboekstelsel Relaxed"
 sb_inboekstelsel_relaxed_desc:0 "The frontier government has ordered magistrates and commandos to release a small number of bonded households and reduce pressure on the most hostile communities."
 # ### REVIEWED ###
 sb_great_trek.006.t:0 "A Republic Beyond the Vaal"
 sb_great_trek.006.d:0 "The settlement on the Mooi River has become the seat of government for the burghers beyond the Vaal. A landdrost now hears their disputes, farm registers are filling, and a council has assembled at Potchefstroom. What began as Oranje's northern outpost is becoming a republic in its own right."
 sb_great_trek.006.f:0 "'They have found a dwelling-place of their own.'\n— Viator, #italic De Zuid-Afrikaan, 19 June 1840#!"
 sb_great_trek.006.a:0 "Our future lies beyond the Vaal."
 sb_great_trek.006.b:0 "Our future remains with [ROOT.GetCountry.GetName]."
