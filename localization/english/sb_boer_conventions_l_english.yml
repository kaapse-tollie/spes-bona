l_english:
 sb_boer_conventions_refusal_warning_tt:0 "#n Refusing may later invite British intervention over slavery.#!"
 sb_boer_conventions_zpb_crackdown_warning_tt:0 "#n Pressing Pretoria's authority may lead to war with Zoutpansberg and its Boer sympathizers.#!"
 sb_boer_conventions_zpb_frontier_spirit_warning_tt:0 "#n Backing Zoutpansberg's slave frontier may lead to war with Britain.#!\n#n $TRN$ will lose its [Concept('concept_recognized_power','$concept_recognized_power_short$')] status.#!"
 sb_boer_conventions_frontier_order_warning_tt:0 "#n Entrenching the slave frontier may lead to war with Britain.#!"
# ### REVIEWED ###
sb_boer_conventions.140.t:0 "The Sand River Convention"
sb_boer_conventions.140.d:0 "The Empire's Assistant Commissioners have offered to recognise the emigrant farmers beyond the Vaal as independent, provided that slavery be prohibited throughout their territory. However, the rowdy boers of Zoutpansberg have urged the Potchefstroom Volksraad to reject the Convention, insisting that no British commissioner may determine which laws the frontier shall keep."
sb_boer_conventions.140.f:0 "'To govern themselves according to their own laws without any interference.'\n\n'No slavery is or shall be permitted or practised.'\n— #italic Sand River Convention, 17 January 1852#!"
sb_boer_conventions.140.a:0 "Sign the Convention."
sb_boer_conventions.140.b:0 "Zoutpansberg shows the way."
# ### REVIEWED ###
sb_boer_conventions.161.t:0 "The Sand River Convention"
sb_boer_conventions.161.d:0 "The Empire's Assistant Commissioners have offered to recognise the emigrant farmers beyond the Vaal as independent, provided that slavery be prohibited throughout their territory. Many in the Volksraad hail the offer as the object of the trek fulfilled, while some frontier commandants exclaim that a republic which accepts British limits upon its laws is independent only in name."
sb_boer_conventions.161.f:0 "'To govern themselves according to their own laws without any interference.'\n\n'No slavery is or shall be permitted or practised.'\n— #italic Sand River Convention, 17 January 1852#!"
sb_boer_conventions.161.a:0 "Sign the Convention."
sb_boer_conventions.161.b:0 "The frontier answers to the Volksraad."
# ### TO REVIEW ###
sb_boer_conventions.141.t:0 "Bloemfontein"
sb_boer_conventions.141.d:0 "Britain is prepared to withdraw its claims between the Orange and the Vaal and recognize the Orange Free State as a settled republic. The price is a legal order more acceptable to London, above all in the question of slavery."
sb_boer_conventions.141.f:0 "The convention named the rivers, renounced British authority, and promised a republic. Beside the signatures, however, stood the condition upon which London had insisted: freedom between the Orange and the Vaal would begin with a law Britain could recognize."
sb_boer_conventions.141.a:0 "Accept the terms."
sb_boer_conventions.141.b:0 "We shall answer on our own terms."
# ### TO REVIEW ###
sb_boer_conventions.160.t:0 "Albany's Abolition Ordinance"
sb_boer_conventions.160.d:0 "As Britain presses the interior republics over slavery, Albany cannot be left as an exception on the eastern frontier. The colonial office now requires the new colony to abolish slavery outright."
sb_boer_conventions.160.f:0 "In Grahamstown, a clerk copied the abolition ordinance into Albany's new statute book. The colony had scarcely acquired its own seal before London reminded it that imperial recognition carried imperial limits."
sb_boer_conventions.160.a:0 "Issue the ordinance."
# ### REVIEWED ###
sb_boer_conventions.143.t:0 "Zoutpansberg Unchecked"
sb_boer_conventions.143.d:0 "Reports of slave-raiding and the sale of captives in Zoutpansberg have reached the halls of Westminister. Britain reminds the Volksraad that recognition north of the Vaal was granted on the express condition that slavery be prohibited. Transvaal must bring the northern republic to order, or risk Britain declaring the Sand River Convention void."
sb_boer_conventions.143.f:0 "'It stipulated that there should be no slavery, and with that single reservation washed its hands finally.'\n— Arthur Conan Doyle, #italic The Great Boer War#!"
sb_boer_conventions.143.a:0 "Bring Zoutpansberg to order."
sb_boer_conventions.143.b:0 "Then we stand with Zoutpansberg."

# ### TO REVIEW ###
sb_boer_conventions.146.t:0 "A Northern Compact"
sb_boer_conventions.146.d:0 "Transvaal has rejected British conditions and turned northward instead, offering Zoutpansberg a compact of defense, transit, trade privilege, and eventual union under a shared frontier order."
sb_boer_conventions.146.f:0 "The northern delegates spread a rough map across the wagon chest. Roads to the Limpopo were traced beside promises of mutual defence and open passage; no British signature appeared anywhere on the page."
sb_boer_conventions.146.a:0 "Stand with Pretoria."
# ### TO REVIEW ###
sb_boer_conventions.145.t:0 "The Convention Discredited"
sb_boer_conventions.145.d:0 "By failing to master Zoutpansberg, we have handed Britain the pretext it sought. London now points to slave-raiding in the north as proof that Transvaal cannot uphold the terms of recognition, and imperial intervention is gathering."
sb_boer_conventions.145.f:0 "The dispatch from the Colonial Office quoted the convention line by line, then listed every northern abuse Pretoria had failed to stop. By the final page, recognition had ceased to read as a guarantee and begun to read as evidence for intervention."
sb_boer_conventions.145.a:0 "Then we must bear the consequences."
# ### REVIEWED ###
sb_boer_conventions.147.t:0 "Pretoria's Ultimatum"
sb_boer_conventions.147.d:0 "Transvaal demands that Zoutpansberg submit to its authority and abolish our coercive labour system that has placed the Sand River Convention in jeopardy. To yield would bring the northern republic to an end; to refuse would mean invoking the Boer compact and calling upon the sister republics to defend Zoutpansberg against Pretoria."
sb_boer_conventions.147.f:0 "'The Government then issued a proclamation deposing Commandant-General Schoeman from all authority, declaring Zoutpansberg in a state of blockade.'\n— George McCall Theal, #italic History of South Africa#!"
sb_boer_conventions.147.a:0 "Submit to Transvaal."
sb_boer_conventions.147.b:0 "Invoke the Boer compact."
sb_boer_conventions_147_compact_appeal_tt:0 "Appeals will be sent in turn to eligible independent Boer republics: #v $ORA$#!, #v $LYD$#!, and Boer #v $NAL$#!. Each may choose whether to #bold honor the compact#!; those that do will join Zoutpansberg if Transvaal opens a [concept_diplomatic_play]."

# ### TO REVIEW ###
# Orange Free State
sb_boer_conventions.148.t:0 "Zoutpansberg Appeals to Bloemfontein"
sb_boer_conventions.148.d:0 "Zoutpansberg has invoked the Boer Compact and appealed to the Orange Free State for aid. Pretoria presents its ultimatum as enforcement of the Sand River Convention; Zoutpansberg calls it the destruction of a sister republic. Bloemfontein must decide whether the Compact protects every signatory's independence, even against another Boer republic."
sb_boer_conventions.148.f:0 "'The two Republics bound themselves to come to each other's assistance in case the independence of either should be wantonly threatened from without.'\n— Paul Kruger, #italic Memoirs#!"
sb_boer_conventions.148.a:0 "Honour the Compact."
sb_boer_conventions.148.b:0 "The Compact does not shield Zoutpansberg."

# ### TO REVIEW ###
# Lydenburg
sb_boer_conventions.151.t:0 "Zoutpansberg Appeals to Lydenburg"
sb_boer_conventions.151.d:0 "Zoutpansberg has invoked the Boer Compact and appealed to Lydenburg for aid against Pretoria's demand for submission. If Transvaal may extinguish one frontier republic in the name of order, Lydenburg may one day face the same demand. The Volksraad must decide whether that danger outweighs the prospect of war with Pretoria."
sb_boer_conventions.151.f:0 "'The two Republics bound themselves to come to each other's assistance in case the independence of either should be wantonly threatened from without.'\n— Paul Kruger, #italic Memoirs#!"
sb_boer_conventions.151.a:0 "Honour the Compact."
sb_boer_conventions.151.b:0 "We will not fight Pretoria for Zoutpansberg."
# ### TO REVIEW ###
# Natalia
sb_boer_conventions.149.t:0 "Zoutpansberg Appeals to Natalia"
sb_boer_conventions.149.d:0 "Zoutpansberg has invoked the Boer Compact and appealed to Natalia for aid against Pretoria's demand for submission. To intervene would carry Natalia into a distant northern war; to refuse would narrow a compact meant to unite the Boer republics against coercion. The Volksraad must decide how far republican fellowship extends."
sb_boer_conventions.149.f:0 "'The two Republics bound themselves to come to each other's assistance in case the independence of either should be wantonly threatened from without.'\n— Paul Kruger, #italic Memoirs#!"
sb_boer_conventions.149.a:0 "Honour the Compact."
sb_boer_conventions.149.b:0 "The northern republics must settle this themselves."

# ### TO REVIEW ###
sb_boer_conventions.150.t:0 "The Northern Republic Defies Us"
sb_boer_conventions.150.d:0 "Zoutpansberg has refused submission and invoked the Boer compact. Pretoria must now force the issue and accept the risk of a wider civil conflict."
sb_boer_conventions.150.f:0 "The last reply from Zoutpansberg was read aloud and laid beside the British warnings. Pretoria's commandants began naming roads, mustering points, and likely allies; the question of authority had passed from the council chamber to the saddle."
sb_boer_conventions.150.a:0 "Then war it is."
dp_sb_trn_zpb_crackdown_locked:0 "Order in Zoutpansberg"
dp_sb_trn_zpb_crackdown_locked_desc:0 "A locked Transvaal-Zoutpansberg civil-war play over Pretoria's authority in the northern frontier."
dp_sb_trn_zpb_crackdown_locked_tooltip:0 "Open the scripted Zoutpansberg crackdown war."
