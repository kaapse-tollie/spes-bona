l_english:
 sb_boer_conventions_refusal_warning_tt:0 "#n Refusing may later invite British intervention over slavery.#!"
 sb_boer_conventions_zpb_crackdown_warning_tt:0 "#n Pressing Pretoria's authority may lead to war with Zoutpansberg and its Boer sympathizers.#!"
 sb_boer_conventions_zpb_frontier_spirit_warning_tt:0 "#n Backing Zoutpansberg's slave frontier may lead to war with Britain.#!\n#n $TRN$ will lose its [Concept('concept_recognized_power','$concept_recognized_power_short|q$')] status.#!"
 sb_boer_conventions_frontier_order_warning_tt:0 "#n Entrenching the slave frontier may lead to war with Britain.#!"
# ### REVIEWED ###
sb_boer_conventions.140.t:0 "The Sand River Convention"
sb_boer_conventions.140.d:0 "The Empire's Assistant Commissioners have offered to recognise the emigrant farmers beyond the Vaal as independent, provided that slavery be prohibited throughout their territory. However, the rowdy boers of Zoutpansberg have urged the Potchefstroom Volksraad to reject the Convention, insisting that no British commissioner may determine which laws the frontier shall keep."
sb_boer_conventions.140.f:0 "'To govern themselves according to their own laws without any interference.'\n\n'No slavery is or shall be permitted or practised.'\n— #italic Sand River Convention, 17 January 1852#!"
sb_boer_conventions.140.a:0 "Sign the Convention."
sb_boer_conventions.140.b:0 "Zoutpansberg shows the way."
# ### REVIEWED ###
sb_boer_conventions.161.t:0 "The Sand River Convention"
sb_boer_conventions.161.d:0 "The Empire's Assistant Commissioners have offered to recognise the emigrant farmers beyond the Vaal as independent, provided that slavery be prohibited throughout their territory. Many in the Volksraad hail the offer as the object of the trek fulfilled, while some frontier commandants exclaim that a republic which accepts British limits upon its laws is independent only in name."
sb_boer_conventions.161.f:0 "'To govern themselves according to their own laws without any interference.'\n\n'No slavery is or shall be permitted or practised.'\n— #italic Sand River Convention, 17 January 1852#!"
sb_boer_conventions.161.a:0 "Sign the Convention."
sb_boer_conventions.161.b:0 "The frontier answers to the Volksraad."
# ### REVIEWED ###
sb_boer_conventions.141.t:0 "The Bloemfontein Convention"
sb_boer_conventions.141.d:0 "Britain is prepared to extend formal recognition to the Orange Free State. In return, our republic must guarantee that slavery—in any form—be prohibited within its borders. Refusal may provide pretext for Britain to force Bloemfontein formally under London's protection."
sb_boer_conventions.141.f:0 "\"The Orange River Government shall, as hitherto, permit no slavery, or trade in slaves, in their territory north of the Orange River.\"\n\n—Article VII, #italic Bloemfontein Convention#!, 1854"
sb_boer_conventions.141.a:0 "Sign the Convention."
sb_boer_conventions.141.b:0 "Our laws are not London's to dictate."
# ### TO REVIEW ###
sb_boer_conventions.160.t:0 "Albany's Abolition Ordinance"
sb_boer_conventions.160.d:0 "As Britain presses the interior republics over slavery, Albany cannot be left as an exception on the eastern frontier. The Colonial Office now requires the new colony to abolish slavery outright."
sb_boer_conventions.160.f:0 "In Grahamstown, a clerk entered London's abolition ordinance into Albany's new statute book. Eastern settlers who had parted from Cape Town hoping for a freer hand on the frontier found instead that a separate Crown charter still answered to Downing Street."
sb_boer_conventions.160.a:0 "Issue the ordinance."
# ### REVIEWED ###
sb_boer_conventions.162.t:0 "Westminster's Condition"
sb_boer_conventions.162.d:0 "Commissioners from Britain have begun installing themselves in [ROOT.GetCountry.GetName], and are ensuring that the moratorium on slavery or forced apprenticeship is enforced. As a subject of the British realm, the Volksraad has no say in this matter."
sb_boer_conventions.162.f:0 "'No slavery or apprenticeship partaking of slavery will be tolerated by the Government of the said State.'\n— #italic Pretoria Convention, 3 August 1881#!"
sb_boer_conventions.162.a:0 "We have no choice but to obey."

# ### REVIEWED ###
sb_boer_conventions.143.t:0 "Zoutpansberg Unchecked"
sb_boer_conventions.143.d:0 "Reports of slave-raiding and the sale of captives in Zoutpansberg have reached the halls of Westminister. Britain reminds the Volksraad that recognition north of the Vaal was granted on the express condition that slavery be prohibited. Transvaal must bring the northern republic to order, or risk Britain declaring the Sand River Convention void."
sb_boer_conventions.143.f:0 "'It stipulated that there should be no slavery, and with that single reservation washed its hands finally.'\n— Arthur Conan Doyle, #italic The Great Boer War#!"
sb_boer_conventions.143.a:0 "Bring Zoutpansberg to order."
sb_boer_conventions.143.b:0 "Then we stand with Zoutpansberg."

# ### TO REVIEW ###
sb_boer_conventions.146.t:0 "A Northern Compact"
sb_boer_conventions.146.d:0 "Transvaal has rejected British conditions and turned northward instead, offering Zoutpansberg a compact of mutual defence, transit, trade privilege, and eventual union under a shared frontier order."
sb_boer_conventions.146.f:0 "At Zoutpansbergdorp, ivory-camp delegates and riders from the south spread a rough sketch-map across a wagon chest. Beside the drift crossings and wagon tracks leading toward the Limpopo, they set down terms of mutual defence and open passage—with no British commissioner's seal anywhere upon the sheet."
sb_boer_conventions.146.a:0 "Stand with Pretoria."
# ### TO REVIEW ###
sb_boer_conventions.145.t:0 "The Convention Discredited"
sb_boer_conventions.145.d:0 "With slave-raiding continuing in the north and Transvaal either unwilling or unable to enforce the Sand River terms upon Zoutpansberg, Britain has declared the conditions of recognition broken. Transvaal's standing as a recognised power is forfeit, and imperial intervention now gathers against the northern frontier."
sb_boer_conventions.145.f:0 "The dispatch from the Colonial Office quoted the Convention line by line, then listed every northern abuse Pretoria had left unchecked. By the final page, recognition had ceased to read as a guarantee and begun to read as a bill of indictment."
sb_boer_conventions.145.a:0 "Then we must bear the consequences."
# ### REVIEWED ###
sb_boer_conventions.147.t:0 "Pretoria's Ultimatum"
sb_boer_conventions.147.d:0 "Transvaal demands that Zoutpansberg submit to its authority and abolish our coercive labour system that has placed the Sand River Convention in jeopardy. To yield would bring the northern republic to an end; to refuse would mean invoking the Boer compact and calling upon the sister republics to defend Zoutpansberg against Pretoria."
sb_boer_conventions.147.f:0 "'The Government then issued a proclamation deposing Commandant-General Schoeman from all authority, declaring Zoutpansberg in a state of blockade.'\n— George McCall Theal, #italic History of South Africa#!"
sb_boer_conventions.147.a:0 "Submit to Transvaal."
sb_boer_conventions.147.b:0 "Invoke the Boer compact."
sb_boer_conventions_147_compact_appeal_tt:0 "Appeals will be sent in turn to eligible independent Boer republics: #v $ORA$#!, #v $LYD$#!, and Boer #v $NAL$#!. Each may choose whether to #bold honor the compact#!; those that do will join Zoutpansberg if Transvaal opens a [concept_diplomatic_play]."

# ### TO REVIEW ###
# Orange Free State
sb_boer_conventions.148.t:0 "Zoutpansberg Appeals to Bloemfontein"
sb_boer_conventions.148.d:0 "Zoutpansberg has invoked the Boer Compact and appealed to the Orange Free State for armed aid. Pretoria presents its ultimatum as enforcement of the Sand River Convention; Zoutpansberg calls it the destruction of a sister republic. Bloemfontein must decide whether to take up arms beside Zoutpansberg if Transvaal opens hostilities, or stand clear of a northern war."
sb_boer_conventions.148.f:0 "In Bloemfontein's council chamber, members laid the signed Boer Compact beside dispatches from Cape Town and the Vaal. One burgher tapped the clause promising help against threats to republican independence; another answered that a pact drawn against imperial annexation was never meant to drag the Free State into a war between Boers."
sb_boer_conventions.148.a:0 "Honour the Compact in arms."
sb_boer_conventions.148.b:0 "The Compact does not shield Zoutpansberg."

# ### TO REVIEW ###
# Lydenburg
sb_boer_conventions.151.t:0 "Zoutpansberg Appeals to Lydenburg"
sb_boer_conventions.151.d:0 "Zoutpansberg has invoked the Boer Compact and appealed to Lydenburg for armed aid against Pretoria's demand for submission. If Transvaal may extinguish one frontier republic by force, Lydenburg—itself born of a break with Pretoria—may face the same demand next. The Volksraad must decide whether to pledge its commandos beside Zoutpansberg or stay out of the fight."
sb_boer_conventions.151.f:0 "At Lydenburg, men who had already broken with Transvaal's #italic Grondwet#! passed Zoutpansberg's dispatch from hand to hand. Beyond the Steenkampsberg passes lay their own eastern farms; if Pretoria's commandos subdued the north without check, no one in the room doubted which road they might ride next."
sb_boer_conventions.151.a:0 "Honour the Compact in arms."
sb_boer_conventions.151.b:0 "We will not fight Pretoria for Zoutpansberg."
# ### TO REVIEW ###
# Natalia
sb_boer_conventions.149.t:0 "Zoutpansberg Appeals to Natalia"
sb_boer_conventions.149.d:0 "Zoutpansberg has invoked the Boer Compact and appealed to Natalia for armed aid against Pretoria's demand for submission. To pledge our commandos would commit Natalia to a distant war beyond the Vaal; to refuse would narrow a compact meant to guard every Boer republic against coercion. The Volksraad must decide how far republican fellowship extends."
sb_boer_conventions.149.f:0 "Riders down from the Drakensberg passes reached Pietermaritzburg with mud-splashed horses and Zoutpansberg's sealed appeal. In the Volksraad hall, burghers looked from the northern plea to their own coastal and Tugela borders, counting how many rifles could be spared to cross the mountains against fellow Boers."
sb_boer_conventions.149.a:0 "Honour the Compact in arms."
sb_boer_conventions.149.b:0 "The northern republics must settle this themselves."

# ### TO REVIEW ###
sb_boer_conventions.150.t:0 "The Northern Republic Defies Us"
sb_boer_conventions.150.d:0 "Zoutpansberg has refused submission and appealed to the sister republics under the Boer Compact. Pretoria must now enforce its ultimatum by arms and accept the risk of a wider civil conflict."
sb_boer_conventions.150.f:0 "The last reply from Zoutpansberg was read aloud and laid beside the British warnings. Pretoria's commandants began naming roads, mustering points, and likely allies; the question of authority had passed from the council chamber to the saddle."
sb_boer_conventions.150.a:0 "Call out the commandos."
dp_sb_trn_zpb_crackdown_locked:0 "Order in Zoutpansberg"
dp_sb_trn_zpb_crackdown_locked_desc:0 "A locked Transvaal-Zoutpansberg civil-war play over Pretoria's authority in the northern frontier."
dp_sb_trn_zpb_crackdown_locked_tooltip:0 "Open the scripted Zoutpansberg crackdown war."
