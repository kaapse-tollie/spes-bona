	 dp_sb_griqualand_revoke_claim_desc:0 "A diplomatic play to force the Cape to abandon its claim over Griqualand West."
	 dp_sb_griqualand_revoke_claim_tooltip:0 "Open a scripted diplomatic play to revoke the Cape claim over Griqualand West."
