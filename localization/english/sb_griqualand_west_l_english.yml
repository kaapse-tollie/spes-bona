l_english:
 sb_griqualand_west.021.t:0 "Diamonds at Kimberley"
 sb_griqualand_west.021.d:0 "Diamonds have been found around Kimberley, turning Waterboersland from a marginal frontier polity into the centre of a Cape-Oranje sovereignty crisis."
 sb_griqualand_west.021.f:0 "A stone could be pocketed. The rush that followed could not."
 sb_griqualand_west.021.a:0 "The rush begins."

 sb_griqualand_west.022.t:0 "Oranje and the Diamond Fields"
 sb_griqualand_west.022.d:0 "Oranje officials argue that Kimberley falls within the republic's interior claim, while the Cape insists that Northern Cape remains an imperial frontier question."
 sb_griqualand_west.022.f:0 "The diamonds made an old boundary dispute suddenly worth pressing."
 sb_griqualand_west.022.a:0 "Press our claim."
 sb_griqualand_west.022.b:0 "Cede the question to the Cape."

 sb_griqualand_west.023.t:0 "The Griqualand West Question"
 sb_griqualand_west.023.d:0 "Oranje has pressed its claim over Kimberley. The Cape must decide whether to reject the republic outright, compensate it for standing aside, or abandon the Northern Cape claim."
 sb_griqualand_west.023.f:0 "Where the old boundary could be argued over quietly, the diamond fields made every line worth a fortune."
 sb_griqualand_west.023.a:0 "No compromise."
 sb_griqualand_west.023.b:0 "Offer compensation."
 sb_griqualand_west.023.c:0 "Cede the claim."

 sb_griqualand_west.241.t:0 "No Cape Compromise"
 sb_griqualand_west.241.d:0 "The Cape refuses to compensate Oranje for Kimberley. The republic can accept a diplomatic defeat or force the question into a wider confrontation."
 sb_griqualand_west.241.f:0 "The diamonds had made a frontier quarrel too valuable to ignore and too public to settle quietly."
 sb_griqualand_west.241.a:0 "Contest by force."
 sb_griqualand_west.241.b:0 "Back down."

 sb_griqualand_west.242.t:0 "Compensation for Kimberley"
 sb_griqualand_west.242.d:0 "The Cape offers Oranje a share of the fiscal windfall in exchange for relinquishing its claim to Kimberley. Acceptance would settle the dispute; refusal would leave only force and prestige."
 sb_griqualand_west.242.f:0 "Compensation could soften a loss of land, but not erase the question of sovereignty."
 sb_griqualand_west.242.a:0 "Accept the compensation."
 sb_griqualand_west.242.b:0 "Everything or nothing."

 sb_griqualand_west.243.t:0 "The Cape Steps Aside"
 sb_griqualand_west.243.d:0 "The Cape has withdrawn its Northern Cape claim, leaving Oranje to press Waterboersland directly over Kimberley."
 sb_griqualand_west.243.f:0 "A claim conceded on paper still had to be made real on the frontier."
 sb_griqualand_west.243.a:0 "Approach Waterboer."

 sb_griqualand_west.244.t:0 "Demand Waterboersland's Annexation"
 sb_griqualand_west.244.d:0 "With Kimberley's sovereignty settled in Cape favour, Cape ministers can now demand Waterboersland's annexation and bring the diamond fields under direct administration."
 sb_griqualand_west.244.f:0 "The dispute had moved from maps to offices, and from offices to demands."
 sb_griqualand_west.244.a:0 "Send the demand."

 sb_griqualand_west.245.t:0 "Demand Waterboersland's Submission"
 sb_griqualand_west.245.d:0 "With Kimberley's sovereignty settled in Oranje's favour, the republic can demand Waterboersland's submission while leaving Waterboer's government in place."
 sb_griqualand_west.245.f:0 "Recognition of a claim still required obedience on the ground."
 sb_griqualand_west.245.a:0 "Send the demand."

 sb_griqualand_west.025.t:0 "Authority Over the Diamond Fields"
 sb_griqualand_west.025.d:0 "A larger power has demanded that Waterboersland accept a new settlement over the Kimberley diamond fields."
 sb_griqualand_west.025.cap_d:0 "The Cape demands the annexation of Waterboersland and the Kimberley fields. Cape officials present direct rule as the only way to secure Griqua rights and imperial order over the diamond trade."
 sb_griqualand_west.025.ora_d:0 "Oranje demands that Waterboersland accept puppet status over Kimberley. The republic presents the settlement as recognition of its interior claim, but refusal will likely bring a direct diplomatic play."
 sb_griqualand_west.025.f:0 "The question was no longer whether the fields mattered, but whose authority could organize them."
 sb_griqualand_west.025.a:0 "Accept the settlement."
 sb_griqualand_west.025.b:0 "Refuse."

 sb_griqualand_west.260.t:0 "Diamond Rush"
 sb_griqualand_west.260.d:0 "With authority over Kimberley decided, diggers, merchants, and speculators are converging on the diamond fields. The rush promises wealth, disorder, and a new political economy around the mines."
 sb_griqualand_west.260.f:0 "Every cart that arrived carried a shovel, a rumour, or a claim to fortune."
 sb_griqualand_west.260.a:0 "Attract the prospectors."
 sb_griqualand_west.260.b:0 "Organize the fields."

 sb_griqualand_west_021_tt:0 "Creates #v 4#! initial Kimberley diamond-field levels. The remaining potential is delayed until Waterboersland is annexed or subordinated."
 sb_griqualand_west_022_cede_tt:0 "Relations with the Cape improve by #P +50#!. The Cape proceeds to demand Waterboersland's annexation."
 sb_griqualand_west_023_no_compromise_tt:0 "Relations with Oranje worsen by #N -50#!. Oranje may back down or contest Cape's claim by force."
 sb_griqualand_west_023_compensation_tt:0 "Oranje receives the compensation offer. The minting and burden modifiers apply only if Oranje accepts."
 sb_griqualand_west_023_cede_tt:0 "The Cape loses its claim on Northern Cape, Oranje gains it, and relations improve by #P +50#!."
 sb_griqualand_west_241_war_tt:0 "The Cape starts a Humiliate diplomatic play against Oranje. Oranje adds a demand to revoke Cape's Northern Cape claim."
 sb_griqualand_west_241_backdown_tt:0 "Oranje drops the issue. The Cape proceeds to demand Waterboersland's annexation."
 sb_griqualand_west_242_accept_tt:0 "Oranje receives a #P +20%#! minting modifier, the Cape receives the matching burden, and relations improve by #P +10#!."
 sb_griqualand_west_242_war_tt:0 "Oranje starts a diplomatic play to revoke Cape's Northern Cape claim."
 sb_griqualand_west_243_tt:0 "Oranje proceeds to demand Waterboersland's submission over Kimberley."
 sb_griqualand_west_244_tt:0 "Waterboersland receives a demand for annexation by the Cape."
 sb_griqualand_west_245_tt:0 "Waterboersland receives a demand for puppet status under Oranje."
 sb_griqualand_west_025_accept_tt:0 "If this is a Cape demand, Waterboersland is annexed and the remaining #v 16#! Kimberley potential is added without forced discovery. If this is an Oranje demand, Waterboersland becomes an Oranje puppet and the remaining fields are forced to discovery in Waterboersland."
 sb_griqualand_west_025_refuse_tt:0 "The claimant starts a diplomatic play. The remaining Kimberley fields are delayed until the war or backdown result is resolved."

 sb_kimberley_compensation:0 "Kimberley Compensation"
 sb_kimberley_compensation_desc:0 "A share of the fiscal windfall from Kimberley is being paid as compensation for relinquished claims."
 sb_kimberley_compensation_burden:0 "Kimberley Compensation Burden"
 sb_kimberley_compensation_burden_desc:0 "The government has accepted a costly compensation settlement over the Kimberley diamond fields."
