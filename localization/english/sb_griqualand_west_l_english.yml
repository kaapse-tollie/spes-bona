l_english:
 je_sb_griqualand_west_migrant_labour:0 "Labour at the Diamond Fields"
 je_sb_griqualand_west_migrant_labour_reason:0 "The mines at Kimberley draw labourers, transport riders, merchants, and their families from the Cape and the Boer republics. What begins as a temporary rush may yet become a settled claim to the country around the diggings."
 je_sb_griqualand_west_migrant_labour_status:0 "If either [GetCulture('anglo_african').GetName] or [GetCulture('boer').GetName] people comprise at least #v 10%#! of the population in [GetStateRegion('STATE_GRIQUALAND_WEST').GetName], that culture will establish the state as a [concept_homeland]."
 je_sb_griqualand_west_migrant_labour_anglo_african_complete_tt:0 "[GetCulture('anglo_african').GetName] people have established [GetStateRegion('STATE_GRIQUALAND_WEST').GetName] as a [concept_homeland]."
 je_sb_griqualand_west_migrant_labour_boer_complete_tt:0 "[GetCulture('boer').GetName] people have established [GetStateRegion('STATE_GRIQUALAND_WEST').GetName] as a [concept_homeland]."

 # ### REVIEWED ###
 sb_griqualand_west.021.t:0 "Diamonds Struck"
 sb_griqualand_west.021.d:0 "Diamonds have been found near the small frontier town of Dutoitspan. The region, while nominally under the authority of [SCOPE.sCountry('sb_local_authority_scope').GetName], has been claimed by both [SCOPE.sCountry('sb_cap_scope').GetName] and [SCOPE.sCountry('sb_oranje_country_scope').GetName], threatening to turn a backwater border discrepancy into open conflict."
 sb_griqualand_west.021.oranje_uncontested_d:0 "Diamonds have been found near the small frontier town of Dutoitspan. The retreat of Cape authority beyond the Orange River has left [SCOPE.sCountry('sb_oranje_country_scope').GetName] as the only neighbouring government able to press a claim against [SCOPE.sCountry('sb_local_authority_scope').GetName]. The diamond fields will not remain beyond its reach for long."
 sb_griqualand_west.021.waterboer_uncontested_d:0 "Diamonds have been found near the small frontier town of Dutoitspan. With Cape authority withdrawn beyond the Orange River and no neighbouring Boer government able to enforce its claims, [SCOPE.sCountry('sb_local_authority_scope').GetName] retains the fields in its own right."
 sb_griqualand_west.021.f:0 "'The largest and most complete hole ever made by human agency.'\n— Anthony Trollope, on the Kimberley diamond mine"
 sb_griqualand_west.021.a:0 "Diamonds are forever"

 # ### TO REVIEW ###
 sb_griqualand_west.027.t:0 "Diamonds Struck"
 sb_griqualand_west.027.d:0 "Diamonds have been found near Kimberley. With no separate Waterboer authority controlling the fields, the question is no longer one of frontier sovereignty but how quickly [ROOT.GetCountry.GetName] can turn the discovery into a working diamond industry."
 sb_griqualand_west.027.f:0 "Carts crowded the road into Kimberley with timber, canvas, sieves, and men who had sold almost everything for the journey. Before officials could number the claims, new pits appeared beyond the last row of tents and another rumour sent the camp running."
 sb_griqualand_west.027.a:0 "Attract the prospectors."
 sb_griqualand_west.027.b:0 "Organize the diamond workings."

 # ### REVIEWED ###
 sb_griqualand_west.022.t:0 "[ROOT.GetCountry.GetName] and the Diamond Fields"
 sb_griqualand_west.022.d:0 "A potentially very large diamond mine has been found near the banks of the Orange river. Nominally under control by [SCOPE.sCountry('sb_local_authority_scope').GetName], the exact demarcation of the border between [SCOPE.sCountry('sb_oranje_country_scope').GetName] and [SCOPE.sCountry('sb_cap_scope').GetName] has never been fully clarified. Prominent members of the Volksraad are arguing that the mines should legally fall under the authority of Bloemfontein, while Cape Town insists that the diamond fields fall under imperial protection."
 sb_griqualand_west.022.f:0 "'The Free State claims to have bought the Diamond Fields.'\n— Anthony Trollope"
 sb_griqualand_west.022.a:0 "Press our claim."
 sb_griqualand_west.022.b:0 "Our relations with [SCOPE.sCountry('sb_cap_scope').GetName] take precedence."

 # ### REVIEWED ###
 sb_griqualand_west.023.t:0 "The [SCOPE.sCountry('sb_local_authority_scope').GetName] Question"
 sb_griqualand_west.023.d:0 "[SCOPE.sCountry('sb_oranje_country_scope').GetName] has pressed its claim over the diamond fields. [ROOT.GetCountry.GetName] must decide whether to reject Bloemfontein's claims outright, compensate it for standing aside, or abandon its claim to the region."
 sb_griqualand_west.023.f:0 "'In full satisfaction of all claims which it considers it may possess to Griqualand West.'\n— Lord Carnarvon, on compensation to the Orange Free State"
 sb_griqualand_west.023.a:0 "Ignore them."
 sb_griqualand_west.023.b:0 "Offer [SCOPE.sCountry('sb_oranje_country_scope').GetName] compensation."
 sb_griqualand_west.023.c:0 "Cede our claim."

 # ### REVIEWED ###
 sb_griqualand_west.241.t:0 "Our demands rebuffed."
 sb_griqualand_west.241.d:0 "[SCOPE.sCountry('sb_cap_scope').GetName] refuses to compensate [SCOPE.sCountry('sb_oranje_country_scope').GetName] for the diamond fields. The Volksraad can either accept this diplomatic defeat or contest the question at the barrel of a gun."
 sb_griqualand_west.241.f:0 "'A party in the Volksraad wished to go to war with Britain, but the counsels of President Johannes Brand prevailed.'\n— #italic 1911 Encyclopaedia Britannica, Orange Free State#!"
 sb_griqualand_west.241.a:0 "March the commandos"
 sb_griqualand_west.241.b:0 "Back down."

 # ### REVIEWED ###
 sb_griqualand_west.242.t:0 "Compensation for the Diamond Fields"
 sb_griqualand_west.242.d:0 "[SCOPE.sCountry('sb_cap_scope').GetName] has conveyed an imperial offer of compensation to [ROOT.GetCountry.GetName] in return for the final abandonment of its claim to Griqualand West. Acceptance would settle the Diamond Fields question and fix the frontier; refusal would preserve the claim, but leave force as the only means of enforcing it."
 sb_griqualand_west.242.f:0 "'In full settlement of all claims with respect to the Diamond Fields and the question of Sovereignty over the lands hitherto in dispute.'\n— #italic Agreement between Lord Carnarvon and President Johannes Brand, 13 July 1876#!"
 sb_griqualand_west.242.a:0 "Accept the settlement."
 sb_griqualand_west.242.b:0 "The Diamond Fields are ours."

 # ### REVIEWED ###
 sb_griqualand_west.243.t:0 "[SCOPE.sCountry('sb_cap_scope').GetName] Steps Aside"
 sb_griqualand_west.243.d:0 "[SCOPE.sCountry('sb_cap_scope').GetName] has withdrawn its claim to [GetStateRegion('STATE_GRIQUALAND_WEST').GetName] and recognised [ROOT.GetCountry.GetName]'s claim instead. The decision removes one rival from the Diamond Fields dispute, but [SCOPE.sCountry('sb_local_authority_scope').GetName] still governs the territory and rejects republican sovereignty. If the republic means to turn recognition into possession, it must now obtain Waterboer's submission."
 sb_griqualand_west.243.f:0 "'The Free State claims to have bought the Diamond Fields—diamonds having been then unknown—under this deed.'\n— Anthony Trollope, #italic South Africa, 1878#!"
 sb_griqualand_west.243.a:0 "Approach [SCOPE.sCountry('sb_local_authority_scope').GetName]."
 sb_griqualand_west.243.b:0 "Demand direct incorporation."

 # ### REVIEWED ###
 sb_griqualand_west.244.t:0 "Demand [SCOPE.sCountry('sb_local_authority_scope').GetName]'s Annexation"
 sb_griqualand_west.244.d:0 "With [SCOPE.sCountry('sb_oranje_claimant_scope').GetName] choosing its relations with Cape Town over [SCOPE.sCountry('sb_oranje_country_scope').GetName]'s doubtful frontier claim, the Boer-side challenge to the diamond fields has been withdrawn. A formal notice of annexation has been drafted, ready to demand that [SCOPE.sCountry('sb_local_authority_scope').GetName] be folded into [ROOT.GetCountry.GetName] as a semi-autonomous province, bringing the diamond fields under direct administration."
 sb_griqualand_west.244.f:0 "'Griqualand West... shall become annexed to, and thenceforth be portion of the Colony of the Cape of Good Hope.'\n— #italic Griqualand West Annexation Act, 1877#!"
 sb_griqualand_west.244.a:0 "Send the notice."

 # ### REVIEWED ###
 sb_griqualand_west.245.t:0 "Demand [SCOPE.sCountry('sb_local_authority_scope').GetName]'s Submission"
 sb_griqualand_west.245.d:0 "The republic's title to the Diamond Fields has been recognised. The Volksraad has drafted terms for [SCOPE.sCountry('sb_local_authority_scope').GetName]'s incorporation into [ROOT.GetCountry.GetName]. Waterboer may retain his captaincy and continue to govern his people, provided that he acknowledges the republic's sovereignty."
 sb_griqualand_west.245.f:0 "'The rights and title of this Government to said land remained unaltered.'\n— J. C. Nielen Marais, O.F.S. Government Secretary, 1867"
 sb_griqualand_west.245.a:0 "Send the demand."

 # ### REVIEWED ###
 sb_griqualand_west.246.t:0 "Demand [SCOPE.sCountry('sb_local_authority_scope').GetName]'s Annexation"
 sb_griqualand_west.246.d:0 "With no Boer republic in a position to press a rival claim, Cape Town faces only [SCOPE.sCountry('sb_local_authority_scope').GetName]'s authority over the diamond mines. A formal notice of annexation has been drafted, ready to demand that [SCOPE.sCountry('sb_local_authority_scope').GetName] be folded into [ROOT.GetCountry.GetName] as a semi-autonomous province, bringing the diamond fields under direct administration."
 sb_griqualand_west.246.f:0 "'Griqualand West... shall become annexed to, and thenceforth be portion of the Colony of the Cape of Good Hope.'\n— #italic Griqualand West Annexation Act, 1877#!"
 sb_griqualand_west.246.a:0 "Send the notice."

 # ### REVIEWED ###
 sb_griqualand_west.247.t:0 "Demand [SCOPE.sCountry('sb_local_authority_scope').GetName]'s Annexation"
 sb_griqualand_west.247.d:0 "Having seen [SCOPE.sCountry('sb_oranje_country_scope').GetName]'s claim rebuffed, [SCOPE.sCountry('sb_oranje_claimant_scope').GetName] has declined to march the commandos. With the Boer challenge withdrawn, a formal notice of annexation has been drafted, ready to demand that [SCOPE.sCountry('sb_local_authority_scope').GetName] be folded into [ROOT.GetCountry.GetName] as a semi-autonomous province, bringing the diamond fields under direct administration."
 sb_griqualand_west.247.f:0 "'Griqualand West... shall become annexed to, and thenceforth be portion of the Colony of the Cape of Good Hope.'\n— #italic Griqualand West Annexation Act, 1877#!"
 sb_griqualand_west.247.a:0 "Send the notice."

 # ### REVIEWED ###
 sb_griqualand_west.248.t:0 "Demand [SCOPE.sCountry('sb_local_authority_scope').GetName]'s Annexation"
 sb_griqualand_west.248.d:0 "With [SCOPE.sCountry('sb_oranje_country_scope').GetName] accepting compensation in satisfaction of its claim, Cape Town can now turn to the government that holds the diamond mines. A formal notice of annexation has been drafted, ready to demand that [SCOPE.sCountry('sb_local_authority_scope').GetName] be folded into [ROOT.GetCountry.GetName] as a semi-autonomous province, bringing the diamond fields under direct administration."
 sb_griqualand_west.248.f:0 "'Griqualand West... shall become annexed to, and thenceforth be portion of the Colony of the Cape of Good Hope.'\n— #italic Griqualand West Annexation Act, 1877#!"
 sb_griqualand_west.248.a:0 "Send the notice."

 # ### REVIEWED ###
 sb_griqualand_west.249.t:0 "Demand [SCOPE.sCountry('sb_local_authority_scope').GetName]'s Annexation"
 sb_griqualand_west.249.d:0 "The confrontation over Kimberley has ended without battle, as [SCOPE.sCountry('sb_oranje_claimant_scope').GetName] abandons its challenge rather than hazard war. A formal notice of annexation has been drafted, ready to demand that [SCOPE.sCountry('sb_local_authority_scope').GetName] be folded into [ROOT.GetCountry.GetName] as a semi-autonomous province, bringing the diamond fields under direct administration."
 sb_griqualand_west.249.f:0 "'Griqualand West... shall become annexed to, and thenceforth be portion of the Colony of the Cape of Good Hope.'\n— #italic Griqualand West Annexation Act, 1877#!"
 sb_griqualand_west.249.a:0 "Send the notice."

 # ### REVIEWED ###
 sb_griqualand_west.250.t:0 "Demand [SCOPE.sCountry('sb_local_authority_scope').GetName]'s Annexation"
 sb_griqualand_west.250.d:0 "The contest over Kimberley has been decided in [ROOT.GetCountry.GetName]'s favour, and the Boer claim can no longer bar Cape Town's ambitions on the diamond mines. A formal notice of annexation has been drafted, ready to demand that [SCOPE.sCountry('sb_local_authority_scope').GetName] be folded into [ROOT.GetCountry.GetName] as a semi-autonomous province, bringing the diamond fields under direct administration."
 sb_griqualand_west.250.f:0 "'Griqualand West... shall become annexed to, and thenceforth be portion of the Colony of the Cape of Good Hope.'\n— #italic Griqualand West Annexation Act, 1877#!"
 sb_griqualand_west.250.a:0 "Send the notice."

 # ### REVIEWED ###
 sb_griqualand_west.251.t:0 "Waterboer's Choice"

 sb_griqualand_west.251.d:0 "Cape Town and the Boer republic have abandoned negotiation over the Diamond Fields. Both now demand that Waterboer's government recognise their title before force decides the question. The council must choose whether to seek Cape protection, acknowledge the Boer claim, or remain apart from the coming war."

 sb_griqualand_west.251.rejection_d:0 "The Cape has rejected the Boer claim outright, and the Volksraad has answered by calling out the commandos. Before either side moves against the other, Waterboer's government must decide whether to seek Cape protection, acknowledge the Boer title, or defend Griqualand's independence against both."

 sb_griqualand_west.251.compensation_d:0 "The Boer republic has rejected Cape compensation, insisting that its title to the Diamond Fields cannot be bought away. With both sides preparing to enforce their claims, Waterboer's government must decide whether to seek Cape protection, recognise the Boer title, or defend Griqualand's independence against both."

 sb_griqualand_west.251.f:0 "'Bringing our territory and nation under the immediate supremacy and motherly protection of Her Most Gracious Majesty Queen Victoria.'\n— Nicolaas Waterboer and the Griqua Council, #italic Address to Sir Henry Barkly, 1871#!"

 sb_griqualand_west.251.a:0 "Seek Cape protection."
 sb_griqualand_west.251.b:0 "Recognise the Boer title."
 sb_griqualand_west.251.c:0 "Griqualand answers to neither."

 # ### REVIEWED ###
 sb_griqualand_west.252.t:0 "Waterboer folds to Cape Town"
 sb_griqualand_west.252.d:0 "Waterboer has accepted Cape protection and rejected the Boer title to Griqualand West. The rival republic refuses to withdraw its claim and is calling out the commandos to enforce it. Cape Town must now make good its promise: defend Waterboer's government and keep the Diamond Fields beyond Boer control."
 sb_griqualand_west.252.f:0 "'To repel force by force, and to protect Her Majesty's subjects by every means in his power.'\n— Sir Henry Barkly, #italic Letter to President Brand, 20 March 1871#!"
 sb_griqualand_west.252.a:0 "Repel the commandos."

 # ### TO REVIEW ###
 sb_griqualand_west.253.t:0 "Waterboer Backs the Republic"
 sb_griqualand_west.253.d:0 "Waterboer has accepted Boer protection and recognized the republic's claim to Griqualand West. Cape Town must either recover the disputed territory or see its own claim extinguished."
 sb_griqualand_west.253.f:0 "Waterboer's seal now stood beneath the republic's terms, and Boer officials treated the fields as protected territory. In Cape Town, the rival claim was taken from the archive and placed before ministers who could either enforce it or watch it disappear."
 sb_griqualand_west.253.a:0 "Press the Cape claim."

 # ### TO REVIEW ###
 sb_griqualand_west.254.t:0 "Waterboer Rejects Both Claims"
 sb_griqualand_west.254.d:0 "Waterboer's government refuses both Cape annexation and Boer protection. Cape Town and the republic each retain a claim to Griqualand West, while Griqualand itself prepares to resist either claimant. Three separate contests will now decide whether any one title can prevail."
 sb_griqualand_west.254.f:0 "Three messengers left Waterboer's council by different roads: one for Cape Town, one for the Boer republic, and one for the local commandants. The first two carried refusals; the third carried orders to prepare for what those refusals would bring."
 sb_griqualand_west.254.a:0 "Let no side enlarge the dispute."

 # ### REVIEWED ###
 sb_griqualand_west.025.t:0 "Authority over the Diamond Fields"
 sb_griqualand_west.025.d:0 "A neighbouring government has demanded sovereignty over [ROOT.GetCountry.GetName] and the Diamond Fields. The council must decide whether to accept the proposed settlement or defend the captaincy's independence."

 sb_griqualand_west.025.cap_d:0 "[SCOPE.sCountry('sb_cap_scope').GetName] demands the annexation of [ROOT.GetCountry.GetName] and the Diamond Fields. Its commissioners argue that only Cape administration can protect Griqua rights and restore order on the diggings. Acceptance would end the captaincy's independence; refusal would place it in open opposition to the Colony and the Crown."
 sb_griqualand_west.025.oranje_annexation_d:0 "[SCOPE.sCountry('sb_demanding_claimant_scope').GetName] demands the direct annexation of [ROOT.GetCountry.GetName] and the Diamond Fields to [SCOPE.sCountry('sb_oranje_country_scope').GetName]. Acceptance would dissolve the captaincy into the republic; refusal would turn the dispute over title into a test of arms."

 sb_griqualand_west.025.ora_d:0 "With [SCOPE.sCountry('sb_cap_scope').GetName] no longer contesting the republican claim, [SCOPE.sCountry('sb_demanding_claimant_scope').GetName] demands that [ROOT.GetCountry.GetName] recognise its sovereignty over the Diamond Fields. The captaincy may retain its council and govern its own people, but only under the republic's suzerainty. Refusal would turn a dispute over title into a test of arms."

 sb_griqualand_west.025.f:0 "'All Territory ... belongs of right to the Griqua nation of Griqualand West, whereof I am Chief.'\n— Nicolaas Waterboer, #italic Declaration at Nooitgedacht, 26 August 1870#!"

 sb_griqualand_west.025.a:0 "Accept the settlement."
 sb_griqualand_west.025.b:0 "Griqualand will not submit."

 # ### REVIEWED ###
 sb_griqualand_west.260.t:0 "Diamond Rush"
 sb_griqualand_west.260.d:0 "With control of Kimberley settled, diggers, merchants and speculators are converging on the diamond fields. The rush promises wealth, disorder and a new political economy centred on the mines."
 sb_griqualand_west.260.f:0 "'Rushing seems to have been the order of the day.'\n— William J. Morton, #italic South African Diamond Fields, 1877#!"
 sb_griqualand_west.260.a:0 "Attract the prospectors."
 sb_griqualand_west.260.b:0 "Organise the diamond workings."

 sb_griqualand_west_023_no_compromise_tt:0 "Relations with [SCOPE.sCountry('sb_oranje_claimant_scope').GetName] worsen by #N -50#!. [SCOPE.sCountry('sb_oranje_claimant_scope').GetName] may back down or contest [SCOPE.sCountry('sb_cap_scope').GetName]'s claim by #N force#!. If the dispute escalates, [SCOPE.sCountry('sb_cap_scope').GetName] will be treated as the #N aggressor#!."

 sb_griqualand_west_022_cede_tt:0 "[SCOPE.sCountry('sb_oranje_country_scope').GetName] relinquishes its [GetStateRegion('STATE_GRIQUALAND_WEST').GetName] [concept_claim]."

 sb_griqualand_west_023_compensation_tt:0 "Should [SCOPE.sCountry('sb_oranje_claimant_scope').GetName] accept our offer, [SCOPE.sCountry('sb_oranje_country_scope').GetName] will receive #P 20%#! of our [concept_budget_minting] income for the next #v 10 years#!. This will improve our relations by #P +10#!."

 sb_griqualand_west_023_cede_tt:0 "[SCOPE.sCountry('sb_cap_scope').GetName] loses its [concept_claim] on [GetStateRegion('STATE_GRIQUALAND_WEST').GetName], and [SCOPE.sCountry('sb_oranje_country_scope').GetName] gains it."
 sb_griqualand_west_241_war_tt:0 "[SCOPE.sCountry('sb_local_authority_scope').GetName] will be asked to choose between [SCOPE.sCountry('sb_cap_scope').GetName], [ROOT.GetCountry.GetName], or continued independence before the rival claims are #n tested by force#!. Because [SCOPE.sCountry('sb_cap_scope').GetName] rejected the claim outright, it will initiate the resulting diplomatic play."
 sb_griqualand_west_241_backdown_tt:0 "[SCOPE.sCountry('sb_oranje_country_scope').GetName] drops the issue. [SCOPE.sCountry('sb_cap_scope').GetName] will proceed to demand [SCOPE.sCountry('sb_local_authority_scope').GetName]'s annexation."

 sb_griqualand_west_242_accept_tt:0 "[SCOPE.sCountry('sb_oranje_country_scope').GetName] relinquishes its [GetStateRegion('STATE_GRIQUALAND_WEST').GetName] [concept_claim]."
 sb_griqualand_west_242_war_tt:0 "[SCOPE.sCountry('sb_local_authority_scope').GetName] will be asked to choose between [SCOPE.sCountry('sb_cap_scope').GetName], [ROOT.GetCountry.GetName], or continued independence before the rival claims are #n tested by force#!. Rejecting this negotiated settlement means [ROOT.GetCountry.GetName] will be treated as the #N aggressor#!, and Britain will back [SCOPE.sCountry('sb_cap_scope').GetName]."

 sb_griqualand_west_243_tt:0 "[ROOT.GetCountry.GetName] proceeds to demand [SCOPE.sCountry('sb_local_authority_scope').GetName]'s submission over Kimberley."
 sb_griqualand_west_243_annex_tt:0 "[SCOPE.sCountry('sb_local_authority_scope').GetName] receives a demand for direct annexation into [SCOPE.sCountry('sb_oranje_country_scope').GetName]."
 sb_griqualand_west_244_tt:0 "[SCOPE.sCountry('sb_local_authority_scope').GetName] receives a demand for annexation by [SCOPE.sCountry('sb_cap_scope').GetName]."
 sb_griqualand_west_245_tt:0 "[SCOPE.sCountry('sb_local_authority_scope').GetName] receives a demand for puppet status under [ROOT.GetCountry.GetName]."
 sb_griqualand_west_025_accept_oranje_annexation_tt:0 "[ROOT.GetCountry.GetName] is annexed directly into [SCOPE.sCountry('sb_oranje_country_scope').GetName]. The remaining #v 19#! Kimberley diamond-mine levels are added as discoverable [concept_resource_potential]."
 sb_griqualand_west_025_refuse_tt:0 "If this is a Cape demand, [SCOPE.sCountry('sb_cap_scope').GetName] starts a locked diplomatic play to return Griqualand West, while [ROOT.GetCountry.GetName]'s only demand is revocation of the Cape claim. If this is a Boer-side demand, the demanding republic starts a protectorate play. The remaining Kimberley fields are delayed until the war or backdown result is resolved."
 sb_griqualand_west_025_refuse_oranje_annexation_tt:0 "[SCOPE.sCountry('sb_oranje_claimant_scope').GetName] starts a restricted diplomatic play to return Griqualand West to [SCOPE.sCountry('sb_oranje_country_scope').GetName]. [ROOT.GetCountry.GetName]'s only demand is revocation of the Oranje claim."
 sb_griqualand_west_251_cap_tt:0 "[ROOT.GetCountry.GetName] becomes a [concept_protectorate] of [SCOPE.sCountry('sb_cap_scope').GetName]. [SCOPE.sCountry('sb_cap_scope').GetName] will answer the rival Boer claim."
 sb_griqualand_west_251_oranje_tt:0 "[ROOT.GetCountry.GetName] becomes a [concept_protectorate] of [SCOPE.sCountry('sb_oranje_claimant_scope').GetName]. [SCOPE.sCountry('sb_cap_scope').GetName] will answer this settlement."
 sb_griqualand_west_251_independent_tt:0 "[ROOT.GetCountry.GetName] rejects both claimants and will have to defend its independence #n by force against both claimants#!."
 sb_griqualand_west_252_cap_aggressor_tt:0 "[SCOPE.sCountry('sb_cap_scope').GetName] will initiate a locked diplomatic play to revoke [SCOPE.sCountry('sb_oranje_country_scope').GetName]'s claim and will be treated as the #N aggressor#!."
 sb_griqualand_west_252_boer_aggressor_tt:0 "[SCOPE.sCountry('sb_oranje_claimant_scope').GetName] will initiate a locked diplomatic play to seize the diamond fields and will be treated as the #N aggressor#!. Britain and [SCOPE.sCountry('sb_cap_scope').GetName] will defend [SCOPE.sCountry('sb_local_authority_scope').GetName]."
 sb_griqualand_west_253_cap_aggressor_tt:0 "[SCOPE.sCountry('sb_cap_scope').GetName] initiates a locked diplomatic play to return Griqualand West from [SCOPE.sCountry('sb_local_authority_scope').GetName] and will be treated as the #N aggressor#!. [SCOPE.sCountry('sb_local_authority_scope').GetName]'s only demand is revocation of the Cape claim."
 sb_griqualand_west_253_boer_aggressor_tt:0 "[SCOPE.sCountry('sb_oranje_claimant_scope').GetName] initiates a locked diplomatic play to revoke the Cape claim and will be treated as the #N aggressor#!. Britain will back [SCOPE.sCountry('sb_cap_scope').GetName], whose demand is the return of Griqualand West from [SCOPE.sCountry('sb_local_authority_scope').GetName]."
 sb_griqualand_west_254_cap_aggressor_tt:0 "Three locked diplomatic plays begin:\n• [SCOPE.sCountry('sb_cap_scope').GetName] demands Griqualand West from [SCOPE.sCountry('sb_local_authority_scope').GetName], which demands revocation of the Cape claim.\n• [SCOPE.sCountry('sb_cap_scope').GetName] initiates the contest to revoke [SCOPE.sCountry('sb_oranje_country_scope').GetName]'s claim.\n• [SCOPE.sCountry('sb_oranje_country_scope').GetName] demands Griqualand West from [SCOPE.sCountry('sb_local_authority_scope').GetName], which demands revocation of the Boer claim.\nNo side may add another war goal."
 sb_griqualand_west_254_boer_aggressor_tt:0 "Three locked diplomatic plays begin:\n• [SCOPE.sCountry('sb_cap_scope').GetName] demands Griqualand West from [SCOPE.sCountry('sb_local_authority_scope').GetName], which demands revocation of the Cape claim.\n• [SCOPE.sCountry('sb_oranje_claimant_scope').GetName] initiates the Cape-Boer claim contest and will be treated as the #N aggressor#!; Britain backs [SCOPE.sCountry('sb_cap_scope').GetName].\n• [SCOPE.sCountry('sb_oranje_country_scope').GetName] demands Griqualand West from [SCOPE.sCountry('sb_local_authority_scope').GetName], which demands revocation of the Boer claim.\nNo side may add another war goal."

 sb_kimberley_compensation:0 "Kimberley Compensation"
 sb_kimberley_compensation_desc:0 "A share of the fiscal windfall from Kimberley is being paid as compensation for relinquished claims."
