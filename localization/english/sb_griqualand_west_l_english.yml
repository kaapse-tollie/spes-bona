l_english:
 je_sb_griqualand_west_question:0 "The Kimberley Question"
 je_sb_griqualand_west_question_reason:0 "The diamond fields have drawn Griqua claims, imperial pressure, and republican ambition onto the same ground."
 je_sb_griqualand_west_question_status_pending:0 "No durable policy has yet been chosen for the diamond fields."
 je_sb_griqualand_west_question_status_arbitration:0 "A treaty-first course has been chosen for the diamond fields."
 je_sb_griqualand_west_question_status_hardline:0 "A hardline course has been chosen for the diamond fields."

 sb_griqualand_west.021.t:0 "Diamonds Struck"
 sb_griqualand_west.021.d:0 "Diamonds have been found near the small frontier town of Dutoitspan. The region, while nominally under the authority of [SCOPE.sCountry('sb_local_authority_scope').GetName], has been claimed by both [SCOPE.sCountry('sb_cap_scope').GetName] and [SCOPE.sCountry('sb_oranje_claimant_scope').GetName], threatening to turn a backwater border discrepancy into open conflict."
 sb_griqualand_west.021.f:0 ""The largest and most complete hole ever made by human agency." - Anthony Trollope, on the Kimberley diamond mine."
 sb_griqualand_west.021.a:0 "Diamonds are forever"

 sb_griqualand_west.027.t:0 "Diamonds Struck"
 sb_griqualand_west.027.d:0 "Diamonds have been found near Kimberley. With no separate Waterboer authority controlling the fields, the question is no longer one of frontier sovereignty but how quickly [ROOT.GetCountry.GetName] can turn the discovery into a working diamond industry."
 sb_griqualand_west.027.f:0 "Every cart that arrived carried a shovel, a rumour, or a claim to fortune."
 sb_griqualand_west.027.a:0 "Attract the prospectors."
 sb_griqualand_west.027.b:0 "Organize the diamond workings."

 sb_griqualand_west.022.t:0 "[ROOT.GetCountry.GetName] and the Diamond Fields"
 sb_griqualand_west.022.d:0 "A potentially very large diamond mine has been found near the banks of the Orange river. Nominally under control by [SCOPE.sCountry('sb_local_authority_scope').GetName], the exact demarcation of the border between [ROOT.GetCountry.GetName] and [SCOPE.sCountry('sb_cap_scope').GetName] has never been fully clarified. Prominent members of the Volksraad are arguing that the mines should legally fall under the authority of Bloemfontein, while Cape Town insists that the diamond fields fall under imperial protection."
 sb_griqualand_west.022.f:0 ""The Free State claims to have bought the Diamond Fields." — Anthony Trollope"
 sb_griqualand_west.022.a:0 "Press our claim."
 sb_griqualand_west.022.b:0 "Our relations with [SCOPE.sCountry('sb_cap_scope').GetName] take precedence."

 sb_griqualand_west.023.t:0 "The [SCOPE.sCountry('sb_local_authority_scope').GetName] Question"
 sb_griqualand_west.023.d:0 "[SCOPE.sCountry('sb_oranje_claimant_scope').GetName] has pressed its claim over the diamond fields. [ROOT.GetCountry.GetName] must decide whether to reject Bloemfontein's claims outright, compensate it for standing aside, or abandon its claim to the region."
 sb_griqualand_west.023.f:0 ""In full satisfaction of all claims which it considers it may possess to Griqualand West." — Lord Carnarvon, on compensation to the Orange Free State"
 sb_griqualand_west.023.a:0 "Ignore them."
 sb_griqualand_west.023.b:0 "Offer [SCOPE.sCountry('sb_oranje_claimant_scope').GetName] compensation."
 sb_griqualand_west.023.c:0 "Cede our claim."

 sb_griqualand_west.241.t:0 "Our demands rebuffed."
 sb_griqualand_west.241.d:0 "[SCOPE.sCountry('sb_cap_scope').GetName] refuses to compensate [ROOT.GetCountry.GetName] for the diamond fields. The Volksraad can either accept this diplomatic defeat or contest the question at the barrel of a gun."
 sb_griqualand_west.241.f:0 ""A party in the Volksraad wished to go to war with Britain, but the counsels of President Johannes Brand prevailed." — 1911 Encyclopaedia Britannica, Orange Free State"
 sb_griqualand_west.241.a:0 "March the commandos"
 sb_griqualand_west.241.b:0 "Back down."

 sb_griqualand_west.242.t:0 "Compensation for Kimberley"
 sb_griqualand_west.242.d:0 "[SCOPE.sCountry('sb_cap_scope').GetName] offers [ROOT.GetCountry.GetName] a share of the fiscal windfall in exchange for relinquishing its claim to Kimberley. Acceptance would settle the dispute; refusal would leave only force and prestige."
 sb_griqualand_west.242.f:0 "Compensation could soften a loss of land, but not erase the question of sovereignty."
 sb_griqualand_west.242.a:0 "Accept the compensation."
 sb_griqualand_west.242.b:0 "Everything or nothing."

 sb_griqualand_west.243.t:0 "[SCOPE.sCountry('sb_cap_scope').GetName] Steps Aside"
 sb_griqualand_west.243.d:0 "[SCOPE.sCountry('sb_cap_scope').GetName] has withdrawn its [GetStateRegion('STATE_GRIQUALAND_WEST').GetName] claim, leaving [ROOT.GetCountry.GetName] to press [SCOPE.sCountry('sb_local_authority_scope').GetName] directly over Kimberley."
 sb_griqualand_west.243.f:0 "A claim conceded on paper still had to be made real on the frontier."
 sb_griqualand_west.243.a:0 "Approach [SCOPE.sCountry('sb_local_authority_scope').GetName]."

 sb_griqualand_west.244.t:0 "Demand [SCOPE.sCountry('sb_local_authority_scope').GetName]'s Annexation"
 sb_griqualand_west.244.d:0 "With [SCOPE.sCountry('sb_oranje_claimant_scope').GetName] choosing its relations with Cape Town over a doubtful frontier claim, the Boer-side challenge to the diamond fields has been withdrawn. A formal notice of annexation has been drafted, ready to demand that [SCOPE.sCountry('sb_local_authority_scope').GetName] be folded into [ROOT.GetCountry.GetName] as a semi-autonomous province, bringing the diamond fields under direct administration."
 sb_griqualand_west.244.f:0 ""Griqualand West... shall become annexed to, and thenceforth be portion of the Colony of the Cape of Good Hope." — Griqualand West Annexation Act, 1877"
 sb_griqualand_west.244.a:0 "Send the notice."

 sb_griqualand_west.245.t:0 "Demand [SCOPE.sCountry('sb_local_authority_scope').GetName]'s Submission"
 sb_griqualand_west.245.d:0 "The republic's title to the Diamond Fields has been recognised. The Volksraad has drafted terms for [SCOPE.sCountry('sb_local_authority_scope').GetName]'s incorporation into [ROOT.GetCountry.GetName]. Waterboer may retain his captaincy and continue to govern his people, provided that he acknowledges the republic's sovereignty."
 sb_griqualand_west.245.f:0 "'The rights and title of this Government to said land remained unaltered.' — J. C. Nielen Marais, O.F.S.Government Secretary, 1867"
 sb_griqualand_west.245.a:0 "Send the demand."

 sb_griqualand_west.246.t:0 "Demand [SCOPE.sCountry('sb_local_authority_scope').GetName]'s Annexation"
 sb_griqualand_west.246.d:0 "With no Boer republic in a position to press a rival claim, Cape Town faces only [SCOPE.sCountry('sb_local_authority_scope').GetName]'s authority over the diamond mines. A formal notice of annexation has been drafted, ready to demand that [SCOPE.sCountry('sb_local_authority_scope').GetName] be folded into [ROOT.GetCountry.GetName] as a semi-autonomous province, bringing the diamond fields under direct administration."
 sb_griqualand_west.246.f:0 ""Griqualand West... shall become annexed to, and thenceforth be portion of the Colony of the Cape of Good Hope." — Griqualand West Annexation Act, 1877"
 sb_griqualand_west.246.a:0 "Send the notice."

 sb_griqualand_west.247.t:0 "Demand [SCOPE.sCountry('sb_local_authority_scope').GetName]'s Annexation"
 sb_griqualand_west.247.d:0 "Having seen its claim rebuffed, [SCOPE.sCountry('sb_oranje_claimant_scope').GetName] has declined to march the commandos. With the Boer challenge withdrawn, a formal notice of annexation has been drafted, ready to demand that [SCOPE.sCountry('sb_local_authority_scope').GetName] be folded into [ROOT.GetCountry.GetName] as a semi-autonomous province, bringing the diamond fields under direct administration."
 sb_griqualand_west.247.f:0 ""Griqualand West... shall become annexed to, and thenceforth be portion of the Colony of the Cape of Good Hope." — Griqualand West Annexation Act, 1877"
 sb_griqualand_west.247.a:0 "Send the notice."

 sb_griqualand_west.248.t:0 "Demand [SCOPE.sCountry('sb_local_authority_scope').GetName]'s Annexation"
 sb_griqualand_west.248.d:0 "With [SCOPE.sCountry('sb_oranje_claimant_scope').GetName] accepting compensation in satisfaction of its claim, Cape Town can now turn to the government that holds the diamond mines. A formal notice of annexation has been drafted, ready to demand that [SCOPE.sCountry('sb_local_authority_scope').GetName] be folded into [ROOT.GetCountry.GetName] as a semi-autonomous province, bringing the diamond fields under direct administration."
 sb_griqualand_west.248.f:0 ""Griqualand West... shall become annexed to, and thenceforth be portion of the Colony of the Cape of Good Hope." — Griqualand West Annexation Act, 1877"
 sb_griqualand_west.248.a:0 "Send the notice."

 sb_griqualand_west.249.t:0 "Demand [SCOPE.sCountry('sb_local_authority_scope').GetName]'s Annexation"
 sb_griqualand_west.249.d:0 "The confrontation over Kimberley has ended without battle, as [SCOPE.sCountry('sb_oranje_claimant_scope').GetName] abandons its challenge rather than hazard war. A formal notice of annexation has been drafted, ready to demand that [SCOPE.sCountry('sb_local_authority_scope').GetName] be folded into [ROOT.GetCountry.GetName] as a semi-autonomous province, bringing the diamond fields under direct administration."
 sb_griqualand_west.249.f:0 ""Griqualand West... shall become annexed to, and thenceforth be portion of the Colony of the Cape of Good Hope." — Griqualand West Annexation Act, 1877"
 sb_griqualand_west.249.a:0 "Send the notice."

 sb_griqualand_west.250.t:0 "Demand [SCOPE.sCountry('sb_local_authority_scope').GetName]'s Annexation"
 sb_griqualand_west.250.d:0 "The contest over Kimberley has been decided in [ROOT.GetCountry.GetName]'s favour, and the Boer claim can no longer bar Cape Town's ambitions on the diamond mines. A formal notice of annexation has been drafted, ready to demand that [SCOPE.sCountry('sb_local_authority_scope').GetName] be folded into [ROOT.GetCountry.GetName] as a semi-autonomous province, bringing the diamond fields under direct administration."
 sb_griqualand_west.250.f:0 ""Griqualand West... shall become annexed to, and thenceforth be portion of the Colony of the Cape of Good Hope." — Griqualand West Annexation Act, 1877"
 sb_griqualand_west.250.a:0 "Send the notice."

 sb_griqualand_west.251.t:0 "Waterboer's Choice"
 sb_griqualand_west.251.d:0 "Cape Town and the Boer republic have both placed claims before Waterboer's government. Neither claimant will now accept a paper settlement, leaving Griqualand West to decide which authority, if any, it will recognize."
 sb_griqualand_west.251.rejection_d:0 "The Cape has rejected the Boer claim outright, and the Volksraad answers by preparing the commandos. Before either claimant moves, Waterboer's government must decide whose title it will recognize over the diamond fields."
 sb_griqualand_west.251.compensation_d:0 "The Boer republic has rejected Cape compensation and insists that sovereignty cannot be purchased away. With both claimants preparing to enforce their titles, Waterboer's government must choose its place in the coming contest."
 sb_griqualand_west.251.f:0 "Neither proclamation nor purchase could settle a frontier whose government had not yet consented."
 sb_griqualand_west.251.a:0 "Seek Cape protection."
 sb_griqualand_west.251.b:0 "Recognize the Boer claim."
 sb_griqualand_west.251.c:0 "Griqualand stands independent."

 sb_griqualand_west.252.t:0 "Waterboer Backs the Cape"
 sb_griqualand_west.252.d:0 "Waterboer has accepted Cape protection while refusing the Boer title to Griqualand West. Cape Town can now demand that the rival claim be withdrawn; the republic, in turn, is prepared to claim the territory from Waterboer's new protector."
 sb_griqualand_west.252.f:0 "Protection settled allegiance, but not the rival title to the ground beneath the diggings."
 sb_griqualand_west.252.a:0 "Put the claims to the test."

 sb_griqualand_west.253.t:0 "Waterboer Backs the Republic"
 sb_griqualand_west.253.d:0 "Waterboer has accepted Boer protection and recognized the republic's claim to Griqualand West. Cape Town must either recover the disputed territory or see its own claim extinguished."
 sb_griqualand_west.253.f:0 "A protectorate on the frontier could be answered only by possession or retreat."
 sb_griqualand_west.253.a:0 "Press the Cape claim."

 sb_griqualand_west.254.t:0 "Waterboer Rejects Both Claims"
 sb_griqualand_west.254.d:0 "Waterboer's government refuses both Cape annexation and Boer protection. Cape Town and the republic each retain a claim to Griqualand West, while Griqualand itself prepares to resist either claimant. Three separate contests will now decide whether any one title can prevail."
 sb_griqualand_west.254.f:0 "Independence left every claim unanswered, and every claimant armed."
 sb_griqualand_west.254.a:0 "Let no side enlarge the dispute."

 sb_griqualand_west.025.t:0 "Authority Over the Diamond Fields"
 sb_griqualand_west.025.d:0 "A larger power has demanded that [ROOT.GetCountry.GetName] accept a new settlement over the Kimberley diamond fields."
 sb_griqualand_west.025.cap_d:0 "[SCOPE.sCountry('sb_cap_scope').GetName] demands the annexation of [ROOT.GetCountry.GetName] and the Kimberley fields. [SCOPE.sCountry('sb_cap_scope').GetName] officials present direct rule as the only way to secure Griqua rights and imperial order over the diamond trade."
 sb_griqualand_west.025.ora_d:0 "[SCOPE.sCountry('sb_demanding_claimant_scope').GetName] demands that [ROOT.GetCountry.GetName] accept puppet status over Kimberley. The republic presents the settlement as recognition of its interior claim, but refusal will likely bring a direct diplomatic play."
 sb_griqualand_west.025.f:0 "The question was no longer whether the fields mattered, but whose authority could organize them."
 sb_griqualand_west.025.a:0 "Accept the settlement."
 sb_griqualand_west.025.b:0 "Refuse."

 sb_griqualand_west.260.t:0 "Diamond Rush"
 sb_griqualand_west.260.d:0 "With control of Kimberley settled, diggers, merchants and speculators are converging on the diamond fields. The rush promises wealth, disorder and a new political economy centred on the mines."
 sb_griqualand_west.260.f:0 "'Rushing seems to have been the order of the day.' — William J. Morton, South African Diamond Fields, 1877"
 sb_griqualand_west.260.a:0 "Attract the prospectors."
 sb_griqualand_west.260.b:0 "Organise the diamond workings."

 sb_griqualand_west_023_no_compromise_tt:0 "Relations with [SCOPE.sCountry('sb_oranje_claimant_scope').GetName] worsen by #N -50#!. [SCOPE.sCountry('sb_oranje_claimant_scope').GetName] may back down or contest [SCOPE.sCountry('sb_cap_scope').GetName]'s claim by #N force#!."
 sb_griqualand_west_022_cede_tt:0 "[ROOT.GetCountry.GetName] relinquishes its [GetStateRegion('STATE_GRIQUALAND_WEST').GetName] [concept_claim]. Relations with [SCOPE.sCountry('sb_cap_scope').GetName] improve by #P +50#!."
 sb_griqualand_west_023_compensation_tt:0 "Should [SCOPE.sCountry('sb_oranje_claimant_scope').GetName] accept our offer, they will receive #P 20%#! of our [concept_budget_minting] income for the next #v 10 years#!. This will improve our relations by #P +10#!.\n\n[SCOPE.sCountry('sb_oranje_claimant_scope').GetName] receives the compensation offer. The minting and burden modifiers apply only if [SCOPE.sCountry('sb_oranje_claimant_scope').GetName] accepts."
 sb_griqualand_west_023_cede_tt:0 "[SCOPE.sCountry('sb_cap_scope').GetName] loses its [concept_claim] on [GetStateRegion('STATE_GRIQUALAND_WEST').GetName], and [SCOPE.sCountry('sb_oranje_claimant_scope').GetName] gains it."
 sb_griqualand_west_241_war_tt:0 "[SCOPE.sCountry('sb_local_authority_scope').GetName] will be asked to choose between [SCOPE.sCountry('sb_cap_scope').GetName], [ROOT.GetCountry.GetName], or continued independence before the rival claims are tested by force."
 sb_griqualand_west_241_backdown_tt:0 "[ROOT.GetCountry.GetName] drops the issue. [SCOPE.sCountry('sb_cap_scope').GetName] will proceed to demand [SCOPE.sCountry('sb_local_authority_scope').GetName]'s annexation."
 sb_griqualand_west_242_accept_tt:0 "[ROOT.GetCountry.GetName] relinquishes its [GetStateRegion('STATE_GRIQUALAND_WEST').GetName] [concept_claim] and receives a #P +20%#! minting modifier. [SCOPE.sCountry('sb_cap_scope').GetName] receives the matching burden, and relations improve by #P +10#!."
 sb_griqualand_west_242_war_tt:0 "[SCOPE.sCountry('sb_local_authority_scope').GetName] will be asked to choose between [SCOPE.sCountry('sb_cap_scope').GetName], [ROOT.GetCountry.GetName], or continued independence before the rival claims are tested by force."
 sb_griqualand_west_243_tt:0 "[ROOT.GetCountry.GetName] proceeds to demand [SCOPE.sCountry('sb_local_authority_scope').GetName]'s submission over Kimberley."
 sb_griqualand_west_244_tt:0 "[SCOPE.sCountry('sb_local_authority_scope').GetName] receives a demand for annexation by [SCOPE.sCountry('sb_cap_scope').GetName]."
 sb_griqualand_west_245_tt:0 "[SCOPE.sCountry('sb_local_authority_scope').GetName] receives a demand for puppet status under [ROOT.GetCountry.GetName]."
 sb_griqualand_west_025_accept_tt:0 "If this is a [SCOPE.sCountry('sb_cap_scope').GetName] demand, [ROOT.GetCountry.GetName] is annexed and the remaining #v 19#! Kimberley potential is added without forced discovery. If this is a Boer-side demand, [ROOT.GetCountry.GetName] becomes a puppet of the demanding Boer republic, and the remaining diamond mine levels are added directly in [ROOT.GetCountry.GetName]."
 sb_griqualand_west_025_refuse_tt:0 "The claimant starts a diplomatic play. The remaining Kimberley fields are delayed until the war or backdown result is resolved."
 sb_griqualand_west_251_cap_tt:0 "[ROOT.GetCountry.GetName] becomes a [concept_protectorate] of [SCOPE.sCountry('sb_cap_scope').GetName]. [SCOPE.sCountry('sb_cap_scope').GetName] will answer the rival Boer claim."
 sb_griqualand_west_251_oranje_tt:0 "[ROOT.GetCountry.GetName] becomes a [concept_protectorate] of [SCOPE.sCountry('sb_oranje_claimant_scope').GetName]. [SCOPE.sCountry('sb_cap_scope').GetName] will answer this settlement."
 sb_griqualand_west_251_independent_tt:0 "[ROOT.GetCountry.GetName] rejects both claimants and becomes independent. [SCOPE.sCountry('sb_cap_scope').GetName] and [SCOPE.sCountry('sb_oranje_claimant_scope').GetName] will each press their claims in separate, restricted diplomatic plays."
 sb_griqualand_west_252_tt:0 "[SCOPE.sCountry('sb_cap_scope').GetName] starts a locked diplomatic play to revoke [SCOPE.sCountry('sb_oranje_claimant_scope').GetName]'s Griqualand West claim. [SCOPE.sCountry('sb_oranje_claimant_scope').GetName]'s only demand is the return of Griqualand West from [SCOPE.sCountry('sb_local_authority_scope').GetName]. Neither side may add another war goal."
 sb_griqualand_west_253_tt:0 "[SCOPE.sCountry('sb_cap_scope').GetName] starts a locked diplomatic play to return Griqualand West from [SCOPE.sCountry('sb_local_authority_scope').GetName]. [SCOPE.sCountry('sb_oranje_claimant_scope').GetName]'s only demand is revocation of the Cape claim. Neither side may add another war goal."
 sb_griqualand_west_254_tt:0 "Three locked diplomatic plays begin:\n• [SCOPE.sCountry('sb_cap_scope').GetName] demands Griqualand West from [SCOPE.sCountry('sb_local_authority_scope').GetName], which demands revocation of the Cape claim.\n• [SCOPE.sCountry('sb_cap_scope').GetName] and [SCOPE.sCountry('sb_oranje_claimant_scope').GetName] demand revocation of one another's claims.\n• [SCOPE.sCountry('sb_oranje_claimant_scope').GetName] demands Griqualand West from [SCOPE.sCountry('sb_local_authority_scope').GetName], which demands revocation of the Boer claim.\nNo side may add another war goal."

 sb_kimberley_compensation:0 "Kimberley Compensation"
 sb_kimberley_compensation_desc:0 "A share of the fiscal windfall from Kimberley is being paid as compensation for relinquished claims."
 sb_kimberley_compensation_burden:0 "Kimberley Compensation Burden"
 sb_kimberley_compensation_burden_desc:0 "The government has accepted a costly compensation settlement over the Kimberley diamond fields."
 sb_diamond_rush_exploitation:0 "Organized Diamond Workings"
 sb_diamond_rush_exploitation_desc:0 "The Kimberley diggings are being organized around licensed claims, compound labour, and mine infrastructure rather than a purely speculative rush."
 sb_arid_interior_corridor:0 "Arid Interior Corridor"
 sb_arid_interior_corridor_desc:0 "The interior route through Bechuanaland is dry, thinly supplied, and difficult to sustain beyond the diamond fields. Settlement advances slowly through this corridor."
