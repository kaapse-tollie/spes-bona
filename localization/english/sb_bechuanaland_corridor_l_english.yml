 sb_bechuanaland_boer_swa_influence_bar_boer:0 "[GetGlobalVariable('sb_bechuanaland_boer_actor_global_scope').GetCountry.GetNameNoFormatting] [GetGlobalVariable('sb_bechuanaland_boer_actor_global_scope').GetCountry.GetFlagTextIcon]"

 sb_bechuanaland_influence_sgo_boer_subject:0 "[SCOPE.sCountry('sb_sgo_scope').GetName] is a direct Boer subject"
 sb_bechuanaland_influence_boer_corridor_land:0 "Boer settlement in Bechuanaland"
 sb_bechuanaland_influence_swa_namibian_core:0 "South West Africa controls its Namibian heartland"
 sb_bechuanaland_influence_swa_caprivi:0 "South West Africa controls the Caprivi corridor"
 sb_bechuanaland_influence_boer_in_swa_bloc:0 "[GetGlobalVariable('sb_bechuanaland_boer_actor_global_scope').GetCountry.GetName] is tied to the South West African power"
 sb_bechuanaland_influence_boer_trade_privileges:0 "Boer trade privileges with [SCOPE.sCountry('sb_sgo_scope').GetName]"
 sb_bechuanaland_influence_swa_trade_privileges:0 "South West African trade privileges with [SCOPE.sCountry('sb_sgo_scope').GetName]"
 sb_bechuanaland_influence_boer_trade_through:0 "Boer trade-through rights in [SCOPE.sCountry('sb_sgo_scope').GetName]"
 sb_bechuanaland_influence_swa_trade_through:0 "South West African trade-through rights in [SCOPE.sCountry('sb_sgo_scope').GetName]"
 sb_bechuanaland_influence_boer_subsidy:0 "Support for the settler government"
 sb_bechuanaland_influence_swa_subsidy:0 "South West African trade missions"
 sb_bechuanaland_influence_swa_crisis_support:0 "South West African crisis support"
 sb_bechuanaland_influence_boer_relations_friendly:0 "[SCOPE.sCountry('sb_sgo_scope').GetName] is friendly with [GetGlobalVariable('sb_bechuanaland_boer_actor_global_scope').GetCountry.GetName]"
 sb_bechuanaland_influence_boer_relations_amicable:0 "[SCOPE.sCountry('sb_sgo_scope').GetName] is amicable with [GetGlobalVariable('sb_bechuanaland_boer_actor_global_scope').GetCountry.GetName]"
 sb_bechuanaland_influence_boer_relations_cordial:0 "[SCOPE.sCountry('sb_sgo_scope').GetName] is cordial with [GetGlobalVariable('sb_bechuanaland_boer_actor_global_scope').GetCountry.GetName]"
 sb_bechuanaland_influence_boer_relations_poor:0 "[SCOPE.sCountry('sb_sgo_scope').GetName] has poor relations with [GetGlobalVariable('sb_bechuanaland_boer_actor_global_scope').GetCountry.GetName]"
 sb_bechuanaland_influence_boer_relations_cold:0 "[SCOPE.sCountry('sb_sgo_scope').GetName] has cold relations with [GetGlobalVariable('sb_bechuanaland_boer_actor_global_scope').GetCountry.GetName]"
 sb_bechuanaland_influence_boer_relations_hostile:0 "[SCOPE.sCountry('sb_sgo_scope').GetName] is hostile to [GetGlobalVariable('sb_bechuanaland_boer_actor_global_scope').GetCountry.GetName]"
 sb_bechuanaland_influence_swa_relations_friendly:0 "[SCOPE.sCountry('sb_sgo_scope').GetName] is friendly with [GetGlobalVariable('sb_bechuanaland_swa_overlord_global_scope').GetCountry.GetName]"
 sb_bechuanaland_influence_swa_relations_amicable:0 "[SCOPE.sCountry('sb_sgo_scope').GetName] is amicable with [GetGlobalVariable('sb_bechuanaland_swa_overlord_global_scope').GetCountry.GetName]"
 sb_bechuanaland_influence_swa_relations_cordial:0 "[SCOPE.sCountry('sb_sgo_scope').GetName] is cordial with [GetGlobalVariable('sb_bechuanaland_swa_overlord_global_scope').GetCountry.GetName]"
