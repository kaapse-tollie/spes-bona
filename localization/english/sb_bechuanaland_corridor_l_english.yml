 sb_bechuanaland_boer_swa_influence_bar_boer:0 "[GetGlobalVariable('sb_bechuanaland_boer_actor_global_scope').GetCountry.GetNameNoFormatting] [GetGlobalVariable('sb_bechuanaland_boer_actor_global_scope').GetCountry.GetFlagTextIcon]"

 sb_bechuanaland_influence_sgo_boer_subject:0 "[SCOPE.sCountry('sb_sgo_scope').GetName] is a direct Boer subject"
