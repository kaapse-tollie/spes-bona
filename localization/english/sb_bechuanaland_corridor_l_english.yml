 sb_bechuanaland_influence_boer_gain_10_tt:0 "Boer influence in the corridor increases by #v 10#!."
 sb_bechuanaland_influence_boer_gain_5_tt:0 "Boer influence in the corridor increases by #v 5#!."
 sb_bechuanaland_influence_swa_gain_10_tt:0 "South West African influence in the corridor increases by #v 10#!."
 sb_bechuanaland_influence_swa_gain_25_tt:0 "South West African influence in the corridor increases by #v 25#!."
 sb_bechuanaland_influence_swa_gain_50_tt:0 "South West African influence in the corridor rises to its maximum, setting the score to #v -40#!."

 je_sb_bechuanaland_sponsor_boer_settlers_button:0 "Sponsor Boer Settlers"
 je_sb_bechuanaland_sponsor_boer_settlers_button_desc:0 "Advance the Boer frontier into [GetStateRegion('STATE_BECHUANALAND').GetName]. A settlement at the first available crossing will be organized as [SCOPE.sCountry('sb_sgo_scope').GetName] and placed under our protection."
 je_sb_bechuanaland_sponsor_boer_settlers_possible_tt:0 "There is no [SCOPE.sCountry('sb_sgo_scope').GetName], and the Tswana still hold land upon which a Boer settlement can be established."

 je_sb_bechuanaland_support_settler_government_button:0 "Support the Settler Government"
 je_sb_bechuanaland_support_settler_government_button_desc:0 "Provide [SCOPE.sCountry('sb_sgo_scope').GetName] with money and political backing, drawing its frontier government closer to the Boer republics."
 je_sb_bechuanaland_support_settler_government_possible_tt:0 "We have #v £2,500#! in reserve, are not in default, and have not subsidized [SCOPE.sCountry('sb_sgo_scope').GetName] within the past two years."
 sb_bechuanaland_boer_subsidy_effect_tt:0 "For #v 12 months#!, Boer influence in the corridor increases by #v 0.25#! each month."

 je_sb_bechuanaland_finance_interior_trade_missions_button:0 "Finance Interior Trade Missions"
 je_sb_bechuanaland_finance_interior_trade_missions_button_desc:0 "Fund merchants and agents travelling through [SCOPE.sCountry('sb_sgo_scope').GetName], binding its interior trade to South West Africa."
 je_sb_bechuanaland_finance_interior_trade_missions_possible_tt:0 "We have #v £25,000#! in reserve, are not in default, and have not financed a mission to [SCOPE.sCountry('sb_sgo_scope').GetName] within the past two years."
 sb_bechuanaland_swa_subsidy_effect_tt:0 "For #v 12 months#!, South West African influence in the corridor increases by #v 0.25#! each month."

 je_sb_bechuanaland_send_warren_expedition_button:0 "Send the Warren Expedition"
 je_sb_bechuanaland_send_warren_expedition_button_desc:0 "Send a Cape column north to extinguish [SCOPE.sCountry('sb_sgo_scope').GetName] and place the road through [GetStateRegion('STATE_BECHUANALAND').GetName] under colonial administration."
 je_sb_bechuanaland_send_warren_expedition_possible_tt:0 "The Cape is a British subject with a foothold in [GetStateRegion('STATE_BECHUANALAND').GetName], [SCOPE.sCountry('sb_sgo_scope').GetName] exists, the Tswana no longer bar the road north, and no Warren ultimatum is pending."

 je_sb_bechuanaland_gbr_direct_warren_button:0 "Force the Corridor Question"
 je_sb_bechuanaland_gbr_direct_warren_button_desc:0 "The defeat at Kimberley has left the Cape unable to secure the interior. Restore its claim and deliver a British ultimatum to the Boer government holding the corridor settlements."
 je_sb_bechuanaland_gbr_direct_warren_possible_tt:0 "The Boers prevailed at Kimberley, and an Oranje or Transvaal government directly or indirectly controls both [GetStateRegion('STATE_GRIQUALAND_WEST').GetName] and [GetStateRegion('STATE_BECHUANALAND').GetName]."

 dp_sb_bechuanaland_cap_dual_return_locked:0 "The Corridor Question"
 dp_sb_bechuanaland_cap_dual_return_locked_desc:0 "The Cape seeks the return of both Griqualand West and Bechuanaland in a single, closed settlement."
 dp_sb_bechuanaland_cap_dual_return_locked_tooltip:0 "The Cape seeks the return of both Griqualand West and Bechuanaland in a single, closed settlement."
 dp_sb_bechuanaland_cap_sgo_return:0 "Sir Warren's demand"
 dp_sb_bechuanaland_cap_sgo_return_desc:0 "Britain, the Cape, and their regional subjects confront the Boer republics in a locked struggle over the early South African settlement."
 dp_sb_bechuanaland_cap_sgo_return_tooltip:0 "A locked total war with fixed participants and demands. Neither side may add further war goals."

 dp_sb_bechuanaland_direct_intervention_locked:0 "The Southern African Corridor Crisis"
 dp_sb_bechuanaland_direct_intervention_locked_desc:0 "A direct imperial confrontation will decide control of the Cape, South West Africa, and the British road into the Southern African interior."
 dp_sb_bechuanaland_direct_intervention_locked_tooltip:0 "A closed [concept_diplomatic_play] over the Southern African subject system. Neither side may add further war goals."
 dp_sb_bechuanaland_proxy_intervention_locked:0 "The Bechuanaland Proxy Crisis"
 dp_sb_bechuanaland_proxy_intervention_locked_desc:0 "South West Africa and the Cape contest the interior corridor while their imperial patrons limit the confrontation."
 dp_sb_bechuanaland_proxy_intervention_locked_tooltip:0 "A closed humiliation play between South West Africa and the Cape. Neither side may add further war goals."
 dp_sb_bechuanaland_proxy_namaqualand_locked:0 "The Namaqualand Proxy Crisis"
 dp_sb_bechuanaland_proxy_namaqualand_locked_desc:0 "South West Africa demands the return of the Cape-held port at Walvis Bay while the Cape answers with humiliation."
 dp_sb_bechuanaland_proxy_namaqualand_locked_tooltip:0 "A closed Return State play over the Cape's Namaqualand partition. Neither side may add further war goals."

 je_sb_bechuanaland_demand_caprivi_button:0 "Demand passage to the Zambezi"
 je_sb_bechuanaland_demand_caprivi_button_desc:0 "Demand Britain give South West Africa access to the Zambezi, joining the Atlantic colony to the river systems of the interior."
 je_sb_bechuanaland_demand_caprivi_possible_tt:0 "[SCOPE.sCountry('sb_swa_scope').GetName] fully controls [GetStateRegion('STATE_HEREROLAND').GetName]."

 je_sb_bechuanaland_send_crisis_support_button:0 "Send Crisis Support"
 je_sb_bechuanaland_send_crisis_support_button_desc:0 "Dispatch rifles, officers, and stores to sustain our aligned government in the corridor war."
 je_sb_bechuanaland_send_crisis_support_possible_tt:0 "A corridor war is active, we have at least £25,000 in reserves, and no support mission has been sent in the past twelve months. Sending support costs £25,000."

 # ### REVIEWED ###
 sb_bechuanaland_corridor.001.t:0 "The Neck of the Bottle"
 sb_bechuanaland_corridor.001.d:0 "The establishment of [SCOPE.sCountry('sb_swa_scope').GetName] has given [SCOPE.sCountry('sb_swa_overlord_scope').GetName] a foothold upon the Atlantic coast. To the east, [SCOPE.sCountry('sb_boer_actor_scope').GetName] presses toward the same thin country. Between them lies Bechuanaland, the only unobstructed British road from the Cape into the interior. What was once a remote frontier has become a question of empire."
 sb_bechuanaland_corridor.001.f:0 "#italic \"Bechuanaland is the neck of the bottle...\"#!\n\n- Cecil John Rhodes"
 sb_bechuanaland_corridor.001.a:0 "The road north must remain open."

 # ### REVIEWED ###
 sb_bechuanaland_corridor.010.t:0 "Warren's Ultimatum"
 sb_bechuanaland_corridor.010.d:0 "Major-General Sir Charles Warren is marching north at the head of an imperial expedition. His terms have reached [ROOT.GetCountry.GetCapital.GetCityHubName]: [ROOT.GetCountry.GetName] must abandon [SCOPE.sCountry('sb_sgo_scope').GetName], leaving the road north to the African interior open to imperial domination, and permit [SCOPE.sCountry('sb_cap_scope').GetName] to occupy the disputed settlements. If the Volksraad refuses, the question will be settled by bloodshed, and [SCOPE.sCountry('sb_swa_overlord_scope').GetName] may yet decide to stifle British plans..."
 sb_bechuanaland_corridor.010.f:0 "'The object of this mission and expedition is to remove the filibusters from Bechuanaland.'\n— Sir Charles Warren, #italic Memorandum on Bechuanaland, 1884#!"
 sb_bechuanaland_corridor.010.a:0 "There will be no war over Bechuanaland."
 sb_bechuanaland_corridor.010.b:0 "Let Warren come and take it."
 sb_bechuanaland_corridor_010_refuse_tt:0 "[SCOPE.sCountry('sb_swa_overlord_scope').GetName] will decide whether to intervene before Britain or [SCOPE.sCountry('sb_cap_scope').GetName] begins a [concept_diplomatic_play]."

 # ### TO REVIEW ###
 sb_bechuanaland_corridor.020.t:0 "Crisis over Bechuanaland"
 sb_bechuanaland_corridor.020.d:0 "Boer leaders have rejected Britain's demands to surrender the [GetStateRegion('STATE_BECHUANALAND').GetName] corridor. Their defiance threatens more than [SCOPE.sCountry('sb_sgo_scope').GetName] sovereignty: if Britain holds Bechuanaland, she will command the road north from the Cape towards the Zambezi and the lands beyond. The cabinet must decide whether to confront Britain directly, answer indirectly through [SCOPE.sCountry('sb_swa_scope').GetName], or stand aside."
 sb_bechuanaland_corridor.020.f:0 "'Bechuanaland is the neck of the bottle and commands the route to the Zambesi.' — Cecil Rhodes, #italic 1884#!"
 sb_bechuanaland_corridor.020.a:0 "The balance of empire is at stake."
 sb_bechuanaland_corridor.020.b:0 "Let [SCOPE.sCountry('sb_swa_scope').GetNameNoFormatting] carry our answer."
 sb_bechuanaland_corridor.020.c:0 "Warren may have his road."

 sb_bechuanaland_corridor_020_direct_tt:0 "[ROOT.GetCountry.GetName] will begin a locked total war for [SCOPE.sCountry('sb_cap_scope').GetName] and every eligible direct British subject in Southern Africa. [SCOPE.sCountry('sb_gbr_scope').GetName] will demand [SCOPE.sCountry('sb_swa_scope').GetName]. Every Boer republic and its subjects will join [ROOT.GetCountry.GetName]; reciprocal Bechuanaland claims and British protectorate demands against independent Boer participants other than [SCOPE.sCountry('sb_sgo_scope').GetName] will be added."

 sb_bechuanaland_corridor_020_proxy_tt:0 "[SCOPE.sCountry('sb_swa_scope').GetName] will begin a locked proxy play against [SCOPE.sCountry('sb_cap_scope').GetName], demanding the Cape's Namaqualand partition if it still contains Walvis Bay and humiliation otherwise. The Cape will demand humiliation in return. Every Boer republic and its subjects will join South West Africa, with reciprocal primary Bechuanaland demands where valid; no secondary goals will be added."

 sb_bechuanaland_corridor_020_no_intervention_tt:0 "A locked early Boer War will begin. [SCOPE.sCountry('sb_gbr_scope').GetName], [SCOPE.sCountry('sb_cap_scope').GetName], and Britain's direct regional subjects will face the actual Boer corridor holder, every existing Boer republic, and their subjects. Reciprocal Bechuanaland demands, Boer settlement goals against the Cape, Natalia, Griqualand West, and Basutoland, and British protectorate demands against eligible independent Boer participants will be fixed at launch; SGO remains exempt from British subjugation."

 sb_bechuanaland_corridor_021_direct_tt:0 "[ROOT.GetCountry.GetName] will begin a locked total war for [SCOPE.sCountry('sb_cap_scope').GetName] and every eligible direct British subject in Southern Africa. [SCOPE.sCountry('sb_gbr_scope').GetName] will demand [SCOPE.sCountry('sb_swa_scope').GetName]. Every Boer republic and its subjects will join [ROOT.GetCountry.GetName]; reciprocal Bechuanaland claims and British protectorate demands against independent Boer participants other than [SCOPE.sCountry('sb_sgo_scope').GetName] will be added."
 
 sb_bechuanaland_corridor_021_proxy_tt:0 "[SCOPE.sCountry('sb_swa_scope').GetName] will begin a locked proxy play against [SCOPE.sCountry('sb_cap_scope').GetName], demanding the Cape's Namaqualand partition if it still contains Walvis Bay and humiliation otherwise. The Cape will demand humiliation in return. Every Boer republic and its subjects will join South West Africa, with reciprocal primary Bechuanaland demands where valid; no secondary goals will be added."
 sb_bechuanaland_corridor_021_no_intervention_tt:0 "A locked early Boer War will begin without South West African intervention. Britain, the Cape, and Britain's direct regional subjects will face every Boer republic and its subjects under the complete fixed settlement package."

 # ### REVIEWED ###
 sb_bechuanaland_corridor.030.t:0 "The Zambezi Memorandum"
 sb_bechuanaland_corridor.030.d:0 "[SCOPE.sCountry('sb_swa_overlord_scope').GetName] has demanded that [SCOPE.sCountry('sb_swa_scope').GetName] be granted access to the Zambezi and through it influence into the African interior. However, the river system is not fully navigable, being interrupted by multiple falls and rapids along its route. A cunning officer has suggested to grant them a strip of land along the middle section which is blocked by the great Victoria Falls to the South-East, limiting their influence while placating their demands. The concession may buy the [SCOPE.sCountry('sb_swa_overlord_scope').GetNameNoFormatting]'s neutrality in the present dispute; while refusal may turn the road to the Zambezi into a contest between empires."
 sb_bechuanaland_corridor.030.f:0 "'Germany shall be granted free access from its protectorate to the Zambezi by means of a strip of land...'\n— #italic Anglo-German Agreement, 1 July 1890#!"
 sb_bechuanaland_corridor.030.a:0 "Give them the useless strip."
 sb_bechuanaland_corridor.030.b:0 "Not one inch of Britain's claims shall be yielded!"

 sb_bechuanaland_corridor_030_accept_tt:0 "The Caprivi provinces will pass to [SCOPE.sCountry('sb_swa_scope').GetName], making [SCOPE.sCountry('sb_swa_overlord_scope').GetName] less likely to intervene in a later struggle over the Bechuanaland corridor with the #b Boers#!."
 sb_bechuanaland_corridor_030_reject_tt:0 "[SCOPE.sCountry('sb_swa_overlord_scope').GetName] will receive Britain's rejection, and #n may intervene via force#!."


 # ### TO REVIEW ###
 sb_bechuanaland_corridor.031.t:0 "No Road to the Zambezi"
 sb_bechuanaland_corridor.031.d:0 "[SCOPE.sCountry('sb_gbr_scope').GetName] has rejected our demand for passage from [SCOPE.sCountry('sb_swa_scope').GetName] to the Zambezi. If Sir Warren secures Bechuanaland, Britain will hold the road from the Cape towards the Zambezi and the lakes beyond, while our Atlantic colony remains shut out. The cabinet must decide whether to challenge Britain's Empire in Southern Africa directly, wage a proxy war through [SCOPE.sCountry('sb_swa_scope').GetName], or wait for a more opportune moment."
 sb_bechuanaland_corridor.031.f:0 "The minister laid London's refusal beside the colonial map. The proposed road from [SCOPE.sCountry('sb_swa_scope').GetNameNoFormatting] ended at the Zambezi. A red line from the Cape ran through Bechuanaland towards Matabeleland, the upper Zambezi and Lake Nyasa.\n\n\"They have denied us a road,\" he said. \"They mean to keep the interior for themselves.\""
 sb_bechuanaland_corridor.031.a:0 "The time of the [SCOPE.sCountry('sb_swa_overlord_scope').GetAdjective] Empire has come."
 sb_bechuanaland_corridor.031.b:0 "Wage a proxy war through [SCOPE.sCountry('sb_swa_scope').GetNameNoFormatting] to force the issue."
 sb_bechuanaland_corridor.031.c:0 "The Zambezi is not worth a war."

 sb_bechuanaland_corridor_031_gp_tt:0 "We will launch a locked total war for [SCOPE.sCountry('sb_cap_scope').GetName] and every eligible direct British subject in Southern Africa; [SCOPE.sCountry('sb_gbr_scope').GetName] will demand [SCOPE.sCountry('sb_swa_scope').GetName]. The #b Boers#! will first decide whether their republics, subjects, corridor claims, and Britain's opposing protectorate demands join the package."

 sb_bechuanaland_corridor_031_proxy_tt:0 "The demand for passage to the Zambezi will become a locked proxy struggle. [SCOPE.sCountry('sb_swa_scope').GetName] will demand the Cape's Namaqualand partition if it still contains Walvis Bay and humiliation otherwise; [SCOPE.sCountry('sb_cap_scope').GetName] will demand humiliation in return. [SCOPE.sCountry('sb_gbr_scope').GetName] will defend the Cape while [ROOT.GetCountry.GetName] remains outside. The Boers will first decide whether their full network and the reciprocal Bechuanaland primaries join; no secondary goals will be added."

 sb_bechuanaland_corridor_031_backdown_tt:0 "The demand for passage to the Zambezi will be abandoned without a diplomatic play."

 # ### TO REVIEW ###
 sb_bechuanaland_corridor.032.t:0 "The Road North"
 sb_bechuanaland_corridor.032.d:0 "[SCOPE.sCountry('sb_swa_overlord_scope').GetName] has challenged Britain over the road to the Zambezi and now calls upon [ROOT.GetCountry.GetName] to join the struggle. If Britain secures Bechuanaland, the route from the Cape to the Zambezi and the lakes beyond will fall beneath the British flag, shutting the Boer republics out of the northern interior. To intervene would carry every republic and dependency that follows our lead into a war between empires."
 sb_bechuanaland_corridor.032.f:0 "'We must secure it, unless we are prepared to see the whole of the North pass out of our hands.'\n— Cecil Rhodes, #italic Speech to the Cape Parliament, 16 July 1884#!"
 sb_bechuanaland_corridor.032.a:0 "The road north must remain open."
 sb_bechuanaland_corridor.032.b:0 "Let the empires fight without us."

 sb_bechuanaland_corridor_032_support_tt:0 "Every existing Boer republic and all of their subjects will join the South West African side. In a direct imperial war this also adds reciprocal Bechuanaland demands and British protectorate goals against eligible independent Boer participants other than [SCOPE.sCountry('sb_sgo_scope').GetName]. In a proxy war it adds only the reciprocal primary Bechuanaland demands."

 sb_bechuanaland_corridor_032_neutral_tt:0 "The entire Boer network will remain outside the coming war. Britain will receive no transfer or protectorate demands against its members, but the war will still determine control of the Bechuanaland Corridor."

 # ### TO REVIEW ###
 sb_bechuanaland_corridor.033.t:0 "The Crisis Attempt Lapses"
 sb_bechuanaland_corridor.033.d:0 "The proposed intervention can no longer proceed because one of its indispensable participants has left the arrangement. No influence was committed, and a new demand may be made if the corridor crisis remains live."
 sb_bechuanaland_corridor.033.f:0 "The drafts remain unsigned. With the coalition no longer answering to the names written upon them, the chancelleries quietly close the file."
 sb_bechuanaland_corridor.033.a:0 "Reassess the corridor."

 sb_bechuanaland_corridor.034.t:0 "Warren Without an Appeal"
 sb_bechuanaland_corridor.034.d:0 "The government behind [SCOPE.sCountry('sb_swa_scope').GetName] has entered Britain's security network. London will therefore hear no separate appeal on its behalf. The Warren ultimatum stands: yield the road north to Cape authority, or face an expedition to enforce the Cape's claims."
 sb_bechuanaland_corridor.034.f:0 "The second dispatch was shorter than the first. The seals of the former sponsor now appeared beside Britain's own; there would be no conference after the reply."
 sb_bechuanaland_corridor.034.a:0 "There will be no war over this."
 sb_bechuanaland_corridor.034.b:0 "Then Warren may come."

 sb_bechuanaland_corridor.035.t:0 "A Place Within the Cape"
 sb_bechuanaland_corridor.035.d:0 "[ROOT.GetCountry.GetName] now stands within the British hierarchy, putting the corridor beyond South West African reach. Cape ministers propose one final step: annexation to [SCOPE.sCountry('sb_cap_scope').GetName], with the institutions of [SCOPE.sCountry('sb_sgo_scope').GetName] absorbed into the colony. Refusal will preserve the present government without changing the British result."
 sb_bechuanaland_corridor.035.f:0 "The proposal was written as an invitation, though every line assumed that the road south and the road north already passed under the same flag."
 sb_bechuanaland_corridor.035.a:0 "Join the Cape."
 sb_bechuanaland_corridor.035.b:0 "Remain a distinct British dependency."

 sb_bechuanaland_corridor.040.t:0 "The Road North Secured"
 sb_bechuanaland_corridor.040.d:0 "From [GetStateRegion('STATE_GRIQUALAND_WEST').GetName] to [GetStateRegion('STATE_BECHUANALAND').GetName], the road into the interior now lies under British authority. Boer settlement and South West African expansion have been checked. What remains is to settle whether the frontier will answer directly to London or pass beneath the institutions of the Cape."
 sb_bechuanaland_corridor.040.f:0 "The surveyor drew one final line across the map. Behind it lay the Cape; beyond it, the interior. For the moment, the road between them was secure."
 sb_bechuanaland_corridor.040.a:0 "Settle the corridor."

 # ### TO REVIEW ###
 sb_bechuanaland_corridor.041.t:0 "The Interior Settlement"
 sb_bechuanaland_corridor.041.d:0 "British authority has receded from the road north. The question is no longer whether the interior settlement will prevail, but whose institutions will shape it: those of [SCOPE.sCountry('sb_bechuanaland_boer_claimant_scope').GetName], those of [SCOPE.sCountry('sb_bechuanaland_swa_settlement_claimant_scope').GetName], or an accommodation between them."
 sb_bechuanaland_corridor.041.f:0 "The frontier had been won together. Its map would now reveal which partner had supplied the settlers, the roads, and the credit needed to hold it."
 sb_bechuanaland_corridor.041.a:0 "Settle the interior corridor."
 sb_bechuanaland_corridor_041_boer_settlement_tt:0 "[SCOPE.sCountry('sb_bechuanaland_boer_claimant_scope').GetName] gains a [concept_claim] on [GetStateRegion('STATE_BOTSWANA').GetName] and receives the remaining Tswana-held land in [GetStateRegion('STATE_BECHUANALAND').GetName]."
 sb_bechuanaland_corridor_041_balanced_settlement_tt:0 "[SCOPE.sCountry('sb_bechuanaland_boer_claimant_scope').GetName] and [SCOPE.sCountry('sb_bechuanaland_swa_settlement_claimant_scope').GetName] each gain a [concept_claim] on [GetStateRegion('STATE_BOTSWANA').GetName]. The remaining Tswana-held land in [GetStateRegion('STATE_BECHUANALAND').GetName] passes to [SCOPE.sCountry('sb_bechuanaland_boer_claimant_scope').GetName]."
 sb_bechuanaland_corridor_041_swa_settlement_tt:0 "[SCOPE.sCountry('sb_bechuanaland_swa_settlement_claimant_scope').GetName] alone gains [Concept('concept_claim', '$concept_claims$')] on [GetStateRegion('STATE_BOTSWANA').GetName], [GetStateRegion('STATE_ZAMBIA').GetName], [GetStateRegion('STATE_ZAMBEZI').GetName], and [GetStateRegion('STATE_KAZEMBE').GetName]. If its overlord commands a [concept_power_bloc], that bloc gains #v 200#! [concept_power_bloc_leverage] against every member of the Boer network."

 sb_bechuanaland_corridor.042.t:0 "An Unresolved Settlement"
 sb_bechuanaland_corridor.042.d:0 "The fighting has ended without either coalition imposing a coherent settlement. The rival packages of demands cancel one another, and the wider claim to Botswana is abandoned rather than assigned by default."
 sb_bechuanaland_corridor.042.f:0 "The delegates signed beneath an empty map. No new frontier had been agreed; only the limits of what either side could compel."
 sb_bechuanaland_corridor.042.a:0 "Close the corridor question without a victor."

 sb_bechuanaland_corridor.043.t:0 "A Cape for Both Peoples"
 sb_bechuanaland_corridor.043.d:0 "The Boer republics have broken Britain's attempt to dictate the interior settlement. Cape ministers can no longer sustain a policy of exclusion against the victors' kinsmen: the Boer people must be acknowledged as one of the colony's founding communities."
 sb_bechuanaland_corridor.043.f:0 "The old watchword of Boer-hatred had exhausted itself on the northern frontier. In its place came an uneasy recognition that the Cape could not be governed against half of its settler population."
 sb_bechuanaland_corridor.043.a:0 "End the Boerehaat and recognise the Boers."

 sb_bechuanaland_corridor.044.t:0 "Natalia Restored"
 sb_bechuanaland_corridor.044.d:0 "British power has receded from the interior, and the colonial administration at Natal can no longer endure. Boer institutions return to Pietermaritzburg; the colony is again the Republic of Natalia."
 sb_bechuanaland_corridor.044.f:0 "The Union Jack came down above the government offices. Before evening a Vierkleur flew in its place, and the old republican name passed from memory back into law."
 sb_bechuanaland_corridor.044.a:0 "Restore the Republic of Natalia."

 sb_bechuanaland_crisis_support:0 "Corridor Crisis Support"
 sb_bechuanaland_crisis_support_desc:0 "Foreign rifles, officers, and stores are sustaining this side of the struggle for the Bechuanaland corridor."
 sb_bechuanaland_crisis_support_effect_tt:0 "Costs £25,000. Only countries participating on the supported side receive the military support. Support from the South West African sponsor also shifts the influence balance by -0.125 each month for one year."
