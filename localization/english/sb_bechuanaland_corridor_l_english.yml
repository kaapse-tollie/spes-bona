l_english:
 je_sb_bechuanaland_corridor:0 "Bechuanaland Corridor Crisis"
 je_sb_bechuanaland_corridor_reason:0 "The Kimberley settlement has made the interior corridor strategically visible. Britain fears a Boer route through Bechuanaland to South West Africa; Boer republics and the South West African overlord see the same corridor as a way to break Cape pressure."
 je_sb_bechuanaland_corridor_status:0 "The crisis is unresolved. Britain seeks to secure the north-west corridor; Boer and South West African pressure seeks to deny it."
 je_sb_bechuanaland_corridor_british_victory_header:0 "British Corridor Secured"
 je_sb_bechuanaland_corridor_boer_swa_victory_header:0 "Boer-South West African Corridor Secured"

 sb_bechuanaland_boer_swa_influence_bar:0 "Corridor Influence"
 sb_bechuanaland_boer_swa_influence_bar_swa:0 "South West African Leverage"
 sb_bechuanaland_boer_swa_influence_bar_boer:0 "Boer Settlement Pressure"

 je_sb_bechuanaland_sponsor_boer_settlers_button:0 "Sponsor Boer Settlers"
 je_sb_bechuanaland_sponsor_boer_settlers_button_desc:0 "Establish Stellaland-Goshen from the first Tswana-held beachhead in the north-west corridor and bring it under Boer protection."
 je_sb_bechuanaland_sponsor_boer_settlers_possible_tt:0 "Requires a Boer actor, Cape claims on the Northern Cape, no existing Stellaland-Goshen, and a Tswana-held corridor beachhead."

 je_sb_bechuanaland_send_warren_expedition_button:0 "Send the Warren Expedition"
 je_sb_bechuanaland_send_warren_expedition_button_desc:0 "Pressure Stellaland-Goshen's overlord to accept Cape annexation of the corridor settlement."
 je_sb_bechuanaland_send_warren_expedition_possible_tt:0 "Requires Cape Colony to be a British subject, Stellaland-Goshen to exist, and Tswana control of the priority corridor beachheads to have ended."

 je_sb_bechuanaland_gbr_direct_warren_button:0 "Force the Corridor Question"
 je_sb_bechuanaland_gbr_direct_warren_button_desc:0 "Intervene directly after a Boer Kimberley victory to restore Cape claims and demand control over the corridor settlement."
 je_sb_bechuanaland_gbr_direct_warren_possible_tt:0 "Requires a Boer Kimberley victory and Waterboersland or Stellaland-Goshen inside an Oranje or Transvaal sphere."

 je_sb_bechuanaland_demand_caprivi_button:0 "Demand the Caprivi Strip"
 je_sb_bechuanaland_demand_caprivi_button_desc:0 "Demand the riverine corridor that would connect South West Africa to the Bechuanaland interior."
 je_sb_bechuanaland_demand_caprivi_possible_tt:0 "Requires South West Africa not to hold the Caprivi provinces and no previous Caprivi demand from this overlord."

 je_sb_bechuanaland_formalize_british_corridor_button:0 "Formalize the British Corridor"
 je_sb_bechuanaland_formalize_british_corridor_button_desc:0 "Confirm British-Cape control of the north-west corridor."
 je_sb_bechuanaland_formalize_british_possible_tt:0 "Requires Cape control of the priority north-west corridor beachheads."

 je_sb_bechuanaland_formalize_boer_swa_corridor_button:0 "Formalize the Interior Corridor"
 je_sb_bechuanaland_formalize_boer_swa_corridor_button_desc:0 "Confirm Boer-South West African control of the north-west corridor."
 je_sb_bechuanaland_formalize_boer_swa_possible_tt:0 "Requires Stellaland-Goshen control of the priority north-west corridor beachheads."

 je_sb_bechuanaland_send_crisis_support_button:0 "Send Crisis Support"
 je_sb_bechuanaland_send_crisis_support_button_desc:0 "Send temporary officers and supplies to the aligned side of the corridor crisis."
 je_sb_bechuanaland_send_crisis_support_possible_tt:0 "Requires an active corridor crisis war and no current yearly support cooldown."

 sb_bechuanaland_corridor.001.t:0 "The Bechuanaland Corridor"
 sb_bechuanaland_corridor.001.d:0 "The settlement of Kimberley has not ended imperial anxiety in the interior. [SCOPE.sCountry('sb_gbr_scope').GetName] now looks north, where the road between the Cape, the Boer republics, Bechuanaland, and [SCOPE.sCountry('sb_swa_scope').GetName] could decide whether the British corridor survives."
 sb_bechuanaland_corridor.001.f:0 "A railway need not exist for a corridor to become a policy."
 sb_bechuanaland_corridor.001.a:0 "The interior cannot be ignored."

 sb_bechuanaland_corridor.010.t:0 "The Warren Demand"
 sb_bechuanaland_corridor.010.d:0 "[SCOPE.sCountry('sb_cap_scope').GetName] and [SCOPE.sCountry('sb_gbr_scope').GetName] demand a settlement over Stellaland-Goshen. Acceptance would yield the corridor to the Cape; refusal risks drawing [SCOPE.sCountry('sb_swa_scope').GetName]'s patron into the dispute."
 sb_bechuanaland_corridor.010.f:0 "The frontier was to be pacified before it became a foreign corridor."
 sb_bechuanaland_corridor.010.a:0 "Back down."
 sb_bechuanaland_corridor.010.b:0 "Refuse."
 sb_bechuanaland_corridor_010_backdown_tt:0 "Stellaland-Goshen, and Waterboersland where relevant, will be annexed by [SCOPE.sCountry('sb_cap_scope').GetName]."
 sb_bechuanaland_corridor_010_refuse_tt:0 "The South West African overlord will decide whether to intervene before the diplomatic play begins."

 sb_bechuanaland_corridor.020.t:0 "The Corridor Crisis"
 sb_bechuanaland_corridor.020.d:0 "The Warren demand has been refused. The crisis can remain a Cape frontier action, become a South West African proxy conflict, or escalate into a direct great-power confrontation over [SCOPE.sCountry('sb_cap_scope').GetName]."
 sb_bechuanaland_corridor.020.f:0 "Once a corridor became a question of empire, every map line invited another claim."
 sb_bechuanaland_corridor.020.a:0 "Intervene directly."
 sb_bechuanaland_corridor.020.b:0 "Use South West Africa as proxy."
 sb_bechuanaland_corridor.020.c:0 "Offer no direct intervention."
 sb_bechuanaland_corridor_020_direct_tt:0 "A transfer-subject diplomatic play over [SCOPE.sCountry('sb_cap_scope').GetName] begins."
 sb_bechuanaland_corridor_020_proxy_tt:0 "[SCOPE.sCountry('sb_swa_scope').GetName] starts a humiliation play against [SCOPE.sCountry('sb_cap_scope').GetName]."
 sb_bechuanaland_corridor_020_no_intervention_tt:0 "The Warren route proceeds without direct South West African intervention."

 sb_bechuanaland_corridor.030.t:0 "The Caprivi Demand"
 sb_bechuanaland_corridor.030.d:0 "[SCOPE.sCountry('sb_swa_overlord_scope').GetName] demands a strip of territory linking [SCOPE.sCountry('sb_swa_scope').GetName] toward the Zambezi. London can concede the corridor or risk a more dangerous confrontation."
 sb_bechuanaland_corridor.030.f:0 "The shape of a colony could be decided by the bend of a river."
 sb_bechuanaland_corridor.030.a:0 "Accept the demand."
 sb_bechuanaland_corridor.030.b:0 "Reject it."
 sb_bechuanaland_corridor_030_accept_tt:0 "The Caprivi provinces transfer to [SCOPE.sCountry('sb_swa_scope').GetName]. The South West African overlord becomes less likely to escalate later."
 sb_bechuanaland_corridor_030_reject_tt:0 "The South West African overlord may escalate directly, use [SCOPE.sCountry('sb_swa_scope').GetName] as a proxy, or back down."

 sb_bechuanaland_corridor.031.t:0 "The Caprivi Demand Rejected"
 sb_bechuanaland_corridor.031.d:0 "[SCOPE.sCountry('sb_gbr_scope').GetName] has rejected the Caprivi demand. The question is now whether to make the corridor a great-power confrontation, a proxy war through [SCOPE.sCountry('sb_swa_scope').GetName], or a grievance left for later."
 sb_bechuanaland_corridor.031.f:0 "A rejected strip could still become a wedge."
 sb_bechuanaland_corridor.031.a:0 "Force the issue."
 sb_bechuanaland_corridor.031.b:0 "Let South West Africa act."
 sb_bechuanaland_corridor.031.c:0 "Back down."
 sb_bechuanaland_corridor_031_gp_tt:0 "A transfer-subject diplomatic play over [SCOPE.sCountry('sb_cap_scope').GetName] begins."
 sb_bechuanaland_corridor_031_proxy_tt:0 "[SCOPE.sCountry('sb_swa_scope').GetName] starts a humiliation play against [SCOPE.sCountry('sb_cap_scope').GetName]."
 sb_bechuanaland_corridor_031_backdown_tt:0 "No diplomatic play begins from the rejected Caprivi demand."

 sb_bechuanaland_crisis_support:0 "Corridor Crisis Support"
 sb_bechuanaland_crisis_support_desc:0 "Foreign officers, rifles, and supplies have been directed toward this side of the Bechuanaland Corridor crisis."
