 sb_bechuanaland_influence_boer_relations_friendly:0 "[SCOPE.sCountry('sb_sgo_scope').GetName] is friendly with [GetGlobalVariable('sb_bechuanaland_boer_actor_global_scope').GetCountry.GetName]"
 sb_bechuanaland_influence_boer_relations_amicable:0 "[SCOPE.sCountry('sb_sgo_scope').GetName] is amicable with [GetGlobalVariable('sb_bechuanaland_boer_actor_global_scope').GetCountry.GetName]"
 sb_bechuanaland_influence_boer_relations_cordial:0 "[SCOPE.sCountry('sb_sgo_scope').GetName] is cordial with [GetGlobalVariable('sb_bechuanaland_boer_actor_global_scope').GetCountry.GetName]"
 sb_bechuanaland_influence_boer_relations_poor:0 "[SCOPE.sCountry('sb_sgo_scope').GetName] has poor relations with [GetGlobalVariable('sb_bechuanaland_boer_actor_global_scope').GetCountry.GetName]"
