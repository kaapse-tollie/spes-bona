 sb_bechuanaland_influence_swa_namibian_core:0 "South West Africa controls its Namibian heartland"
 sb_bechuanaland_influence_swa_caprivi:0 "South West Africa controls the Caprivi corridor"
 sb_bechuanaland_influence_boer_in_swa_bloc:0 "[GetGlobalVariable('sb_bechuanaland_boer_actor_global_scope').GetCountry.GetName] is tied to the South West African power"
 sb_bechuanaland_influence_boer_trade_privileges:0 "Boer trade privileges with Stellaland-Goshen"
 sb_bechuanaland_influence_swa_trade_privileges:0 "South West African trade privileges with Stellaland-Goshen"
