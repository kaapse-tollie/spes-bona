 je_sb_bechuanaland_sponsor_boer_settlers_button:0 "Sponsor Boer Settlers"
 je_sb_bechuanaland_sponsor_boer_settlers_button_desc:0 "Advance the Boer frontier into [GetStateRegion('STATE_BECHUANALAND').GetName]. A settlement at the first available crossing will be organized as Stellaland-Goshen and placed under our protection."
 je_sb_bechuanaland_sponsor_boer_settlers_possible_tt:0 "There is no Stellaland-Goshen, and the Tswana still hold land upon which a Boer settlement can be established."

 je_sb_bechuanaland_support_settler_government_button:0 "Support the Settler Government"
 je_sb_bechuanaland_support_settler_government_button_desc:0 "Provide Stellaland-Goshen with money and political backing, drawing its frontier government closer to the Boer republics."
 je_sb_bechuanaland_support_settler_government_possible_tt:0 "We have #v £2,500#! in reserve, are not in default, and have not subsidized Stellaland-Goshen within the past two years."
 sb_bechuanaland_boer_subsidy_effect_tt:0 "For #v 12 months#!, Boer influence in the corridor increases by #v 0.25#! each month."

 je_sb_bechuanaland_finance_interior_trade_missions_button:0 "Finance Interior Trade Missions"
 je_sb_bechuanaland_finance_interior_trade_missions_button_desc:0 "Fund merchants and agents travelling through Stellaland-Goshen, binding its interior trade to South West Africa."
 je_sb_bechuanaland_finance_interior_trade_missions_possible_tt:0 "We have #v £25,000#! in reserve, are not in default, and have not financed a mission within the past two years."
 sb_bechuanaland_swa_subsidy_effect_tt:0 "For #v 12 months#!, South West African influence in the corridor increases by #v 0.25#! each month."

 je_sb_bechuanaland_send_warren_expedition_button:0 "Send the Warren Expedition"
 je_sb_bechuanaland_send_warren_expedition_button_desc:0 "Send a Cape column north to extinguish Stellaland-Goshen and place the road through [GetStateRegion('STATE_BECHUANALAND').GetName] under colonial administration."
 je_sb_bechuanaland_send_warren_expedition_possible_tt:0 "The Cape is a British subject with a foothold in [GetStateRegion('STATE_BECHUANALAND').GetName], Stellaland-Goshen exists, the Tswana no longer bar the road north, and no Warren ultimatum is pending."

 je_sb_bechuanaland_gbr_direct_warren_button:0 "Force the Corridor Question"
 je_sb_bechuanaland_gbr_direct_warren_button_desc:0 "The defeat at Kimberley has left the Cape unable to secure the interior. Restore its claim and deliver a British ultimatum to the Boer government holding the corridor settlements."
 je_sb_bechuanaland_gbr_direct_warren_possible_tt:0 "The Boers prevailed at Kimberley, and an Oranje or Transvaal government directly or indirectly controls both [GetStateRegion('STATE_GRIQUALAND_WEST').GetName] and [GetStateRegion('STATE_BECHUANALAND').GetName]."

 dp_sb_bechuanaland_cap_dual_return_locked:0 "The Corridor Question"
 dp_sb_bechuanaland_cap_dual_return_locked_desc:0 "The Cape seeks the return of both Griqualand West and Bechuanaland in a single, closed settlement."
 dp_sb_bechuanaland_cap_dual_return_locked_tooltip:0 "The Cape seeks the return of both Griqualand West and Bechuanaland in a single, closed settlement."

 dp_sb_bechuanaland_direct_intervention_locked:0 "The Southern African Corridor Crisis"
 dp_sb_bechuanaland_direct_intervention_locked_desc:0 "A direct imperial confrontation will decide control of the Cape, South West Africa, and the British road into the Southern African interior."
 dp_sb_bechuanaland_direct_intervention_locked_tooltip:0 "A closed diplomatic play over the Southern African subject system. Neither side may add further war goals."
 dp_sb_bechuanaland_proxy_intervention_locked:0 "The Bechuanaland Proxy Crisis"
 dp_sb_bechuanaland_proxy_intervention_locked_desc:0 "South West Africa and the Cape contest the interior corridor while their imperial patrons limit the confrontation."
 dp_sb_bechuanaland_proxy_intervention_locked_tooltip:0 "A closed humiliation play between South West Africa and the Cape. Neither side may add further war goals."

 je_sb_bechuanaland_demand_caprivi_button:0 "Demand the Caprivi Strip"
 je_sb_bechuanaland_demand_caprivi_button_desc:0 "Demand a narrow road from South West Africa toward the Zambezi, joining the Atlantic colony to the river systems of the interior."
 je_sb_bechuanaland_demand_caprivi_possible_tt:0 "South West Africa fully controls Hereroland, does not control the proposed Caprivi corridor, and no demand for it has yet been presented."

 je_sb_bechuanaland_send_crisis_support_button:0 "Send Crisis Support"
 je_sb_bechuanaland_send_crisis_support_button_desc:0 "Dispatch rifles, officers, and stores to sustain our aligned government in the corridor war."
 je_sb_bechuanaland_send_crisis_support_possible_tt:0 "A corridor war is active, and no support mission has been sent in the past twelve months."

 # ### REVIEWED ###
 sb_bechuanaland_corridor.001.t:0 "The Neck of the Bottle"
 sb_bechuanaland_corridor.001.d:0 "The establishment of [SCOPE.sCountry('sb_swa_scope').GetName] has given [SCOPE.sCountry('sb_swa_overlord_scope').GetName] a foothold upon the Atlantic coast. To the east, [SCOPE.sCountry('sb_boer_actor_scope').GetName] presses toward the same thin country. Between them lies Bechuanaland, the only unobstructed British road from the Cape into the interior. What was once a remote frontier has become a question of empire."
 sb_bechuanaland_corridor.001.f:0 "#italic \"Bechuanaland is the neck of the bottle...\"#!\n\n- Cecil John Rhodes"
 sb_bechuanaland_corridor.001.a:0 "The road north must remain open."

 # ### REVIEWED ###
 sb_bechuanaland_corridor.010.t:0 "The Warren Ultimatum"
 sb_bechuanaland_corridor.010.d:0 "An ultimatum endorsed in Cape Town and London has arrived in [ROOT.GetCountry.GetCapital.GetCityHubName]. The government is to surrender its hold over the road north and permit Cape authorities to occupy the contested settlements. Acceptance will end the matter without bloodshed. Refusal may draw the patron of [SCOPE.sCountry('sb_swa_scope').GetName] into the dispute."
 sb_bechuanaland_corridor.010.f:0 "The messenger brushed the red dust from his coat before laying the memorandum upon the table. Its seals were intact; its meaning required no translation.\n\nThere would be no conference, no commission, and no second letter."
 sb_bechuanaland_corridor.010.a:0 "There will be no war over this."
 sb_bechuanaland_corridor.010.b:0 "The corridor is not theirs to take."
 sb_bechuanaland_corridor_010_backdown_tt:0 "Stellaland-Goshen, and Waterboersland where relevant, will pass to [SCOPE.sCountry('sb_cap_scope').GetName]."
 sb_bechuanaland_corridor_010_refuse_tt:0 "[SCOPE.sCountry('sb_swa_overlord_scope').GetName] will decide whether to intervene before Britain or the Cape begins a diplomatic play."

 # ### REVIEWED ###
 sb_bechuanaland_corridor.020.t:0 "An Answer to Warren"
 sb_bechuanaland_corridor.020.d:0 "The British ultimatum has been rejected. Ministers in [ROOT.GetCountry.GetCapital.GetCityHubName] must now decide how far they are prepared to go in defense of the interior settlement: confront Britain directly, arm [SCOPE.sCountry('sb_swa_scope').GetName] as a proxy, or leave the Boer government to face the Warren expedition alone."
 sb_bechuanaland_corridor.020.f:0 "Three markers rested upon the cabinet map: one at the Cape, one upon the Atlantic coast, and one in the dust of Bechuanaland. The minister moved the first two together.\n\n\"If they meet here,\" he said, tapping the third, \"this is no longer a colonial quarrel.\""
 sb_bechuanaland_corridor.020.a:0 "The balance of empire is at stake."
 sb_bechuanaland_corridor.020.b:0 "Let South West Africa carry our answer."
 sb_bechuanaland_corridor.020.c:0 "This is not our quarrel."
 sb_bechuanaland_corridor_020_direct_tt:0 "[ROOT.GetCountry.GetName] will begin a locked diplomatic play to transfer [SCOPE.sCountry('sb_cap_scope').GetName]. [SCOPE.sCountry('sb_gbr_scope').GetName] will demand the transfer of [SCOPE.sCountry('sb_swa_scope').GetName], while [ROOT.GetCountry.GetName] will demand every valid British subject based in Southern Africa. The Boer network will join [ROOT.GetCountry.GetName]; Britain will seek to transfer or make protectorates of its members except Stellaland-Goshen. Cape and Stellaland-Goshen claims in Bechuanaland will be placed at stake where valid."
 sb_bechuanaland_corridor_020_proxy_tt:0 "[SCOPE.sCountry('sb_swa_scope').GetName] will begin a locked humiliation play against [SCOPE.sCountry('sb_cap_scope').GetName]. [SCOPE.sCountry('sb_gbr_scope').GetName] will defend the Cape, while [ROOT.GetCountry.GetName] remains outside the play. The Boer network will join [SCOPE.sCountry('sb_swa_scope').GetName], and Cape and Stellaland-Goshen claims in Bechuanaland will be placed at stake where valid."
 sb_bechuanaland_corridor_020_no_intervention_tt:0 "The British or Cape demand proceeds without direct South West African intervention."
 sb_bechuanaland_corridor_021_direct_tt:0 "[ROOT.GetCountry.GetName] will begin a locked diplomatic play to transfer [SCOPE.sCountry('sb_cap_scope').GetName]. [SCOPE.sCountry('sb_gbr_scope').GetName] will demand the transfer of [SCOPE.sCountry('sb_swa_scope').GetName], while [ROOT.GetCountry.GetName] will demand every valid British subject based in Southern Africa. The Boer network will always join [ROOT.GetCountry.GetName]; Britain will seek to transfer or make protectorates of its members except Stellaland-Goshen. Cape and Stellaland-Goshen claims in Bechuanaland will be placed at stake where valid."
 sb_bechuanaland_corridor_021_proxy_tt:0 "[SCOPE.sCountry('sb_swa_scope').GetName] will begin a locked humiliation play against [SCOPE.sCountry('sb_cap_scope').GetName]. [SCOPE.sCountry('sb_gbr_scope').GetName] will defend the Cape, while [ROOT.GetCountry.GetName] remains outside the play. The Boer network will always join [SCOPE.sCountry('sb_swa_scope').GetName], and Cape and Stellaland-Goshen claims in Bechuanaland will be placed at stake where valid."
 sb_bechuanaland_corridor_021_no_intervention_tt:0 "[SCOPE.sCountry('sb_cap_scope').GetName] begins a closed diplomatic play to recover [GetStateRegion('STATE_GRIQUALAND_WEST').GetName] and [GetStateRegion('STATE_BECHUANALAND').GetName] without South West African intervention."

 # ### REVIEWED ###
 sb_bechuanaland_corridor.030.t:0 "The Caprivi Memorandum"
 sb_bechuanaland_corridor.030.d:0 "[SCOPE.sCountry('sb_swa_overlord_scope').GetName] has presented a demand for a narrow strip of country running from [SCOPE.sCountry('sb_swa_scope').GetName] toward the Zambezi. Concession would give the Atlantic colony its own road into the interior. Rejection would preserve Britain's position, but may turn the corridor question into a contest between great powers."
 sb_bechuanaland_corridor.030.f:0 "The proposed frontier was little more than two lines of ink drawn across country few men in the room had seen. Yet at its eastern end ran the Zambezi, and at its western end stood a foreign flag."
 sb_bechuanaland_corridor.030.a:0 "The strip is not worth a war."
 sb_bechuanaland_corridor.030.b:0 "No foreign road will cross Bechuanaland."
 sb_bechuanaland_corridor_030_accept_tt:0 "The Caprivi provinces will pass to [SCOPE.sCountry('sb_swa_scope').GetName], making its overlord less likely to intervene in a later corridor war."
 sb_bechuanaland_corridor_030_reject_tt:0 "[SCOPE.sCountry('sb_swa_overlord_scope').GetName] may confront Britain directly, act through [SCOPE.sCountry('sb_swa_scope').GetName], or abandon the demand."

 # ### REVIEWED ###
 sb_bechuanaland_corridor.031.t:0 "No Road to the Zambezi"
 sb_bechuanaland_corridor.031.d:0 "[SCOPE.sCountry('sb_gbr_scope').GetName] has rejected the Caprivi memorandum. The demand may still be enforced by a direct challenge to British rule at the Cape, pursued through [SCOPE.sCountry('sb_swa_scope').GetName], or set aside before a strip of desert becomes the cause of a wider war."
 sb_bechuanaland_corridor.031.f:0 "The reply from London was brief enough to read standing. When the last page had passed around the table, no one spoke. The maps had already been unfolded."
 sb_bechuanaland_corridor.031.a:0 "Then Britain shall answer to us directly."
 sb_bechuanaland_corridor.031.b:0 "Let South West Africa force the passage."
 sb_bechuanaland_corridor.031.c:0 "A desert strip is not worth the risk."
 sb_bechuanaland_corridor_031_gp_tt:0 "The Caprivi dispute will become the occasion for a locked imperial struggle over the interior corridor. [ROOT.GetCountry.GetName] will demand [SCOPE.sCountry('sb_cap_scope').GetName] and every valid British subject based in Southern Africa; [SCOPE.sCountry('sb_gbr_scope').GetName] will demand [SCOPE.sCountry('sb_swa_scope').GetName]. The Boer leader will first choose whether its network joins the South West African side."
 sb_bechuanaland_corridor_031_proxy_tt:0 "The Caprivi dispute will become the occasion for a locked proxy struggle over the interior corridor. [SCOPE.sCountry('sb_swa_scope').GetName] and [SCOPE.sCountry('sb_cap_scope').GetName] will exchange humiliation demands. [SCOPE.sCountry('sb_gbr_scope').GetName] will defend the Cape, while [ROOT.GetCountry.GetName] remains outside the play. The Boer leader will first choose whether its network joins South West Africa."
 sb_bechuanaland_corridor_031_backdown_tt:0 "The Caprivi demand is abandoned without a diplomatic play."

 # ### TO REVIEW ###
 sb_bechuanaland_corridor.032.t:0 "The Road Through Bechuanaland"
 sb_bechuanaland_corridor.032.d:0 "The Caprivi dispute has widened into a contest over the whole road north. The South West African government now asks [ROOT.GetCountry.GetName] to stand beside it. Support would place every republic and dependency in our political network within the coming struggle; neutrality would leave the imperial powers to settle the corridor without us."
 sb_bechuanaland_corridor.032.f:0 "The memorandum spoke first of a strip of desert, then of the Zambezi, and at last of every road and republic between the Cape and the interior. By its final page, the frontier itself had become the question."
 sb_bechuanaland_corridor.032.a:0 "The interior must not be closed to us."
 sb_bechuanaland_corridor.032.b:0 "This is not our war."
 sb_bechuanaland_corridor_032_support_tt:0 "[ROOT.GetCountry.GetName], Stellaland-Goshen, and every live Boer-primary subject in our network will join the South West African side. Britain may demand the transfer or protection of every participating Boer actor except Stellaland-Goshen. If Cape and Stellaland-Goshen both hold Bechuanaland, each receives a reciprocal Return State demand."
 sb_bechuanaland_corridor_032_neutral_tt:0 "The entire Boer network remains outside the coming war, and Britain receives no protectorate or transfer demands against it. The war will still settle the Bechuanaland Corridor."

 # ### TO REVIEW ###
 sb_bechuanaland_corridor.040.t:0 "The Road North Secured"
 sb_bechuanaland_corridor.040.d:0 "From [GetStateRegion('STATE_GRIQUALAND_WEST').GetName] to [GetStateRegion('STATE_BECHUANALAND').GetName], the road into the interior now lies under British authority. Boer settlement and South West African expansion have been checked. What remains is to settle whether the frontier will answer directly to London or pass beneath the institutions of the Cape."
 sb_bechuanaland_corridor.040.f:0 "The surveyor drew one final line across the map. Behind it lay the Cape; beyond it, the interior. For the moment, the road between them was secure."
 sb_bechuanaland_corridor.040.a:0 "Settle the corridor."

 # ### TO REVIEW ###
 sb_bechuanaland_corridor.041.t:0 "The Interior Settlement"
 sb_bechuanaland_corridor.041.d:0 "British authority has receded from the road north. The question is no longer whether the interior settlement will prevail, but whose institutions will shape it: those of [SCOPE.sCountry('sb_bechuanaland_boer_claimant_scope').GetName], those of [SCOPE.sCountry('sb_bechuanaland_swa_settlement_claimant_scope').GetName], or an accommodation between them."
 sb_bechuanaland_corridor.041.f:0 "The frontier had been won together. Its map would now reveal which partner had supplied the settlers, the roads, and the credit needed to hold it."
 sb_bechuanaland_corridor.041.a:0 "Settle the interior corridor."
 sb_bechuanaland_corridor_041_boer_settlement_tt:0 "[SCOPE.sCountry('sb_bechuanaland_boer_claimant_scope').GetName] gains a [concept_claim] on [GetStateRegion('STATE_BOTSWANA').GetName] and receives the remaining Tswana-held land in [GetStateRegion('STATE_BECHUANALAND').GetName]."
 sb_bechuanaland_corridor_041_balanced_settlement_tt:0 "[SCOPE.sCountry('sb_bechuanaland_boer_claimant_scope').GetName] and [SCOPE.sCountry('sb_bechuanaland_swa_settlement_claimant_scope').GetName] each gain a [concept_claim] on [GetStateRegion('STATE_BOTSWANA').GetName]. The remaining Tswana-held land in [GetStateRegion('STATE_BECHUANALAND').GetName] passes to [SCOPE.sCountry('sb_bechuanaland_boer_claimant_scope').GetName]."
 sb_bechuanaland_corridor_041_swa_settlement_tt:0 "[SCOPE.sCountry('sb_bechuanaland_swa_settlement_claimant_scope').GetName] alone gains [Concept('concept_claim', '$concept_claims$')] on [GetStateRegion('STATE_BOTSWANA').GetName], [GetStateRegion('STATE_ZAMBIA').GetName], [GetStateRegion('STATE_ZAMBEZI').GetName], and [GetStateRegion('STATE_KAZEMBE').GetName]. If its overlord commands a [concept_power_bloc], that bloc gains #v 200#! [concept_power_bloc_leverage] against every member of the Boer network."

 sb_bechuanaland_crisis_support:0 "Corridor Crisis Support"
 sb_bechuanaland_crisis_support_desc:0 "Foreign rifles, officers, and stores are sustaining this side of the struggle for the Bechuanaland corridor."
