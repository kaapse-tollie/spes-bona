l_english:
 je_sb_bechuanaland_corridor:0 "The Bechuanaland Corridor"
 je_sb_bechuanaland_corridor_reason:0 "Between the settled Cape frontier and the Kalahari lies the narrow road through [GetStateRegion('STATE_BECHUANALAND').GetName]. The country is spare, but its position is not: whoever commands the corridor commands Britain's overland route into the African interior, and the ground upon which Boer settlement might meet South West African expansion.\n\nBritain seeks to keep the road north open. The Boer republics and South West Africa seek a frontier of their own. Settlement, diplomacy, or war must decide which design prevails."

 je_sb_bechuanaland_corridor_status:0 "British agents press north from the Cape, while Boer settlers and South West African interests compete to close the road before them."
 je_sb_bechuanaland_corridor_status_swa_advantage:0 "South West African interests command the interior settlement."
 je_sb_bechuanaland_corridor_status_balanced:0 "Boer and South West African influence remain in balance."
 je_sb_bechuanaland_corridor_status_boer_advantage:0 "The Boer republics command the interior settlement."
 je_sb_bechuanaland_corridor_british_victory_header:0 "#title The #b British settlement#! will prevail if:#!\n"
 je_sb_bechuanaland_corridor_boer_swa_victory_header:0 "#title The #b Boer-South West African settlement#! will prevail if:#!\n"
 je_sb_bechuanaland_corridor_british_victory_tt:0 "The #b British Corridor#! is secured: Cape authorities, or their other subjects, control all of [GetStateRegion('STATE_GRIQUALAND_WEST').GetName], while Cape or British authorities control all of [GetStateRegion('STATE_BECHUANALAND').GetName] or have won a corridor settlement."
 je_sb_bechuanaland_corridor_boer_swa_victory_tt:0 "The #b Interior Corridor#! is secured: [SCOPE.sCountry('sb_sgo_scope').GetName] controls all of [GetStateRegion('STATE_BECHUANALAND').GetName], or the Boer-South West African side has won a corridor settlement."
 je_sb_bechuanaland_corridor_british_victory_effects_header:0 "#title If concluded in a #b British victory#!:#!\n$EFFECT$"
 je_sb_bechuanaland_corridor_boer_swa_victory_effects_header:0 "#title If concluded in a #b Boer-South West African victory#!:#!\n$EFFECT$"

 sb_bechuanaland_boer_swa_influence_bar:0 "The Corridor Question"
