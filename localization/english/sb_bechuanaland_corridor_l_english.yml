l_english:

# ### TO REVIEW ###
 je_sb_bechuanaland_corridor:0 "The Bechuanaland Corridor"
 je_sb_bechuanaland_corridor_reason:0 "Between the settled Cape frontier and the Kalahari lies the narrow road through [GetStateRegion('STATE_BECHUANALAND').GetName]. The country is spare, but its position is not: whoever controls the corridor commands the route from the Cape into the African interior, and the ground upon which Boer settlement might meet South West African expansion.\n\n[JournalEntry.MakeScope.Var('sb_bechuanaland_gbr_scope').GetCountry.GetName] seeks to assert its dominance on the route to the Zambezi, while [JournalEntry.MakeScope.Var('sb_bechuanaland_swa_overlord_scope').GetCountry.GetName] seeks to challenge this. Meanwhile, [JournalEntry.MakeScope.Var('sb_bechuanaland_boer_actor_scope').GetCountry.GetName] wishes to link up with [JournalEntry.MakeScope.Var('sb_bechuanaland_swa_scope').GetCountry.GetName] and break the threat of British dominiation once and for all. Settlement, diplomacy, or war will determine whose design prevails..."

 je_sb_bechuanaland_corridor_status:0 "British agents press north from the Cape, while Boer and South West African interests compete over influence over the road to the Zambezi."
 je_sb_bechuanaland_corridor_status_swa_advantage:0 "South West African interests command the interior settlement."
 je_sb_bechuanaland_corridor_status_undecided:0 "Neither side has secured an advantage in the interior settlement."
 je_sb_bechuanaland_corridor_status_boer_advantage:0 "The Boer republics command the interior settlement."
 je_sb_bechuanaland_corridor_british_victory_header:0 "#title The #b British settlement#! will prevail if:#!\n"
 je_sb_bechuanaland_corridor_boer_swa_victory_header:0 "#title The #b Boer-South West African settlement#! will prevail if:#!\n"
 je_sb_bechuanaland_corridor_british_victory_tt:0 "The #b British Corridor#! is secured: Cape authorities, or their other subjects, control all of [GetStateRegion('STATE_GRIQUALAND_WEST').GetName], while Cape or British authorities control all of [GetStateRegion('STATE_BECHUANALAND').GetName] or have won a corridor settlement."
 je_sb_bechuanaland_corridor_boer_swa_victory_tt:0 "The #b Interior Corridor#! is secured: [SCOPE.sCountry('sb_sgo_scope').GetName] controls all of [GetStateRegion('STATE_BECHUANALAND').GetName], or the Boer-South West African side has won a corridor settlement."
 je_sb_bechuanaland_corridor_british_victory_effects_header:0 "#title If concluded in a #b British victory#!:#!\n$EFFECT$"
 je_sb_bechuanaland_corridor_boer_swa_victory_effects_header:0 "#title If concluded in a #b Boer-South West African victory#!:#!\n$EFFECT$"
 event_effects_sb_bechuanaland_corridor.040_tt:0 "• Direct British Boer subjects covered by the settlement become [concept_protectorate]\n• Depending on Cape policy, Tswana becomes a British or Cape protectorate; otherwise the Cape gains a claim on [GetStateRegion('STATE_BECHUANALAND').GetName] and #p 7,500#! progress toward Malaria Prevention\n• Unless superseded by the Pink Map, Britain gains claims on [GetStateRegion('STATE_ZAMBIA').GetName], [GetStateRegion('STATE_ZAMBEZI').GetName], and [GetStateRegion('STATE_KAZEMBE').GetName]\n• Cape-held territory in [GetStateRegion('STATE_BECHUANALAND').GetName] becomes incorporated"
 event_effects_sb_bechuanaland_corridor.041_boer_tt:0 "The Boer claimant gains a [concept_claim] on [GetStateRegion('STATE_BOTSWANA').GetName] and receives the remaining Tswana-held corridor in [GetStateRegion('STATE_BECHUANALAND').GetName]. The northern claimant may also gain a claim on [GetStateRegion('STATE_ZAMBEZI').GetName]."
 event_effects_sb_bechuanaland_corridor.041_swa_tt:0 "The South West African claimant gains claims on [GetStateRegion('STATE_BOTSWANA').GetName], and—unless superseded by the Pink Map—[GetStateRegion('STATE_ZAMBIA').GetName], [GetStateRegion('STATE_ZAMBEZI').GetName], and [GetStateRegion('STATE_KAZEMBE').GetName]. Its power bloc gains #p 200#! [concept_power_bloc_leverage] against every Boer nation."
 event_effects_sb_bechuanaland_corridor.041_tied_tt:0 "The Boer and South West African claimants both gain a [concept_claim] on [GetStateRegion('STATE_BOTSWANA').GetName]. The Boer claimant receives the remaining Tswana-held corridor in [GetStateRegion('STATE_BECHUANALAND').GetName]."

 sb_bechuanaland_boer_swa_influence_bar:0 "The Corridor Question"
 sb_bechuanaland_boer_swa_influence_bar_swa:0 "[JournalEntry.MakeScope.Var('sb_bechuanaland_swa_overlord_scope').GetCountry.GetName]"
 sb_bechuanaland_boer_swa_influence_bar_boer:0 "[JournalEntry.MakeScope.Var('sb_bechuanaland_boer_actor_scope').GetCountry.GetNameNoFormatting] [JournalEntry.MakeScope.Var('sb_bechuanaland_boer_actor_scope').GetCountry.GetFlagTextIcon]"

 sb_bechuanaland_influence_boer_settlers:0 "Boer settlers in Bechuanaland"
 sb_bechuanaland_influence_boer_in_swa_bloc:0 "[JournalEntry.MakeScope.Var('sb_bechuanaland_boer_actor_scope').GetCountry.GetName] belongs to the power bloc of [JournalEntry.MakeScope.Var('sb_bechuanaland_swa_overlord_scope').GetCountry.GetName]"
 sb_bechuanaland_influence_swa_investment_rights:0 "[JournalEntry.MakeScope.Var('sb_bechuanaland_swa_overlord_scope').GetCountry.GetName] holds investment rights in [JournalEntry.MakeScope.Var('sb_bechuanaland_boer_actor_scope').GetCountry.GetName]"
 sb_bechuanaland_influence_swa_mutual_trade:0 "Mutual trade privileges bind [JournalEntry.MakeScope.Var('sb_bechuanaland_swa_overlord_scope').GetCountry.GetName] and [JournalEntry.MakeScope.Var('sb_bechuanaland_boer_actor_scope').GetCountry.GetName]"
 sb_bechuanaland_influence_swa_military_aid:0 "[JournalEntry.MakeScope.Var('sb_bechuanaland_swa_overlord_scope').GetCountry.GetName] grants military assistance to [JournalEntry.MakeScope.Var('sb_bechuanaland_boer_actor_scope').GetCountry.GetName]"
 sb_bechuanaland_influence_boer_subsidy:0 "Financing for Boer settlers"
 sb_bechuanaland_influence_swa_subsidy:0 "Interior trade missions"
 sb_bechuanaland_influence_swa_crisis_support:0 "South West African crisis support"
 sb_bechuanaland_influence_swa_boer_relations_friendly:0 "Friendly relations between [JournalEntry.MakeScope.Var('sb_bechuanaland_swa_overlord_scope').GetCountry.GetName] and [JournalEntry.MakeScope.Var('sb_bechuanaland_boer_actor_scope').GetCountry.GetName]"
 sb_bechuanaland_influence_swa_boer_relations_amicable:0 "Amicable relations between [JournalEntry.MakeScope.Var('sb_bechuanaland_swa_overlord_scope').GetCountry.GetName] and [JournalEntry.MakeScope.Var('sb_bechuanaland_boer_actor_scope').GetCountry.GetName]"
 sb_bechuanaland_influence_swa_boer_relations_cordial:0 "Cordial relations between [JournalEntry.MakeScope.Var('sb_bechuanaland_swa_overlord_scope').GetCountry.GetName] and [JournalEntry.MakeScope.Var('sb_bechuanaland_boer_actor_scope').GetCountry.GetName]"
 sb_bechuanaland_influence_swa_boer_relations_poor:0 "Poor relations between [JournalEntry.MakeScope.Var('sb_bechuanaland_swa_overlord_scope').GetCountry.GetName] and [JournalEntry.MakeScope.Var('sb_bechuanaland_boer_actor_scope').GetCountry.GetName]"
 sb_bechuanaland_influence_swa_boer_relations_cold:0 "Cold relations between [JournalEntry.MakeScope.Var('sb_bechuanaland_swa_overlord_scope').GetCountry.GetName] and [JournalEntry.MakeScope.Var('sb_bechuanaland_boer_actor_scope').GetCountry.GetName]"
 sb_bechuanaland_influence_swa_boer_relations_hostile:0 "Hostile relations between [JournalEntry.MakeScope.Var('sb_bechuanaland_swa_overlord_scope').GetCountry.GetName] and [JournalEntry.MakeScope.Var('sb_bechuanaland_boer_actor_scope').GetCountry.GetName]"

 sb_bechuanaland_influence_boer_gain_5_tt:0 "Boer influence in the corridor increases by #v 5#!."
 sb_bechuanaland_influence_swa_gain_5_tt:0 "South West African influence in the corridor increases by #v 5#!."
 sb_bechuanaland_influence_swa_gain_40_tt:0 "South West African influence in the corridor increases by #v 40#!, to a minimum score of #v -40#!."
 sb_bechuanaland_influence_swa_maximum_tt:0 "South West African influence in the corridor rises to its maximum, setting the score to #v -40#!."

# ### TO REVIEW ###
 je_sb_bechuanaland_sponsor_boer_settlers_button:0 "Sponsor Boer Settlers"
 je_sb_bechuanaland_sponsor_boer_settlers_button_desc:0 "Establish a puppet Boer republic in [GetStateRegion('STATE_BECHUANALAND').GetName]."
 je_sb_bechuanaland_sponsor_boer_settlers_possible_tt:0 "[GetStateRegion('STATE_BECHUANALAND').GetName] is colonisable by us."

 je_sb_bechuanaland_support_settler_government_button:0 "Finance Boer Settlers"
 je_sb_bechuanaland_support_settler_government_button_desc:0 "Finance new farms, wagons, and waterworks along the Boer frontier in [GetStateRegion('STATE_BECHUANALAND').GetName]."
 je_sb_bechuanaland_support_settler_government_possible_tt:0 "We are not in default and have not financed the settlers within the past year."

 je_sb_bechuanaland_finance_interior_trade_missions_button:0 "Finance Interior Trade Missions"
 je_sb_bechuanaland_finance_interior_trade_missions_button_desc:0 "Fund merchants, concession agents, and transport riders travelling between South West Africa and the Boer frontier."
 je_sb_bechuanaland_finance_interior_trade_missions_possible_tt:0 "We are not in default and have not financed an interior trade mission within the past year."

 je_sb_bechuanaland_strengthen_colonial_garrison_button:0 "Strengthen the Colonial Garrison"
 je_sb_bechuanaland_strengthen_colonial_garrison_button_desc:0 "Dispatch trained men and officers to reinforce [SCOPE.sCountry('sb_swa_scope').GetName]'s colonial forces."
 je_sb_bechuanaland_strengthen_colonial_garrison_possible_tt:0 "We have at least #v 4,500 servicemen#! and #v 500 officers#! available, are not in default, and have not reinforced the garrison within the past year."
 sb_bechuanaland_strengthen_colonial_garrison_creation_tt:0 "Creates #b one battalion#! of the latest available infantry in South West Africa."
 sb_bechuanaland_strengthen_colonial_garrison_influence_tt:0 "Adds #p 5#! influence over the corridor settlement."
 sb_swa_colonial_garrison:0 "South West African Colonial Garrison"

# ### TO REVIEW ###
 je_sb_bechuanaland_send_warren_expedition_button:0 "Send the Warren Expedition"
 je_sb_bechuanaland_send_warren_expedition_button_desc:0 "Send a Cape column north to extinguish [SCOPE.sCountry('sb_sgo_scope').GetName] and place the road through [GetStateRegion('STATE_BECHUANALAND').GetName] under colonial administration."
 je_sb_bechuanaland_send_warren_expedition_possible_tt:0 "The Cape is a British subject with a foothold in [GetStateRegion('STATE_BECHUANALAND').GetName], [SCOPE.sCountry('sb_sgo_scope').GetName] exists, no [concept_decentralized_nation] retains territory there, and no Warren ultimatum is pending."

 je_sb_bechuanaland_gbr_direct_warren_button:0 "Force the Corridor Question"
 je_sb_bechuanaland_gbr_direct_warren_button_desc:0 "The defeat at Kimberley has left the Cape unable to secure the interior. Restore its claim and deliver a British ultimatum to the Boer government holding the corridor settlements."
 je_sb_bechuanaland_gbr_direct_warren_possible_tt:0 "The Boers prevailed at Kimberley; an Oranje or Transvaal government directly or indirectly controls both [GetStateRegion('STATE_GRIQUALAND_WEST').GetName] and [GetStateRegion('STATE_BECHUANALAND').GetName], where no [concept_decentralized_nation] retains territory."

 dp_sb_bechuanaland_cap_sgo_return:0 "Sir Warren's demand"
 dp_sb_bechuanaland_cap_sgo_return_desc:0 "The Cape and [SCOPE.sCountry('sb_sgo_scope').GetName] each demand the return of the other's Bechuanaland partition."
 dp_sb_bechuanaland_cap_sgo_return_tooltip:0 "A [concept_diplomatic_play] with reciprocal Return State demands over Bechuanaland."

 dp_sb_bechuanaland_direct_intervention_locked:0 "The Southern African Corridor Crisis"
 dp_sb_bechuanaland_direct_intervention_locked_desc:0 "A direct imperial confrontation will decide control of the Cape, South West Africa, and the British road into the Southern African interior."
 dp_sb_bechuanaland_direct_intervention_locked_tooltip:0 "A closed [concept_diplomatic_play] over the Southern African subject system. Neither side may add further war goals."
 dp_sb_bechuanaland_warren_intervention_locked:0 "The Warren Expedition"
 dp_sb_bechuanaland_warren_intervention_locked_desc:0 "Britain seeks to impose the Cape corridor settlement upon the Boer government standing behind the frontier settlements in Bechuanaland."
 dp_sb_bechuanaland_warren_intervention_locked_tooltip:0 "A closed [concept_diplomatic_play] over the Bechuanaland corridor. Neither side may add further war goals."
 dp_sb_bechuanaland_proxy_intervention_locked:0 "The Bechuanaland Proxy Crisis"
 dp_sb_bechuanaland_proxy_intervention_locked_desc:0 "South West Africa and the Cape contest the interior corridor while their imperial patrons limit the confrontation."
 dp_sb_bechuanaland_proxy_intervention_locked_tooltip:0 "A closed humiliation play between South West Africa and the Cape. Neither side may add further war goals."

 # 1.14 Namaqualand proxy route
 # TO REVIEW (non-event/JE keys)
 dp_sb_bechuanaland_proxy_namaqualand_locked:0 "The Namaqualand Proxy Crisis"
 dp_sb_bechuanaland_proxy_namaqualand_locked_desc:0 "South West Africa demands Walvis Bay while Britain supports the Cape in a restricted proxy confrontation."
 dp_sb_bechuanaland_proxy_namaqualand_locked_tooltip:0 "Open a locked Return State play over the Namaqualand coast."

# ### TO REVIEW ###
 je_sb_bechuanaland_demand_caprivi_button:0 "Demand passage to the Zambezi"
 je_sb_bechuanaland_demand_caprivi_button_desc:0 "Demand Britain give South West Africa access to the Zambezi, joining the Atlantic colony to the river systems of the interior."
 je_sb_bechuanaland_demand_caprivi_possible_tt:0 "$SWA$ fully controls [GetStateRegion('STATE_HEREROLAND').GetName]."

 je_sb_bechuanaland_send_crisis_support_button:0 "Send Crisis Support"
 je_sb_bechuanaland_send_crisis_support_button_desc:0 "Dispatch rifles, officers, and stores to South West Africa and the participating Boer governments for the duration of their war with Britain or the Cape."
 je_sb_bechuanaland_send_crisis_support_possible_tt:0 "South West Africa or the Boers are at war with Britain or the Cape, we are not in default, and no crisis-support programme is active."

 # ### REVIEWED ###
 sb_bechuanaland_corridor.001.t:0 "The Neck of the Bottle"
 sb_bechuanaland_corridor.001.d:0 "The establishment of [SCOPE.sCountry('sb_swa_scope').GetName] has given [SCOPE.sCountry('sb_swa_overlord_scope').GetName] a foothold upon the Atlantic coast. To the east, [SCOPE.sCountry('sb_boer_actor_scope').GetName] presses toward the same thin country. Between them lies Bechuanaland, the only unobstructed British road from the Cape into the interior. What was once a remote frontier has become a question of empire."
 sb_bechuanaland_corridor.001.f:0 "#italic \"Bechuanaland is the neck of the bottle...\"#!\n\n- Cecil John Rhodes"
 sb_bechuanaland_corridor.001.a:0 "The road north must remain open."

 # ### REVIEWED ###
 sb_bechuanaland_corridor.010.t:0 "Warren's Ultimatum"
 sb_bechuanaland_corridor.010.d:0 "Major-General Sir Charles Warren is marching north at the head of an imperial expedition. His terms have reached [ROOT.GetCountry.GetCapital.GetCityHubName]: [ROOT.GetCountry.GetName] must abandon [SCOPE.sCountry('sb_sgo_scope').GetName], leaving the road north to the African interior open to imperial domination, and permit [SCOPE.sCountry('sb_cap_scope').GetName] to occupy the disputed settlements. If the Volksraad refuses, the question will be settled by bloodshed, and [SCOPE.sCountry('sb_swa_overlord_scope').GetName] may yet decide to stifle British plans..."
 sb_bechuanaland_corridor.010.f:0 "'The object of this mission and expedition is to remove the filibusters from Bechuanaland.'\n— Sir Charles Warren, #italic Memorandum on Bechuanaland, 1884#!"
 sb_bechuanaland_corridor.010.a:0 "There will be no war over Bechuanaland."
 sb_bechuanaland_corridor.010.b:0 "Let Warren come and take it."
 sb_bechuanaland_corridor_010_refuse_tt:0 "[SCOPE.sCountry('sb_swa_overlord_scope').GetName] will decide whether to intervene before Britain or [SCOPE.sCountry('sb_cap_scope').GetName] begins a [concept_diplomatic_play]."

 # ### REVIEWED ###
 sb_bechuanaland_corridor.020.t:0 "Crisis over Bechuanaland"
 sb_bechuanaland_corridor.020.d:0 "Boer leaders have rejected [SCOPE.sCountry('sb_gbr_scope').GetName]'s demands to surrender the [GetStateRegion('STATE_BECHUANALAND').GetName] corridor. Their defiance not only stakes their sovereignty at risk; for if Britain holds Bechuanaland, she will command the road north from the Cape towards the Zambezi and the lands beyond. The cabinet must decide whether to confront Britain directly, answer indirectly through [SCOPE.sCountry('sb_swa_scope').GetName], or stand aside."
 sb_bechuanaland_corridor.020.f:0 "'Bechuanaland is the neck of the bottle and commands the route to the Zambesi.' — Cecil Rhodes, #italic 1884#!"
 sb_bechuanaland_corridor.020.a:0 "The balance of empire is at stake."
 sb_bechuanaland_corridor.020.b:0 "We will respond through [SCOPE.sCountry('sb_swa_scope').GetNameNoFormatting]."
 sb_bechuanaland_corridor.020.c:0 "Let Warren have his road."

 sb_bechuanaland_corridor_020_direct_tt:0 "[SCOPE.sCountry('sb_gbr_scope').GetName] will open a [concept_diplomatic_play] against [SCOPE.sCountry('sb_warren_defender_scope').GetName]. We and [SCOPE.sCountry('sb_swa_scope').GetName] will support the Boer defence. The reciprocal Cape–[SCOPE.sCountry('sb_sgo_scope').GetName] corridor demands will be #b primary#!; every imperial transfer and Boer-subjugation [concept_war_goal] will be #b secondary#!."

 sb_bechuanaland_corridor_020_proxy_tt:0 "[SCOPE.sCountry('sb_gbr_scope').GetName] will open a [concept_diplomatic_play] against [SCOPE.sCountry('sb_warren_defender_scope').GetName], with [SCOPE.sCountry('sb_swa_scope').GetName] supporting the Boer defence while we remain #b neutral#!. The reciprocal Cape–[SCOPE.sCountry('sb_sgo_scope').GetName] corridor demands will be #b primary#!; every colonial and Boer-subjugation [concept_war_goal] will be #b secondary#!."

 sb_bechuanaland_corridor_020_no_intervention_tt:0 "[SCOPE.sCountry('sb_gbr_scope').GetName]'s [concept_diplomatic_play] to #b subjugate#! every participating Boer nation. We will remain #b completely neutral#!."

 # ### REVIEWED ###
 sb_bechuanaland_corridor.030.t:0 "The Zambezi Memorandum"
 sb_bechuanaland_corridor.030.d:0 "[SCOPE.sCountry('sb_swa_overlord_scope').GetName] has demanded that [SCOPE.sCountry('sb_swa_scope').GetName] be granted access to the Zambezi and through it influence into the African interior. However, the river system is not fully navigable, being interrupted by multiple falls and rapids along its route. A cunning officer has suggested to grant them a strip of land along the middle section which is blocked by the great Victoria Falls to the South-East, limiting their influence while placating their demands. The concession may buy the [SCOPE.sCountry('sb_swa_overlord_scope').GetNameNoFormatting]'s neutrality in the present dispute; while refusal may turn the road to the Zambezi into a contest between empires."
 sb_bechuanaland_corridor.030.f:0 "'Germany shall be granted free access from its protectorate to the Zambezi by means of a strip of land...'\n— #italic Anglo-German Agreement, 1 July 1890#!"
 sb_bechuanaland_corridor.030.a:0 "Give them the useless strip."
 sb_bechuanaland_corridor.030.b:0 "Not one inch of Britain's claims shall be yielded!"

 sb_bechuanaland_corridor_030_accept_tt:0 "The Caprivi provinces will pass to [SCOPE.sCountry('sb_swa_scope').GetName], making [SCOPE.sCountry('sb_swa_overlord_scope').GetName] less likely to intervene in a later struggle over the Bechuanaland corridor with the #b Boers#!."
 sb_bechuanaland_corridor_030_reject_tt:0 "[SCOPE.sCountry('sb_swa_overlord_scope').GetName] will receive Britain's rejection, and #n may intervene via force#!."


 # ### REVIEWED ###
 sb_bechuanaland_corridor.031.t:0 "No Road to the Zambezi"
 sb_bechuanaland_corridor.031.d:0 "[SCOPE.sCountry('sb_gbr_scope').GetName] has rejected our demand for passage from [SCOPE.sCountry('sb_swa_scope').GetName] to the Zambezi. If Sir Warren secures Bechuanaland, Britain will hold the road from the Cape towards the Zambezi and the lakes beyond, while our Atlantic colony remains shut out. The cabinet must decide whether to challenge Britain's Empire in Southern Africa directly, wage a proxy war through [SCOPE.sCountry('sb_swa_scope').GetName], or wait for a more opportune moment."
 sb_bechuanaland_corridor.031.f:0 "The minister laid London's refusal beside the colonial map. The proposed road from [SCOPE.sCountry('sb_swa_scope').GetNameNoFormatting] ended at the Zambezi. A red line from the Cape ran through Bechuanaland towards Matabeleland, the upper Zambezi and Lake Nyasa.\n\n\"They have denied us a road,\" he said. \"They mean to keep the interior for themselves.\""
 sb_bechuanaland_corridor.031.a:0 "The time of the [SCOPE.sCountry('sb_swa_overlord_scope').GetAdjective] Empire has come."
 sb_bechuanaland_corridor.031.b:0 "Wage a proxy war through [SCOPE.sCountry('sb_swa_scope').GetNameNoFormatting] to force the issue."
 sb_bechuanaland_corridor.031.c:0 "The Zambezi is not worth a war with Britain."

 sb_bechuanaland_corridor_031_gp_tt:0 "We will launch a [concept_diplomatic_play] to demand control of [SCOPE.sCountry('sb_cap_scope').GetName] and #b every eligible British subject in Southern Africa#!; [SCOPE.sCountry('sb_gbr_scope').GetName] #n will demand control of [SCOPE.sCountry('sb_swa_scope').GetName]#!. The #b Boers#! #p may decide to join our side#!."

 sb_bechuanaland_corridor_031_proxy_tt:0 "We will force [SCOPE.sCountry('sb_swa_scope').GetName] to launch a [concept_diplomatic_play] against [SCOPE.sCountry('sb_cap_scope').GetName]. [SCOPE.sCountry('sb_gbr_scope').GetName] will #n very likely defend the Cape#!. [SCOPE.sCountry('sb_swa_scope').GetNameNoFormatting] will #b not#! be at risk of losing any territory. The #b Boers#! #p may decide to join our side#!. "

 sb_bechuanaland_corridor_031_backdown_tt:0 "The demand for passage to the Zambezi will be abandoned without a diplomatic play."

 # ### REVIEWED ###
 sb_bechuanaland_corridor.032.t:0 "A Clash of Titans"
 sb_bechuanaland_corridor.032.d:0 "[SCOPE.sCountry('sb_swa_overlord_scope').GetName] has mobilised their troops against Britain over the road to the Zambezi, and calls upon [ROOT.GetCountry.GetName] to join their struggle. If Britain secures Bechuanaland, the route from the Cape to the Zambezi and the lakes beyond will fall beneath the British flag, shutting the Boer republics from linking up with [SCOPE.sCountry('sb_swa_scope').GetName], getting further enveloped by British interest. The cost of intervention is war, staking our independent existence on the line."
 sb_bechuanaland_corridor.032.f:0 "'We must secure it, unless we are prepared to see the whole of the North pass out of our hands.'\n— Cecil Rhodes, #italic Speech to the Cape Parliament, 16 July 1884#!"
 sb_bechuanaland_corridor.032.a:0 "Britain seeks to envelop us, strike back!"
 sb_bechuanaland_corridor.032.b:0 "The cost of war with Britain is too high."

 sb_bechuanaland_corridor_032_support_tt:0 "We join [SCOPE.sCountry('sb_swa_overlord_scope').GetName] in the diplomatic play against [SCOPE.sCountry('sb_gbr_scope').GetName]. #n Britain will seek to make participating independent Boer republics protectorates and transfer existing Boer subjects#!; [SCOPE.sCountry('sb_sgo_scope').GetName] is excluded from those demands."

 sb_bechuanaland_corridor_032_neutral_tt:0 "We will stay neutral during the war."

 # ### REVIEWED ###
 sb_bechuanaland_corridor.033.t:0 "A War by Proxy"
 sb_bechuanaland_corridor.033.d:0 "[SCOPE.sCountry('sb_swa_scope').GetName] is mustering its colonial garrison to seize control over the Zambezi trade route by force. [SCOPE.sCountry('sb_swa_overlord_scope').GetName] is urging [ROOT.GetCountry.GetName] to join the attack, but will remain formally at peace with Britain, who most likely will come to [SCOPE.sCountry('sb_cap_scope').GetName] defence. A Boer and [SCOPE.sCountry('sb_swa_overlord_scope').GetAdjective] victory will end our isolation, allowing us to link up with [SCOPE.sCountry('sb_swa_scope').GetNameNoFormatting] through [GetStateRegion('STATE_BECHUANALAND').GetName]. While the imperial proxies will not stake their sovereignty on the line, if we were to join, and fail, Britain will surely demand our subjugation which they have long seeked... The Volksraad must decide whether this risk is worth it."
 sb_bechuanaland_corridor.033.f:0 "'With the Boers on the sea in the East, and the German Settlement at Angra Pequena in the West...'\n— Edmond Robert Wodehouse, #italic House of Commons, 29 October 1884#!"
 sb_bechuanaland_corridor.033.a:0 "We fight now, or die alone later."
 sb_bechuanaland_corridor.033.b:0 "Without [SCOPE.sCountry('sb_swa_overlord_scope').GetNameNoFormatting] involvement it's futile."
 sb_bechuanaland_corridor_033_support_tt:0 "[ROOT.GetCountry.GetName] will join [SCOPE.sCountry('sb_swa_scope').GetName] against [SCOPE.sCountry('sb_cap_scope').GetName]. While [SCOPE.sCountry('sb_swa_overlord_scope').GetName] #b will remain neutral#!. #n Britain [SCOPE.sCountry('sb_gbr_scope').GetName] will come to the Cape's defence, and demand our subjugation#!."

 # ### TO REVIEW ###
 sb_bechuanaland_corridor.036.t:0 "The Crisis Attempt Lapses"
 sb_bechuanaland_corridor.036.d:0 "The proposed intervention can no longer proceed because one of its indispensable participants has left the arrangement. No influence was committed, and a new demand may be made if the corridor crisis remains live."
 sb_bechuanaland_corridor.036.f:0 "The drafts remain unsigned. With the coalition no longer answering to the names written upon them, the chancelleries quietly close the file."
 sb_bechuanaland_corridor.036.a:0 "Reassess the corridor."

 # ### TO REVIEW ###
 sb_bechuanaland_corridor.034.t:0 "Warren Without an Appeal"
 sb_bechuanaland_corridor.034.d:0 "The government behind [SCOPE.sCountry('sb_swa_scope').GetName] has entered Britain's security network. London will therefore hear no separate appeal on its behalf. The Warren ultimatum stands: yield the road north to Cape authority, or face an expedition to enforce the Cape's claims."
 sb_bechuanaland_corridor.034.f:0 "The second dispatch was shorter than the first. The seals of the former sponsor now appeared beside Britain's own; there would be no conference after the reply."
 sb_bechuanaland_corridor.034.a:0 "There will be no war over this."
 sb_bechuanaland_corridor.034.b:0 "Then Warren may come."

 # ### TO REVIEW ###
 sb_bechuanaland_corridor.035.t:0 "A Place Within the Cape"
 sb_bechuanaland_corridor.035.d:0 "[ROOT.GetCountry.GetName] now stands within the British hierarchy, putting the corridor beyond South West African reach. Cape ministers propose one final step: annexation to [SCOPE.sCountry('sb_cap_scope').GetName], with the institutions of [SCOPE.sCountry('sb_sgo_scope').GetName] absorbed into the colony. Refusal will preserve the present government without changing the British result."
 sb_bechuanaland_corridor.035.f:0 "The proposal was written as an invitation, though every line assumed that the road south and the road north already passed under the same flag."
 sb_bechuanaland_corridor.035.a:0 "Join the Cape."
 sb_bechuanaland_corridor.035.b:0 "Remain a distinct British dependency."

 # ### TO REVIEW ###
 sb_bechuanaland_corridor.040.t:0 "The Road North Secured"
 sb_bechuanaland_corridor.040.d:0 "From [GetStateRegion('STATE_GRIQUALAND_WEST').GetName] to [GetStateRegion('STATE_BECHUANALAND').GetName], the road into the interior now lies under British authority. Boer settlement and South West African expansion have been checked. What remains is to settle whether the frontier will answer directly to London or pass beneath the institutions of the Cape."
 sb_bechuanaland_corridor.040.f:0 "The surveyor drew one final line across the map. Behind it lay the Cape; beyond it, the interior. For the moment, the road between them was secure."
 sb_bechuanaland_corridor.040.a:0 "Settle the corridor."

 # ### TO REVIEW ###
 sb_bechuanaland_corridor.041.t:0 "Triumph over Britain"
 sb_bechuanaland_corridor.041.d:0 "Britain has lost the struggle for Bechuanaland and hence over the greater Zambezi region. Surveyors, settlers and concession agents are already following the victorious columns towards the Zambezi. Representatives of [SCOPE.sCountry('sb_bechuanaland_boer_claimant_scope').GetName] and [SCOPE.sCountry('sb_bechuanaland_swa_settlement_claimant_scope').GetName] now divide the gains, each pointing to the men supplied, the roads opened and the cost borne in the war."
 sb_bechuanaland_corridor.041.f:0 "'I look upon this Bechuanaland territory as the Suez Canal of the trade of this country (the Cape), the key of its road to the interior.'\n— Cecil Rhodes, #italic Speech to the Cape Parliament, 16 August 1883#!"
 sb_bechuanaland_corridor.041.a:0 "The map of Southern African has been redrawn."

 sb_bechuanaland_corridor_041_boer_settlement_tt:0 "[SCOPE.sCountry('sb_bechuanaland_boer_claimant_scope').GetName] gains a [concept_claim] on [GetStateRegion('STATE_BOTSWANA').GetName] and receives all remaining Tswana-held territory in [GetStateRegion('STATE_BECHUANALAND').GetName]."

 sb_bechuanaland_corridor_041_tied_settlement_tt:0 "With the influence score exactly tied, [SCOPE.sCountry('sb_bechuanaland_boer_claimant_scope').GetName] and [SCOPE.sCountry('sb_bechuanaland_swa_settlement_claimant_scope').GetName] each gain a [concept_claim] on [GetStateRegion('STATE_BOTSWANA').GetName]. All remaining Tswana-held territory in [GetStateRegion('STATE_BECHUANALAND').GetName] passes to [SCOPE.sCountry('sb_bechuanaland_boer_claimant_scope').GetName]."

 sb_bechuanaland_corridor_041_swa_settlement_tt:0 "[SCOPE.sCountry('sb_bechuanaland_swa_settlement_claimant_scope').GetName] alone gains [Concept('concept_claim', '$concept_claims$')] on [GetStateRegion('STATE_BOTSWANA').GetName], [GetStateRegion('STATE_ZAMBIA').GetName], [GetStateRegion('STATE_ZAMBEZI').GetName] and [GetStateRegion('STATE_KAZEMBE').GetName]. If its overlord commands a [concept_power_bloc], that bloc gains #v 200#! [concept_power_bloc_leverage] against every Boer nation."

 # ### TO REVIEW ###
 sb_bechuanaland_corridor.042.t:0 "An Unresolved Settlement"
 sb_bechuanaland_corridor.042.d:0 "The fighting has ended without either coalition imposing a coherent settlement. The rival packages of demands cancel one another, and the wider claim to Botswana is abandoned rather than assigned by default."
 sb_bechuanaland_corridor.042.f:0 "The delegates signed beneath an empty map. No new frontier had been agreed; only the limits of what either side could compel."
 sb_bechuanaland_corridor.042.a:0 "Close the corridor question without a victor."

 # ### TO REVIEW ###
 sb_bechuanaland_corridor.043.t:0 "A Cape for Both Peoples"
 sb_bechuanaland_corridor.043.d:0 "The Boer republics have broken Britain's attempt to dictate the interior settlement. Cape ministers can no longer sustain a policy of exclusion against the victors' kinsmen: the Boer people must be acknowledged as one of the colony's founding communities."
 sb_bechuanaland_corridor.043.f:0 "The old watchword of Boer-hatred had exhausted itself on the northern frontier. In its place came an uneasy recognition that the Cape could not be governed against half of its settler population."
 sb_bechuanaland_corridor.043.a:0 "End the Boerehaat and recognise the Boers."

 # ### TO REVIEW ###
 sb_bechuanaland_corridor.044.t:0 "Natalia Restored"
 sb_bechuanaland_corridor.044.d:0 "British power has receded from the interior, and the colonial administration at Natal can no longer endure. Boer institutions return to Pietermaritzburg; the colony is again the Republic of Natalia."
 sb_bechuanaland_corridor.044.f:0 "The Union Jack came down above the government offices. Before evening a Vierkleur flew in its place, and the old republican name passed from memory back into law."
 sb_bechuanaland_corridor.044.a:0 "Restore the Republic of Natalia."

 sb_bechuanaland_crisis_support:0 "Corridor Crisis Support"
 sb_bechuanaland_crisis_support_desc:0 "Foreign rifles, officers, and stores are sustaining this side of the struggle for the Bechuanaland corridor."
 sb_bechuanaland_crisis_support_effect_tt:0 "For as long as South West Africa or the primary Boer network remains at war with Britain or the Cape, this costs #n £1,000 each month#!, grants participating countries #p +5% offense#! and #p +5% defense#!, and adds #p 0.125#! monthly South West African influence."
 sb_bechuanaland_finance_boer_settlers_cost:0 "Financing Boer Settlers"
 sb_bechuanaland_finance_boer_settlers_cost_desc:0 "Public funds sustain farms, transport, and waterworks along the Bechuanaland frontier."
 sb_bechuanaland_financed_boer_settlement:0 "Financed Boer Settlement"
 sb_bechuanaland_financed_boer_settlement_desc:0 "Outside finance is accelerating the advance of settlement across Bechuanaland."
 sb_bechuanaland_interior_trade_mission_cost:0 "Interior Trade Missions"
 sb_bechuanaland_interior_trade_mission_cost_desc:0 "Merchants and concession agents are being financed along the route into the Southern African interior."
 sb_bechuanaland_interior_trade_missions:0 "Interior Trade Missions"
 sb_bechuanaland_interior_trade_missions_desc:0 "Commercial missions have opened new channels of exchange between South West Africa and the Boer frontier."
 sb_bechuanaland_interior_trade_missions_colonial_growth:0 "Interior Trade Missions"
 sb_bechuanaland_interior_trade_missions_colonial_growth_desc:0 "Surveyors and commercial agents are opening routes for colonial expansion through the interior."
 sb_bechuanaland_crisis_support_cost:0 "Bechuanaland Crisis Support"
 sb_bechuanaland_crisis_support_cost_desc:0 "Rifles, officers, and stores are being sent to sustain the anti-British coalition."
