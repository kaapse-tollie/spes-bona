l_english:
# ### TO REVIEW ###
sb_firearms.001.t:0 "Powder and Drill"
sb_firearms.001.d:0 "Years of steady [GetGoods('small_arms').GetName] supplies and regimental drill have freed [ROOT.GetCountry.GetAdjectiveNoFormatting] forces from relying on imported novelties. Commanders across [ROOT.GetCountry.GetName] are ready to set older disadvantages aside and adopt firearms as the foundation of army doctrine."
sb_firearms.001.f:0 "On the muster ground, chests of trade muskets and percussion rifles stood open beside stacked hide shields. Men who had once judged battle by the reach of a spear-cast now paced out yards, checked flints, and waited for a single word before firing in volley through the drifting smoke."
sb_firearms.001.a:0 "Drill the forces in the new tactics."

# ### TO REVIEW ###
je_sb_adopt_firearms:0 "The Adoption of Firearms"
je_sb_adopt_firearms_reason:0 "Armies fighting mainly with spear and shield suffer heavy penalties in battle and military research (#b $sb_iron_age_weapons$#!). Securing a steady supply of [GetGoods('small_arms').GetTextIcon] Small Arms — whether imported or produced at home — gradually eases those penalties as adoption advances. Every week in which our [concept_market] supplies Small Arms without a [concept_shortage] advances adoption; interruptions pause progress without erasing it."
je_sb_adopt_firearms_lobby:0 "Imported muskets, battlefield encounters, and domestic workshops are reshaping warfare across Southern Africa. Kingdoms whose forces still fight mainly with close-range weapons must secure reliable firearms or fall behind armed neighbours."
je_sb_adopt_firearms_status_supplied:0 "Small Arms are available in our [concept_market] without a [concept_shortage]. Adoption advances each week."
je_sb_adopt_firearms_completion_tt:0 "Complete #v 260 weeks#! of firearms adoption. Earlier preparations and firearms gained through events count towards this total."
je_sb_adopt_firearms_status_no_progress:0 "Progress is paused: our [concept_market] needs a supply of Small Arms without a [concept_shortage]. Earlier progress is retained."
je_sb_adopt_firearms_remove_penalties_tt:0 "Remove all remaining #b $sb_iron_age_weapons$#! penalties."

