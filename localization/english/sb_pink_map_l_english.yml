l_english:
 sb_pink_map_qualifying_colonization_tt:0 "[ROOT.GetCountry.GetName] or one of its colonial or chartered-company subjects is colonizing [GetStateRegion('STATE_KAZEMBE').GetName], [GetStateRegion('STATE_ZAMBIA').GetName], or [GetStateRegion('STATE_ZAMBEZI').GetName]."
 sb_pink_map_bechuanaland_resolved_tt:0 "The $je_sb_bechuanaland_corridor$ [concept_international_situation] must first be resolved."
 sb_pink_map_defiance_tt:0 "[SCOPE.sCountry('gbr_scope').GetName] and [ROOT.GetCountry.GetName] will retain competing [Concept('concept_claim', '$concept_claims$')] in the Zambezi basin. Their [concept_relations] will deteriorate by #n 50#!, and [SCOPE.sCountry('gbr_scope').GetName] will become substantially more aggressive toward [ROOT.GetCountry.GetName] while #bold The Pink Map#! remains active."
