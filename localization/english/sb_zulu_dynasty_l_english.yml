# ### TO REVIEW ###
sb_zulu_dynasty.090.t:0 "The Dynasty Wavers"
sb_zulu_dynasty.090.d:0 "Prestige has bled away from the throne. The regiments grumble, senior houses whisper, and the ruler's failures are now weighed against the ambition of his rivals. What force once contained must now be answered in the oldest Zulu fashion: by another claimant of the royal house."
sb_zulu_dynasty.090.f:0 "The royal messenger called the king's name before the assembled regiment, but the answering acclamation was thin and uneven. That evening another prince's name passed quietly among the huts, spoken first as comparison and then as possibility."
sb_zulu_dynasty.090.a:0 "The court turns elsewhere."
# ### TO REVIEW ###
sb_zulu_dynasty.091.t:0 "Natal Proclaimed"
sb_zulu_dynasty.091.d:0 "Britain has answered Dingane's raid with annexation. The seized coast and conquered Zulu littoral are now being reorganized into the Natal Colony, binding the southeastern seaboard more tightly to imperial rule."
sb_zulu_dynasty.091.f:0 "The proclamation was read at the coastal settlement beneath a newly raised British flag. Surveyors and officers then carried copies inland, giving the name Natal to ground whose authority had until recently been decided by kings, chiefs, traders, and war."
sb_zulu_dynasty.091.a:0 "Natal shall be held."
# ### TO REVIEW ###
sb_zulu_dynasty.092.t:0 "Dingane Defiant"
sb_zulu_dynasty.092.d:0 "Against expectation, Dingane has survived the British answer to the seizure of Port Natal. A victory that began against the Boers has been crowned by defiance of a great power, and the court cannot ignore the aura now around the king."
sb_zulu_dynasty.092.f:0 "The returning regiments entered the royal enclosure carrying captured equipment and the names of the fallen. Dingane received them before the senior houses, and every acclamation reminded his rivals that neither Boer wagon nor British column had removed him."
sb_zulu_dynasty.092.a:0 "The king's name grows."
# ### TO REVIEW ###
sb_zulu_dynasty.093.t:0 "The Royal House Secured"
sb_zulu_dynasty.093.d:0 "The throne is no longer merely surviving events. Through victory, caution, and the management of rivals, the royal house has convinced the chiefdom that the line will endure. A clear heir may now be set forward."
sb_zulu_dynasty.093.f:0 "Senior houses arrived at the royal enclosure expecting another argument over immediate danger. Instead, the court spoke of succession, instruction, and which prince should receive the loyalties of men preparing for a reign beyond the present king."
sb_zulu_dynasty.093.a:0 "The house is secured."
# ### TO REVIEW ###
sb_zulu_dynasty.095.t:0 "A Name at the Edge of the Throne"
sb_zulu_dynasty.095.d:0 "Mpande now wears the kingship, but Dingane's fall has not ended the politics of the royal house. Senior men around the court speak Gqugqu's name as the claimant whose presence must balance the new king."
sb_zulu_dynasty.095.f:0 "Mpande's name was acclaimed as king, yet another name followed it through the gatherings of the royal house. Gqugqu had no throne, but his claim gave every dissatisfied faction a person around whom future opposition might gather."
sb_zulu_dynasty.095.a:0 "The court accepts the pretender."
