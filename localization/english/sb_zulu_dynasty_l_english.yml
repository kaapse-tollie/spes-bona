# ### REVIEWED ###
sb_zulu_dynasty.001.t:0 "A Throne Won in Blood"
sb_zulu_dynasty.001.d:0 "Seven years have passed since Dingane assassinated his legendary brother, Shaka, at kwaDukuza and seized the throne. Shaka's regiments still make the Zulu Kingdom the strongest power from the Phongolo to the Thukela, but the king knows how quickly one of his many brothers may become a future rival. Meanwhile, Anglo traders at Port Natal give the fearsome British Empire a foothold in the Zulu's backyard. While beyond the Drakensberg, Boer wagons spread in every direction in search for a Republic of their own. If Dingane is to survive the looming threats, he must keep the royal #v kraal#! obedient. For a divide Zulu kingdom would surely make for easy pickings..."
sb_zulu_dynasty.001.f:0 "The praise-singer's voice carried across uMgungundlovu:\n\n'UMgabadeli, owagabadela inkundla yakwaBulawayo' — the daring one who dared to enter the courtyard of Bulawayo.\n— #italic Izibongo zikaDingane#!"
sb_zulu_dynasty.001.a:0 "The throne belongs to the man who can hold it."
# ### TO REVIEW ###
sb_zulu_dynasty.091.t:0 "Natal Proclaimed"
sb_zulu_dynasty.091.d:0 "With Zulu resistance broken and the whole littoral in British hands, no separate settler government remains to administer the coast. Crown authorities are ready to organise the annexed coastal districts and conquered Zulu lands into a formal Colony of Natal."
sb_zulu_dynasty.091.f:0 "At Port Natal, the proclamation was read beneath the Union Jack before clerks and surveyors carried printed copies inland towards the Tugela. Ground long contested by kings, chiefs, trekker wagons, and coastal traders was now parcelled into colonial districts under a governor’s commission."
sb_zulu_dynasty.091.a:0 "Proclaim the Colony of Natal."
# ### TO REVIEW ###
sb_zulu_dynasty.092.t:0 "Port Natal Held"
sb_zulu_dynasty.092.d:0 "[ROOT.GetCountry.GetRuler.GetFullName] has outlasted Britain’s attempt to overturn the seizure of Port Natal. Having checked first the trekkers and now an imperial intervention, the throne’s standing rises sharply across the court."
sb_zulu_dynasty.092.f:0 "Messengers from the coast arrived at the royal enclosure to confirm that the British expedition had come to nothing and Port Natal remained in [ROOT.GetCountry.GetAdjectiveNoFormatting] hands. Before the assembled senior houses, the regiments saluted [ROOT.GetCountry.GetRuler.GetFullNameNoFormatting]; even the most watchful rivals could see that neither trekker commandos nor imperial threats had shaken the throne."
sb_zulu_dynasty.092.a:0 "The throne’s standing grows."
