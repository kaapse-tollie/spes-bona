l_english:
 # ### TO REVIEW ###
 sb_boer_republics.007.t:0 "A Republic Beyond the Vaal"
 sb_boer_republics.007.d:0 "A Boer republic has taken shape beyond the Vaal. Some in the Colonial Office argue that it is wiser to bind Transvaal to imperial ports and commercial transit than to drive it at once into open hostility."
 sb_boer_republics.007.f:0 "A Colonial Office clerk drew a line from the new republic to the nearest imperial port. Recognition might be uncertain and sovereignty disputed, but wagons still required roads, merchants, and a coast through which their goods could pass."
 sb_boer_republics.007.a:0 "Secure their transit to imperial ports."
 sb_boer_republics.007.b:0 "Withhold all countenance."

 # ### TO REVIEW ###
 sb_boer_republics.110.t:0 "Wagons for the Limpopo"
 sb_boer_republics.110.d:0 "Cape politics have estranged Boer households across the Colony's eastern and northern districts. Rather than live under Cape Town's ordinances, whole families are preparing to trek north to the Limpopo—forcing the ministry either to let them go and govern with reformist backing, or to conciliate the remaining frontier settlers."
 sb_boer_republics.110.f:0 "At an Eastern Cape farm auction, land and iron bedsteads went cheap while powder kegs and salted hides fetched twice their price. Men in wide-brimmed hats checked wagon axles and greased the wheel hubs, each family packing only what an ox-team could haul across the Orange and the Vaal."
 sb_boer_republics.110.a:0 "Let them trek north."
 sb_boer_republics.110.b:0 "Turn back towards the frontier interest."
 sb_boer_republics_110_liberal_shift_tt:0 "Shifts the Cape political balance #v 10#! points toward the #tooltippable;concept_movement_sb_cape_liberal;Cape Liberals#!."
 sb_boer_republics_110_settler_shift_tt:0 "Shifts the Cape political balance #v 10#! points toward the frontier settlers."

 # ### TO REVIEW ###
 sb_boer_republics.120.t:0 "A Republic Beneath the Zoutpansberg"
 sb_boer_republics.120.d:0 "Trekker families have established Zoutpansbergdorp beneath the northern Transvaal mountains. A #italic landdrost#! has taken office, farm claims fill the registers, and the district's commandants no longer look south for orders. From this small settlement, the burghers claim authority to the Limpopo and declare a republic of their own."
 sb_boer_republics.120.f:0 "Beneath the mist-hung slopes of the Soutpansberg, ivory wagons stood unspanned beside freshly pegged homestead plots. At a plank table in the shade of an acacia, a #italic landdrost#! entered farm claims into a bound register while commandants marked the roads towards the Limpopo—answering to neither Winburg nor Potchefstroom."
 sb_boer_republics.120.a:0 "Our future lies beneath the Zoutpansberg."
 sb_boer_republics.120.b:0 "Our place remains in [ROOT.GetCountry.GetNameNoFormatting]."


 # ### TO REVIEW ###
 sb_boer_republics.130.t:0 "The Volksraad and the Commando"
 sb_boer_republics.130.d:0 "The republic has outgrown the trekker camp. A proposed #italic Grondwet#! would establish a State President and fix the powers of the Volksraad, landdrosts, and commandants in law. Yet many burghers insist that the frontier order which carried them through war and migration remains government enough."
 sb_boer_republics.130.f:0 "On the council table, clerks laid fair-copied articles of government beside #italic veldkornet#! muster rolls and worn saddlebags. Landholders tapped the clauses on courts and settled voting; older burghers eyed the presidency, asking whether a frontier republic was safer under an elected head in the council chamber—or a Commandant-General in the saddle."
 sb_boer_republics.130.a:0 "Adopt the #italic Grondwet#!."
 sb_boer_republics.130.b:0 "Stand by the Commandant-General's order."

 # ### TO REVIEW ###
 sb_boer_republics.131.t:0 "A Break in the Volksraad"
 sb_boer_republics.131.d:0 "The new #italic Grondwet#! has not won the allegiance of every burgher. Cornelis Potgieter and his followers reject the order taking shape around the President and Volksraad. They are taking their families and wagons beyond the republic's eastern frontier, where they intend to establish a government of their own at Lydenburg."
 sb_boer_republics.131.f:0 "Riding east from the assembly, Potgieter's followers left the western constitution behind and drew up their own declaration in the eastern highveld:\n\n'This state shall henceforth bear and use the name De Republiek Lydenburg in Zuid-Afrika.'\n— #italic Resolution of the Lydenburg Volksraad, 11 March 1857#!"
 sb_boer_republics.131.a:0 "The #italic Grondwet#! stands."
 sb_boer_republics.131.b:0 "Then we shall go east."
 sb_boer_republics_131_dont_play_as_lyd_tt:0 "The #v Republic of Lydenburg#! will be established as an independent country."
 sb_boer_republics_131_play_as_lyd_tt:0 "Switch to the newly established #v Republic of Lydenburg#!."

 # ### TO REVIEW ###
 sb_boer_republics.132.t:0 "A Spokesman for the Farms"
 sb_boer_republics.132.d:0 "With the #italic Grondwet#! adopted, the Groot Boere have settled on [SCOPE.sCharacter('sb_trn_marthinus').GetFullName] to speak for them. He will carry the farmers' petitions to the Volksraad under his own name."
 sb_boer_republics.132.f:0 "A burgher unfolded a petition along creases worn almost through the paper. Three farms shared the same spring. Their owners wanted a hearing before any one of them fenced it in. [SCOPE.sCharacter('sb_trn_marthinus').GetLastNameNoFormatting] drew up a bench, and the three men sat down together."
 sb_boer_republics.132.a:0 "Let him hear the petition."
 sb_boer_republics.132.tt.office:0 "#v Marthinus Wessel Pretorius#! leads the Groot Boere, Transvaal's Landowner [concept_interest_group]."
 sb_boer_republics.132.tt.youth:0 "Marthinus loses the #v Youth#! trait."
 sb_boer_republics.132.tt.mandate:0 "Marthinus gains #p +15#! personal [concept_popularity] for #v 48 months#!."

 # ### TO REVIEW ###
 sb_boer_republics.133.t:0 "Return from Natal"
 sb_boer_republics.133.d.both:0 "As the Boer exodus from Natal crosses the Drakensberg into Transvaal, Andries Pretorius has returned to the western districts. With the new #italic Grondwet#! now in force, however, the Groot Boere look to the next generation—turning to his son, Marthinus Wessel Pretorius, to speak for the burghers in the Volksraad."
 sb_boer_republics.133.d.son:0 "With Boer families departing Natal for the highveld, Transvaal's landed burghers are closing ranks under the new #italic Grondwet#!. Seeking a strong voice for the western farms in the Volksraad, the Groot Boere have chosen Marthinus Wessel Pretorius to lead them."
 sb_boer_republics.133.d.father:0 "With Boer families abandoning Natal for the inland republics, Andries Pretorius has stepped forward in Transvaal. Turning to a seasoned commandant who knows the frontier and the Crown alike, the Groot Boere have chosen him to lead them."
 sb_boer_republics.133.d.present:0 "As the Boer exodus from Natal pours onto the highveld, Andries Pretorius has taken his place among the western burghers in Potchefstroom, where emigrating families and local landholders alike seek his counsel."
 sb_boer_republics.133.d:0 "Word of the Boer departure from Natal has crossed the Drakensberg into Transvaal. Burghers with kin on the road are pressing the Volksraad and the Groot Boere to make room for the arriving families."
 sb_boer_republics.133.f.households:0 "Ox-wagons filed down the western tracks for days, their canvas patched from the mountain passes and their herds thin from the climb. Outside Potchefstroom, local burghers rode out with slaughter-oxen and grain sacks, pointing kinsmen towards grazing along the Mooi River before nightfall."
 sb_boer_republics.133.f.punitive:0 "After the Zulu victory, there had been no time to bargain for farms or wait for buyers. Families crossed the Drakensberg with whatever cattle they could drive and whatever chests fitted beneath the wagon tent, reaching the highveld determined never again to build where another power's writ ran."
 sb_boer_republics.133.f:0 "Riders down from the Drakensberg passes brought the same news to every drift and church square: the farms of Natal were emptying, wagons were turning north once more, and the centre of the trekker world was shifting back across the Vaal."
 sb_boer_republics.133.tt.father:0 "#v Andries Pretorius#! leads the Groot Boere, Transvaal's Landowner [concept_interest_group]."
 sb_boer_republics.133.a:0 "There is a place for them beyond the Vaal."

 # TO REVIEW (non-event/JE keys)
 sb_youth:0 "Youth"
 sb_youth_desc:0 "The older burghers know this young man's family better than they know him. This trait ends when Marthinus is recognised as spokesman for the Groot Boere or turns 35, whichever comes first."
 sb_marthinus_groot_boere_mandate:0 "Spokesman for the Groot Boere"
