l_english:
 # ### TO REVIEW ###
 sb_boer_republics.007.t:0 "A Republic Beyond the Vaal"
 sb_boer_republics.007.d:0 "Another Boer republic has taken shape beyond the Vaal. Some in the Colonial Office argue that it would be wiser to bind this Transvaal state to imperial ports and transit than to drive it at once into open hostility."
 sb_boer_republics.007.f:0 "A Colonial Office clerk drew a line from the new republic to the nearest imperial port. Recognition might be uncertain and sovereignty disputed, but wagons still required roads, merchants, and a coast through which their goods could pass."
 sb_boer_republics.007.a:0 "Grant transit rights."
 sb_boer_republics.007.b:0 "Ignore them."

 # ### TO REVIEW ###
 sb_boer_republics.110.t:0 "Frontier Discontent"
 sb_boer_republics.110.d:0 "Cape politics have estranged many frontier Boers beyond recall. Men such as Stephanus Schoeman now speak openly of seeking a sterner future beyond the settled highveld, and another northward trek appears close at hand."
 sb_boer_republics.110.f:0 "In the eastern districts, meetings ended with the same complaint and the same glance northward. Families began repairing wagon covers, selling what could not travel, and asking which commandant would lead once grievance became departure."
 sb_boer_republics.110.a:0 "Let them go."
 sb_boer_republics.110.b:0 "Perhaps we have pressed too far."
 sb_boer_republics_110_liberal_shift_tt:0 "Shifts the Cape political balance #v 10#! points toward the #tooltippable;concept_movement_sb_cape_liberal;Cape Liberals#!."
 sb_boer_republics_110_settler_shift_tt:0 "Shifts the Cape political balance #v 10#! points toward the frontier settlers."

 # ### TO REVIEW ###
 sb_boer_republics.120.t:0 "A Republic Beneath the Zoutpansberg"
 sb_boer_republics.120.d:0 "Trekker families have established Zoutpansbergdorp beneath the north transvaal mountains. A #italic landdrost#! has taken office, farm claims fill the registers, and the district's commandants no longer look south for orders. From this small settlement, the burghers claim authority to the Limpopo and declare a republic of their own."
 sb_boer_republics.120.f:0 ""What may be termed the capital of this quarter of the republic."\n— James Macqueen, #italic Journey from Inhambane to Zoutpansberg, 1862#!"
 sb_boer_republics.120.a:0 "Our future lies beneath the Zoutpansberg."
 sb_boer_republics.120.b:0 "Our place remains in [ROOT.GetCountry.GetNameNoFormatting]."


 # ### TO REVIEW ###
 sb_boer_republics.130.t:0 "The Volksraad and the Commando"
 sb_boer_republics.130.d:0 "The republic has outgrown the trekker camp. A proposed grondwet would establish a State President and set the powers of the Volksraad, landdrosts and commandants in law. Yet many burghers insist that the frontier order which carried them through war and migration remains government enough."
 sb_boer_republics.130.f:0 "'After the war there exists no longer any Commandant-General as such.'\n— #italic Constitution of the Orange Free State, 1854#!"
 sb_boer_republics.130.a:0 "Adopt the #italic grondwet#!."
 sb_boer_republics.130.b:0 "The old order has carried us this far."

 # ### TO REVIEW ###
 sb_boer_republics.131.t:0 "A Break in the Volksraad"
 sb_boer_republics.131.d:0 "The new Grondwet has not won the allegiance of every burgher. Cornelis Potgieter and his followers reject the order taking shape around the President and Volksraad. They are taking their families and wagons beyond the republic's eastern frontier, where they intend to establish a government of their own at Lydenburg."
 sb_boer_republics.131.f:0 "'This state shall henceforth bear and use the name De Republiek Lydenburg in Zuid-Afrika.'\n— #italic Resolution of the Lydenburg Volksraad, 11 March 1857#!"
 sb_boer_republics.131.a:0 "The Grondwet stands."
 sb_boer_republics.131.b:0 "Then we shall go east."
 sb_boer_republics_131_dont_play_as_lyd_tt:0 "The #v Republic of Lydenburg#! will be established as an independent country."
 sb_boer_republics_131_play_as_lyd_tt:0 "Switch to the newly established #v Republic of Lydenburg#!."
