l_english:
 dp_sb_martinus_humiliation:0 "Pretorius Standoff"
 dp_sb_martinus_humiliation_desc:0 "A coercive diplomatic play over Martinus Pretorius' claim to the Orange Free State presidency."
 dp_sb_martinus_humiliation_tooltip:0 "Launch a locked diplomatic play with [concept_humiliation] at stake on both sides."

 # ### TO REVIEW ###
 sb_martinus_confederation.001.t:0 "The Cape Alignment"
 sb_martinus_confederation.001.d:0 "The Orange Free State now sits inside Britain's imperial orbit, but London would rather not police the interior alone. Cape ministers argue that a closer constitutional link to Cape Town would stabilize the frontier, secure trade routes, and keep the Free State from drifting into Transvaal politics."
 sb_martinus_confederation.001.f:0 "Cape ministers placed the Free State between two lines on their map: the road south to imperial ports and the road north into Transvaal politics. Their proposal promised that Bloemfontein might keep its council, provided its wider direction followed the first road."
 sb_martinus_confederation.001.a:0 "Accept Cape alignment"
 sb_martinus_confederation.001.b:0 "Keep the republic separate"

 # ### TO REVIEW ###
 sb_martinus_confederation.002.t:0 "Grey's Free State Proposal"
 sb_martinus_confederation.002.d:0 "The Orange Free State has entered Britain's imperial orbit, leaving Cape Town with an opportunity to shape the interior settlement. Sir George Grey proposes a constitutional link that would preserve the republic's local institutions while drawing Bloemfontein into the Cape's diplomacy and protection."
 sb_martinus_confederation.002.a:0 "Put the proposal to Bloemfontein."

 # ### TO REVIEW ###
 sb_martinus_confederation.010.t:0 "Marthinus's Claim"
 sb_martinus_confederation.010.d:0 "President Marthinus Wessel Pretorius maintains that the government of the Orange Free State was intended to pass to his father and the emigrant farmers, and that the claim now falls to him as Andries Pretorius's successor. His supporters see a greater prize: one president in Pretoria and Bloemfontein could prepare the way for a single Boer republic on both sides of the Vaal. The Volksraad must decide whether to support his claim with an expedition."
 sb_martinus_confederation.010.f:0 "'The land had been handed over to his father and therefore to himself as his successor.'\n— Paul Kruger, #italic Memoirs, 1902#!"
 sb_martinus_confederation.010.a:0 "Muster an expedition to press the claim."
 sb_martinus_confederation.010.b:0 "Withdraw the claim."


 # ### REVIEWED ###
 sb_martinus_confederation.020.t:0 "Pretorius Presses His Claim"
 sb_martinus_confederation.020.d:0 "Marthinus Wessel Pretorius has laid claim to the presidency of the Orange Free State, presenting government under one president as the natural fulfilment of the trek. A Transvaal commando is assembling north of the Vaal to lend force to his argument. The Volksraad proposes to appeal to sister Boer republics before giving Transvaal its answer."
 sb_martinus_confederation.020.f:0 "'You stand up for your President and I for mine.'\n— Paul Kruger, #italic recalling the confrontation of 1857#!"
 sb_martinus_confederation.020.a:0 "Seek allies and prepare to resist."
 sb_martinus_confederation.020.b:0 "Recognise Pretorius as President."
 sb_martinus_player_warn_tt:0 "#n This may lead to war with Transvaal!#!"
 sb_martinus_confederation.020.b.tt:0 "[SCOPE.sCountry('sb_martinus_trn_scope').GetName] will receive an event confirming [ROOT.GetCountry.GetNameNoFlag]'s acceptance. Once ratified, [ROOT.GetCountry.GetName] will become the junior [concept_subject] of [SCOPE.sCountry('sb_martinus_trn_scope').GetName] under a [Concept('concept_sb_boer_presidential_union', '$sb_boer_presidential_union$')].\n\nThe [Concept('concept_sb_boer_presidential_union', '$sb_boer_presidential_union$')] will break when the incumbent Transvaal [concept_ruler] ceases to govern or Transvaal abandons presidential government, unless [ROOT.GetCountry.GetNameNoFlag] first becomes a [Concept('concept_sb_boer_confederal_partner', '$sb_boer_confederal_partner$')]."

 # ### TO REVIEW ###
 sb_martinus_confederation.021.t:0 "One President Across the Vaal"
 sb_martinus_confederation.021.d:0 "The Orange Free State Volksraad has accepted Marthinus Pretorius's claim rather than summon the commandos. Its resolution recognises him as president and asks Pretoria to ratify an arrangement binding the two republics beneath one executive."
 sb_martinus_confederation.021.f:0 "The Free State's answer crossed the Vaal beneath its seal. The commandos could stand down; the clerks now had to define how two Volksraads would answer to one president."
 sb_martinus_confederation.021.a:0 "Proclaim the presidential union."
 sb_martinus_confederation.021.a.tt:0 "[SCOPE.sCountry('sb_martinus_ora_scope').GetName] will become the junior [concept_subject] of [ROOT.GetCountry.GetName] under a [Concept('concept_sb_boer_presidential_union', '$sb_boer_presidential_union$')].\n\nThe [Concept('concept_sb_boer_presidential_union', '$sb_boer_presidential_union$')] will break when the incumbent Transvaal [concept_ruler] ceases to govern or Transvaal abandons presidential government, unless [SCOPE.sCountry('sb_martinus_ora_scope').GetNameNoFlag] first becomes a [Concept('concept_sb_boer_confederal_partner', '$sb_boer_confederal_partner$')]."

 # ### REVIEWED ###
 sb_martinus_confederation.030.t:0 "The Free State Calls"
 sb_martinus_confederation.030.d:0 "The Orange Free State has rejected Marthinus Pretorius's claim to its presidency and appealed to Lydenburg for support. If Transvaal can force one Boer republic beneath its president, Lydenburg's own independence may soon face the same test. The Volksraad must decide whether to stand with Bloemfontein or remain outside the quarrel."
 sb_martinus_confederation.030.f:0 "Commandant-General Joubert of Lydenburg offered to join the Free State against Pretorius.\n— #italic After George McCall Theal, History of South Africa#!"
 sb_martinus_confederation.030.a:0 "Stand with the Orange Free State."
 sb_martinus_confederation.030.b:0 "This is not Lydenburg's quarrel."
 # ### REVIEWED ###
 sb_martinus_confederation.031.t:0 "The Free State Calls"
 sb_martinus_confederation.031.d:0 "The Orange Free State has rejected Marthinus Pretorius's claim to its presidency and appealed to Zoutpansberg for support. Pretorius's attempt to rule on both sides of the Vaal threatens to make Transvaal the arbiter of every northern republic. The council must decide whether to stand with Bloemfontein or remain outside the quarrel."
 sb_martinus_confederation.031.f:0 "'The latter should come to the Free State's assistance.'\n— Paul Kruger, #italic recalling Boshoff's agreement with Commandant-General Schoeman#!"
 sb_martinus_confederation.031.a:0 "Stand with the Orange Free State."
 sb_martinus_confederation.031.b:0 "This is not Zoutpansberg's quarrel."
 # ### REVIEWED ###
 sb_martinus_confederation.032.t:0 "The Free State Calls"
 sb_martinus_confederation.032.d:0 "The Orange Free State has rejected Marthinus Pretorius's claim to its presidency and appealed to Natalia for support. The son of Andries Pretorius now seeks to place two inland republics beneath one president. Natalia must decide whether Boer unity justifies his ambition or whether Bloemfontein's independence must be defended."
 sb_martinus_confederation.032.f:0 "Marthinus Pretorius bore the name of the commandant who had once defended the Boer settlements in Natal. Whether that inheritance entitled the son to govern two republics was another question."
 sb_martinus_confederation.032.a:0 "Stand with the Orange Free State."
 sb_martinus_confederation.032.b:0 "Leave the inland republics to their quarrel."


 # ### REVIEWED ###
 # No other Boer republic supports the Orange Free State
 sb_martinus_confederation.041.t:0 "The Free State Stands Alone"
 sb_martinus_confederation.041.d:0 "The Orange Free State has rejected Pretorius's claim, but no other Boer republic has pledged its support. With Bloemfontein isolated, Pretorius may still force the issue without facing a wider coalition. Alternatively, he can withdraw and seek the presidency through election."
 sb_martinus_confederation.041.f:0 "'You stand up for your President and I for mine.'\n— Paul Kruger, #italic Memoirs#!, recalling the confrontation of 1857"
 sb_martinus_confederation.041.a:0 "Force the issue."
 sb_martinus_confederation.041.b:0 "Stand down and contest the presidency."

 # ### REVIEWED ###
 # Lydenburg supports the Orange Free State
 sb_martinus_confederation.042.t:0 "Lydenburg Backs the Free State"
 sb_martinus_confederation.042.d:0 "Lydenburg has pledged its support to the Orange Free State against Pretorius's claim. If Transvaal forces the issue, it will face resistance from both Bloemfontein and the eastern republic. Pretorius must decide whether to risk war or pursue the presidency through election."
 sb_martinus_confederation.042.f:0 "'You stand up for your President and I for mine.'\n— Paul Kruger, #italic Memoirs#!, recalling the confrontation of 1857"

 # ### REVIEWED ###
 # Zoutpansberg supports the Orange Free State
 sb_martinus_confederation.043.t:0 "Zoutpansberg Backs the Free State"
 sb_martinus_confederation.043.d:0 "Zoutpansberg has pledged its support to the Orange Free State against Pretorius's claim. If Transvaal forces the issue, it will face resistance from both Bloemfontein and the northern republic. Pretorius must decide whether to risk war or pursue the presidency through election."
 sb_martinus_confederation.043.f:0 "'You stand up for your President and I for mine.'\n— Paul Kruger, #italic Memoirs#!, recalling the confrontation of 1857"
 sb_martinus_confederation.043.a:0 "Force the issue."
 sb_martinus_043_force_issue_tt:0 "[ROOT.GetCountry.GetName] will begin a [concept_diplomatic_play] against #v $ORA$#!. Victory will establish a [Concept('concept_sb_boer_presidential_union', '$sb_boer_presidential_union$')], with #v $ORA$#! as the junior [concept_subject]."
 sb_martinus_043_zpb_support_tt:0 "#v $ZPB$#! will support #v $ORA$#!."
 sb_martinus_confederation.043.b:0 "Stand down and contest the presidency."
 sb_martinus_043_compromise_tt:0 "#v Marthinus Pretorius#! will preserve his claim. If #v $ORA$#! later holds an [concept_election], he may stand as leader of the #v Groot Boere#!. If he becomes [concept_ruler] of both republics, they will enter a [Concept('concept_sb_boer_presidential_union', '$sb_boer_presidential_union$')]."

 # ### REVIEWED ###
 # Lydenburg and Zoutpansberg support the Orange Free State
 sb_martinus_confederation.044.t:0 "Lydenburg and Zoutpansberg Rally"
 sb_martinus_confederation.044.d:0 "Lydenburg and Zoutpansberg have both pledged their support to the Orange Free State. What began as a claim to the Bloemfontein presidency now threatens to set three Boer republics against Transvaal. Pretorius must decide whether to face their coalition or pursue the presidency through election."
 sb_martinus_confederation.044.f:0 "'You stand up for your President and I for mine.'\n— Paul Kruger, #italic Memoirs#!, recalling the confrontation of 1857"

 # ### REVIEWED ###
 # Natalia supports the Orange Free State
 sb_martinus_confederation.045.t:0 "Natalia Backs the Free State"
 sb_martinus_confederation.045.d:0 "Natalia has pledged its support to the Orange Free State against Pretorius's claim. Support from beyond the Drakensberg has turned an inland dispute into a wider Boer crisis. Pretorius must decide whether the Bloemfontein presidency is worth a war reaching to the coast."
 sb_martinus_confederation.045.f:0 "'You stand up for your President and I for mine.'\n— Paul Kruger, #italic Memoirs#!, recalling the confrontation of 1857"

 # ### REVIEWED ###
 # Lydenburg and Natalia support the Orange Free State
 sb_martinus_confederation.046.t:0 "Lydenburg and Natalia Rally"
 sb_martinus_confederation.046.d:0 "Lydenburg and Natalia have both pledged their support to the Orange Free State. Forcing Pretorius's claim would now bring Transvaal into conflict with Bloemfontein, the eastern republic and the Boer settlements beyond the Drakensberg. The alternative is to pursue the presidency through election."
 sb_martinus_confederation.046.f:0 "'You stand up for your President and I for mine.'\n— Paul Kruger, #italic Memoirs#!, recalling the confrontation of 1857"

 # ### REVIEWED ###
 # Zoutpansberg and Natalia support the Orange Free State
 sb_martinus_confederation.047.t:0 "Zoutpansberg and Natalia Rally"
 sb_martinus_confederation.047.d:0 "Zoutpansberg and Natalia have both pledged their support to the Orange Free State. The northern frontier and the coastal republic now stand behind Bloemfontein, leaving Pretorius to choose between withdrawal and a war stretching across the Boer interior."
 sb_martinus_confederation.047.f:0 "'You stand up for your President and I for mine.'\n— Paul Kruger, #italic Memoirs#!, recalling the confrontation of 1857"

 # ### REVIEWED ###
 # All three republics support the Orange Free State
 sb_martinus_confederation.048.t:0 "The Boer Republics Rally"
 sb_martinus_confederation.048.d:0 "Lydenburg, Zoutpansberg and Natalia have all pledged their support to the Orange Free State. Pretorius's attempt to unite the Boer republics beneath one president has instead united them against Transvaal. He may still force his claim, but doing so would begin a general war across the Boer frontier."
 sb_martinus_confederation.048.f:0 "'You stand up for your President and I for mine.'\n— Paul Kruger, #italic Memoirs#!, recalling the confrontation of 1857"


 # ### TO REVIEW ###
 sb_martinus_confederation.050.t:0 "The Final Demand"
 sb_martinus_confederation.050.d:0 "Pretorius has forced the issue. Accepting the dual presidency would avoid bloodshed while placing the Free State inside his political orbit; refusing means meeting the Transvaal and its supporters in a contest of republican honor."
 sb_martinus_confederation.050.f:0 "The final demand was shorter than the first and carried no constitutional argument the Free State had not already heard. Its meaning lay in the deadline at the bottom and in the commandos waiting to learn whether they would vote with ballots or rifles."
 sb_martinus_confederation.050.a:0 "Accept the dual presidency"
 sb_martinus_confederation.050.b:0 "Fight for the republic"
 sb_martinus_force_issue_dp_tt:0 "Transvaal will open a diplomatic play against the Orange Free State."
 sb_martinus_force_issue_lyd_backer_tt:0 "Lydenburg will back the Orange Free State."
 sb_martinus_force_issue_zpb_backer_tt:0 "Zoutpansberg will back the Orange Free State."
 sb_martinus_force_issue_nal_backer_tt:0 "Natalia will back the Orange Free State."
 sb_martinus_compromise_election_path_tt:0 "Pretorius will preserve his claim. If the Orange Free State later holds elections, he may stand as leader of the Groot Boere; if he becomes president of both republics, a Presidential Union will form."

 # ### REVIEWED ###
 sb_martinus_confederation.080.t:0 "The Free State Nomination"
 sb_martinus_confederation.080.d:0 "The Groot Boere of the Orange Free State have rallied behind Marthinus Wessel Pretorius for the presidency. Where his earlier claim was carried by commandos, it will now be tested at the ballot box. If he prevails, the same man will govern on both sides of the Vaal, bringing union between the republics within reach."
 sb_martinus_confederation.080.f:0 "'He owed his election to the Unionist Party there, since his chief aim was to amalgamate the two Republics.'\n— Paul Kruger, #italic Memoirs#!"
 sb_martinus_confederation.080.a:0 "The Free State has opened the road."
 sb_martinus_080_election_campaign_tt:0 "#v Marthinus Wessel Pretorius#! will contest the #v $ORA$#! [concept_election] as [concept_leader] of the [GetInterestGroupVariant('ig_landowners',GetPlayer).GetName]. If he wins, #v $ORA$#! will become the junior [concept_subject] of [ROOT.GetCountry.GetName] under a [Concept('concept_sb_boer_presidential_union', '$sb_boer_presidential_union$')]."

 # ### REVIEWED ###
 sb_martinus_confederation.081.t:0 "Pretorius and the Groot Boere"
 sb_martinus_confederation.081.d:0 "The Groot Boere have rallied behind Marthinus Wessel Pretorius for the presidency. His supporters argue that placing both republics under one president would strengthen the Boer cause and prepare the way for union across the Vaal. His opponents warn that Bloemfontein would retain its Volksraad while becoming subordinate to Transvaal in all but name. The matter will now be decided at the polls."
 sb_martinus_confederation.081.f:0 "'The partisans of Pretorius in the Free State secured his election as president of that republic.'\n— #italic Encyclopædia Britannica, 1911#!"
 sb_martinus_confederation.081.a:0 "Let the campaign begin."
 sb_martinus_081_campaign_outcome_tt:0 "#v Marthinus Wessel Pretorius#! becomes [concept_leader] of the [GetInterestGroupVariant('ig_landowners',GetPlayer).GetName].\nThe [GetInterestGroupVariant('ig_landowners',GetPlayer).GetName] gain #p +20%#! [concept_political_strength] for #v 3 years#!.\n\nIf #v Marthinus Wessel Pretorius#! wins the [concept_election], [ROOT.GetCountry.GetName] will become the junior [concept_subject] of [ROOT.Var('sb_martinus_trn_tooltip_var').GetCountry.GetName] under a [Concept('concept_sb_boer_presidential_union', '$sb_boer_presidential_union$')]."



 # ### TO REVIEW ###
 sb_martinus_confederation.120.t:0 "Natalia and the Union Project"
 sb_martinus_confederation.120.d:0 "Marthinus Pretorius' union project now reaches beyond the Vaal. Natalia's republican leadership must decide whether the coastal republic should voluntarily enter the presidential union or preserve its separate course."
 sb_martinus_confederation.120.f:0 "Natalia's councillors heard the Pretorius name with respect, but they conducted their argument beside harbour accounts and reports from the British coast. Union with the interior promised Boer strength; it also risked fastening a maritime republic to quarrels decided far beyond its port."
 sb_martinus_confederation.120.a:0 "Join the presidential union"
 sb_martinus_confederation.120.a.tt:0 "[SCOPE.sCountry('sb_martinus_trn_scope').GetName] will receive an event confirming [ROOT.GetCountry.GetNameNoFlag]'s voluntary accession. If accepted, [ROOT.GetCountry.GetName] will become the junior [concept_subject] of [SCOPE.sCountry('sb_martinus_trn_scope').GetName] under a [Concept('concept_sb_boer_presidential_union', '$sb_boer_presidential_union$')].\n\nThe [Concept('concept_sb_boer_presidential_union', '$sb_boer_presidential_union$')] will break when the incumbent Transvaal [concept_ruler] ceases to govern or Transvaal abandons presidential government, unless [ROOT.GetCountry.GetNameNoFlag] first becomes a [Concept('concept_sb_boer_confederal_partner', '$sb_boer_confederal_partner$')]."
 sb_martinus_confederation.120.c:0 "Stand apart"

 # ### TO REVIEW ###
 sb_martinus_confederation.121.t:0 "Natalia Joins the Union"
 sb_martinus_confederation.121.d:0 "Natalia's Volksraad has voluntarily accepted the presidential union and asks Pretoria to acknowledge the coastal republic beneath the common presidency. What began as an arrangement across the Vaal may now bind the Boer interior to Port Natal."
 sb_martinus_confederation.121.f:0 "The resolution arrived beneath Natalia's seal, carrying neither an ultimatum nor a demand for concessions. Its councillors asked only that Pretoria accept the union they had chosen."
 sb_martinus_confederation.121.a:0 "Welcome Natalia into the union."
 sb_martinus_confederation.121.a.tt:0 "[SCOPE.sCountry('sb_martinus_natalia_scope').GetName] will become the junior [concept_subject] of [ROOT.GetCountry.GetName] under a [Concept('concept_sb_boer_presidential_union', '$sb_boer_presidential_union$')].\n\nThe [Concept('concept_sb_boer_presidential_union', '$sb_boer_presidential_union$')] will break when the incumbent Transvaal [concept_ruler] ceases to govern or Transvaal abandons presidential government, unless [SCOPE.sCountry('sb_martinus_natalia_scope').GetNameNoFlag] first becomes a [Concept('concept_sb_boer_confederal_partner', '$sb_boer_confederal_partner$')]."

 # ### TO REVIEW ###
 sb_martinus_confederation.130.t:0 "Sir George Grey's Confederation"
 sb_martinus_confederation.130.d:0 "With the Orange Free State already drawn into Cape Town's orbit, Sir George Grey now proposes that the Transvaal complete the settlement. A Cape-linked confederation would preserve republican institutions on paper while binding the inland republics to British trade, protection, and imperial federation."
 sb_martinus_confederation.130.f:0 "Grey's memorandum crossed the Vaal with diagrams of councils, competencies, and imperial guarantees. It promised Pretoria a place inside a larger settlement without asking its burghers to call themselves Cape colonists; whether the distinction would survive in practice was left to smaller print."
 sb_martinus_confederation.130.a:0 "Accept Grey's settlement"
 sb_martinus_confederation.130.b:0 "Keep Pretoria separate"

 # ### TO REVIEW ###
 sb_martinus_confederation.131.t:0 "Grey Looks Beyond the Vaal"
 sb_martinus_confederation.131.d:0 "With the Orange Free State already bound to Cape Town, Sir George Grey argues that the Transvaal should be offered the same constitutional road. Extending the confederal settlement across the Vaal would place both inland republics within a common Cape-led imperial framework."
 sb_martinus_confederation.131.a:0 "Put the proposal to Pretoria."

 sb_ora_republican_defiance:0 "Republican Defiance"
 sb_ora_republican_defiance_desc:0 "The republic has rejected Cape alignment and rallied its frontier institutions."
 sb_martinus_claim_revoked:0 "Claim Revoked"
 sb_martinus_claim_revoked_desc:0 "The government has stepped back from Pretorius' wider republican claim."
 sb_martinus_mutual_recognition:0 "Mutual Recognition"
 sb_martinus_mutual_recognition_desc:0 "The Boer republics have settled the crisis through mutual recognition."
 sb_martinus_free_state_mandate:0 "Free State Mandate"
 sb_martinus_free_state_mandate_desc:0 "Marthinus Wessel Pretorius is buoyed by Orange Free State support for his wider republican claim."
 sb_ora_pretorius_groot_boere_campaign:0 "Pretorius Campaign"
 sb_ora_pretorius_groot_boere_campaign_desc:0 "The Groot Boere have rallied behind Marthinus Wessel Pretorius during the election campaign."
 sb_ora_separate_republic:0 "Separate Republic"
 sb_ora_separate_republic_desc:0 "The republic has rejected Marthinus Pretorius' legal-union offer."
