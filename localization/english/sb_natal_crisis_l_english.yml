l_english:
 # ### REVIEWED ###
 sb_natal_crisis.025.t:0 "Land for Guns"
 sb_natal_crisis.025.d:0 "Dingane does not simply refuse the Retief deputation. He offers a harsher bargain: the Boers may found their coastal republic only if Oranje supplies the Zulu kingdom with imported firearms for five years. It is dangerous, but it would open Natal without war."
 sb_natal_crisis.025.f:0 "Land might be granted once. Guns, once delivered, would remain in the kingdom's hands long after the bargain was forgotten."
 sb_natal_crisis.025.a:0 "Accept the bargain."
 sb_natal_crisis.025.b:0 "Then we must take Natal."
 # ### TO REVIEW ###
 sb_natal_crisis.026.t:0 "Dingane's Price Refused"
 sb_natal_crisis.026.d:0 "The Boers have refused land for guns. If they will not buy Natal, they may try to take it, and the Qwabe frontier must be brought firmly under royal authority before the wagons return with muskets and commandos."
 sb_natal_crisis.026.f:0 "The Boer envoys departed without the agreement, and the court messengers left by other gates. Before sunset, regimental commanders were being summoned and cattle were driven away from the roads along which the wagons might return."
 sb_natal_crisis.026.a:0 "Prepare for war."
 # ### TO REVIEW ###
 sb_natal_crisis.051.t:0 "Natal by Force"
 sb_natal_crisis.051.d:0 "The bargain has failed. The Zulu now move to absorb the southern frontier, and the Natal question becomes a military one. If a republic is to be won on the coast, it must be won by commando and laager."
 sb_natal_crisis.051.f:0 "The last proposal had returned unanswered, its seals cut and its terms rejected. Commandants now marked river crossings on a rough map of Natal while families drew the wagons closer together and waited to learn whether the coast would be abandoned or fought for."
 sb_natal_crisis.051.a:0 "We must withdraw."
 sb_natal_crisis.051.b:0 "Send for Pretorius."
 # ### REVIEWED ###
 sb_natal_crisis.010.t:0 "Towards Natal"
 sb_natal_crisis.010.d:0 "Piet Retief and his fellow Voortrekkers propose to cross the Drakensberg and establish a Boer settlement in the  fertile country around Port Natal. Its harbour would give the trekkers a road to the sea, but King Dingane regards the land south of the Tugela as his to grant. Retief now asks us to support an embassy to uMgungundlovu and seek his consent."
 sb_natal_crisis.010.f:0 "'I shall set out in a few days for the country of the Zulus, in order to settle with you our future relations.'\n— Piet Retief, #italic Letter to Dingane, 19 October 1837#!"
 sb_natal_crisis.010.a:0 "Back Retief's mission."
 sb_natal_crisis.010.b:0 "We will not risk Dingane's wrath."
 sb_natal_crisis_010_a_warning_tt:0 "#bold #n Backing Retief's mission may lead to war with the Zulu Kingdom.#!#!"

 # ### TO REVIEW ###
 sb_natal_crisis.020.t:0 "Retief Before Dingane"
 sb_natal_crisis.020.d:0 "Retief has recovered the stolen cattle, yet the Boer deputation still stands before Dingane asking leave to settle south of the Tugela. Some councillors see a buffer against Port Natal; others see future masters arriving with wagons and rifles."
 sb_natal_crisis.020.f:0 "Retief's party waited before the royal enclosure while Dingane's councillors argued beyond their hearing. The recovered cattle proved that the Boers could serve the king for a day; the wagons behind them raised the harder question of whom they would obey once settled."
 sb_natal_crisis.020.a:0 "Grant the strip."
 sb_natal_crisis.020.b:0 "Kill Retief."
 sb_natal_crisis.020.c:0 "Take guns for the southern strip."
 # ### TO REVIEW ###
 sb_natal_crisis.021.t:0 "Whispers at Court"
 sb_natal_crisis.021.d:0 "Dingane's concession has bought time on the frontier, but not silence at court. Men who favored harder measures now whisper that the king has traded prestige for peace."
 sb_natal_crisis.021.f:0 "The concession was proclaimed beyond the royal enclosure, yet discussion inside it did not cease. Councillors who had opposed the grant now counted each Boer wagon crossing the Tugela as evidence that peace had purchased a danger rather than removed one."
 sb_natal_crisis.021.a:0 "The throne must endure."
 # ### REVIEWED ###
 sb_natal_crisis.030.t:0 "The Republic of Natalia"
 sb_natal_crisis.030.d:0 "Dingane has accepted Retief's terms and granted the emigrant farmers the country between the Tugela and the Umzimvubu. Wagons are already descending the Drakensberg towards Port Natal, where a Volksraad is preparing to govern the new settlements. For Oranje, a sister republic on the coast promises access to the sea beyond British control."
 sb_natal_crisis.030.f:0 "'I ... resign unto him, Retief, and his countrymen the place called Port Natal, together with all the land annexed.'\n— #italic Deed of Cession attributed to Dingane, 4 February 1838#!"
 sb_natal_crisis.030.a:0 "Let Natalia stand beside us."
 sb_natal_crisis.030.b:0 "Our future lies in Natalia."
 # ### REVIEWED ###
 sb_natal_crisis.050.t:0 "Retief Murdered"
 sb_natal_crisis.050.d:0 "Piet Retief has been murdered by Dingane, and his Impi troops have marched to secure Southern Natal. One of our prominent commanders, Pretorius, is demanding that we send an expedition to assert our claims and exact revenge agaist the Zulu."
 sb_natal_crisis.050.f:0 "In a panting breath the survivor said, "Commandent-General Pretoriius, Dingane killed Oom Retief! He lied to us, he said he would allow us to peacefully settle in the land South of the Tugela if we recaptured a large cattle heard the Swazi had stolen from him. We successfully recovered them from the thiefs. Dingane embraced Retief and thanked him, and then immeditely turned to his Impi and ordered them to kill us alll. I was lucky to survive.""
 sb_natal_crisis.050.a:0 "We must withdraw."
 sb_natal_crisis.050.b:0 "Rally the commandos!"
 # ### TO REVIEW ###
 sb_natal_crisis.070.t:0 "Victory at Blood River"
 sb_natal_crisis.070.d:0 "Dingane's regiments have broken against the laager on the Ncome. For the first time since Retief's murder and the attacks at Bloukrans, the trekker camps can look beyond mere survival. The Volksraad may now turn scattered farms and wagon camps into a Boer republic in Natal."
 sb_natal_crisis.070.f:0 "'Sunday, the 16th, was a day as if ordained for us. The sky was open. The weather clear and bright.'\n— Jan Gerritze Bantjes, #italic Journal of the Expedition, 1838#!"

 sb_natal_crisis.070.a:0 "Let Natalia be founded."
 sb_natal_crisis.070.b:0 "Lead Natalia."
 sb_natal_crisis_070_zulu_defeat_tt:0 "The Zulu lose #v 10#! Dynastic Stability. If their firearms programme is active, they gain #v +10%#! firearms progress."
 # ### TO REVIEW ###
 sb_natal_crisis.071.t:0 "Pretorius Goes to Natalia"
 sb_natal_crisis.071.d:0 "Natalia has been founded on the coast under Andries Pretorius. In Transvaal, his son Marthinus Wessel Pretorius now takes up the inland republic's leadership while the older commandant-general turns his authority toward the new Boer republic by the sea."
 sb_natal_crisis.071.f:0 "Andries prepared to ride toward the coast while Marthinus remained among the inland councils. Their household papers were divided between two wagons, as though the authority of the Pretorius name could be apportioned as neatly as rifles and clothing."
 sb_natal_crisis.071.a:0 "Remain in Transvaal."
 sb_natal_crisis.071.b:0 "Lead Natalia."
 # ### TO REVIEW ###
 sb_natal_crisis.080.t:0 "Natal Held"
 sb_natal_crisis.080.d:0 "The Boers have been crushed, though some of their strange weapons were taken from the field. Natal now lies fully in Zulu hands, and Dingane's authority has survived its hardest trial since the first wagons crossed toward the coast."
 sb_natal_crisis.080.f:0 "The surviving Boer wagons disappeared beyond the passes, leaving damaged guns and scattered stores behind them. In the royal kraal, messengers recited the regiments that had returned and the ground from which the settlers had been driven."
 sb_natal_crisis.080.a:0 "We must consider our next step."
 sb_natal_crisis_080_b_warning_tt:0 "#bold #n Seizing Port Natal may bring Britain into the struggle.#!#!"
 # ### TO REVIEW ###
 sb_natal_crisis.085.t:0 "Port Natal Raided"
 sb_natal_crisis.085.d:0 "Reports have at last reached Britain that Dingane's victory over the Boers has spilled onto the coast itself. What began as a frontier struggle in Natal now threatens British authority on the southeastern seaboard."
 sb_natal_crisis.085.f:0 "The report travelled from Port Natal to the Cape and onward beneath an official seal. By the time it reached London, a frontier raid had become a memorandum about shipping, imperial subjects, and whether another power might command the southeastern coast."
 sb_natal_crisis.085.a:0 "Britain must answer."
 sb_natal_crisis.085.b:0 "We have larger concerns."
 # ### TO REVIEW ###
 sb_natal_crisis.100.t:0 "The Coast Question"
 sb_natal_crisis.100.d:0 "Natalia is no longer an improvised trekker settlement. With a port active on the southeastern seaboard, the Colonial Office argues that a Boer-controlled coast weakens the Cape and cannot be left to harden into a permanent power."
 sb_natal_crisis.100.f:0 "On the Colonial Office map, Natalia occupied a small stretch of coast and a disproportionate share of the discussion. Officials traced the harbour, the inland wagon road, and the distance to Cape authority before drafting an ultimatum intended to make every line answer to one government."
 sb_natal_crisis.100.a:0 "Let the ultimatum go."
 sb_natal_crisis.100.b:0 "Let Natalia stand."
 # ### TO REVIEW ###
 sb_natal_crisis.110.t:0 "Britain's Ultimatum"
 sb_natal_crisis.110.d:0 "Britain now demands that Natalia submit to the Crown. Submission would preserve the settlement but turn it into a colony. Refusal means a quick strike for Port Natal and an appeal to the inland republics."
 sb_natal_crisis.110.f:0 "The British note was delivered within sight of the harbour. Natalia's councillors could hear surf beyond the shutters as they weighed submission against resistance, painfully aware that the ships controlling their outlet required neither the republic's roads nor its permission."
 sb_natal_crisis.110.a:0 "Submit and preserve what remains."
 sb_natal_crisis.110.b:0 "Refuse. Seize Port Natal and stand."
 # ### TO REVIEW ###
 sb_natal_crisis.111.t:0 "Natalia Appeals to Oranje"
 sb_natal_crisis.111.d:0 "Britain has demanded submission from Natalia, and the republic has answered by seizing Port Natal before the Crown can dictate the coast from ashore. Oranje is now asked to renew the common Boer cause."
 sb_natal_crisis.111.f:0 "Natalia's rider reached Bloemfontein carrying copies of the ultimatum and a list of every republic being asked for aid. The Free State councillors read their own name among them and understood that silence would also be an answer."
 sb_natal_crisis.111.a:0 "We will stand with Natalia."
 sb_natal_crisis.111.b:0 "The risk is too great."
 # ### TO REVIEW ###
 sb_natal_crisis.112.t:0 "Shall Transvaal Answer?"
 sb_natal_crisis.112.d:0 "Britain has demanded that Natalia submit, and the coast has answered with defiance. If Transvaal supports Natalia now, the Boer republics will stand together against imperial command of the sea-road."
 sb_natal_crisis.112.f:0 "The appeal from Natalia was placed beside maps of the interior's trade routes. Some councillors saw a distant coastal war; others saw the only non-British outlet the Boer republics might possess, and the precedent that would follow if it were surrendered without a fight."
 sb_natal_crisis.112.a:0 "We will answer."
 sb_natal_crisis.112.b:0 "Natal stands alone."
 # ### TO REVIEW ###
 sb_natal_crisis.113.t:0 "Shall Zoutpansberg Answer?"
 sb_natal_crisis.113.d:0 "Britain now moves openly against Natalia. If Zoutpansberg joins the struggle, the crisis becomes a wider Boer stand against imperial pressure on the coast."
 sb_natal_crisis.113.f:0 "The dispatch had crossed two republics before reaching the northern frontier. Its paper was worn, but the request remained plain: Natalia asked whether memories of one trek and one struggle were strong enough to send Zoutpansberg commandos toward a coast few had seen."
 sb_natal_crisis.113.a:0 "We will answer."
 sb_natal_crisis.113.b:0 "We stand aside."
 # ### TO REVIEW ###
 sb_natal_crisis.114.t:0 "Natalia Defiant"
 sb_natal_crisis.114.d:0 "Natalia has rejected the British ultimatum. What might have been settled by submission must now be settled by force, and the road to the southeast becomes a matter of war."
 sb_natal_crisis.114.f:0 "The refusal arrived with news that Natalia had seized the port. Orders passed from the Colonial Office to the military desks, where clerks replaced the language of negotiation with embarkation dates, objectives, and the strength required to compel submission."
 sb_natal_crisis.114.a:0 "Force their submission."
 # ### TO REVIEW ###
 sb_natal_crisis.115.t:0 "Natalia Lost"
 sb_natal_crisis.115.d:0 "Whether by submission or defeat, Natalia can no longer stand apart from Britain. The republic is now being folded into imperial rule, and many Boer families prepare to abandon the coast rather than live beneath the Crown."
 sb_natal_crisis.115.f:0 "The new authorities raised the imperial flag while Boer families loaded wagons within sight of it. Those willing to remain entered a colony; those unwilling to accept the Crown followed the same passes inland by which the republic's founders had once arrived."
 sb_natal_crisis.115.a:0 "Then we must yield."
 decision_sb_annex_zulu_subject_to_natal_colony:0 "Annex KwaZulu to Natal Colony"
 decision_sb_annex_zulu_subject_to_natal_colony_desc:0 "Fold a compliant Zulu puppet into the Natal Colony."
 # ### TO REVIEW ###
 sb_natal_crisis.116.t:0 "Across the Drakensberg"
 sb_natal_crisis.116.d:0 "The British flag now flies over Pietermaritzburg, and Natalia is no more. Most of the republic's Boer families will not remain beneath the Crown. Their wagons are climbing the Drakensberg with their households, herds and all they can carry, bound for new farms in Oranje and beyond."
 sb_natal_crisis.116.f:0 "'On my arrival at the foot of the Drakensberg Mountains, I was almost paralysed to witness the whole of the population, with few exceptions, trekking!'\n— Sir Harry Smith, #italic Dispatch from Pietermaritzburg, 10 February 1848#!"
 sb_natal_crisis.116.a:0 "There is land for them here."
 # ### TO REVIEW ###
 sb_natal_crisis.117.t:0 "Natal Refugees in Transvaal"
 sb_natal_crisis.117.d:0 "Natalia has passed under British rule, and the surviving Boer families now look north toward Transvaal. Their arrival will bring manpower, wagons, and a renewed bitterness toward the Crown in equal measure."
 sb_natal_crisis.117.f:0 "Northbound families crossed the Vaal with what they had salvaged from Natalia. Around the reception camps, Transvaal farmers offered grazing and heard repeated accounts of the ultimatum, the harbour, and the flag left behind on the coast."
 sb_natal_crisis.117.a:0 "Receive them."
 sb_natal_refugee_boer_pop_move_tt:0 "Most Boer [Concept('concept_pop', '$concept_pops$')] in Natal will emigrate to an inland Boer republic."
 # ### TO REVIEW ###
 sb_natal_crisis.118.t:0 "Shall Lydenburg Answer?"
 sb_natal_crisis.118.d:0 "Britain's move against Natalia now tests every inland republic. If Lydenburg answers the call, the crisis becomes a shared Boer war. If not, Natalia may be crushed alone and the Empire will learn how easily the frontier can be divided."
 sb_natal_crisis.118.f:0 "Lydenburg's council read Natalia's appeal beneath a map of the eastern roads. The coast lay beyond mountains and another republic, but the warning felt nearer: Britain had found one isolated Boer state, and might remember how little help it received."
 sb_natal_crisis.118.a:0 "Lydenburg will answer."
 sb_natal_crisis.118.b:0 "We shall stand aside."
 # ### TO REVIEW ###
 sb_natal_crisis.119.t:0 "The Call from Natalia"
 sb_natal_crisis.119.d:0 "Britain has placed its terms before the Natalia Volksraad: accept British sovereignty or prepare to resist it. A dispatch from Pietermaritzburg calls upon every Boer community beyond the Drakensberg to send men, horses and ammunition. Natalia must soon answer, and so must we."
 sb_natal_crisis.119.f:0 ""The time has now arrived for us to assist each other."\n— Commandant H. Steyn, #italic Letter to F. Hever, 4 June 1843#!"
 sb_natal_crisis.119.a:0 "Natalia will not stand alone."
 sb_natal_crisis.119.b:0 "We will not risk war with Britain."
 sb_natalia_player_warn_tt:0 "#n This may lead to war with Britain!#!"
 sb_natalia_player_support_pledge_tt:0 "If Natalia is AI-controlled, it will reject the British ultimatum. All AI-controlled Boer countries will support Natalia when Britain begins the ensuing diplomatic play. Natalia will demand the liberation of Cape Colony."
 ai_strategy_sb_natalia_resistance:0 "Defend the Natalia Republic"
 ai_strategy_sb_natalia_resistance_desc:0 "Natalia has rejected the British ultimatum with the pledged support of the Boer republics and will carry the confrontation to war."

sb_desc_firearms_gain_10:0 "Gain #v +10%#! progress toward #bold Adoption of Firearms#!"

 KLR:0 "Klip River County"
 KLR_ADJ:0 "Klip River"
 KLR_FLAVOR_TEXT:0 "A short-lived Boer county on the northern Natal frontier, established amid disputes between the Natal Colony, the Zulu kingdom, and the remaining trekker communities."
 Andries_Theodorus:0 "Andries Theodorus"
 Spies:0 "Spies"
 klip_river_commando:0 "Klip River Commando"
 sb_klip_river_zulu_muster:0 "Northern Natal Muster"
 sb_klip_river_zulu_muster_desc:0 "Zulu regiments enter the northern Natal campaign with local guides, clear objectives, and firmer coordination between the royal army and its frontier allies."
 ai_strategy_sb_klip_river_secession_resistance:0 "Defend the Klip River Republic"
 ai_strategy_sb_klip_river_secession_resistance_desc:0 "The Zulu court has recognised the Klip River rebellion and will carry the confrontation with Natal Colony through to war."

 dp_sb_klip_river_secession:0 "Klip River Secession"
 dp_sb_klip_river_secession_desc:0 "The Zulu kingdom moves against Natal Colony in support of the Boer secession at Klip River."
 dp_sb_klip_river_secession_tooltip:0 "Open the [concept_diplomatic_play] over Klip River County. The Zulu kingdom leads the rebellion; Britain supports Natal Colony."
 dp_sb_klip_river_punitive_expedition:0 "Natal Punitive Expedition"
 dp_sb_klip_river_punitive_expedition_desc:0 "Natal Colony seeks to annex the Zulu kingdom after the northern boundary settlement is rejected."
 dp_sb_klip_river_punitive_expedition_tooltip:0 "Open the [concept_diplomatic_play] between Natal Colony and the Zulu kingdom. Britain will support Natal Colony."

 # ### REVIEWED ###
 sb_klip_river_county.010.t:0 "The Colony's Northern Boundary"
 sb_klip_river_county.010.d:0 "The government at Pietermaritzburg has inherited a frontier that the old Natalia Volksraad never settled. Boer farms along the Klip River stand north of the line claimed by the Colony, while the Zulu court continues to regard the district as its own. Commissioners are ready to demand a final answer."
 sb_klip_river_county.010.f:0 "'The respective boundaries between the territory of Natal and the Zoolah nation shall be defined...'\n— #italic Treaty between King Mpande and Henry Cloete, 5 October 1843#!"
 sb_klip_river_county.010.a:0 "Send the commissioners north."
 sb_klip_river_county.010.b:0 "Ratify the present boundary."
 sb_klip_river_county_010_tt:0 "[SCOPE.sCountry('sb_klip_zulu_scope').GetName] will answer Natal's demand over #bold Klip River County#!."
 sb_klip_river_county_010_b_tt:0 "We will recognise the present Natal-Zulu boundary."

 # ### REVIEWED ###
 sb_klip_river_county.020.t:0 "The Klip River Question"
 sb_klip_river_county.020.d:0 "Commissioners from the newly established [SCOPE.sCountry('sb_klip_natal_scope').GetName] have asked the royal court to recognise the Mzinyathi as the Colony's northern boundary, placing the Klip River country under British rule. The Boer settlers beyond the Tugela make a rival offer: recognise a republic of their own, and they will stand between Natal and the Zulu heartland. The council must choose between peace with Britain, an alliance with the settlers, or reasserting our authority."
 sb_klip_river_county.020.f:0 "The Klip River affair became a three-sided contest in which the Zulu court, Boer settlers and the new British administration each tried to turn an uncertain frontier to its own advantage.\n— After Michał Leśniewski, #italic Chronology of the Klip River Affair of 1847#!"
 sb_klip_river_county.020.a:0 "Recognise the Mzinyathi boundary."
 sb_klip_river_county.020.b:0 "Recognise the Klip River Republic."
 sb_klip_river_county.020.c:0 "We will not bow to any settlers."

 sb_klip_river_county_020_a_tt:0 "#bold Klip River County#! will pass to [SCOPE.sCountry('sb_klip_natal_scope').GetName]. [SCOPE.sCountry('sb_klip_zulu_scope').GetName] will receive a #v 25-year#! [concept_truce] with Natal and Britain."
 sb_klip_river_county_020_a_dynasty_tt:0 "[ROOT.GetCountry.GetName] loses #n -5#! Dynastic Stability. [ROOT.GetCountry.GetRuler.GetFullName] gains the [GetCharacterTrait('cautious').GetName] [concept_character_trait] if not already Cautious, contributing #p +0.5#! monthly Dynastic Stability."

 sb_klip_river_county_020_b_tt:0 "Boer separatists will establish #bold $KLR$#! with Zulu support. [SCOPE.sCountry('sb_klip_natal_scope').GetName] will attempt to suppress the new republic in a [concept_diplomatic_play]."
 sb_klip_river_county_020_b_dynasty_tt:0 "[ROOT.GetCountry.GetName] gains #p +5#! Dynastic Stability. [ROOT.GetCountry.GetRuler.GetFullName] gains the [GetCharacterTrait('tactful').GetName] [concept_character_trait] if not already Tactful."

 sb_klip_river_county_020_c_tt:0 "#n [SCOPE.sCountry('sb_klip_natal_scope').GetName] will begin a punitive [concept_diplomatic_play] to annex [SCOPE.sCountry('sb_klip_zulu_scope').GetName].#!"
 sb_klip_river_county_020_c_dynasty_tt:0 "[ROOT.GetCountry.GetName] gains #p +15#! Dynastic Stability. [ROOT.GetCountry.GetRuler.GetFullName] gains the [GetCharacterTrait('ambitious').GetName] [concept_character_trait] if not already Ambitious."

 # ### REVIEWED ###
 sb_klip_river_county.004.t:0 "A Republic on the Klip"
 sb_klip_river_county.004.d:0 "The Boer settlers of the Klip River country have cast off the authority of Pietermaritzburg and proclaimed a republic under Andries Theodorus Spies. The Zulu court has recognised their cause and called the Zulu regiments to arms. Spies now appeals to the Volksraad for aid, promising that a restored Natalia will accept Bloemfontein's protection if the British are driven from the coast. The question is whether Boer fellowship is worth war with London."
 sb_klip_river_county.004.f:0 "Andries Theodorus Spies addressed a proclamation to the 'Emigrants and Countrymen over Tugela' as British troops entered the Klip River country.\n— #italic 4 December 1847#!"
 sb_klip_river_county.004.a:0 "Stand with the Klip River Republic."
 sb_klip_river_county.004.b:0 "We will not fight Britain for Natal."
 sb_klip_river_county_004_a_tt:0 "[ROOT.GetCountry.GetName] will support [SCOPE.sCountry('sb_klip_county_scope').GetName] and the Zulu Kingdom against [SCOPE.sCountry('sb_klip_natal_scope').GetName] and Britain. If the coalition prevails, a reduced Natalia will become a [concept_protectorate] of [ROOT.GetCountry.GetName]."

 # ### REVIEWED ###
 sb_klip_river_county.030.t:0 "The Mzinyathi Boundary"
 sb_klip_river_county.030.d:0 "The Zulu court has agreed to recognise the Mzinyathi as the northern boundary of the new British colony. The Klip River country will pass under the administration of Pietermaritzburg, and the agreement promises peace along Natal's northern frontier. For the Boer settlers beyond the Tugela, however, the settlement extinguishes the last hope of remaining outside British rule. Many are already preparing to cross the Drakensberg."
 sb_klip_river_county.030.f:0 "'There shall be hence-forward and for ever peace and friendship.'\n— #italic Treaty between King Mpande and Henry Cloete, 5 October 1843#!"
 sb_klip_river_county.030.a:0 "Extend Natal to the Mzinyathi."
 sb_klip_river_county_030_tt:0 "Natal receives #bold Klip River County#!. Natal and Britain will sign a #v 25-year#! [concept_truce] with the Zulu Kingdom."

 # ### REVIEWED ###
 sb_klip_river_county.050.t:0 "The Klip River Insurrection"
 sb_klip_river_county.050.d:0 "The Klip River settlers have repudiated the authority of Pietermaritzburg and established an independent Boer government under Andries Theodorus Spies. The Zulu court has recognised their cause and called the Zulu regiments to arms. What began as a dispute over Natal's northern boundary has become a war for the colony: together, the insurgents and their Zulu allies intend to drive out the British administration and restore a Boer and Zulu control of the region."
 sb_klip_river_county.050.f:0 "Natal's officers warned that the colony possessed too few troops to take the offensive against the Zulu Kingdom, still less against the Zulu and Boer settlers together.\n— After E. F. Boys, #italic Opinion on the Military Situation in Natal, 16 July 1847#!"
 sb_klip_river_county.050.a:0 "The Empire will hold Natal."
 sb_klip_river_county_050_tt:0 "The Zulu Kingdom will begin an #bold Annexation#! [concept_diplomatic_play] against [ROOT.GetCountry.GetName] in support of $KLR$. Britain will support Natal; if Oranje has pledged aid to the boer cause, it will join the Zulu side."

 # ### REVIEWED ###
 sb_klip_river_county.060.t:0 "The Security of Natal"
 sb_klip_river_county.060.d:0 "The Zulu court has rejected the proposed Mzinyathi boundary and refuses to cede the Klip River country. The Executive Council now declares that no agreement can secure Natal while the Zulu Kingdom retains the power to reopen the frontier at will. What began as a dispute over one district will be presented to Britain as proof that lasting peace requires the conquest and annexation of Zululand."
 sb_klip_river_county.060.f:0 "'He has practised, and is practising, the grossest deceit towards the British Government.'\n— William Harding, #italic on the Klip River affair, 1847#!"
 sb_klip_river_county.060.a:0 "Fold Zululand by force into the Colony."
 sb_klip_river_county_060_tt:0 "[ROOT.GetCountry.GetName] will begin a punitive [concept_diplomatic_play] to annex [SCOPE.sCountry('sb_klip_zulu_scope').GetName]."

 # ### REVIEWED ###
 sb_klip_river_county.070.t:0 "Beyond British Rule"
 sb_klip_river_county.070.d:0 "London has extinguished Natalia and replaced its Volksraad with a colonial government at Pietermaritzburg. The decision not to pursue the Klip River farms is merely the latest reminder to Natal's remaining Boer families that British rule is permanent and their petitions carry little weight. Unwilling to remain beneath the Crown, they are loading their wagons for the Drakensberg."
 sb_klip_river_county.070.f:0 "'The continued emigration of the Boers... has been going on ever since it was taken possession of in 1842 by Her Majesty's troops.'\n— Stanger, Shepstone and Gibb, #italic Report on Natal, 28 December 1847#!"
 sb_klip_river_county.070.a:0 "Oh well..."

 # ### REVIEWED ###
 sb_klip_river_county.075.t:0 "The Klip River Exodus"
 sb_klip_river_county.075.d:0 "The settlement of the Klip River question has brought the last Boer district in Natal under British administration. A colonial magistrate has summoned its inhabitants to swear allegiance to the Crown, but most refuse. Their families, herds and wagons are already gathering for the Drakensberg passes. Pietermaritzburg will keep the land, but not the settlers."
 sb_klip_river_county.075.f:0 "'They seem so perfectly resolved to leave the district.'\n— J. N. Boshof, #italic Letter to Donald Moodie, 20 November 1847#!"
 sb_klip_river_county.075.a:0 "Oh well..."

 # ### REVIEWED ###
 sb_klip_river_county.080.t:0 "The Crown Follows North"
 sb_klip_river_county.080.d:0 "The Zulu court's refusal has ended not in a settled boundary, but in conquest. British and colonial forces have overthrown the Zulu Kingdom, annexed its territory, and carried Natal's administration far beyond the Tugela. To the Colony's remaining Boer families, the victory offers no cause for celebration: the government they once fled now rules a wider country, and their wagons are already turning towards the Drakensberg."
 sb_klip_river_county.080.f:0 "'They would go further and still further away when our rule followed them.'\n— Anthony Trollope, #italic South Africa, 1878#!"
 sb_klip_river_county.080.a:0 "Britania shall bring order to Zululand."

 # ### REVIEWED ###
 sb_klip_river_county.081.t:0 "The Empire Remains"
 sb_klip_river_county.081.d:0 "The war with the Zulu Kingdom has ended without a victor, and neither side has altered the frontier. For Natal's Boer families, however, the peace settles a more important question: British rule has survived, the Volksraad will not return, and Natalia will not be restored. Those unwilling to remain beneath London's rule are yoking their oxen and turning towards the Drakensberg."
 sb_klip_river_county.081.f:0 "'The continued emigration of the Boers... has been going on ever since it was taken possession of in 1842 by Her Majesty's troops.'\n— Stanger, Shepstone and Gibb, #italic Report on Natal, 28 December 1847#!"
 sb_klip_river_county.081.a:0 "So long..."

 # ### REVIEWED ###
 sb_klip_river_county.082.t:0 "The Wagons from Natal"
 sb_klip_river_county.082.d:0 "The Zulu victory has overthrown British rule in Natal, and no Boer republic has risen in its place. Unwilling to submit to Zulu rule, the remaining Boer families have crossed the Drakensberg with what livestock and possessions they could save. They now ask [ROOT.GetCountry.GetName] for land and protection."
 sb_klip_river_county.082.f:0 "'We had a time of hardship... All was gone.'\n— Daniel Pieter Bezuidenhout, #italic The Pioneer's Narrative#!"
 sb_klip_river_county.082.a:0 "Give them land among us."

 # ### REVIEWED ###
 sb_klip_river_county.090.t:0 "The Crown Beyond the Tugela"
 sb_klip_river_county.090.d:0 "British and colonial forces have crushed the Klip River Republic and defeated the Zulu Kingdom that came to its aid. The separatist government is dissolved, Zululand has been annexed, and Pietermaritzburg now governs the country beyond the Tugela. For the Boer families who took up arms to escape British rule, defeat leaves only submission or another trek across the Drakensberg."
 sb_klip_river_county.090.f:0 "'In this way Natal was nearly cleared of Dutchmen in the year 1848.'\n— Anthony Trollope, #italic South Africa, 1878#!"
 sb_klip_river_county.090.a:0 "Those who will not submit may trek."

 # ### REVIEWED ###
 sb_klip_river_county.091.t:0 "The Klip River Republic Falls"
 sb_klip_river_county.091.d:0 "Colonial forces have broken the Klip River Republic and restored the county to the authority of Pietermaritzburg. The Zulu Kingdom has made a separate peace and survives beyond the Mzinyathi, but its intervention has not saved its Boer ally. Faced once more with British rule, the remaining settlers are abandoning their farms and preparing for the Drakensberg passes."
 sb_klip_river_county.091.f:0 "'The Dutch Boers on the Klip River ... are trekking across the Quattelamba or Drakenberg range of mountains to their friends on the other side.'\n— Sir John Hall, #italic Letter from Grahamstown, 10 January 1848#!"
 sb_klip_river_county.091.a:0 "There will be no republic on the Klip."
