l_english:
 # ### TO REVIEW ###
 sb_natal_crisis.025.t:0 "Dingane's Price"
 sb_natal_crisis.025.d:0 "Retief's deputation has returned from uMgungundlovu with Dingane's terms. [SCOPE.sCountry('zulu_kingdom').GetName] will allow the emigrant farmers a settlement south of the Tugela only if [ROOT.GetCountry.GetName] supplies it with firearms for five years. Buying peace would secure a foothold in Natal without a war, yet every crate sent east will arm Dingane's regiments."
 sb_natal_crisis.025.f:0 "'His attention was arrested by sixty horses and eleven guns... and he told them he must also have them.'\n— William Wood, #italic Statements Respecting Dingaan, King of the Zulus, 1840#!"
 sb_natal_crisis.025.a:0 "Pay Dingane's price."
 sb_natal_crisis.025.b:0 "Refuse the guns. Take Natal by force."
 sb_natal_crisis.025.c:0 "Pay the price—and follow the wagons."

 # ### TO REVIEW ###
 sb_natal_crisis.026.t:0 "No Guns for the King"
 sb_natal_crisis.026.d:0 "The Boer leaders have rejected the demand for firearms in exchange for southern Natal. They intend to take the land by force, leaving [SCOPE.sCharacter('sb_court_frontier_sovereign').GetFullName] to either yield the disputed districts or face their commandos."
 sb_natal_crisis.026.f:0 "The returning messenger set down neither powder nor rifles before [SCOPE.sCharacter('sb_court_frontier_sovereign').GetFirstNameNoFormatting]. Those councillors who had urged the arms bargain looked down at the swept earth of the enclosure, waiting to hear whether [SCOPE.sCharacter('sb_court_frontier_sovereign').GetSheHe] would yield the frontier or summon the regiments."
 sb_natal_crisis.026.a:0 "Then they shall face the regiments."
 sb_natal_crisis.026.b:0 "Yield the land. Spare the kingdom a war."

 # ### REVIEWED ###
 sb_natal_crisis.010.t:0 "Towards Natal"
 sb_natal_crisis.010.d:0 "Piet Retief and his fellow Voortrekkers propose to cross the Drakensberg and establish a Boer settlement in the  fertile country around Port Natal. Its harbour would give the trekkers a road to the sea, but King Dingane regards the land south of the Tugela as his to grant. Retief now asks us to support an embassy to uMgungundlovu and seek his consent."
 sb_natal_crisis.010.f:0 "'I shall set out in a few days for the country of the Zulus, in order to settle with you our future relations.'\n— Piet Retief, #italic Letter to Dingane, 19 October 1837#!"
 sb_natal_crisis.010.a:0 "Back Retief's mission."
 sb_natal_crisis.010.b:0 "We will not risk Dingane's wrath."
 sb_natal_crisis_010_a_warning_tt:0 "#bold #n Backing Retief's mission may lead to war with the Zulu Kingdom.#!#!"

 # ### TO REVIEW ###
 sb_natal_crisis.020.t:0 "Retief's Petition"
 sb_natal_crisis.020.d:0 "[SCOPE.sCharacter('sb_retief_envoy').GetFullName] has returned the stolen cattle and asks [SCOPE.sCharacter('sb_court_frontier_sovereign').GetFullName] to grant the emigrant farmers land south of the Tugela. The king must answer the petition: honour the grant, demand guns in payment, or order the deputation's death."
 sb_natal_crisis.020.f:0 "The cattle pass before the royal enclosure, their return witnessed by the men who had counted them missing. Retief has met the king's demand and now presses his own. Beyond the mountains, families wait beside loaded wagons for permission to descend into Natal.\n\nThe councillors have seen the visitors' horses and firearms. Such men could supply the regiments; settled upon their own farms, they might prove less willing to obey the king who admitted them."
 sb_natal_crisis.020.a:0 "Honour the grant of land."
 sb_natal_crisis.020.b:0 "Put Retief and his deputation to death."
 sb_natal_crisis.020.c:0 "Land in return for guns."
 # TO REVIEW (non-event/JE keys)
 sb_natalia_chiefdoms_absorbed_tt:0 "[ROOT.GetCountry.GetName] will #bold annex#! the #v Nguni Chiefdoms#!."

 # ### REVIEWED ###
 sb_natal_crisis.030.t:0 "The Republic of Natalia"
 sb_natal_crisis.030.d:0 "Dingane has accepted Retief's terms and granted the emigrant farmers the country between the Tugela and the Umzimvubu. Wagons are already descending the Drakensberg towards Port Natal, where a Volksraad is preparing to govern the new settlements. For Oranje, a sister republic on the coast promises access to the sea beyond British control."
 sb_natal_crisis.030.f:0 "'I ... resign unto him, Retief, and his countrymen the place called Port Natal, together with all the land annexed.'\n— #italic Deed of Cession attributed to Dingane, 4 February 1838#!"
 sb_natal_crisis.030.a:0 "Let Natalia stand beside us."
 sb_natal_crisis.030.b:0 "Our future lies in Natalia."

 # ### REVIEWED ###
 sb_natal_crisis.050.t:0 "Retief Murdered"
 sb_natal_crisis.050.d:0 "Piet Retief has been murdered by Dingane, and his Impi troops have marched to secure Southern Natal. One of our prominent commanders, Pretorius, is demanding that we send an expedition to assert our claims and exact revenge agaist the Zulu."
 sb_natal_crisis.050.f:0 "In a panting breath the survivor said, "Commandent-General Pretorius, Dingane killed Oom Retief! He lied to us, he said he would allow us to peacefully settle in the land South of the Tugela if we recaptured a large cattle heard the Swazi had stolen from him. We successfully recovered them from the thiefs. Dingane embraced Retief and thanked him, and then immeditely turned to his Impi and ordered them to kill us alll. I was lucky to survive.""
 sb_natal_crisis.050.a:0 "We must withdraw."
 sb_natal_crisis.050.b:0 "Rally the commandos!"

 # ### TO REVIEW ###
 sb_natal_crisis.070.t:0 "Victory at Blood River"
 sb_natal_crisis.070.d:0 "Zulu regiments have broken against the Boer laager on the Ncome, ending armed resistance to the trekker settlements in Natal. With the frontier secured, [ROOT.GetCountry.GetName] may establish a sister republic across the Drakensberg."
 sb_natal_crisis.070.f:0 "At daybreak the wagons were unlashed from the laager beside the Ncome. Field-cornets counted the remaining powder, tended the draught-oxen, and drew up the roll of farms for a Volksraad that no longer answered only for a camp on the march."

 sb_natal_crisis.070.a:0 "Let Natalia be founded."
 sb_natal_crisis.070.b:0 "Cross the mountains and lead Natalia."

 # ### TO REVIEW ###
 sb_natal_crisis.071.t:0 "Pretorius Goes to Natalia"
 sb_natal_crisis.071.d:0 "Andries Pretorius has taken office in Boer Natalia after the victory at Blood River, leaving [ROOT.GetCountry.GetName] to continue under its own government west of the Drakensberg. Our leadership must decide whether to remain on the highveld or guide the new republic in Natal."
 sb_natal_crisis.071.f:0 "At the outspan, two riders parted company. One carried news of the appointment to the farms on the Mooi River. The other turned his horse towards Natal, where the new government was already waiting for its commandant."
 sb_natal_crisis.071.a:0 "Remain in Transvaal."
 sb_natal_crisis.071.b:0 "Follow Pretorius and lead Natalia."

 # ### TO REVIEW ###
 sb_natal_crisis.080.t:0 "The Commandos Turn Back"
 sb_natal_crisis.080.d:0 "The confrontation with the Boers has ended in Zulu victory, strengthening the sovereign's standing among the chiefs. A few Boer firearms collected along the frontier have reached the royal homestead, and the commanders ask to put them to use."
 sb_natal_crisis.080.f:0 "Praise follows the news into the royal homestead. The men carrying the guns receive rather more practical attention: which pieces will fire, who knows how to load them, and how much powder can be found? A commander turns a battered lock in his hands while the congratulations continue."
 sb_natal_crisis.080.a:0 "Put these guns to use."
 sb_natal_crisis_080_b_warning_tt:0 "#bold #n Seizing Port Natal may bring Britain into the struggle.#!#!"

 # ### TO REVIEW ###
 sb_natal_crisis.081.t:0 "Terms Without Triumph"
 sb_natal_crisis.081.d:0 "The confrontation with the Boers has ended without a decisive victory for either side. As the regiments prepare to return home, their commanders bring forward a handful of firearms gathered along the frontier."
 sb_natal_crisis.081.f:0 "A man takes one of the collected guns by the barrel and offers it to his commander. He has little to say about the terms. He wants to know whether he should carry it home or leave it with the men who will be taught to use it. Around them, the regiments are already breaking up for the journey."
 sb_natal_crisis.081.a:0 "Keep the guns for the regiments."

 # ### TO REVIEW ###
 sb_natal_crisis.082.t:0 "The Price of Natal"
 sb_natal_crisis.082.d:0 "The Boers have prevailed in Natal, weakening the sovereign's standing and encouraging rival princes to seek new supporters. A few Boer firearms gathered along the frontier offer the regiments a means to prepare for another confrontation."
 sb_natal_crisis.082.f:0 "The boundary is recited before the council. When the men who brought in the guns step forward, no one calls them trophies. One of the commanders asks for the weapons to be kept together: next time, more of his men should know how they work."
 sb_natal_crisis.082.a:0 "Let the regiments learn to use them."

 # ### TO REVIEW ###
 sb_natal_crisis.085.t:0 "Port Natal Raided"
 sb_natal_crisis.085.d:0 "Dispatches have reached London confirming that Zulu forces have marched to the coast and seized Port Natal. What began as an inland frontier conflict now challenges British authority along the south-eastern seaboard, forcing [ROOT.GetCountry.GetName] to choose between a campaign to annex Zululand or accepting the loss."
 sb_natal_crisis.085.f:0 "The report travelled from Port Natal to the Cape and onward beneath an official seal. By the time it reached London, the seizure of the harbour had become a Colonial Office memorandum on shipping, imperial subjects, and whether an independent kingdom could be left astride the south-eastern coast."
 sb_natal_crisis.085.a:0 "Answer the seizure by force."
 sb_natal_crisis.085.b:0 "We have larger concerns."

 # ### TO REVIEW ###
 sb_natal_crisis.100.t:0 "The Coast Question"
 sb_natal_crisis.100.d:0 "[SCOPE.sCountry('natalia').GetName] is no longer an improvised trekker settlement. With a harbour established on the south-eastern seaboard, the Colonial Office urges [ROOT.GetCountry.GetName] to demand its submission before a Boer coastal state hardens into a permanent rival to the Cape."
 sb_natal_crisis.100.f:0 "On the Colonial Office map, Natalia occupied a small stretch of coast and a disproportionate share of the discussion. Officials traced the harbour, the inland wagon road, and the distance to Cape authority before drafting an ultimatum intended to make every line answer to one government."
 sb_natal_crisis.100.a:0 "Dispatch the ultimatum."
 sb_natal_crisis.100.b:0 "Let Natalia stand."

 # ### REVIEWED ###
 sb_natal_crisis.110.t:0 "Britain's Ultimatum"
 sb_natal_crisis.110.d:0 "Natalia has opened a harbour under its own flag, giving the republic an outlet beyond British control. Her Majesty's Government will not tolerate an independent Boer state upon the coast and demands its submission to the Crown. The Volksraad must either accept British rule or reject the ultimatum and call upon the inland republics for aid against the inevitable response."
 sb_natal_crisis.110.f:0 "'Her Majesty has desired me to inform the Emigrant Farmers that she cannot acknowledge a portion of her own subjects as an independent Republic.'\n— Sir George Napier, #italic Message to the Emigrant Farmers, 1841#!"
 sb_natal_crisis.110.a:0 "Accept the Crown's terms."
 sb_natal_crisis.110.b:0 "Reject the terms and call for aid."

 sb_natal_crisis_british_colony_finalization_tt:0 "[ROOT.GetCountry.GetName] will become a British #bold Crown Colony#!. Its Boer compacts will be annulled and a colonial administration installed."

 # ### REVIEWED ###
 sb_natal_crisis.111.t:0 "Natalia's Plea"
 sb_natal_crisis.111.d:0 "Natalia's Volksraad has rejected Britain's demand for submission. British forces at Port Natal are preparing to  march against the republic. A dispatch of commandos from Pietermaritzburg are asking Oranje to enter the coming war on Natalia's side. Agreeing means war with Britain; while to refusing is to abandon a sister republic."
 sb_natal_crisis.111.f:0 "'We are aware of the power of Great Britain... but at the same time we cannot allow that might instead of right shall triumph.'\n— Volksraad of Natalia, #italic Protest to Sir George Napier, 21 February 1842#!"
 sb_natal_crisis.111.a:0 "Call out the commandos. We ride for Natalia."
 sb_natal_crisis.111.b:0 "War with Britain is too risky."
 sb_natal_crisis_111_a_tt:0 "#n Britain will demand our subjugation along with Natalia!#!"


 # ### REVIEWED ###
 sb_natal_crisis.112.t:0 "A Call Across the Drakensberg"
 sb_natal_crisis.112.d:0 "Natalia's Volksraad has rejected Britain's demand for submission. A dispatch from Pietermaritzburg calls upon [ROOT.GetCountry.GetName] to enter the coming war and send its commandos across the Drakensberg. Potchefstroom and Natalia once answered to the same Volksraad; now the republic must decide whether that old bond is worth war with the Crown."
 sb_natal_crisis.112.f:0 "'The time has now arrived for us to assist each other.'\n— Commandant H. Steyn, #italic Letter to F. Hever, 4 June 1843#!"
 sb_natal_crisis.112.a:0 "Call out the commandos. We cross the Drakensberg."
 sb_natal_crisis.112.b:0 "We will not go to war with Britain."
 sb_natal_crisis_112_a_tt:0 "#n Britain will demand our subjugation along with Natalia!#!"

 # ### REVIEWED ###
 sb_natal_crisis.113.t:0 "A Call to the Far North"
 sb_natal_crisis.113.d:0 "Natalia's Volksraad has rejected Britain's demand for submission. A dispatch from Pietermaritzburg has reached Zoutpansberg, calling upon the northern republic to send its commandos south and enter the coming war. To answer would mean fighting the Crown for a coast few of its burghers have seen; to refuse would leave another emigrant republic to be brought beneath British rule."
 sb_natal_crisis.113.f:0 "'We quit this Colony... under the full assurance that the English Government... will allow us to govern ourselves without its interference in future.'\n— Piet Retief, #italic Manifesto of the Emigrant Farmers, 1837#!"
 sb_natal_crisis.113.a:0 "Call out the commandos. We ride south."
 sb_natal_crisis.113.b:0 "We will not go to war with Britain."
 sb_natal_crisis_113_a_tt:0 "#n Britain will demand our subjugation along with Natalia!#!"


 # ### REVIEWED ###
 sb_natal_crisis.114.t:0 "The Natal Expedition"
 sb_natal_crisis.114.d:0 "Natalia's Volksraad has rejected the Crown's ultimatum and called upon the inland republics for aid. The imperial government will not recognise an independent Boer state on the south-eastern coast. An expedition is being assembled at Port Natal to march inland and compel the republic—and any allies—to submit."
 sb_natal_crisis.114.f:0 "'As Great Britain had now begun the campaign, Great Britain was of course obliged to end it successfully.'\n— Anthony Trollope, #italic South Africa, 1878#!"
 sb_natal_crisis.114.a:0 "Dispatch the expedition."

 # ### REVIEWED ###
 sb_natal_crisis.115.t:0 "The Republic Is No More"
 sb_natal_crisis.115.d:0 "The struggle is over. Natalia has been compelled to accept British sovereignty, and the authority of the Volksraad is at an end. In its place will stand the Colony of Natal. Many Boer families have expressed their deep discontent at being once again under Imperial rule, and are considering loading their wagons for the Drakensberg."
 sb_natal_crisis.115.f:0 "'The district of Port Natal... will be recognized and adopted by Her Majesty the Queen as a British Colony.'\n— Sir George Napier, #italic Proclamation of 12 May 1843#!"
 sb_natal_crisis.115.a:0 "Alas so ends Natalia."

 decision_sb_annex_zulu_subject_to_natal_colony:0 "Annex KwaZulu to Natal Colony"
 decision_sb_annex_zulu_subject_to_natal_colony_desc:0 "Fold a compliant Zulu puppet into the Natal Colony."

 # ### TO REVIEW ###
 sb_natal_crisis.116.t:0 "Across the Drakensberg"
 sb_natal_crisis.116.d:0 "The British flag now flies over Pietermaritzburg, and Natalia is no more. Most of the republic's Boer families will not remain beneath the Crown. Their wagons are climbing the Drakensberg with their households, herds and all they can carry, bound for new farms in Oranje and beyond."
 sb_natal_crisis.116.f:0 "'On my arrival at the foot of the Drakensberg Mountains, I was almost paralysed to witness the whole of the population, with few exceptions, trekking!'\n— Sir Harry Smith, #italic Dispatch from Pietermaritzburg, 10 February 1848#!"
 sb_natal_crisis.116.a:0 "There is land for them here."
 # ### TO REVIEW ###
 sb_natal_crisis.117.t:0 "Natal Refugees in Transvaal"
 sb_natal_crisis.117.d:0 "Natalia has passed under British rule, and departing Boer families now turn north towards [ROOT.GetCountry.GetName]. Their arrival will bring skilled hands, loaded wagons, and a renewed bitterness towards the Crown in equal measure."
 sb_natal_crisis.117.f:0 "Northbound families crossed the Vaal with what they had salvaged from Natalia. Around the reception camps, Transvaal farmers offered grazing and heard repeated accounts of the ultimatum, the harbour, and the flag left behind on the coast."
 sb_natal_crisis.117.a:0 "Receive them."
 sb_natal_refugee_boer_pop_move_tt:0 "Most Boer [Concept('concept_pop', '$concept_pops|q$')] in Natal will emigrate to an inland Boer republic."
 # ### TO REVIEW ###
 sb_natal_crisis.118.t:0 "A Call to Lydenburg"
 sb_natal_crisis.118.d:0 "Natalia's Volksraad has rejected Britain's demand for submission. A dispatch from Pietermaritzburg now calls upon [ROOT.GetCountry.GetName] to send its commandos south and enter the coming war. Answering means fighting the Crown—and risking British subjugation—while refusing leaves an isolated Boer republic to fall alone."
 sb_natal_crisis.118.f:0 "The courier's horse still stood lathered outside the council room while Lydenburg's elders read the dispatch from Pietermaritzburg. Port Natal lay days beyond the Drakensberg, yet the burghers waiting along the verandah knew that a British column victorious on the coast would not stop at the Tugela."
 sb_natal_crisis.118.a:0 "Call out the commandos. Fight Britain for Natalia."
 sb_natal_crisis.118.b:0 "Stand aside. We will not fight Britain."
 # ### TO REVIEW ###
 sb_natal_crisis.119.t:0 "The Call from Natalia"
 sb_natal_crisis.119.d:0 "Britain has placed its terms before the Natalia Volksraad: accept British sovereignty or prepare to resist it. A dispatch from Pietermaritzburg calls upon [ROOT.GetCountry.GetName] and every Boer community beyond the Drakensberg to pledge men, horses and ammunition. Natalia must soon answer, and so must we."
 sb_natal_crisis.119.f:0 "The courier rode in with sealed letters from Pietermaritzburg before the Volksraad had even risen. Burghers gathered in the square outside, asking whether a pledge sent down the mountain passes tonight would carry their own commandos into war before the year was out."
 sb_natal_crisis.119.a:0 "Natalia will not stand alone."
 sb_natal_crisis.119.b:0 "We will not risk war with Britain."
 sb_natalia_player_warn_tt:0 "#n This may lead to war with Britain!#!"
 sb_natalia_player_support_pledge_tt:0 "If Natalia is AI-controlled, it will reject the British ultimatum. All AI-controlled Boer countries will support Natalia when Britain begins the ensuing diplomatic play. Natalia will demand the return of Cape-held Natal; if Oranje joins, it will also demand the liberation of Cape Colony."
 ai_strategy_sb_natalia_resistance:0 "Defend the Natalia Republic"
 ai_strategy_sb_natalia_resistance_desc:0 "Natalia has rejected the British ultimatum with the pledged support of the Boer republics and will carry the confrontation to war."

sb_desc_firearms_gain_10:0 "Gain #v +10%#! progress toward #bold Adoption of Firearms#!"

 KLR:0 "Klip River Republic"
 KLR_ADJ:0 "Klip River"
 KLR_FLAVOR_TEXT:0 "A short-lived Boer republic on the northern Natal frontier, established amid disputes between the Natal Colony, the Zulu kingdom, and the remaining trekker communities."
 Andries_Theodorus:0 "Andries Theodorus"
 klip_river_commando:0 "Klip River Commando"
 sb_klip_river_zulu_muster:0 "Northern Natal Muster"
 sb_klip_river_zulu_muster_desc:0 "Zulu regiments enter the northern Natal campaign with local guides, clear objectives, and firmer coordination between the royal army and its frontier allies."
 ai_strategy_sb_klip_river_secession_resistance:0 "Defend the Klip River Republic"
 ai_strategy_sb_klip_river_secession_resistance_desc:0 "The Zulu court has recognised the Klip River rebellion and will carry the confrontation with Natal Colony through to war."

 dp_sb_klip_river_secession:0 "Klip River Secession"
 dp_sb_klip_river_secession_desc:0 "The Zulu kingdom moves against Natal Colony in support of the Boer secession at Klip River."
 dp_sb_klip_river_secession_tooltip:0 "Open the [concept_diplomatic_play] over Klip River County. The Zulu kingdom leads the rebellion; Britain supports Natal Colony."
 dp_sb_klip_river_punitive_expedition:0 "Natal Punitive Expedition"
 # TO REVIEW (non-event/JE keys)
 dp_sb_klip_river_punitive_expedition_desc:0 "Natal Colony demands the return of the Zulu-held part of Natal and a [concept_protectorate] over the Zulu Kingdom after the northern boundary settlement is rejected."
 dp_sb_klip_river_punitive_expedition_tooltip:0 "Open the [concept_diplomatic_play] demanding the return of the Zulu-held part of Natal to Natal Colony and a [concept_protectorate] over the Zulu Kingdom. Britain will support Natal Colony."

 # ### REVIEWED ###
 sb_klip_river_county.010.t:0 "The Colony's Northern Boundary"
 sb_klip_river_county.010.d:0 "The government at Pietermaritzburg has inherited a frontier that the old Natalia Volksraad never settled. Boer farms along the Klip River stand north of the line claimed by the Colony, while the Zulu court continues to regard the district as its own. Commissioners are ready to demand a final answer."
 sb_klip_river_county.010.f:0 "'The respective boundaries between the territory of Natal and the Zoolah nation shall be defined...'\n— #italic Treaty between King Mpande and Henry Cloete, 5 October 1843#!"
 sb_klip_river_county.010.a:0 "Send the commissioners north."
 sb_klip_river_county.010.b:0 "Ratify the present boundary."
 sb_klip_river_county_010_tt:0 "[SCOPE.sCountry('sb_klip_zulu_scope').GetName] will answer Natal's demand over #bold Klip River County#!."
 sb_klip_river_county_010_b_tt:0 "We will recognise the present Natal-Zulu boundary."

 # ### REVIEWED ###
 sb_klip_river_county.020.t:0 "The Klip River Question"
 sb_klip_river_county.020.d:0 "Commissioners from the newly established [SCOPE.sCountry('sb_klip_natal_scope').GetName] have asked the royal court to recognise the Mzinyathi as the Colony's northern boundary, placing the Klip River country under British rule. The Boer settlers beyond the Tugela make a rival offer: recognise a republic of their own, and they will stand between Natal and the Zulu heartland. The council must choose between peace with Britain, an alliance with the settlers, or reasserting our authority."
 sb_klip_river_county.020.f:0 "The Klip River affair became a three-sided contest in which the Zulu court, Boer settlers and the new British administration each tried to turn an uncertain frontier to its own advantage.\n— After Michał Leśniewski, #italic Chronology of the Klip River Affair of 1847#!"
 sb_klip_river_county.020.a:0 "Recognise the Mzinyathi boundary."
 sb_klip_river_county.020.b:0 "Recognise the Klip River Republic."
 sb_klip_river_county.020.c:0 "We will not bow to any settlers."

 sb_klip_river_county_020_a_tt:0 "#bold Klip River County#! will pass to [SCOPE.sCountry('sb_klip_natal_scope').GetName]. [SCOPE.sCountry('sb_klip_zulu_scope').GetName] will receive a #v 25-year#! [concept_truce] with Natal and Britain."
 # TO REVIEW (non-event/JE keys)
 sb_klip_river_county_020_a_dynasty_tt:0 "[ROOT.GetCountry.GetName] loses #n 5#! Prerogative. [ROOT.GetCountry.GetRuler.GetFullName] gains the [GetCharacterTrait('cautious').GetName] [concept_character_trait] if not already Cautious, contributing #p +0.5#! monthly Prerogative."

 sb_klip_river_county_020_b_tt:0 "Boer separatists will establish #bold $KLR$#! with Zulu support. [SCOPE.sCountry('sb_klip_natal_scope').GetName] will attempt to suppress the new republic in a [concept_diplomatic_play]."
 # TO REVIEW (non-event/JE keys)
 sb_klip_river_county_020_b_dynasty_tt:0 "[ROOT.GetCountry.GetName] gains #p +5#! Prerogative. [ROOT.GetCountry.GetRuler.GetFullName] gains the [GetCharacterTrait('tactful').GetName] [concept_character_trait] if not already Tactful."

 # TO REVIEW (non-event/JE keys)
 sb_klip_river_county_020_c_tt:0 "#n [SCOPE.sCountry('sb_klip_natal_scope').GetName] will begin a punitive [concept_diplomatic_play] demanding the return of the Zulu-held part of Natal and a [concept_protectorate] over [SCOPE.sCountry('sb_klip_zulu_scope').GetName].#!"

 # TO REVIEW (non-event/JE keys)
 sb_klip_river_county_020_c_dynasty_tt:0 "[ROOT.GetCountry.GetName] gains #p +15#! Prerogative. [ROOT.GetCountry.GetRuler.GetFullName] gains the [GetCharacterTrait('ambitious').GetName] [concept_character_trait] if not already Ambitious."

 # ### REVIEWED ###
 sb_klip_river_county.004.t:0 "A Republic on the Klip"
 sb_klip_river_county.004.d:0 "The Boer settlers of the Klip River country have cast off the authority of Pietermaritzburg and proclaimed a republic under Andries Theodorus Spies. The Zulu court has recognised their cause and called the Zulu regiments to arms. Spies now appeals to the Volksraad for aid, promising that a restored Natalia will accept Bloemfontein's protection if the British are driven from the coast. The question is whether Boer fellowship is worth war with London."
 sb_klip_river_county.004.f:0 "Andries Theodorus Spies addressed a proclamation to the 'Emigrants and Countrymen over Tugela' as British troops entered the Klip River country.\n— #italic 4 December 1847#!"
 sb_klip_river_county.004.a:0 "Stand with the Klip River Republic."
 sb_klip_river_county.004.b:0 "We will not fight Britain for Natal."
 sb_klip_river_county_004_a_tt:0 "[ROOT.GetCountry.GetName] will support [SCOPE.sCountry('sb_klip_county_scope').GetName] and the Zulu Kingdom against [SCOPE.sCountry('sb_klip_natal_scope').GetName] and Britain. If the coalition prevails, a reduced Natalia will become a [concept_protectorate] of [ROOT.GetCountry.GetName]."

 # ### REVIEWED ###
 sb_klip_river_county.030.t:0 "The Mzinyathi Boundary"
 sb_klip_river_county.030.d:0 "The Zulu court has agreed to recognise the Mzinyathi as the northern boundary of the new British colony. The Klip River country will pass under the administration of Pietermaritzburg, and the agreement promises peace along Natal's northern frontier. For the Boer settlers beyond the Tugela, however, the settlement extinguishes the last hope of remaining outside British rule. Many are already preparing to cross the Drakensberg."
 sb_klip_river_county.030.f:0 "'There shall be hence-forward and for ever peace and friendship.'\n— #italic Treaty between King Mpande and Henry Cloete, 5 October 1843#!"
 sb_klip_river_county.030.a:0 "Extend Natal to the Mzinyathi."
 sb_klip_river_county_030_tt:0 "Natal receives #bold Klip River County#!. Natal and Britain will sign a #v 25-year#! [concept_truce] with the Zulu Kingdom."

 # ### REVIEWED ###
 sb_klip_river_county.050.t:0 "The Klip River Insurrection"
 sb_klip_river_county.050.d:0 "The Klip River settlers have repudiated the authority of Pietermaritzburg and established an independent Boer government under Andries Theodorus Spies. The Zulu court has recognised their cause and called the Zulu regiments to arms. What began as a dispute over Natal's northern boundary has become a war for the colony: together, the insurgents and their Zulu allies intend to drive out the British administration and restore a Boer and Zulu control of the region."
 sb_klip_river_county.050.f:0 "Natal's officers warned that the colony possessed too few troops to take the offensive against the Zulu Kingdom, still less against the Zulu and Boer settlers together.\n— After E. F. Boys, #italic Opinion on the Military Situation in Natal, 16 July 1847#!"
 sb_klip_river_county.050.a:0 "The Empire will hold Natal."
 sb_klip_river_county_050_tt:0 "The Zulu Kingdom will begin an #bold Annexation#! [concept_diplomatic_play] against [ROOT.GetCountry.GetName] in support of $KLR$. Britain will support Natal; if Oranje has pledged aid to the boer cause, it will join the Zulu side."

 # ### REVIEWED ###
 sb_klip_river_county.060.t:0 "The Security of Natal"
 sb_klip_river_county.060.d:0 "The Zulu court has rejected the proposed Mzinyathi boundary and refuses to cede the Klip River country. The Executive Council now declares that no agreement can secure Natal while the Zulu Kingdom retains the power to reopen the frontier at will. What began as a dispute over one district will be presented to Britain as proof that lasting peace requires the conquest of the county and subjugation of Zululand."
 sb_klip_river_county.060.f:0 "'He has practised, and is practising, the grossest deceit towards the British Government.'\n— William Harding, #italic on the Klip River affair, 1847#!"
 sb_klip_river_county.060.a:0 "Bring the Zulu's to heel."
 # TO REVIEW (non-event/JE keys)
 sb_klip_river_county_060_tt:0 "[ROOT.GetCountry.GetName] will begin a punitive [concept_diplomatic_play] demanding the return of the Zulu-held part of Natal and a [concept_protectorate] over [SCOPE.sCountry('sb_klip_zulu_scope').GetName]."

 # ### REVIEWED ###
 sb_klip_river_county.070.t:0 "Beyond British Rule"
 sb_klip_river_county.070.d:0 "London has extinguished Natalia and replaced its Volksraad with a colonial government at Pietermaritzburg. The decision not to pursue the Klip River farms is merely the latest reminder to Natal's remaining Boer families that British rule is permanent and their petitions carry little weight. Unwilling to remain beneath the Crown, they are loading their wagons for the Drakensberg."
 sb_klip_river_county.070.f:0 "'The continued emigration of the Boers... has been going on ever since it was taken possession of in 1842 by Her Majesty's troops.'\n— Stanger, Shepstone and Gibb, #italic Report on Natal, 28 December 1847#!"
 sb_klip_river_county.070.a:0 "Oh well..."

 # ### REVIEWED ###
 sb_klip_river_county.075.t:0 "The Klip River Exodus"
 sb_klip_river_county.075.d:0 "The settlement of the Klip River question has brought the last Boer district in Natal under British administration. A colonial magistrate has summoned its inhabitants to swear allegiance to the Crown, but most refuse. Their families, herds and wagons are already gathering for the Drakensberg passes. Pietermaritzburg will keep the land, but not the settlers."
 sb_klip_river_county.075.f:0 "'They seem so perfectly resolved to leave the district.'\n— J. N. Boshof, #italic Letter to Donald Moodie, 20 November 1847#!"
 sb_klip_river_county.075.a:0 "Oh well..."

 # ### REVIEWED ###
 sb_klip_river_county.080.t:0 "The Crown Follows North"
 sb_klip_river_county.080.d:0 "The Zulu court's refusal to cede the Klip river territory has ended with their subjugation under the British Empire. However, to the Colony's remaining Boer families, the victory offers no cause for celebration: the government they once fled in the distant Cape now rules the boundary territories they inhabit, and so once more wagons are already turning towards the Drakensberg."
 sb_klip_river_county.080.f:0 "'They would go further and still further away when our rule followed them.'\n— Anthony Trollope, #italic South Africa, 1878#!"
 sb_klip_river_county.080.a:0 "Britania shall bring order to Zululand."

 # ### REVIEWED ###
 sb_klip_river_county.081.t:0 "The Empire Remains"
 sb_klip_river_county.081.d:0 "The war with the Zulu Kingdom has ended without a victor, and neither side has altered the frontier. For Natal's Boer families, however, the peace settles a more important question: British rule has survived, the Volksraad will not return, and Natalia will not be restored. Those unwilling to remain beneath London's rule are yoking their oxen and turning towards the Drakensberg."
 sb_klip_river_county.081.f:0 "'The continued emigration of the Boers... has been going on ever since it was taken possession of in 1842 by Her Majesty's troops.'\n— Stanger, Shepstone and Gibb, #italic Report on Natal, 28 December 1847#!"
 sb_klip_river_county.081.a:0 "So long..."

 # ### REVIEWED ###
 sb_klip_river_county.082.t:0 "The Wagons from Natal"
 sb_klip_river_county.082.d:0 "The Zulu victory has overthrown British rule in Natal, and no Boer republic has risen in its place. Unwilling to submit to Zulu rule, the remaining Boer families have crossed the Drakensberg with what livestock and possessions they could save. They now ask [ROOT.GetCountry.GetName] for land and protection."
 sb_klip_river_county.082.f:0 "'We had a time of hardship... All was gone.'\n— Daniel Pieter Bezuidenhout, #italic The Pioneer's Narrative#!"
 sb_klip_river_county.082.a:0 "Give them land among us."

 # ### REVIEWED ###
 sb_klip_river_county.090.t:0 "The Crown Beyond the Tugela"
 sb_klip_river_county.090.d:0 "British and colonial forces have crushed the Klip River Republic and defeated the Zulu Kingdom that came to its aid. The separatist government is dissolved, Zululand has been annexed, and Pietermaritzburg now governs the country beyond the Tugela. For the Boer families who took up arms to escape British rule, defeat leaves only submission or another trek across the Drakensberg."
 sb_klip_river_county.090.f:0 "'In this way Natal was nearly cleared of Dutchmen in the year 1848.'\n— Anthony Trollope, #italic South Africa, 1878#!"
 sb_klip_river_county.090.a:0 "Those who will not submit may trek."

 # ### REVIEWED ###
 sb_klip_river_county.091.t:0 "The Klip River Republic Falls"
 sb_klip_river_county.091.d:0 "Colonial forces have broken the Klip River Republic and restored the county to the authority of Pietermaritzburg. The Zulu Kingdom has made a separate peace and survives beyond the Mzinyathi, but its intervention has not saved its Boer ally. Faced once more with British rule, the remaining settlers are abandoning their farms and preparing for the Drakensberg passes."
 sb_klip_river_county.091.f:0 "'The Dutch Boers on the Klip River ... are trekking across the Quattelamba or Drakenberg range of mountains to their friends on the other side.'\n— Sir John Hall, #italic Letter from Grahamstown, 10 January 1848#!"
 sb_klip_river_county.091.a:0 "There will be no republic on the Klip."

