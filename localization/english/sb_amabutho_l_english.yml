l_english:
 law_sb_amabutho_system:0 "Amabutho System"
 law_sb_amabutho_system_desc:0 "Age-regiments bind military service and royal labour to the authority of the ruler and chiefly houses. Men muster as infantry in war, while boys carry supplies, tend cattle, and prepare for service, placing a lasting burden on the homesteads that sustain them."
