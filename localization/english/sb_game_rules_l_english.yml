l_english:
 rule_sb_frontier_ai_behavior:0 "SB Frontier AI History"
 setting_sb_frontier_ai_behavior_dynamic_historical:1 "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_sb_frontier_ai_behavior_dynamic_historical_desc Dynamic-Historical#!#!"
 setting_sb_frontier_ai_behavior_dynamic_historical_desc:0 "Enable dated AI-against-AI frontier wars, historical force preservation, and the configured dynamic outcome dice. This rule never supplies assistance against a player."
 setting_sb_frontier_ai_behavior_strict_historical:1 "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_sb_frontier_ai_behavior_strict_historical_desc Strict-Historical#!#!"
 setting_sb_frontier_ai_behavior_strict_historical_desc:0 "Enable AI-against-AI frontier scripting with deterministic historical choices and outcomes where specified. This rule never supplies assistance against a player."
 setting_sb_frontier_ai_behavior_off:1 "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_sb_frontier_ai_behavior_off_desc Disabled#!#!"
 setting_sb_frontier_ai_behavior_off_desc:0 "Disable AI-against-AI frontier musters, modifiers, force floors, buildouts, material grants, outcome dice, and dated war scripting."
 rule_sb_frontier_player_challenge:0 "SB Frontier Player Challenge"
 setting_sb_frontier_player_challenge_disabled:1 "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_sb_frontier_player_challenge_disabled_desc Disabled#!#!"
 setting_sb_frontier_player_challenge_disabled_desc:0 "Default. AI frontier opponents receive no artificial assistance merely because they face a player."
 setting_sb_frontier_player_challenge_enabled:1 "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_sb_frontier_player_challenge_enabled_desc Enabled#!#!"
 setting_sb_frontier_player_challenge_enabled_desc:0 "Challenge mode. AI frontier opponents facing a player may receive historical force floors, musters, combat modifiers, mobilization support, and other explicitly scripted assistance. Player-facing assistance replaces the AI-History route and never stacks with it."
 rule_sb_ai_economy_helpers:0 "SB AI Economy Helpers"
 setting_sb_ai_economy_helpers_enabled:1 "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_sb_ai_economy_helpers_enabled_desc Enabled#!#!"
 setting_sb_ai_economy_helpers_enabled_desc:0 "Give selected Southern African AI countries small milestone buildings in the early game, reflecting that the AI struggles to develop these low-population frontier economies reliably."
 setting_sb_ai_economy_helpers_disabled:1 "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_sb_ai_economy_helpers_disabled_desc Disabled#!#!"
 setting_sb_ai_economy_helpers_disabled_desc:0 "Disable Spes Bona's AI economy milestone helpers."
