 sb_zululand_boer_commitment_bar_low:0 "Uncommitted"
 sb_zululand_boer_commitment_bar_high:0 "Committed"

 # ### TO REVIEW ###
 je_sb_zululand_increase_policing_button:0 "Increase Colonial Policing"
 # TO REVIEW (non-event/JE keys)
 je_sb_zululand_increase_policing_button_desc:0 "Commit #n 100#! [concept_authority] to reduce uSuthu target [concept_activism] by #v 20 percentage points#! while policing is active."
 je_sb_zululand_increase_policing_possible_tt:0 "We have at least #v 100#! [concept_authority] available."
 je_sb_zululand_end_policing_button:0 "Relax Colonial Policing"
 je_sb_zululand_end_policing_button_desc:0 "End the additional policing effort and recover its [concept_authority] cost."
 je_sb_zululand_unload_refugees_button:0 "Unload Zulu Refugees"
 je_sb_zululand_unload_refugees_button_desc:0 "Return Zulu peasant households to Zululand. An open indenture programme continues."
 je_sb_zululand_unload_refugees_possible_tt:0 "Natal has Zulu peasant households and the Shepstone System has been in force for at least #v 25 years#!. Zululand holds its full state and the settlement remains open to intervention."
 # TO REVIEW (non-event/JE keys)
 je_sb_zululand_unload_refugees_effect_tt:0 "Move #v 20%#! of Natal’s Zulu peasant households to Zululand."
 je_sb_zululand_return_claimant_button:0 "Permit the Claimant’s Return"
 # TO REVIEW (non-event/JE keys)
 je_sb_zululand_return_claimant_button_desc:0 "Permit the surviving members of the deposed royal house, including their children, to come home to Zululand."
 # TO REVIEW (non-event/JE keys)
 je_sb_zululand_return_claimant_possible_tt:0 "The contest is open to intervention and a surviving member of the royal household is in exile."
 # TO REVIEW (non-event/JE keys)
 je_sb_zululand_return_claimant_effect_tt:0 "The whole household returns. An eligible adult speaks for the uSuthu as an [concept_agitator]. A child retains the right to the throne and can be restored under a regent."
 je_sb_zululand_sponsor_usuthu_button:0 "Sponsor the uSuthu"
 # TO REVIEW (non-event/JE keys)
 je_sb_zululand_sponsor_usuthu_button_desc:0 "Spend #n £250#! each week to increase uSuthu #tooltippable #tooltip:[GetPlayer.GetTooltipTag],political_movement_pop_attraction_mult_desc Pop Attraction#!#! by #v 50%#! and add #v 2#! Boer Commitment each month."
 je_sb_zululand_end_usuthu_sponsorship_button:0 "End uSuthu Sponsorship"
 je_sb_zululand_end_usuthu_sponsorship_button_desc:0 "End the weekly subsidy and its monthly influence."
 je_sb_zululand_sanction_volunteers_button:0 "Sanction Boer Volunteers"
 # TO REVIEW (non-event/JE keys)
 je_sb_zululand_sanction_volunteers_button_desc:0 "Expose Transvaal servicemen to #n +1%#! Mortality, raising uSuthu target [concept_activism] by #v 20 percentage points#! and adding #v 3#! Boer Commitment each month."
 je_sb_zululand_end_volunteers_button:0 "Recall the Volunteers"
 je_sb_zululand_end_volunteers_button_desc:0 "End the volunteer campaign and its military cost."

 # ### TO REVIEW ###
 sb_zululand_chiefdoms_subject_dependence:0 "The Thirteen Chiefdoms"
 sb_zululand_chiefdoms_subject_dependence_desc:0 "Natal’s partition steadily subordinates the appointed chiefdoms to colonial authority."
 # TO REVIEW (non-event/JE keys)
 # TO REVIEW (non-event/JE keys)
 sb_zululand_chiefdom_reserves:0 "Chiefly Reserves"
 sb_zululand_chiefdom_reserves_desc:0 "Appointed chiefs administer protected subsistence land while collecting a modest hut tax for the colonial settlement."
 # TO REVIEW (non-event/JE keys)
 sb_zululand_zibhebhu_incorporation_legacy:0 "Legacy of the Loyalist Chiefs"
 # TO REVIEW (non-event/JE keys)
 sb_zululand_zibhebhu_incorporation_legacy_desc:0 "The appointed chiefs’ administration accelerates the incorporation of Zululand."
 sb_zululand_crown_incorporation_legacy:0 "Legacy of the Restored Crown"
 sb_zululand_crown_incorporation_legacy_desc:0 "Co-operation with the restored royal authority eases, but does not eliminate, the work of incorporating Zululand."
 sb_zululand_policing_cost:0 "Colonial Policing in Zululand"
 # TO REVIEW (non-event/JE keys)
 sb_zululand_policing_cost_desc:0 "Magistrates and mounted police contain royalist organising in Zululand."
 sb_zululand_usuthu_sponsorship_cost:0 "Sponsoring the uSuthu"
 sb_zululand_usuthu_sponsorship_cost_desc:0 "Transvaal is financing royalist organisation in Zululand."
 sb_zululand_boer_volunteer_mortality:0 "Boer Volunteers in Zululand"
 sb_zululand_boer_volunteer_mortality_desc:0 "Servicemen are crossing the frontier to fight for the uSuthu cause."

 # ### TO REVIEW ###
 sb_zulu_chiefdoms:0 "Thirteen Chiefdoms"
 sb_zulu_chiefdoms_action_name:0 "Thirteen Chiefdoms"
 sb_zulu_chiefdoms_action_propose_name:0 "Establish the Thirteen Chiefdoms"
 sb_zulu_chiefdoms_desc:0 "A locked colonial settlement dividing Zululand among appointed chiefs while its international situation remains unresolved."
 sb_zulu_chiefdoms_pact_desc:0 "$sb_zulu_chiefdoms_desc$"
 sb_zulu_chiefdoms_action_notification_name:0 "The Thirteen Chiefdoms Established"
 sb_zulu_chiefdoms_action_notification_desc:0 "Zululand has been placed under the Thirteen Chiefdoms settlement."
 sb_zulu_chiefdoms_action_break_name:0 "End the Thirteen Chiefdoms"
 sb_zulu_chiefdoms_action_notification_break_name:0 "The Thirteen Chiefdoms Ended"
 sb_zulu_chiefdoms_action_notification_break_desc:0 "The Thirteen Chiefdoms settlement has ended."
 subject_type_sb_zulu_chiefdoms:0 "@puppet! $sb_zulu_chiefdoms$"
 subject_type_sb_zulu_chiefdoms_no_icon:0 "$sb_zulu_chiefdoms$"

 # ### TO REVIEW ###
 sb_zululand_settlement.001.t:0 "The Government of Conquered Zululand"
 sb_zululand_settlement.001.d:0 "The independent Zulu kingdom has fallen, but conquest has not answered who will govern its country. Natal’s officials argue that a frontier so closely bound to their colony should be placed beneath Pietermaritzburg. Others in London warn that handing over the whole settlement would entangle Natal in a costly and dangerous native policy."
 sb_zululand_settlement.001.f:0 "In Pietermaritzburg, colonial secretaries and labour agents already pored over maps of the Tugela crossings, pressing for a settlement that would answer to Natal’s magistrates. At Whitehall, treasury clerks stacked the dispatches from the Cape beside the garrison accounts, counting what another frontier colony would cost Westminster if Natal’s plans miscarried."
 sb_zululand_settlement.001.a:0 "Place Zululand beneath Natal."
 sb_zululand_settlement.001.a.tt:0 "Zululand becomes a [concept_protectorate] of Natal."
 sb_zululand_settlement.001.a.tt.government:0 "Natal chooses how Zululand will be governed."
 sb_zululand_settlement.001.b:0 "Administer Zululand from Britain."
 sb_zululand_settlement.001.b.tt:0 "Britain annexes [GetStateRegion('STATE_ZULULAND').GetName]."
 sb_zululand_settlement.001.b.tt.radicals:0 "#n 25%#! of Zulu [Concept('concept_pop', '$concept_pops|q$')] in British territory become more [concept_radical]."
 sb_zululand_settlement.001.b.tt.movement:0 "A Zulu National Movement forms in British territory."

 # ### TO REVIEW ###
 sb_zululand_settlement.110.t:0 "A Skirmish among the Chiefdoms"
 sb_zululand_settlement.110.d.zibhebhu:0 "A clash between rival retainers has ended in a local victory for the chiefly adherents. Their clients present the affair as proof that the appointed settlement alone can preserve order."
 sb_zululand_settlement.110.d.usuthu:0 "A clash between rival retainers has rallied neighbouring homesteads behind the uSuthu. Royal messengers present the affair as proof that partition has brought only disorder."
 sb_zululand_settlement.110.a:0 "The balance has shifted."
 sb_zululand_settlement.110.a.royals:0 "uSuthu target [concept_activism] rises by #v 5 percentage points#!, decaying over #v one year#!."
 sb_zululand_settlement.110.a.chiefs:0 "amaKhosi target [concept_activism] rises by #v 5 percentage points#!, decaying over #v one year#!."

 # ### TO REVIEW ###
 sb_zululand_settlement.112.t:0 "A Chief Changes Allegiance"
 sb_zululand_settlement.112.d.zibhebhu:0 "[SCOPE.sCharacter('sb_zululand_defector').GetFullName] has compared conditions on either side of the Tugela and chosen the chiefly settlement. Natal’s treatment of its Zulu population now serves as an argument for collaboration."
 sb_zululand_settlement.112.d.usuthu:0 "[SCOPE.sCharacter('sb_zululand_defector').GetFullName] has rejected the chiefly settlement and declared for the royal cause. Natal’s treatment of its own Zulu population has made royalist warnings difficult to dismiss."
 sb_zululand_settlement.112.a:0 "[SCOPE.sCharacter('sb_zululand_defector').GetHerHis|U] followers shift with [SCOPE.sCharacter('sb_zululand_defector').GetHerHim]."
 sb_zululand_settlement.112.a.royals:0 "[SCOPE.sCharacter('sb_zululand_defector').GetFullName] declares for the uSuthu."
 sb_zululand_settlement.112.a.chiefs:0 "[SCOPE.sCharacter('sb_zululand_defector').GetFullName] declares for the amaKhosi."

 # ### TO REVIEW ###
 sb_zululand_settlement.115.t:0 "Volunteers Cross into Zululand"
 sb_zululand_settlement.115.d:0 "Boer volunteers and their families have crossed from the Transvaal into Zululand to join the uSuthu. Five hundred people have gone in answer to the royal appeal."
 sb_zululand_settlement.115.f:0 "The muster roll gives a name for every man who brought a rifle. Beside some names the clerk has entered a wagon as well. Those men have brought the household with them, trusting that the royal party will honour its promise of land."
 sb_zululand_settlement.115.a:0 "Let their names stand on the roll."
 sb_zululand_settlement.115.a.tt:0 "#v 500#! people from Boer [GetPopType('soldiers').GetName] households have settled in Zululand."
 sb_zululand_settlement.115.a.tt.commitment:0 "The volunteers have earned #v 20#! Boer Commitment, up to #v 100#!."
 sb_zululand_settlement.115.a.tt.activism:0 "The volunteers raise uSuthu target [concept_activism] by #v 5 percentage points#!. This effect decays over #v one year#!."

 # ### TO REVIEW ###
 sb_zululand_settlement.120.t:0 "The Loyalist Chiefs Prevail"
 sb_zululand_settlement.120.d:0 "The chiefly settlement has prevailed. Its leaders now speak for Zululand’s government, while the royal opposition must reckon with their authority. Natal’s officials see an opportunity to bind the country more closely to their administration."
 sb_zululand_settlement.120.f:0 "At the magistrate’s court, the royal praise-names vanished from the messengers’ addresses. Disputes over cattle, hut tax and passes now travelled through appointed chiefs whose warrants carried Pietermaritzburg’s stamp as much as their own."
 sb_zululand_settlement.120.t.extinction:0 "The amaKhosi Prevail"
 sb_zululand_settlement.120.d.extinction:0 "The last member of the deposed royal house has died. With no one left for the uSuthu to restore, the amaKhosi council will govern Zululand."
 sb_zululand_settlement.120.d.confirmation:0 "The Boer republic founded under Hamu’s bargain already holds its land. Natal has confirmed the chiefly council in the remaining districts of Zululand."
 sb_zululand_settlement.120.a:0 "Recognise the chiefly settlement."
 sb_zululand_settlement.120.a.tt:0 "Zululand remains governed under [GetLawType('law_sb_federated_chiefdoms').GetName] and [GetLawType('law_sb_chiefly_council').GetName]."
 sb_zululand_settlement.120.a.tt.subject:0 "Zululand has become an ordinary [concept_puppet] of Natal."
 sb_zululand_settlement.120.a.tt.reunion:0 "When the civil war ends, the council will govern the reunited districts as Natal’s [concept_puppet]."
 sb_zululand_settlement.120.a.tt.interventions:0 "Foreign intervention in the chiefdoms has ended."
 sb_zululand_settlement.120.a.tt.reward:0 "Natal holds a permanent #p +50%#! incorporation speed bonus in any part of [GetStateRegion('STATE_ZULULAND').GetName] it owns."

 # ### TO REVIEW ###
 sb_zululand_settlement.121.t:0 "The Crown Restored"
 sb_zululand_settlement.121.d:0 "The appointed settlement can no longer command the country. The uSuthu have restored a dynastic claimant to the Zulu Crown, whose authority now rests upon the royal following rather than Natal’s thirteen chiefs."
 sb_zululand_settlement.121.f:0 "The royal salute travelled from ridge to ridge along the White Umfolozi before the border magistrates received their formal dispatches. Regiments and headmen who had ignored the thirteen residencies now gathered once more at the king’s homestead."
 sb_zululand_settlement.121.a:0 "Recognise the restored Crown."
 sb_zululand_settlement.121.a.tt:0 "The royal claimant has taken the throne under [GetLawType('law_monarchy').GetName] and [GetLawType('law_autocracy').GetName]."
 sb_zululand_settlement.121.a.tt.subject:0 "Zululand has become an ordinary [concept_puppet] of Natal."
 sb_zululand_settlement.121.a.tt.interventions:0 "Foreign intervention in the chiefdoms has ended."
 sb_zululand_settlement.121.a.tt.reward:0 "Natal holds a permanent #p +10%#! incorporation speed bonus in any part of [GetStateRegion('STATE_ZULULAND').GetName] it owns."
 sb_zululand_settlement.121.a.tt.promise:0 "Any Boer territorial promise earned during the struggle has been honoured."

 # ### TO REVIEW ###
 sb_zululand_settlement.130.t:0 "The Annexation of Zululand"
 sb_zululand_settlement.130.d:0 "The incorporation of Zululand is complete. The temporary settlements through which Natal governed the conquered kingdom—including any remaining Chiefly Reserves—can now give way to ordinary provincial administration."
 sb_zululand_settlement.130.a:0 "One administration now governs the country."

 # ### TO REVIEW ###
 sb_zululand_settlement.200.t:0 "The Nieuwe Republiek"
 sb_zululand_settlement.200.d:0 "Boer support for the restored Crown has been paid in land. The burghers around Vryheid have proclaimed a republic. Their commandant governs it under Transvaal’s protection."
 sb_zululand_settlement.200.d.rebellion:0 "The restored Zulu Crown has honoured its bargain with Pretoria before the struggle for Zululand is decided. The northern districts now form the Nieuwe Republiek, with its own commandant and Transvaal as its protector."
 sb_zululand_settlement.200.f:0 "The grants bore the names of men who had crossed the border with rifles. A field-cornet read them aloud beneath the flag of a republic that had not existed when they rode out."
 sb_zululand_settlement.200.a:0 "Watch the new republic from Pretoria."
 sb_zululand_settlement.200.b:0 "Lead the Nieuwe Republiek."

 # ### TO REVIEW ###
 sb_zululand_settlement.210.t:0 "The Imperial Boundary Demand"
 sb_zululand_settlement.210.d:0 "The imperial authorities reject the Nieuwe Republiek’s claim to the coastal districts and demand that the greater concession be cut back to Vryheid. Acceptance preserves a reduced republic; refusal stakes the whole settlement upon a confrontation with Natal and Britain."
 sb_zululand_settlement.210.f:0 "The survey line drawn in the imperial memorandum cut the republic cleanly away from St Lucia Bay and the coast. To Vryheid’s leaders, the papers left little doubt: Britain and Natal would tolerate grazing farms around Vryheid, not a Boer harbour on the Indian Ocean."
 sb_zululand_settlement.210.a:0 "Accept the reduced boundary."
 sb_zululand_settlement.210.a.tt:0 "The three coastal districts return to Zululand, leaving a reduced Nieuwe Republiek in the two inland districts around Vryheid with at least one Livestock Ranch."
 sb_zululand_settlement.210.b:0 "Refuse the imperial demand."
 sb_zululand_settlement.210.dismiss:0 "File the dispatch."
 sb_zululand_settlement.210.b.protectorate_tt:0 "Transvaal defends the Nieuwe Republiek in the boundary confrontation. Zululand and the Nieuwe Republiek each press #bold Return State#! demands for the other’s districts in [GetStateRegion('STATE_ZULULAND').GetName]."
 sb_zululand_settlement.210.b.tt:0 "If Transvaal is independent, the Nieuwe Republiek appeals to Pretoria for defence; otherwise confrontation follows directly, with both Zululand and the Nieuwe Republiek pressing #bold Return State#! demands."

 # ### TO REVIEW ###
 sb_zululand_settlement.211.t:0 "The Republic Calls for Aid"
 sb_zululand_settlement.211.d:0 "The Nieuwe Republiek has refused the imperial boundary and now invokes its compact with Transvaal. Accepting commits Pretoria to join the republic’s defence and bind it afterwards as a Confederal Partner. Refusal leaves the small republic to meet Natal and Britain alone."
 sb_zululand_settlement.211.f:0 "On the Raadzaal table lay the old frontier compact beside the latest dispatch from Vryheid. While the land was only an expectation in Zululand, the pledge had been easy to approve; now every burgher member weighed whether Pretoria could risk a confrontation with the British Empire to keep those farms."
 sb_zululand_settlement.211.a:0 "The compact binds us."
 sb_zululand_settlement.211.a.tt:0 "Transvaal enters the boundary confrontation as an ally of the Nieuwe Republiek, while the agreed war goals remain held by Natal, Zululand or the Nieuwe Republiek as appropriate. Once the confrontation concludes, the Nieuwe Republiek becomes Transvaal’s [Concept('concept_sb_boer_confederal_partner', '$sb_boer_confederal_partner|q$')]."
 sb_zululand_settlement.211.b:0 "We will not risk the republic."
 sb_zululand_settlement.211.b.tt:0 "Relations with the Nieuwe Republiek fall by #n 50#! and any Defensive Pact is broken. The Nieuwe Republiek remains principal in the confrontation."

 # ### TO REVIEW ###
 sb_zululand_settlement.230.t:0 "The Imperial Boundary Demand"
 sb_zululand_settlement.230.d:0 "The Zulu rebellion has been defeated, leaving the greater Nieuwe Republiek’s concession surrounded by Natalian rule. The imperial authorities now demand that the coastal districts be surrendered directly to Natal. Acceptance preserves a reduced republic around Vryheid; refusal places the republic itself against Natal’s claim of annexation."
 sb_zululand_settlement.230.f:0 "The land title had been sealed by a Zulu king whose government had already fallen. In Pietermaritzburg’s dispatch, the coastal districts were treated not as Boer territory to be purchased, but as Crown land awaiting survey."
 sb_zululand_settlement.230.a:0 "Accept the reduced boundary."
 sb_zululand_settlement.230.a.tt:0 "The three disputed coastal districts pass directly to Natal, leaving the Nieuwe Republiek with the two inland districts around Vryheid and at least one Livestock Ranch."
 sb_zululand_settlement.230.b:0 "Refuse the imperial demand."
 sb_zululand_settlement.230.b.protectorate_tt:0 "Transvaal defends the Nieuwe Republiek in the boundary confrontation. Natal presses #bold Annex Nieuwe Republiek#!, and the republic presses #bold Return State#! on Natal’s districts in [GetStateRegion('STATE_ZULULAND').GetName]."
 sb_zululand_settlement.230.b.tt:0 "If Transvaal is independent, the Nieuwe Republiek appeals to Pretoria for defence; otherwise confrontation follows directly, with Natal pressing #bold Annex Nieuwe Republiek#! and the Nieuwe Republiek pressing #bold Return State#! on Natalian Zululand."

 # ### TO REVIEW ###
 sb_zululand_settlement.231.t:0 "The Boundary Is Reduced"
 sb_zululand_settlement.231.d_direct:0 "The Nieuwe Republiek has accepted the imperial boundary. Natal’s officials have taken possession of the three disputed districts, leaving the republic its inland seat around Vryheid and the means to sustain its remaining burghers."
 sb_zululand_settlement.231.d_crown:0 "The Nieuwe Republiek has accepted the imperial boundary. Natal’s officials have restored the three disputed districts to the Zulu Crown, leaving the republic its inland seat around Vryheid and the means to sustain its remaining burghers."
 sb_zululand_settlement.231.f:0 "Survey pegs and signed boundary protocols now mark the line the republic chose to yield rather than contest in arms."
 sb_zululand_settlement.231.a:0 "The reduced boundary will stand."

 # ### TO REVIEW ###
 sb_zululand_settlement.220.t:0 "Vryheid Looks to Pretoria"
 sb_zululand_settlement.220.d:0 "The reduced Nieuwe Republiek has survived the imperial cutback, but its government sees little future in permanent isolation. Its Volksraad has resolved to seek union with Transvaal."
 sb_zululand_settlement.220.a:0 "Send the petition north."

 # ### TO REVIEW ###
 sb_zululand_settlement.221.t:0 "The Vryheid Petition"
 sb_zululand_settlement.221.d:0 "Delegates from the reduced Nieuwe Republiek ask that their territory and institutions be admitted into Transvaal. Acceptance would complete the inland union promised by their old frontier compact."
 sb_zululand_settlement.221.a:0 "Admit Vryheid to the republic."
 sb_zululand_settlement.221.a.tt:0 "Transvaal annexes the reduced Nieuwe Republiek."
 sb_zululand_settlement.221.b:0 "Let the republic remain separate."
 sb_zululand_settlement.221.b.tt:0 "The Nieuwe Republiek keeps its own government."

 # ### TO REVIEW ###
 dp_sb_nrp_boundary_confrontation:0 "The Nieuwe Republiek Boundary"
 dp_sb_nrp_boundary_confrontation_desc:0 "The surviving governments contest the Nieuwe Republiek’s frontier and the political future of its territory in Zululand."
 dp_sb_nrp_boundary_confrontation_tooltip:0 "Open a locked diplomatic play over the Nieuwe Republiek’s boundary in Zululand."

 # TO REVIEW (non-event/JE keys)
 sb_zululand_boer_commitment_bar_tooltip:0 "#header Boer Commitment#!\nOngoing interventions contribute #v [GetPlayer.MakeScope.ScriptValue('sb_zululand_monthly_commitment')|=0]#!/month before the #v 100#!-point cap.\n[GetPlayer.MakeScope.GetScriptValueDesc('sb_zululand_monthly_commitment')]\n\nAccepting the appeal grants #v +20#! once. At #v 100#!, the bargain is binding; ongoing support still affects the movement. A royalist victory honours the bargain under its territorial conditions."

 # TO REVIEW (non-event/JE keys)
 sb_zululand_chiefdom_balance_bar_tooltip:0 "#header uSuthu Activism#!\n[concept_activism] measures mobilisation, while [concept_political_movement_support] measures the movement’s backing.\n\n[GetGlobalVariable('sb_zululand_live_zul_scope').GetCountry.GetCustom('sb_chiefs_escalation_rule')]\n\nPrerogative and Institutional Reach do not determine this contest’s outcome."
 # TO REVIEW (non-event/JE keys)
 sb_zululand_drift_sponsorship:0 "active Transvaal sponsorship"
 # TO REVIEW (non-event/JE keys)
 sb_zululand_drift_volunteers:0 "active Boer volunteers"
 # TO REVIEW (non-event/JE keys)
 # TO REVIEW (non-event/JE keys)
 sb_usuthu_live_readout:0 "uSuthu: #v [GetPlayer.MakeScope.ScriptValue('sb_usuthu_support')|%0]#! support · #v [GetPlayer.MakeScope.ScriptValue('sb_usuthu_activism')|%0]#! activism\namaKhosi: #v [GetPlayer.MakeScope.ScriptValue('sb_zululand_chiefly_support')|%0]#! support · #v [GetPlayer.MakeScope.ScriptValue('sb_zululand_chiefly_activism')|%0]#! activism"
 # TO REVIEW (non-event/JE keys)
 # TO REVIEW (non-event/JE keys)
 concept_sb_zulu_chiefdoms_desc:0 "The Thirteen Chiefdoms are a puppet-category subject governed by Federated Chiefdoms and a Chiefly Council. Natal supports the appointed chiefs, while Transvaal can aid the uSuthu royal party. A ten-year review recognises a surviving chiefly settlement; completed royal restoration ends it earlier. Mixed institutions and unresolved constitutional conflict delay the review. Both results become ordinary puppets. Liberty Desire follows the normal subject rules."
 # TO REVIEW (non-event/JE keys)
