 je_sb_zululand_support_chiefs_button_desc:0 "Spend #n £500#! each week to increase amaKhosi pop attraction by #v 50%#! while support remains active."

 # ### TO REVIEW ###
 sb_zululand_settlement.116.t:0 "A Chief's Allegiance"
 sb_zululand_settlement.116.d:0 "[SCOPE.sCharacter('sb_chief_bribe_candidate').GetFullName] has committed to neither constitutional party. A payment of #bold @money![ROOT.GetCountry.MakeScope.Var('sb_zululand_bribe_cost_var').GetValue|0]#! will secure this chief’s support for our preferred settlement."
 sb_zululand_settlement.116.a:0 "Secure the chief's support."
 sb_zululand_settlement.116.a.tt:0 "Pay #n @money![ROOT.GetCountry.MakeScope.Var('sb_zululand_bribe_cost_var').GetValue|0]#!. Gold reserves: #v @money![ROOT.GetCountry.GetGoldReserves|0]#!. Amount to borrow: #n @money![ROOT.GetCountry.MakeScope.ScriptValue('sb_zululand_bribe_shortfall')|0]#!."
 sb_zululand_settlement.116.a.tt.chiefs:0 "[SCOPE.sCharacter('sb_chief_bribe_candidate').GetFullName] declares for the amaKhosi."
 sb_zululand_settlement.116.a.tt.royals:0 "[SCOPE.sCharacter('sb_chief_bribe_candidate').GetFullName] declares for the uSuthu."
 sb_zululand_settlement.116.b:0 "Keep our funds."

 # ### TO REVIEW ###
 sb_zululand_settlement.122.t:0 "The Chiefly Settlement Prevails"
 sb_zululand_settlement.122.d:0 "The amaKhosi have secured the chiefly constitution. The loose federation survives as Zululand's government, and Natal recognises its authority. The settlement closes this contest, though the court's politics will continue."
 sb_zululand_settlement.122.a:0 "Let the council govern."

 # ### TO REVIEW ###
 sb_zululand_settlement.123.t:0 "The Royal Constitution Restored"
 sb_zululand_settlement.123.d:0 "The royal house again commands the government of Zululand. Monarchy and Autocracy replace the appointed partition, while the kingdom remains a subject of Natal. Obligations undertaken to win this struggle must now be honoured."
 sb_zululand_settlement.123.a:0 "The Crown will govern again."

