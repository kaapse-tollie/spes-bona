 # TO REVIEW (non-event/JE keys)
 sb_usuthu_live_readout:0 "uSuthu: #v [GetPlayer.MakeScope.ScriptValue('sb_usuthu_support')|%0]#! support · #v [GetPlayer.MakeScope.ScriptValue('sb_usuthu_activism')|%0]#! activism\namaKhosi: #v [GetPlayer.MakeScope.ScriptValue('sb_zululand_chiefly_support')|%0]#! support · #v [GetPlayer.MakeScope.ScriptValue('sb_zululand_chiefly_activism')|%0]#! activism"
 # TO REVIEW (non-event/JE keys)
 # TO REVIEW (non-event/JE keys)
 concept_sb_zulu_chiefdoms_desc:0 "The Thirteen Chiefdoms are a puppet-category subject governed by Federated Chiefdoms and a Chiefly Council. Natal supports the appointed chiefs, while Transvaal can aid the uSuthu royal party. A ten-year review recognises a surviving chiefly settlement; completed royal restoration ends it earlier. Mixed institutions and unresolved constitutional conflict delay the review. Both results become ordinary puppets. Liberty Desire follows the normal subject rules."
 # TO REVIEW (non-event/JE keys)
 ideology_sb_usuthu:0 "uSuthu Absolutist"
 # TO REVIEW (non-event/JE keys)
 ideology_sb_usuthu_desc:0 "Royalist supporters seek to replace the appointed chiefdoms with Monarchy and Autocracy."
 # TO REVIEW (non-event/JE keys)
 concept_sb_zulu_chiefdoms:0 "Thirteen Chiefdoms"
 # TO REVIEW (non-event/JE keys)
 sb_usuthu_volunteers:0 "Boer Volunteers"
 # TO REVIEW (non-event/JE keys)
 je_sb_zululand_support_chiefs_button:0 "Support Loyalist Chiefs"
 # TO REVIEW (non-event/JE keys)
 sb_usuthu_influence_tooltip:0 "#header Influencing the constitutional contest#!\nAttraction controls recruitment; activism measures mobilisation.\n\n#bold Royal recruitment from interventions:#!\n[GetPlayer.MakeScope.GetScriptValueDesc('sb_usuthu_action_attraction')]\n#bold Chiefly recruitment from interventions:#!\n[GetPlayer.MakeScope.GetScriptValueDesc('sb_zululand_chiefly_action_attraction')]\n#bold Royal activism pressure from interventions:#!\n[GetPlayer.MakeScope.GetScriptValueDesc('sb_usuthu_action_activism')]\n\nSponsorship recruits royal supporters; Support Loyalist Chiefs recruits amaKhosi supporters. Volunteers and policing change activism pressure. Returning the claimant supplies an agitator; bribery changes the displayed neutral chief's constitutional allegiance. Native economic dependence, subject payments and political lobbies continue to affect Liberty Desire separately."
 # TO REVIEW (non-event/JE keys)
 sb_usuthu_policing:0 "Colonial Policing"
 # TO REVIEW (non-event/JE keys)
 sb_zululand_chief_patronage_cost:0 "Supporting the Loyalist Chiefs"
 # TO REVIEW (non-event/JE keys)
 sb_usuthu_sponsorship:0 "Transvaal Sponsorship"
