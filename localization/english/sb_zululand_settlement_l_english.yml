 # ### TO REVIEW ###
 je_sb_zululand_chiefdoms:0 "The Thirteen Chiefdoms"
 je_sb_zululand_chiefdoms_reason:0 "Natal has divided Zululand among appointed chiefs. Royal and chiefly followings contest its constitutional settlement. Natal and Transvaal can influence recruitment, activism and the allegiance of individual chiefs.\n\nPeaceful consolidation requires the complete constitutional settlement, Prerogative of at least #v 50#!, and opposing support below #v 5%#! or an accepted accommodation. A constitutional coup or ideological civil-war victory also settles the contest. There is no deadline.\n\nBoth outcomes become ordinary puppets. Annexation remains subject to ordinary diplomacy."

 je_sb_zululand_chiefdoms_status_zibhebhu:0 "Federated Chiefdoms govern Zululand. The Loyalist Chiefs must consolidate their authority or defeat a constitutional challenge."
 je_sb_zululand_chiefdoms_status_usuthu:0 "The royal constitution governs Zululand. The Crown must consolidate its authority or defeat a constitutional challenge."
 je_sb_zululand_chiefdoms_status_committed:0 "Transvaal has made a binding commitment to the uSuthu cause."

