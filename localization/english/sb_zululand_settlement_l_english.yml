l_english:
 # ### TO REVIEW ###
 NRP:0 "Nieuwe Republiek"
 NRP_ADJ:0 "Nieuwe Republikein"
 NRP_FLAVOR_TEXT:0 "A Boer republic founded in north-western Zululand through an alliance with the uSuthu royal house."
 Mandla:0 "Mandla"

 # ### TO REVIEW ###
 je_sb_zululand_chiefdoms:0 "The Thirteen Chiefdoms"
 je_sb_zululand_chiefdoms_reason:0 "Natal has broken the Zulu kingdom into chiefdoms, but the royal house still commands followers. The appointed chiefs must make the settlement endure; the uSuthu seek to restore the Crown.\n\nNatal can support the chiefs, restrain mobilisation, win over uncommitted houses or permit the royal household to return. Transvaal can strengthen the royal party in exchange for its territorial promise. Inspect the great houses to see who speaks for each following.\n\nThe settlement is reviewed after #v ten years#!. Federated Chiefdoms and a Chiefly Council must still govern a Zululand subject to Natal. A mixed constitution or an unresolved constitutional conflict delays that decision. Royal restoration can settle the contest sooner. If the last member of the deposed royal house dies, the amaKhosi prevail."

 je_sb_zululand_chiefdoms_extinction_header:0 "The amaKhosi Prevail"
 je_sb_zululand_chiefdoms_extinction_conclusion:0 "The last member of the deposed royal house has died. With no sovereign left for the uSuthu to restore, the chiefly council governs Zululand."

 je_sb_zululand_chiefdoms_status_zibhebhu:0 "The Loyalist Chiefs seek to preserve the partition until its ten-year review."
 je_sb_zululand_chiefdoms_status_usuthu:0 "The royal party seeks to reunite Zululand beneath the Crown."
 je_sb_zululand_chiefdoms_status_committed:0 "Transvaal has made a binding commitment to the uSuthu cause."

