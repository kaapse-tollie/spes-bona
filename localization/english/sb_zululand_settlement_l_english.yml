 # TO REVIEW (non-event/JE keys)
 sb_usuthu_influence_tooltip:0 "#header Influencing the constitutional contest#!\nPop Attraction governs recruitment; [concept_activism] measures mobilisation.\n\n#bold Royal recruitment from interventions:#!\n[GetPlayer.MakeScope.GetScriptValueDesc('sb_usuthu_action_attraction')]\n#bold Chiefly recruitment from interventions:#!\n[GetPlayer.MakeScope.GetScriptValueDesc('sb_zululand_chiefly_action_attraction')]\n#bold Royal activism pressure from interventions:#!\n[GetPlayer.MakeScope.GetScriptValueDesc('sb_usuthu_action_activism')]\n\nSponsorship recruits royal supporters; Support Loyalist Chiefs recruits amaKhosi supporters. Volunteers and policing change target activism pressure. A returning royal household can supply an adult [concept_agitator]. Bribery changes the displayed neutral chief’s constitutional allegiance. Ordinary economic dependence, subject payments and political lobbies continue to affect [concept_liberty_desire] separately."
