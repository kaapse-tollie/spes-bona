l_english:
 # ### TO REVIEW ###
 NRP:0 "Nieuwe Republiek"
 NRP_ADJ:0 "Nieuwe Republikein"
 NRP_FLAVOR_TEXT:0 "A Boer republic founded in northwestern Zululand through an alliance with the uSuthu royal house."
 Mandla:0 "Mandla"

 # ### TO REVIEW ###
 je_sb_zululand_chiefdoms:0 "The Thirteen Chiefdoms"
 je_sb_zululand_chiefdoms_reason:0 "Natal has broken the Zulu kingdom into thirteen appointed chiefdoms. Zibhebhu's clients compete with the uSuthu royal house for authority while Natal's administration, Transvaal intervention and the conduct of the chiefs steadily alter the balance. The struggle cannot be settled in its first #v 18 months#!. If neither party wins outright, the stronger side prevails after #v 5 years#!; a tie restores the Crown."
 je_sb_zululand_chiefdoms_status_zibhebhu:0 "The balance currently favours #v Zibhebhu#! and Natal's appointed chiefs."
 je_sb_zululand_chiefdoms_status_usuthu:0 "The balance currently favours the #v uSuthu royalists#!."
 je_sb_zululand_chiefdoms_status_committed:0 "Transvaal has made a binding commitment to the uSuthu cause."

 # ### TO REVIEW ###
 sb_zululand_chiefdom_balance_bar:0 "Authority in Zululand"
 sb_zululand_chiefdom_balance_bar_usuthu:0 "uSuthu"
 sb_zululand_chiefdom_balance_bar_zibhebhu:0 "Zibhebhu"
 sb_zululand_boer_commitment_bar:0 "Boer Commitment"
 sb_zululand_boer_commitment_bar_low:0 "Uncommitted"
 sb_zululand_boer_commitment_bar_high:0 "Committed"

 # ### TO REVIEW ###
 je_sb_zululand_increase_policing_button:0 "Increase Colonial Policing"
 je_sb_zululand_increase_policing_button_desc:0 "Commit #n 100#! Authority to strengthen Zibhebhu and the appointed chiefs, moving the balance #v 0.5#! points towards Zibhebhu each month."
 je_sb_zululand_increase_policing_possible_tt:0 "We have at least #v 100#! Authority available."
 je_sb_zululand_end_policing_button:0 "Relax Colonial Policing"
 je_sb_zululand_end_policing_button_desc:0 "End the additional policing effort and recover its Authority cost."
 je_sb_zululand_unload_refugees_button:0 "Unload Zulu Refugees"
 je_sb_zululand_unload_refugees_button_desc:0 "Return Zulu peasant households from Natal to Zululand and dismantle the Shepstone settlement."
 je_sb_zululand_unload_refugees_possible_tt:0 "The Shepstone System is active and has been in force for at least #v 25 years#!."
 je_sb_zululand_unload_refugees_effect_tt:0 "#v 5%#! of Zulu [GetPopType('peasants').GetName] in [GetStateRegion('STATE_NATAL').GetName] move to [GetStateRegion('STATE_ZULULAND').GetName]. The Shepstone System is repealed, its reduced repeal consequences are applied without a separate event, and the balance moves #v 5#! points towards the uSuthu."
 je_sb_zululand_return_claimant_button:0 "Permit the Claimant's Return"
 je_sb_zululand_return_claimant_button_desc:0 "Allow the exiled royal claimant to return to Zululand. The claimant must still contest the Crown; recognition does not install them as ruler."
 je_sb_zululand_return_claimant_possible_tt:0 "The royal claimant has not already been permitted to return."
 je_sb_zululand_return_claimant_effect_tt:0 "Zulu communities in Natal gain #p 20%#! Loyalists and the balance moves #v 0.5#! points towards the uSuthu each month. The claimant's fate will later be tested; their death does not end this royalist drift."
 je_sb_zululand_sponsor_usuthu_button:0 "Sponsor the uSuthu"
 je_sb_zululand_sponsor_usuthu_button_desc:0 "Spend #n £250#! each week to move the balance #v 0.25#! points towards the uSuthu and add #v 2#! Boer Commitment each month."
 je_sb_zululand_end_usuthu_sponsorship_button:0 "End uSuthu Sponsorship"
 je_sb_zululand_end_usuthu_sponsorship_button_desc:0 "End the weekly subsidy and its monthly influence."
 je_sb_zululand_sanction_volunteers_button:0 "Sanction Boer Volunteers"
 je_sb_zululand_sanction_volunteers_button_desc:0 "Expose Transvaal's [GetPopType('soldiers').GetName] to #n +1% Mortality#!, moving the balance #v 0.5#! points towards the uSuthu and adding #v 3#! Boer Commitment each month."
 je_sb_zululand_end_volunteers_button:0 "Recall the Volunteers"
 je_sb_zululand_end_volunteers_button_desc:0 "End the volunteer campaign and its military cost."

 # ### TO REVIEW ###
 sb_zululand_chiefdoms_subject_dependence:0 "The Thirteen Chiefdoms"
 sb_zululand_chiefdoms_subject_dependence_desc:0 "Natal's partition steadily subordinates the appointed chiefdoms to colonial authority."
 sb_zululand_zibhebhu_subject_dependence:0 "Zibhebhu's Settlement"
 sb_zululand_zibhebhu_subject_dependence_desc:0 "Zibhebhu's victory leaves Zululand rapidly dependent upon Natal."
 sb_zululand_crown_restored_autonomy:0 "The Restored Crown"
 sb_zululand_crown_restored_autonomy_desc:0 "The restored royal house steadily reasserts Zululand's autonomy beneath Natal's formal suzerainty."
 sb_zululand_chiefdom_reserves:0 "Chiefly Reserves"
 sb_zululand_chiefdom_reserves_desc:0 "Appointed chiefs administer protected subsistence land while collecting a modest hut tax for the colonial settlement."
 sb_zululand_zibhebhu_incorporation_legacy:0 "Zibhebhu's Administrative Legacy"
 sb_zululand_zibhebhu_incorporation_legacy_desc:0 "The institutions created beneath Zibhebhu accelerate the incorporation of Zululand."
 sb_zululand_crown_incorporation_legacy:0 "Legacy of the Restored Crown"
 sb_zululand_crown_incorporation_legacy_desc:0 "Cooperation with the restored royal authority eases, but does not eliminate, the work of incorporating Zululand."
 sb_zululand_policing_cost:0 "Colonial Policing in Zululand"
 sb_zululand_policing_cost_desc:0 "Magistrates and mounted police are being used to uphold Zibhebhu and the appointed chiefs."
 sb_zululand_usuthu_sponsorship_cost:0 "Sponsoring the uSuthu"
 sb_zululand_usuthu_sponsorship_cost_desc:0 "Transvaal is financing royalist organization in Zululand."
 sb_zululand_boer_volunteer_mortality:0 "Boer Volunteers in Zululand"
 sb_zululand_boer_volunteer_mortality_desc:0 "Servicemen are crossing the frontier to fight for the uSuthu cause."
 sb_zululand_relaxed_hut_tax_transfer:0 "Relaxed Zululand Hut Tax"
 sb_zululand_relaxed_hut_tax_transfer_desc:0 "Relaxed collection halves Zululand's usual subject income transfer to Natal."

 # ### TO REVIEW ###
 sb_zulu_chiefdoms:0 "Thirteen Chiefdoms"
 sb_zulu_chiefdoms_action_name:0 "Thirteen Chiefdoms"
 sb_zulu_chiefdoms_action_propose_name:0 "Establish the Thirteen Chiefdoms"
 sb_zulu_chiefdoms_desc:0 "A locked colonial settlement dividing Zululand among appointed chiefs while its international situation remains unresolved."
 sb_zulu_chiefdoms_pact_desc:0 "$sb_zulu_chiefdoms_desc$"
 sb_zulu_chiefdoms_action_notification_name:0 "The Thirteen Chiefdoms Established"
 sb_zulu_chiefdoms_action_notification_desc:0 "Zululand has been placed under the Thirteen Chiefdoms settlement."
 sb_zulu_chiefdoms_action_break_name:0 "End the Thirteen Chiefdoms"
 sb_zulu_chiefdoms_action_notification_break_name:0 "The Thirteen Chiefdoms Ended"
 sb_zulu_chiefdoms_action_notification_break_desc:0 "The Thirteen Chiefdoms settlement has ended."
 subject_type_sb_zulu_chiefdoms:0 "@puppet! $sb_zulu_chiefdoms$"
 subject_type_sb_zulu_chiefdoms_no_icon:0 "$sb_zulu_chiefdoms$"

 # ### TO REVIEW ###
 sb_zululand_settlement.001.t:0 "The Government of Conquered Zululand"
 sb_zululand_settlement.001.d:0 "The independent Zulu kingdom has fallen, but conquest has not answered who will govern its country. Natal's officials argue that a frontier so closely bound to their colony should be placed beneath Pietermaritzburg. Others in London warn that handing over the whole settlement would entangle Natal in a costly and dangerous native policy."
 sb_zululand_settlement.001.f:0 "The military dispatch marked the campaign complete. Beside it lay memoranda on chiefs, boundaries, prisoners and taxes—the papers of a government not yet chosen."
 sb_zululand_settlement.001.a:0 "Place Zululand beneath Natal."
 sb_zululand_settlement.001.a.tt:0 "The complete [GetStateRegion('STATE_ZULULAND').GetName] state becomes a Zulu [concept_protectorate] of Natal, whose government will immediately decide how it is to be administered."
 sb_zululand_settlement.001.b:0 "Administer Zululand from Britain."
 sb_zululand_settlement.001.b.tt:0 "Britain takes direct possession of [GetStateRegion('STATE_ZULULAND').GetName]. #n 25%#! of Zulu [Concept('concept_pop', '$concept_pops$')] become more Radical, and an initially enthusiastic Zulu National Movement is organized."

 # ### TO REVIEW ###
 sb_zululand_settlement.110.t:0 "A Skirmish among the Chiefdoms"
 sb_zululand_settlement.110.d.zibhebhu:0 "A clash between rival retainers has ended in a local victory for Zibhebhu's adherents. His clients present the affair as proof that the appointed settlement alone can preserve order."
 sb_zululand_settlement.110.d.usuthu:0 "A clash between rival retainers has rallied neighboring homesteads behind the uSuthu. Royal messengers present the affair as proof that partition has brought only disorder."
 sb_zululand_settlement.110.a:0 "The balance has shifted."

 # ### TO REVIEW ###
 sb_zululand_settlement.111.t:0 "The Hut Tax"
 sb_zululand_settlement.111.d:0 "Magistrates report that collection of the hut tax is becoming the chief test of the appointed chiefs' authority. Enforcing every assessment will preserve Natal's receipts, but bind the royalist grievance to each homestead. Relaxation would sacrifice revenue while rewarding those chiefs most willing to work within the partition."
 sb_zululand_settlement.111.a:0 "Enforce every assessment."
 sb_zululand_settlement.111.a.tt:0 "Zululand continues to pay its full subject income transfer to Natal, and the balance moves #v 5#! points towards the uSuthu."
 sb_zululand_settlement.111.b:0 "Relax collection."
 sb_zululand_settlement.111.b.tt:0 "Zululand's subject income transfer to Natal is reduced by #v 50%#!, and the balance moves #v 5#! points towards Zibhebhu."

 # ### TO REVIEW ###
 sb_zululand_settlement.112.t:0 "A Chief Changes Allegiance"
 sb_zululand_settlement.112.d.zibhebhu:0 "A wavering chief has compared conditions on either side of the Tugela and chosen Zibhebhu's settlement. Natal's treatment of its Zulu population now serves as an argument for collaboration."
 sb_zululand_settlement.112.d.usuthu:0 "A wavering chief has rejected Zibhebhu's settlement and declared for the uSuthu. Natal's treatment of its own Zulu population has made royalist warnings difficult to dismiss."
 sb_zululand_settlement.112.a:0 "His followers go with him."

 # ### TO REVIEW ###
 sb_zululand_settlement.113.t:0 "The Claimant's Fate"
 sb_zululand_settlement.113.d.survival:0 "The returned claimant has survived the attempts to break the royal faction. Their presence gives scattered uSuthu loyalties a living centre and makes restoration appear possible."
 sb_zululand_settlement.113.d.death:0 "The returned claimant is dead. Some call it illness and others assassination, but certainty matters less than the opening left behind. Zibhebhu's adherents proclaim the royal challenge spent while the uSuthu turn to the next name in the dynasty."
 sb_zululand_settlement.113.a:0 "The contest continues."

 # ### TO REVIEW ###
 sb_zululand_settlement.115.t:0 "An Appeal from the uSuthu"
 sb_zululand_settlement.115.d:0 "The claimant's death has not ended the royal cause. uSuthu envoys ask Transvaal for men, money and recognition, promising that aid given now will be remembered when Zululand's frontier is settled."
 sb_zululand_settlement.115.f:0 "Five hundred men could be called volunteers in Pretoria and invaders in Pietermaritzburg. The difference lay in which seal appeared on the orders."
 sb_zululand_settlement.115.a:0 "Send five hundred volunteers."
 sb_zululand_settlement.115.a.tt:0 "Exactly #v 500#! Transvaal [GetPopType('soldiers').GetName] move to Zululand. Boer Commitment rises by #v 20#! and the balance moves #v 7#! points towards the uSuthu."
 sb_zululand_settlement.115.b:0 "We cannot afford this venture."
 sb_zululand_settlement.115.b.tt:0 "Transvaal sends no volunteers and makes no additional commitment."

 # ### TO REVIEW ###
 sb_zululand_settlement.120.t:0 "Zibhebhu Prevails"
 sb_zululand_settlement.120.d:0 "Zibhebhu has broken the royalist challenge and emerged as the indispensable authority among the appointed chiefs. Zululand remains deeply unsettled, but its surviving administration now depends upon Natal rather than the old Crown."
 sb_zululand_settlement.120.f:0 "The royal praise-names faded from the messengers' speeches. Petitions now travelled through magistrates and chiefs whose position depended on the colonial settlement."
 sb_zululand_settlement.120.a:0 "Entrust the settlement to Zibhebhu."
 sb_zululand_settlement.120.a.tt:0 "Zululand becomes an ordinary [concept_puppet] with #v −0.10#! monthly Liberty Desire and gains #n 10%#! Zulu Radicals. If later annexed, ordinary incorporation becomes available with #p +100%#! speed for #v 10 years#!."

 # ### TO REVIEW ###
 sb_zululand_settlement.121.t:0 "The Crown Restored"
 sb_zululand_settlement.121.d:0 "The appointed settlement can no longer command the country. The uSuthu have restored a dynastic claimant to the Zulu Crown, whose authority now rests upon the royal following rather than Natal's thirteen chiefs."
 sb_zululand_settlement.121.f:0 "The salute passed from hill to hill before it reached the magistrates. A name that partition was meant to scatter had again become a government."
 sb_zululand_settlement.121.a:0 "Recognize the restored Crown."
 sb_zululand_settlement.121.a.tt:0 "Zululand remains an ordinary [concept_puppet] with #v +0.05#! monthly Liberty Desire and gains #p 10%#! Zulu Loyalists. If later annexed, ordinary incorporation becomes available with #p +50%#! speed for #v 10 years#!. If Boer Commitment reached #v 100#!, the greater Nieuwe Republiek is also created."

 # ### TO REVIEW ###
 sb_zululand_settlement.130.t:0 "The Annexation of Zululand"
 sb_zululand_settlement.130.d:0 "The incorporation of Zululand is complete. The temporary settlements through which Natal governed the conquered kingdom can now give way to ordinary provincial administration."
 sb_zululand_settlement.130.a:0 "One administration now governs the country."

 # ### TO REVIEW ###
 sb_zululand_settlement.200.t:0 "The Nieuwe Republiek"
 sb_zululand_settlement.200.d:0 "Boer support for the restored Crown has been paid in land. A new republic has been proclaimed around Vryheid, bound by frontier compacts to Transvaal but responsible for its own uncertain future."
 sb_zululand_settlement.200.d.rebellion:0 "The restored Zulu Crown has honoured its bargain with Pretoria before the struggle for Zululand is decided. A greater Nieuwe Republiek has been proclaimed across the northern districts, bound by frontier compacts to Transvaal but responsible for its own uncertain future."
 sb_zululand_settlement.200.f:0 "The grants bore the names of men who had crossed the border with rifles. A field-cornet read them aloud beneath the flag of a republic that had not existed when they rode out."
 sb_zululand_settlement.200.a:0 "Watch the new republic from Pretoria."
 sb_zululand_settlement.200.b:0 "Lead the Nieuwe Republiek."

 # ### TO REVIEW ###
 sb_zululand_settlement.210.t:0 "The Imperial Boundary Demand"
 sb_zululand_settlement.210.d:0 "The imperial authorities reject the Nieuwe Republiek's claim to the coastal districts and demand that the greater concession be cut back to Vryheid. Acceptance preserves a reduced republic; refusal stakes the whole settlement upon a confrontation with Natal and Britain."
 sb_zululand_settlement.210.f:0 "The boundary proposed in the memorandum was not a line between equals. It was the portion of the concession the empire was prepared to tolerate."
 sb_zululand_settlement.210.a:0 "Accept the reduced boundary."
 sb_zululand_settlement.210.a.tt:0 "The coastal districts return to Zululand, leaving a reduced Nieuwe Republiek around Vryheid with at least one Livestock Ranch. After #v two years#! the reduced republic will petition to join Transvaal."
 sb_zululand_settlement.210.b:0 "Refuse the imperial demand."
 sb_zululand_settlement.210.b.tt:0 "The Nieuwe Republiek asks Transvaal to lead its defence. If no support is forthcoming, it faces the resulting Return State confrontation alone."

 # ### TO REVIEW ###
 sb_zululand_settlement.211.t:0 "The Republic Calls for Aid"
 sb_zululand_settlement.211.d:0 "The Nieuwe Republiek has refused the imperial boundary and now invokes its compact with Transvaal. Accepting will make it a Confederal Partner and place Pretoria at the head of its defence. Refusal leaves the small republic to meet Natal and Britain alone."
 sb_zululand_settlement.211.f:0 "The compact had been easy to sign while it promised land. Its meaning was tested only when the demand arrived."
 sb_zululand_settlement.211.a:0 "The compact binds us."
 sb_zululand_settlement.211.a.tt:0 "The Nieuwe Republiek becomes Transvaal's [Concept('concept_sb_boer_confederal_partner', '$sb_boer_confederal_partner$')]. Transvaal becomes principal defender in the boundary confrontation, while the agreed war goals remain held by Natal, Zululand, or the Nieuwe Republiek as appropriate."
 sb_zululand_settlement.211.b:0 "We will not risk the republic."
 sb_zululand_settlement.211.b.tt:0 "Relations with the Nieuwe Republiek fall by #n 50#! and any Defensive Pact is broken. The Nieuwe Republiek remains principal in the confrontation."

 # ### TO REVIEW ###
 sb_zululand_settlement.230.t:0 "The Imperial Boundary Demand"
 sb_zululand_settlement.230.d:0 "The Zulu rebellion has been defeated, leaving the greater Nieuwe Republiek's concession surrounded by Natalian rule. The imperial authorities now demand that the coastal districts be surrendered directly to Natal. Acceptance preserves a reduced republic around Vryheid; refusal places the republic itself against Natal's claim of annexation."
 sb_zululand_settlement.230.f:0 "The bargain had been made with a Crown that no longer held the country. The memorandum from Pietermaritzburg treated its frontier as an error awaiting correction."
 sb_zululand_settlement.230.a:0 "Accept the reduced boundary."
 sb_zululand_settlement.230.a.tt:0 "The three disputed coastal districts pass directly to Natal, leaving the Nieuwe Republiek with the two inland districts around Vryheid and at least one Livestock Ranch. After #v two years#! the reduced republic will petition to join Transvaal."
 sb_zululand_settlement.230.b:0 "Refuse the imperial demand."
 sb_zululand_settlement.230.b.tt:0 "The Nieuwe Republiek asks Transvaal to lead its defence. If confrontation follows, Natal holds an #bold Annex Nieuwe Republiek#! demand and the Nieuwe Republiek holds a #bold Return State#! demand on Natalian Zululand."

 # ### TO REVIEW ###
 sb_zululand_settlement.231.t:0 "The Boundary Is Reduced"
 sb_zululand_settlement.231.d_direct:0 "The Nieuwe Republiek has accepted the imperial boundary. Natal's officials have taken possession of the three disputed districts, leaving the republic its inland seat around Vryheid and the means to sustain its remaining burghers."
 sb_zululand_settlement.231.d_crown:0 "The Nieuwe Republiek has accepted the imperial boundary. Natal's officials have restored the three disputed districts to the Zulu Crown, leaving the republic its inland seat around Vryheid and the means to sustain its remaining burghers."
 sb_zululand_settlement.231.f:0 "Survey pegs and signed memoranda now mark the limit which force and diplomacy had failed to settle."
 sb_zululand_settlement.231.a:0 "The reduced boundary will stand."

 # ### TO REVIEW ###
 sb_zululand_settlement.220.t:0 "Vryheid Looks to Pretoria"
 sb_zululand_settlement.220.d:0 "The reduced Nieuwe Republiek has survived the imperial cutback, but its government sees little future in permanent isolation. Its Volksraad has resolved to seek union with Transvaal."
 sb_zululand_settlement.220.a:0 "Send the petition north."

 # ### TO REVIEW ###
 sb_zululand_settlement.221.t:0 "The Vryheid Petition"
 sb_zululand_settlement.221.d:0 "Delegates from the reduced Nieuwe Republiek ask that their territory and institutions be admitted into Transvaal. Acceptance would complete the inland union promised by their old frontier compact."
 sb_zululand_settlement.221.a:0 "Admit Vryheid to the republic."
 sb_zululand_settlement.221.a.tt:0 "Transvaal annexes the reduced Nieuwe Republiek."
 sb_zululand_settlement.221.b:0 "Let the republic remain separate."
 sb_zululand_settlement.221.b.tt:0 "The Nieuwe Republiek remains independent."

 # ### TO REVIEW ###
 dp_sb_nrp_boundary_confrontation:0 "The Nieuwe Republiek Boundary"
 dp_sb_nrp_boundary_confrontation_desc:0 "The surviving governments contest the Nieuwe Republiek's frontier and the political future of its territory in Zululand."
 dp_sb_nrp_boundary_confrontation_tooltip:0 "Open a locked diplomatic play over the Nieuwe Republiek's boundary in Zululand."
