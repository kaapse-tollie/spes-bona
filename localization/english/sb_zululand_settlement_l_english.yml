 je_sb_zululand_end_chief_support_button:0 "End Chiefly Patronage"
 # TO REVIEW (non-event/JE keys)
 je_sb_zululand_end_chief_support_button_desc:0 "End the £500 weekly expense and its increase in amaKhosi attraction."
 # TO REVIEW (non-event/JE keys)
 # TO REVIEW (non-event/JE keys)
 # TO REVIEW (non-event/JE keys)
