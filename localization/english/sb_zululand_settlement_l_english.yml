 je_sb_zululand_unload_refugees_button:0 "Unload Zulu Refugees"
 je_sb_zululand_unload_refugees_button_desc:0 "Return Zulu peasant households to Zululand. An open indenture programme continues."
 je_sb_zululand_unload_refugees_possible_tt:0 "The Shepstone System has been in force for at least #v 25 years#!, Zululand controls its whole state and the settlement remains open to intervention."
 # TO REVIEW (non-event/JE keys)
 je_sb_zululand_unload_refugees_effect_tt:0 "Move #v 20%#! of Natal’s Zulu peasant households to Zululand."
 je_sb_zululand_return_claimant_button:0 "Permit the Claimant's Return"
 je_sb_zululand_return_claimant_button_desc:0 "Allow the exiled royal claimant to return to Zululand. The claimant must still contest the Crown; recognition does not install them as ruler."
 je_sb_zululand_return_claimant_possible_tt:0 "The contest is open to intervention and a living royal claimant awaits permission to return."
 # TO REVIEW (non-event/JE keys)
