 # TO REVIEW (non-event/JE keys)
 glossary_sb_amabutho: "Amabutho"
 glossary_sb_amabutho_desc: "#b;italic Amabutho#! are regiments organised by age; the singular is #italic ibutho#!.\n\nIn the nineteenth-century Zulu kingdom, the men’s regiments brought together recruits from different communities for military service and labour under the king. Women also formed amabutho within the wider system."

 # TO REVIEW (non-event/JE keys)
 glossary_sb_amakhosi: "amaKhosi"
 glossary_sb_amakhosi_desc: "#b;italic amaKhosi#! are chiefs or rulers in isiZulu-speaking communities. The singular is #italic inkosi#!."

 # TO REVIEW (non-event/JE keys)
 glossary_sb_usuthu: "uSuthu"
 glossary_sb_usuthu_desc: "The #b;italic uSuthu#! were the political following of #b Cetshwayo#!, and later of his son #b Dinuzulu#!.\n\nThe name was associated with Cetshwayo’s struggle for the Zulu throne and continued to identify supporters of his royal cause."

 # TO REVIEW (non-event/JE keys)
 glossary_sb_umkhosi: "Umkhosi"
 glossary_sb_umkhosi_desc: "#b;italic Umkhosi#! was a royal first-fruits festival in the nineteenth-century Zulu kingdom.\n\nThe king and his regiments gathered for rites marking the new harvest and affirming royal authority."
