l_english:
sb_swz_seek_british_protection:0 "Ask for British Protection"
sb_swz_seek_british_protection_desc:0 "Boer pressure grows on the plateau and the coast already lies in British hands. Direct British protection may be the lesser evil."
sb_swazi_frontier_rearmed:0 "The Frontier Rearmed"
sb_swazi_frontier_rearmed_desc:0 "Fresh firearms and a temporary settlement have steadied the western marches."
sb_trn_swazi_frontier_overreach:0 "Frontier Overreach"
sb_trn_swazi_frontier_overreach_desc:0 "The government has rejected a workable frontier settlement in pursuit of broader claims over the whole eastern Transvaal."
sb_swazi_frontier_muster:0 "A Frontier Muster"
sb_swazi_frontier_muster_desc:0 "The frontier councils have prepared the passes and organized the kingdom's regiments for a determined defense."
sb_zulu_swazi_frontier_disarray:0 "Disarray on the Swazi Frontier"
sb_zulu_swazi_frontier_disarray_desc:0 "The speed and concentration of the Swazi muster have caught the invading amabutho unprepared for the broken approaches to the kingdom."
# ### TO REVIEW ###
sb_swazi_frontier.094.t:0 "The Swazi Frontier"
sb_swazi_frontier.094.d_victory:0 "Dingane's victory over the Boers has emboldened the court. Councillors now press him to carry that momentum eastward and settle the Swazi frontier by force."
sb_swazi_frontier.094.d_defeat:0 "Dingane's defeat in Natal has weakened the throne, but some councillors argue that a swift campaign against the Swazi could still restore royal authority."
sb_swazi_frontier.094.d_compromise:0 "Natal has ended in compromise rather than settlement. The court now looks eastward, where a Swazi campaign might recover authority without reopening the Boer question."
sb_swazi_frontier.094.d:0 "Dingane's court now looks eastward toward the Swazi. Some councillors argue that victory there would steady the dynasty; others warn that another failed campaign could undo the throne altogether."
sb_swazi_frontier.094.f:0 "Dingane's councillors set reports from Natal beside tribute accounts from the eastern frontier. The advocates of war pointed toward the Swazi hills and argued that a victory there could answer every doubt the court had carried back from the Boer struggle."
sb_swazi_frontier.094.a:0 "Strike east."
sb_swazi_frontier.094.b:0 "We cannot risk it."
# ### REVIEWED ###
sb_swazi_border.1.t:0 "A Frontier Inherited"
sb_swazi_border.1.d:0 "With Lydenburg reunited with the republic, its treaties and unresolved boundaries have become the Volksraad's concern. Swazi royal homesteads and herds have returned to the winter grazing country along the Crocodile and Komati, which Lydenburg regarded as ceded. Some demand that the old claims be enforced; others argue that friendship with the Swazi court is worth more than a disputed frontier."
sb_swazi_border.1.f:0 "'The Swazi had formally acknowledged Republican rights to the area, but in practice were simultaneously repudiating them on the ground.'\n— Philip Bonner, #italic Kings, Commoners and Concessionaires#!"
sb_swazi_border.1.a:0 "Lydenburg's claims are ours to enforce."
sb_swazi_border.1.b:0 "Friendly relations with the Swazi are paramount."
# ### REVIEWED ###
sb_swazi_border.2.t:0 "Boer Pressure in the West"
sb_swazi_border.2.d:0 "The Transvaal has revived Lydenburg's claims to the western grazing country and demands that the Swazi court recognise the republican frontier. Some councillors propose offering the disputed districts in return for a limited trade in guns and ammunition. Others insist that no land should be yielded merely because the Boers have marked it on their maps."
sb_swazi_border.2.f:0 "'What is clear, nevertheless, is (King) Mswati's desire to secure horses and guns.'\n— Philip Bonner, #italic Kings, Commoners and Concessionaires#!"
sb_swazi_border.2.a:0 "Offer the border districts in return for arms."
sb_swazi_border.2.b:0 "Tell them to go back to Holland."
# ### TO REVIEW ###
sb_swazi_border.3.t:0 "A Swazi Counter-Offer"
sb_swazi_border.3.d:0 "The Swazi court proposes a settlement. It will recognise republican sovereignty over the disputed western districts if the Volksraad permits a limited trade in guns and ammunition. Accepting would secure the frontier without war; rejecting would preserve the republic's claim to the whole country as far as the Lebombo."
sb_swazi_border.3.f:0 "'Mswati could cede away this vast tract of land... because he did not endow it with any finality.'\n— Philip Bonner, #italic Kings, Commoners and Concessionaires#!"
sb_swazi_border.3.a:0 "Accept the settlement."
sb_swazi_border.3.b:0 "Our claim reaches to the Lebombo."

# ### REVIEWED ###
sb_swazi_border.4.t:0 "The Swazi Refuse"
sb_swazi_border.4.d:0 "The Swazi court has rejected the republic's demand and made no counter-offer. Its councillors deny that Lydenburg's old treaties give the Transvaal any right to the western grazing country. The commandants now demand that the Volksraad enforce on the ground what the republic claims on the map."
sb_swazi_border.4.f:0 "'Land could not be alienated except by conquest or a decision of the people.'\n— D. Hugh Gillis, #italic The Kingdom of Swaziland#!"
sb_swazi_border.4.a:0 "We will teach these K****rs a lesson."
# ### TO REVIEW ###
sb_swazi_frontier.097.t:0 "The Swazi Defeated"
sb_swazi_frontier.097.d:0 "Dingane has forced the Swazi from the field and restored the aura of strength around his court. The victory gives the king's allies a clear answer to those who doubted his hold over the nearer frontier."
sb_swazi_frontier.097.f:0 "The victorious regiments returned with cattle and shields taken in the fighting. At court, men who had questioned Dingane's judgement now repeated the campaign's names carefully, aware that success on the Swazi frontier had made criticism of the king more dangerous."
sb_swazi_frontier.097.a:0 "So the frontier remembers."
# ### REVIEWED ###
sb_swazi_frontier.100.t:0 "An Appeal from eSwatini"
sb_swazi_frontier.100.d:0 "The Swazi kingdom now asks Britain to accept it as a protectorate. If we refuse, it must face the Boer frontier alone. If we accept, the kingdom will pass beneath direct British protection."
sb_swazi_frontier.100.f:0 "The petition did not ask Britain to rule the kingdom well. It asked only that Britain rule it before the frontier republics did."
sb_swazi_frontier.100.a:0 "Take them under protection."
sb_swazi_frontier.100.b:0 "We will not intervene."
sb_swzai_frontier_concede_truce:0 "Create a #v 25 year truce#! with the Swazi."
sb_swzai_frontier_concede_guns:0 "The Swazi gain #v +40%#! progress toward #bold Adoption of Firearms#! and receive a five-year Boer small-arms treaty."
